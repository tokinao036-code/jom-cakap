};

/* ---------------- listen & repeat (sheet) ---------------- */
const LR = {
  items: [], i: 0, tok: 0, rate: 1, paused: false, el: null,
  open(items, title) {
    this.close(true);
    this.items = items; this.i = 0; this.rate = 1; this.paused = false; this.title = title;
    const o = document.createElement('div'); o.className = 'overlay'; o.id = 'lr';
    o.innerHTML = `<div class="sheet"><div class="grab"></div><div class="row between"><div><div class="kicker">Слушать и повторять</div><b>${esc(title)}</b></div><button class="icon-btn" data-act="lr-close" aria-label="Закрыть">${I.x}</button></div>
      <div class="lr-text" id="lrText"></div><div class="phase" id="lrPhase"></div><div class="ring" id="lrRing"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="lrArc" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"/></svg><span id="lrRingT"></span></div>
      <div class="ctrls"><button class="icon-btn" data-act="lr-prev" aria-label="Назад">${I.back}</button><button class="big-play" style="width:64px;height:64px;margin:0" data-act="lr-pause" id="lrPause" aria-label="Пауза">${I.pause}</button><button class="icon-btn" data-act="lr-next" aria-label="Дальше">${I.next}</button><button class="icon-btn" data-act="lr-rate" id="lrRate" style="width:auto;padding:0 12px;font-weight:800">1×</button></div>
      <p class="faint small center" style="margin:12px 0 0">Фраза звучит → пауза для вашего повтора вслух → фраза звучит снова.</p></div>`;
    o.addEventListener('click', e => { if (e.target === o) this.close(); });
    document.body.appendChild(o); this.el = o;
    this.run();
  },
  close(silent) { this.tok++; stopAudio(); const o = $('#lr'); if (o) o.remove(); this.el = null; if (!silent) { /* nothing else */ } },
  async run() {
    const tok = ++this.tok;
    while (this.el && tok === this.tok && this.i < this.items.length) {
      const it = this.items[this.i];
      this.paint(it, 'Слушайте', 0);
      const t0 = performance.now();
      await play(it.say || it.ms, it.v || 'f', this.rate);
      if (tok !== this.tok) return;
      const pause = Math.min(9000, Math.max(1800, (performance.now() - t0) * 1.25 + 900));
      this.paint(it, 'Ваша очередь: повторите вслух', pause);
      await this.wait(pause, tok);
      if (tok !== this.tok) return;
      this.paint(it, 'Ещё раз — сравните', 0);
      await play(it.say || it.ms, it.v || 'f', this.rate);
      if (tok !== this.tok) return;
      await this.wait(800, tok);
      if (tok !== this.tok) return;
      this.i++;
    }
    if (this.el && tok === this.tok) { $('#lrText').innerHTML = `<div class="flower" style="width:64px;height:64px;margin:0 auto">${FLOWER}</div><div class="ms">Bagus!</div><div class="muted">Готово: ${this.items.length} ${plural(this.items.length, 'фраза', 'фразы', 'фраз')}</div>`; $('#lrPhase').textContent = ''; $('#lrRing').classList.add('hidden'); mark('listen'); }
  },
  wait(ms, tok) {
    const arc = $('#lrArc'), t = $('#lrRingT'), start = performance.now();
    return new Promise(res => {
      const tick = () => {
        if (tok !== this.tok || !this.el) return res();
        const p = Math.min(1, (performance.now() - start) / ms);
        if (arc) arc.style.strokeDashoffset = String(327 * p);
        if (p >= 1) return res();
        requestAnimationFrame(tick);
      };
      if (t) t.textContent = ms > 1000 ? 'говорите' : '';
      tick();
    });
  },
  paint(it, phase, pause) {
    if (!this.el) return;
    $('#lrText').innerHTML = `<div class="faint tiny">${this.i + 1} / ${this.items.length}</div><div class="ms">${esc(it.ms)}</div><div class="tr">${esc(it.tr)}</div><div class="muted small">${esc(it.ru)}</div>`;
    $('#lrPhase').textContent = phase;
    $('#lrRing').classList.toggle('hidden', !pause);
    const arc = $('#lrArc'); if (arc) arc.style.strokeDashoffset = '0';
    $('#lrRingT').textContent = '';
  },
  jump(d) { this.i = Math.max(0, Math.min(this.items.length - 1, this.i + d)); this.paused = false; $('#lrPause').innerHTML = I.pause; stopAudio(); this.run(); },
  toggle() { if (this.paused) { this.paused = false; $('#lrPause').innerHTML = I.pause; this.run(); } else { this.paused = true; this.tok++; stopAudio(); $('#lrPause').innerHTML = I.resume; $('#lrPhase').textContent = 'Пауза'; } },
};

  } catch (e) { el.textContent = 'Нет доступа к кэшу'; }
}
function warm() {
  const urls = [...D.audio.packs.map(n => new URL(`audio/${n}.bin`, location.href).href), ...Object.values(IMG).map(m => m.url)];
  if (navigator.serviceWorker) navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage({ type: 'warm', urls })).catch(() => { /* no worker */ });
  try { localStorage.setItem('jomcakap:warm', window.BUILD); } catch (e) { /* ignore */ }

/* ---------------- motion: staggered entrance, count-up, bars, ripple, petals ---------------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function enhance(root) {
  if (!root) return;
  const kids = [...root.children].filter(el => !el.classList.contains('sticky') && el.id !== 'foot');
  kids.slice(0, 14).forEach((el, i) => { el.style.setProperty('--i', i); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); });
  // safety net: if the browser never runs the animation (hidden tab, power saving), content must not stay invisible
  setTimeout(() => { kids.forEach(el => el.classList.remove('enter')); root.classList.remove('slide-l', 'slide-r'); }, 1400);
  requestAnimationFrame(() => $$('.bar i[data-w]', root).forEach(b => { b.style.width = b.dataset.w + '%'; }));
  $$('[data-count]', root).forEach(el => {
    const to = Number(el.dataset.count); if (REDUCED || !to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 700;
    const tick = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function petals(n = 26) {
  if (REDUCED) return;
  const box = document.createElement('div'); box.className = 'petals';
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = `${Math.random() * 100}%`; p.style.setProperty('--d', `${2.4 + Math.random() * 2}s`); p.style.setProperty('--dl', `${Math.random() * .8}s`);
    p.style.setProperty('--x', `${(Math.random() - .5) * 160}px`); p.style.setProperty('--r', `${(Math.random() - .5) * 720}deg`);
    p.innerHTML = FLOWER; box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5200);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn, .opt, .tile, .grades button, #nav a, .topic');
  if (!b || REDUCED) return;
  const r = b.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'ripple'; s.style.left = `${e.clientX - r.left}px`; s.style.top = `${e.clientY - r.top}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 600);
});

    o.innerHTML = `<div class="sheet center"><div class="grab"></div><div class="bloom">${FLOWER}</div><div class="kicker">Tahniah! — Поздравляем!</div><h2 style="margin:6px 0">День ${L.day} пройден</h2>
      <p class="muted">${n ? `${n} ${plural(n, 'слово добавлено', 'слова добавлены', 'слов добавлено')} в карточки.` : 'Слова урока уже в карточках.'} Серия: <b>${st} ${plural(st, 'день', 'дня', 'дней')}</b>.</p>
      <div class="row" style="gap:10px;margin-top:8px"><a class="btn ghost grow" href="#/today" data-act="close-cele">На главную</a>${nx ? `<a class="btn grow" href="#/lesson/${nx.id}" data-act="close-cele">Урок ${nx.day}</a>` : ''}</div></div>`;
    document.body.appendChild(o);
    o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-act="close-cele"]')) o.remove(); });
    setTimeout(() => burst($('.bloom', o)), 400);
    petals();
    mountStep(L, SI.finish);
  },
  flip() { flipCard(); },
  grade(el) {
    const g = Number(el.dataset.g), id = RV.list[RV.i];
    grade(id, g); RV.done++; save();
    if (g === 0 && (RV.again[id] || 0) < 2) { RV.again[id] = (RV.again[id] || 0) + 1; RV.list.splice(Math.min(RV.list.length, RV.i + 4), 0, id); }
    if (g === 2) burst(el);
    RV.i++; setTimeout(showCard, g === 2 ? 180 : 60);
  },
  newper(el) { S.settings.newPerDay = Number(el.dataset.n); save(); render(); },
  autoplay(el) { S.settings.autoplay = !S.settings.autoplay; save(); el.classList.toggle('on', S.settings.autoplay); },
  warm() { warm(); toast('Загружаю аудио и фото для офлайна…'); setTimeout(offlineStatus, 4000); setTimeout(offlineStatus, 12000); },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `jomcakap-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    toast('Файл резервной копии сохранён');
  },
  async copy() { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Скопировано — вставьте в «Заметки»'); } catch (e) { $('#impText').value = JSON.stringify(S); toast('Текст в поле ниже — скопируйте его вручную'); } },
  import() { importState($('#impText').value); },
  reset() { if (confirm('Удалить весь прогресс на этом устройстве? Это нельзя отменить.')) { S = fresh(); save(); render(); toast('Прогресс сброшен'); } },
};
function paintAns(k) { $('#ans').innerHTML = k.ans.map(j => `<button class="tile" data-act="pr-untile" data-j="${j}">${esc(k.tiles[j])}</button>`).join(''); }
function importState(txt) {
  try {
    const s = JSON.parse(txt);
    if (!s || s.v !== 1 || typeof s.srs !== 'object') throw new Error('format');
    S = Object.assign(fresh(), s, { settings: Object.assign(fresh().settings, s.settings) }); save(); applyTheme(); render(); toast('Прогресс восстановлен');
  } catch (e) { toast('Не похоже на резервную копию Jom Cakap'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  if (el.tagName !== 'A') e.preventDefault();
  if (el.dataset.act === 'say' || el.dataset.act === 'flip') e.stopPropagation();
  f(el, e);
});
let wTimer = null;
document.addEventListener('input', e => {
  if (e.target.classList.contains('wr')) {
    const ta = e.target, i = Number(ta.dataset.i), t = LBY[LS.id].writing[i];
    $(`#need${i}`).innerHTML = needHtml(t, ta.value);
    clearTimeout(wTimer); wTimer = setTimeout(() => { S.writing[ta.dataset.k] = ta.value; save(); }, 600);
    return;
  }
  if (e.target.id === 'cardSearch') { const ids = Object.keys(S.srs).filter(id => id.endsWith('|f')).map(id => id.slice(0, -2)).filter(id => ITEMS[id]); $('#cardList').innerHTML = cardRows(ids, e.target.value.toLowerCase().trim()); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'impFile' && e.target.files[0]) { const r = new FileReader(); r.onload = () => importState(r.result); r.readAsText(e.target.files[0]); }
});

/* ---------------- boot ---------------- */
function boot() {
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); });
  $('#nav').innerHTML = [['today', 'Сегодня'], ['lessons', 'Уроки'], ['cards', 'Карточки'], ['budaya', 'Культура'], ['grammar', 'Правила'], ['progress', 'Прогресс']].map(([r, t]) => `<a href="#/${r}" data-r="${r}">${I[r]}<span>${t}</span></a>`).join('');
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      let w = null; try { w = localStorage.getItem('jomcakap:warm'); } catch (e) { /* ignore */ }
      if (w !== window.BUILD && navigator.onLine) setTimeout(warm, 3000);
    }).catch(() => { /* offline mode unavailable */ });
  }
}
boot();

</script>
</body>
</html>
