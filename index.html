лая."},{"ms":"Gembira berkenalan dengan anda!","ru":"Рад(а) знакомству!","tr":"гембира беркеналан денган анда!"}]}],"n":12,"schema":{"pat":["s","o"],"rows":[[["s","Saya","я"],["o","pelajar","студент"]],[["s","Dia","он, она"],["o","orang Malaysia","малайзиец"]],[["s","Encik Ahmad","господин Ахмад"],["l","di pejabat","в офисе"]]],"note":"Кто + кто/где. Никакого «есть», «является» в разговоре."}},{"id":"d2","week":2,"day":2,"img":"p_flag_students","meme":["m_upin_grin","m_hayya"],"ms":"Bahasa dan faham","title":"Языки и понимание","goal":"Сказать, на каких языках говорите, признаться, что не поняли, попросить повторить и говорить медленнее.","can":["Сказать, кто вы по национальности","Сказать, что учите малайский и говорите немного","Сказать «не понимаю» и попросить повторить медленнее","Различать tidak и bukan"],"words":[{"ms":"orang Rusia","ru":"русский, россиянин (человек)","ex":"Saya orang Rusia.","exRu":"Я из России (россиянин / россиянка).","use":"orang (человек) + страна = национальность или житель: orang Malaysia, orang Jepun.","tr":"оранг русия","exTr":"сая оранг русия."},{"ms":"bahasa","ru":"язык","ex":"Saya cakap tiga bahasa.","exRu":"Я говорю на трёх языках.","use":"Язык как система общения. «Bahasa» без уточнения в Малайзии часто значит малайский.","tr":"бахаса","exTr":"сая чакап тига бахаса."},{"ms":"Bahasa Melayu","ru":"малайский язык","ex":"Bahasa Melayu bahasa rasmi Malaysia.","exRu":"Малайский — официальный язык Малайзии.","use":"Официально также «Bahasa Malaysia» — оба названия верны. Индонезийский — отдельная норма: Bahasa Indonesia.","tr":"бахаса мелаю","exTr":"бахаса мелаю бахаса расми малайсия."},{"ms":"Bahasa Inggeris","ru":"английский язык","ex":"Encik cakap bahasa Inggeris?","exRu":"Вы говорите по-английски?","use":"В Малайзии пишется «Inggeris», в Индонезии — «Inggris». Мелочь, но в письме сразу видно, какую норму вы учили.","tr":"бахаса инггерис","exTr":"энчи' чакап бахаса инггерис?"},{"ms":"belajar","ru":"учиться, изучать","ex":"Saya belajar bahasa Melayu.","exRu":"Я учу малайский.","use":"belajar + предмет, без предлога.","tr":"беладжар","exTr":"сая беладжар бахаса мелаю."},{"ms":"cakap","ru":"говорить","ex":"Dia cakap bahasa Melayu dan bahasa Arab.","exRu":"Он(а) говорит по-малайски и по-арабски.","use":"Нейтрально-разговорное. Официально: bertutur, berbahasa. Индонезийцы чаще говорят «bicara».","tr":"чакап","exTr":"дия чакап бахаса мелаю дан бахаса араб."},{"ms":"sikit","ru":"немного","ex":"Saya cakap bahasa Melayu sikit.","exRu":"Я немного говорю по-малайски.","use":"Разговорная форма. Нейтральная и письменная — sedikit.","tr":"сикит","exTr":"сая чакап бахаса мелаю сикит."},{"ms":"faham","ru":"понимать","ex":"Saya faham sikit.","exRu":"Я немного понимаю.","use":"Малайзийская норма. В Индонезии — paham или mengerti.","ar":"faham ← араб. فهم «понимание»","tr":"фахам","exTr":"сая фахам сикит."},{"ms":"tidak","ru":"не (с действиями и качествами)","ex":"Saya tidak faham.","exRu":"Я не понимаю.","use":"Нейтральное и официальное «не». В речи сокращается до «tak» (сленг этого урока).","tr":"тида'","exTr":"сая тида' фахам."},{"ms":"Maaf","ru":"Извините","ex":"Maaf, encik cakap bahasa Inggeris?","exRu":"Извините, вы говорите по-английски?","use":"И «простите», и «извините, можно спросить». Сильнее: «Minta maaf» — прошу прощения.","ar":"из арабского, корень ع-ف-و «прощать» (как в عفوًا)","tr":"мааф","exTr":"мааф, энчи' чакап бахаса инггерис?"},{"ms":"Boleh ulang?","ru":"Можете повторить?","ex":"Maaf, boleh ulang sekali lagi?","exRu":"Извините, можете повторить ещё раз?","use":"Вежливо в любой ситуации. boleh — можно, ulang — повторить.","tr":"болэх уланг?","exTr":"мааф, болэх уланг секали лаги?"},{"ms":"perlahan sikit","ru":"помедленнее","ex":"Boleh cakap perlahan sikit?","exRu":"Можете говорить чуть помедленнее?","use":"Главная фраза первых недель. Официальнее: «Boleh bercakap dengan lebih perlahan?»","tr":"перлахан сикит","exTr":"болэх чакап перлахан сикит?"}],"rule":{"title":"Два «не»: tidak и bukan","ref":"g-neg","text":["«Не» в малайском — два слова. tidak — перед действием или качеством: tidak faham (не понимаю), tidak jauh (недалеко).","bukan — перед предметом или человеком: bukan pelajar (не студент), bukan kopi (не кофе). Проверка: если по-русски можно вставить «является», нужно bukan."],"ex":[{"ms":"Saya tidak faham.","ru":"Я не понимаю.","tr":"сая тида' фахам."},{"ms":"Dia bukan pensyarah, dia pelajar.","ru":"Он(а) не преподаватель, а студент.","tr":"дия букан пеншарах, дия пеладжар."},{"ms":"Ini bukan teh, ini kopi.","ru":"Это не чай, это кофе.","tr":"ини букан тэх, ини копи."}],"mistake":"«Saya tidak pelajar» — ошибка: перед существительным нужно bukan. В русском «не» одно, поэтому эта ошибка очень частая.","cmp":"В русском одно «не» на все случаи. Малайский различает «не делаю» (tidak) и «не являюсь» (bukan)."},"dialog":{"scene":"Молодёжный форум АСЕАН, Конгресс-центр Куала-Лумпура. Стойка регистрации.","img":"klcc_conv","lines":[{"n":"Nurul","v":"f","ms":"Selamat pagi. Selamat datang ke Forum Belia ASEAN.","ru":"Доброе утро. Добро пожаловать на Молодёжный форум АСЕАН.","tr":"селамат паги. селамат датанг ке форум белия асиан."},{"n":"Sasha","v":"m","ms":"Selamat pagi. Nama saya Sasha, dari Rusia.","ru":"Доброе утро. Меня зовут Саша, я из России.","tr":"селамат паги. нама сая саша, дари русия."},{"n":"Nurul","v":"f","ms":"Oh, peserta dari Rusia! Awak cakap bahasa Melayu?","ru":"О, участник из России! Вы говорите по-малайски?","tr":"ох, песерта дари русия! ава' чакап бахаса мелаю?"},{"n":"Sasha","v":"m","ms":"Sikit. Saya belajar bahasa Melayu.","ru":"Немного. Я учу малайский.","tr":"сикит. сая беладжар бахаса мелаю."},{"n":"Nurul","v":"f","ms":"Bagus! Ini kad peserta awak dan ini jadual forum hari ini.","ru":"Отлично! Вот ваш бейдж участника, а это программа форума на сегодня.","tr":"багус! ини кад песерта ава' дан ини джадуал форум хари ини."},{"n":"Sasha","v":"m","ms":"Maaf, saya tidak faham. Boleh ulang perlahan sikit?","ru":"Извините, я не понял(а). Можете повторить помедленнее?","tr":"мааф, сая тида' фахам. болэх уланг перлахан сикит?"},{"n":"Nurul","v":"f","ms":"Ini kad peserta. Ini jadual.","ru":"Это бейдж. Это программа.","tr":"ини кад песерта. ини джадуал."},{"n":"Sasha","v":"m","ms":"Oh, faham! Terima kasih.","ru":"А, понятно! Спасибо.","tr":"ох, фахам! терима касих."},{"n":"Nurul","v":"f","ms":"Tak apa, bahasa Inggeris pun boleh.","ru":"Ничего, можно и по-английски.","tr":"та' апа, бахаса инггерис пун болэх."},{"n":"Sasha","v":"m","ms":"Tidak, tidak. Saya mahu cakap bahasa Melayu!","ru":"Нет-нет. Я хочу говорить по-малайски!","tr":"тида', тида'. сая маху чакап бахаса мелаю!"},{"n":"Nurul","v":"f","ms":"Bagus! Bahasa Melayu awak boleh tahan!","ru":"Здорово! А малайский у вас неплохой!","tr":"багус! бахаса мелаю ава' болэх тахан!"}]},"slang":[{"ms":"tak","ru":"не (коротко от tidak)","ex":"Tak apa, saya faham.","exRu":"Ничего, я понимаю.","ok":"В устной речи почти всегда: tak faham, tak boleh, tak apa. Так говорят и начальники, и министры в интервью.","no":"В письме, докладе, официальной речи — только tidak.","say":"tak","tr":"та'","exTr":"та' апа, сая фахам."},{"ms":"boleh tahan","ru":"неплохо, вполне ничего","ex":"Nasi lemak di sini boleh tahan.","exRu":"Nasi lemak здесь вполне ничего.","ok":"Похвалить по-дружески: еду, чей-то малайский, фильм.","no":"В оценке чужой работы для начальства или партнёров — звучит снисходительно («сойдёт»). Там: «sangat baik».","say":"boleh tahan","tr":"болэх тахан","exTr":"наси лема' ди сини болэх тахан."}],"build":[{"ru":"Я не понимаю.","ms":"Saya tidak faham.","extra":["bukan","sikit"],"tr":"сая тида' фахам."},{"ru":"Он(а) не преподаватель.","ms":"Dia bukan pensyarah.","extra":["tidak","saya"],"tr":"дия букан пеншарах."},{"ru":"Можете говорить помедленнее?","ms":"Boleh cakap perlahan sikit?","extra":["faham","ulang"],"tr":"болэх чакап перлахан сикит?"}],"reply":[{"p":"Awak cakap bahasa Melayu?","pRu":"Вы говорите по-малайски?","o":["Sikit. Saya belajar bahasa Melayu.","Saya bukan bahasa Melayu.","Sama-sama."],"a":0,"why":"«Немного, я учу малайский» — естественный ответ. «Saya bukan bahasa Melayu» значит «я не малайский язык».","pTr":"ава' чакап бахаса мелаю?","oTr":["сикит. сая беладжар бахаса мелаю.","сая букан бахаса мелаю.","сама-сама."]},{"p":"Ini kad peserta awak dan jadual forum hari ini.","pRu":"(быстро) Вот ваш бейдж и программа на сегодня.","o":["Maaf, boleh ulang perlahan sikit?","Selamat petang.","Saya orang Rusia."],"a":0,"why":"Не расслышали — просите повторить медленнее. Это нормально и вежливо.","pTr":"ини кад песерта ава' дан джадуал форум хари ини.","oTr":["мааф, болэх уланг перлахан сикит?","селамат петанг.","сая оранг русия."]}],"test":[{"q":"Как сказать «Я не студент»?","o":["Saya bukan pelajar.","Saya tidak pelajar.","Saya pelajar tidak."],"a":0,"why":"Перед существительным (pelajar) — bukan."},{"q":"Как сказать «Я не понимаю»?","o":["Saya bukan faham.","Saya tidak faham.","Tidak saya faham."],"a":1,"why":"faham — действие, значит tidak."},{"q":"Малайзийское написание «английский язык»:","o":["Bahasa Inggris","Bahasa Inggeris","Bahasa England"],"a":1,"why":"Inggeris — малайзийское, Inggris — индонезийское."},{"q":"Слово «sikit» — это…","o":["разговорное «немного»","«медленно»","«много»"],"a":0,"why":"sikit — разговорная форма sedikit."},{"q":"Вы не расслышали фразу. Что сказать?","o":["Boleh ulang?","Boleh cakap?","Saya pelajar."],"a":0,"why":"Boleh ulang? — Можете повторить?"},{"q":"Какое «не» писать в официальном письме?","o":["tak","tidak","tak lah"],"a":1,"why":"tak — только в устной речи."}],"culture":"Малайзия многоязычна: малайцы, китайцы и индийцы в одном разговоре переходят с малайского на английский и обратно («bahasa rojak» — «язык-салат»). Вам часто будут отвечать по-английски из вежливости. Мягко продолжайте по-малайски: это ценят, особенно госслужащие — малайский является языком государственной службы.","story":"В выходные Аишах берёт Сашу на Молодёжный форум АСЕАН в KLCC. Первая попытка говорить по-малайски с незнакомыми людьми — и первое «не понимаю».","reading":{"title":"Forum Belia ASEAN","kind":"Объявление + заметка Саши","img":"p_flag_students","words":70,"gloss":[{"ms":"pertama","ru":"первый","tr":"пертама"},{"ms":"banyak","ru":"много","tr":"баня'"},{"ms":"negara","ru":"страна","tr":"негара"},{"ms":"tanya","ru":"спрашивать","tr":"таня"},{"ms":"semua","ru":"всё, все","tr":"семуа"},{"ms":"tetapi","ru":"но","tr":"тетапи"}],"q":[{"q":"Какие языки на форуме?","o":["Английский и малайский","Только малайский","Малайский и китайский"],"a":0},{"q":"Что пишет Саша о понимании?","o":["Понимает не всё, но немного","Понимает всё","Ничего не понимает"],"a":0},{"q":"Почему в «Saya bukan orang Malaysia» стоит bukan, а не tidak?","o":["Перед существительным (orang) — bukan","Это ошибка","bukan — вежливее"],"a":0}],"blocks":[{"h":"Объявление на стойке регистрации","v":"f","lines":[{"ms":"Forum Belia ASEAN, hari pertama.","ru":"Молодёжный форум АСЕАН, первый день.","tr":"форум белия асиан, хари пертама."},{"ms":"Peserta dari banyak negara ada di sini.","ru":"Здесь участники из многих стран.","tr":"песерта дари баня' негара ада ди сини."},{"ms":"Bahasa forum: bahasa Inggeris dan bahasa Melayu.","ru":"Языки форума: английский и малайский.","tr":"бахаса форум: бахаса инггерис дан бахаса мелаю."},{"ms":"Tidak faham? Sila tanya di meja pendaftaran.","ru":"Не понимаете? Спрашивайте у стойки регистрации.","tr":"тида' фахам? сила таня ди мэджа пендафтаран."}]},{"h":"Заметка Саши в телефоне","v":"m","lines":[{"ms":"Hari ini saya cakap bahasa Melayu sikit.","ru":"Сегодня я немного говорил(а) по-малайски.","tr":"хари ини сая чакап бахаса мелаю сикит."},{"ms":"Saya tidak faham semua, tetapi saya faham sikit.","ru":"Я понимаю не всё, но немного понимаю.","tr":"сая тида' фахам семуа, тетапи сая фахам сикит."},{"ms":"Cik Nurul cakap perlahan sikit. Dia baik.","ru":"Нурул говорила помедленнее. Она добрая.","tr":"чи' нурул чакап перлахан сикит. дия баи'."},{"ms":"Saya bukan orang Malaysia, tetapi saya mahu cakap bahasa Melayu.","ru":"Я не малайзиец, но я хочу говорить по-малайски.","tr":"сая букан оранг малайсия, тетапи сая маху чакап бахаса мелаю."},{"ms":"Aisyah cakap: «Bahasa Melayu awak boleh tahan!»","ru":"Аишах сказала: «Твой малайский неплох!»","tr":"аишах чакап: «бахаса мелаю ава' болэх тахан!»"}]}]},"writing":[{"kind":"chat","title":"Сообщение организатору форума","img":"p_flag_students","task":"Нурул из оргкомитета написала вам. Ответьте: вы говорите по-малайски немного, учите язык, попросите писать и говорить медленнее.","from":{"n":"Cik Nurul","v":"f","ms":"Selamat datang ke Forum Belia ASEAN! Awak cakap bahasa Melayu?","ru":"Добро пожаловать на Молодёжный форум АСЕАН! Вы говорите по-малайски?","tr":"селамат датанг ке форум белия асиан! ава' чакап бахаса мелаю?"},"need":[["Благодарность",["terima kasih"]],["«Немного»",["sikit","sedikit"]],["«Учу малайский»",["belajar"]],["Просьба о медленном темпе",["perlahan"]]],"hint":[{"ms":"Saya cakap bahasa Melayu sikit.","ru":"Я немного говорю по-малайски.","tr":"сая чакап бахаса мелаю сикит."},{"ms":"Boleh cakap perlahan sikit?","ru":"Можно помедленнее?","tr":"болэх чакап перлахан сикит?"}],"model":[{"ms":"Terima kasih, Cik Nurul!","ru":"Спасибо, Нурул!","tr":"терима касих, чи' нурул!"},{"ms":"Saya cakap bahasa Melayu sikit. Saya belajar bahasa Melayu.","ru":"Я немного говорю по-малайски. Я учу малайский.","tr":"сая чакап бахаса мелаю сикит. сая беладжар бахаса мелаю."},{"ms":"Boleh cakap perlahan sikit?","ru":"Можно говорить помедленнее?","tr":"болэх чакап перлахан сикит?"},{"ms":"Bahasa Inggeris pun boleh. Terima kasih!","ru":"Можно и по-английски. Спасибо!","tr":"бахаса инггерис пун болэх. терима касих!"}]},{"kind":"form","title":"Анкета участника: языки","img":"p_asean","task":"В анкете участника есть графа «Bahasa». Напишите 4 предложения: на каких языках вы говорите, какой учите, какой понимаете немного. Обязательно используйте tidak и bukan.","need":[["Языки, на которых говорите",["cakap bahasa","bahasa rusia"]],["Что учите",["belajar"]],["tidak",["tidak"]],["bukan",["bukan"]]],"hint":[{"ms":"bahasa Tatar","ru":"татарский язык","tr":"бахаса татар"},{"ms":"bahasa Arab","ru":"арабский язык","tr":"бахаса араб"},{"ms":"Saya bukan orang Malaysia, tetapi…","ru":"Я не малайзиец, но…","tr":"сая букан оранг малайсия, тетапи…"}],"model":[{"ms":"Saya cakap bahasa Rusia dan bahasa Tatar.","ru":"Я говорю по-русски и по-татарски.","tr":"сая чакап бахаса русия дан бахаса татар."},{"ms":"Saya cakap bahasa Inggeris sikit.","ru":"Я немного говорю по-английски.","tr":"сая чакап бахаса инггерис сикит."},{"ms":"Saya belajar bahasa Arab dan bahasa Melayu.","ru":"Я учу арабский и малайский.","tr":"сая беладжар бахаса араб дан бахаса мелаю."},{"ms":"Saya bukan orang Malaysia, tetapi saya faham sikit.","ru":"Я не малайзиец, но немного понимаю.","tr":"сая букан оранг малайсия, тетапи сая фахам сикит."},{"ms":"Saya tidak faham bahasa Cina.","ru":"Я не понимаю китайский.","tr":"сая тида' фахам бахаса чина."}]}],"n":13,"schema":{"pat":["s","n","v"],"rows":[[["s","Saya","я"],["n","tidak","не"],["v","faham","понимаю"]],[["s","Saya","я"],["n","bukan","не"],["o","pelajar","студент"]],[["n","Jangan","не (надо)"],["v","risau","волнуйся"]]],"note":"tidak — перед действием и описанием, bukan — перед предметом, jangan — «не делай»."}},{"id":"d3","week":2,"day":3,"img":"x_putrajaya","meme":["m_nakapa"],"ms":"Kami, kita dan gelaran","title":"Местоимения и обращения","goal":"Говорить о себе и других, выбирать правильное «мы», обращаться к людям по статусу — от коллеги до Датука.","can":["Выбрать между awak, anda и обращением по титулу","Различать kami и kita на переговорах","Говорить об уважаемом человеке через beliau","Обращаться: Encik, Puan, Cik, Tuan, Datuk"],"words":[{"ms":"awak","ru":"ты, вы (ровеснику)","ex":"Awak dari mana?","exRu":"Ты откуда?","use":"Дружески-нейтрально: однокурсники, коллеги одного уровня. Старшему по статусу — по титулу: Encik, Puan, Datuk.","tr":"ава'","exTr":"ава' дари мана?"},{"ms":"anda","ru":"вы (формально, письменно)","ex":"Terima kasih atas kerjasama anda.","exRu":"Спасибо за ваше сотрудничество.","use":"Анкеты, объявления, реклама, слайды презентации. В разговоре с конкретным человеком звучит холодно — лучше обращение по титулу.","tr":"анда","exTr":"терима касих атас керджасама анда."},{"ms":"dia","ru":"он, она","ex":"Dia kawan saya.","exRu":"Это мой друг (моя подруга).","use":"Одно слово для мужчин и женщин. О старших по статусу — beliau.","tr":"дия","exTr":"дия каван сая."},{"ms":"beliau","ru":"он, она (уважительно)","ex":"Beliau Menteri Luar Negeri.","exRu":"Он(а) — министр иностранных дел.","use":"О министрах, профессорах, старших. О себе или о ровеснике — никогда.","tr":"белияу","exTr":"белияу ментэри луар негери."},{"ms":"kami","ru":"мы (без вас)","ex":"Kami dari Universiti Kazan.","exRu":"Мы из Казанского университета.","use":"Моя сторона без собеседника. На переговорах — позиция вашей делегации.","tr":"ками","exTr":"ками дари университи казань."},{"ms":"kita","ru":"мы (вместе с вами)","ex":"Kita jumpa esok.","exRu":"Увидимся завтра (мы с вами).","use":"Включает собеседника. На переговорах kita — обе стороны вместе.","tr":"кита","exTr":"кита джумпа эсо'."},{"ms":"mereka","ru":"они","ex":"Mereka delegasi dari Jepun.","exRu":"Это делегация из Японии.","use":"Для людей. Jepun — малайзийское «Япония» (в Индонезии Jepang).","tr":"мерека","exTr":"мерека дэлэгаси дари джепун."},{"ms":"Encik","ru":"господин (к мужчине)","ex":"Encik Hafiz, ini Sasha.","exRu":"Господин Хафиз, это Саша.","use":"К любому взрослому мужчине без титула: коллега, клиент, сотрудник ресепшена. Encik + имя, а не фамилия.","tr":"энчи'","exTr":"энчи' хафиз, ини саша."},{"ms":"Puan","ru":"госпожа (к женщине)","ex":"Puan Rahimah pensyarah saya.","exRu":"Госпожа Рахима — мой преподаватель.","use":"К взрослой женщине, особенно на работе. Если сомневаетесь между Puan и Cik — выбирайте Puan.","tr":"пуан","exTr":"пуан рахимах пеншарах сая."},{"ms":"Cik","ru":"к молодой женщине","ex":"Terima kasih, Cik Nurul.","exRu":"Спасибо, Нурул.","use":"Молодой незамужней женщине: сотрудница, студентка. Взрослой женщине на работе — Puan.","tr":"чи'","exTr":"терима касих, чи' нурул."},{"ms":"Tuan","ru":"господин (с особым уважением)","ex":"Terima kasih, tuan.","exRu":"Благодарю вас, господин.","use":"Старшему чиновнику, руководителю, иностранному гостю. В письме «Tuan/Puan» — «Уважаемый(ая)».","tr":"туан","exTr":"терима касих, туан."},{"ms":"Datuk","ru":"Датук (почётный титул)","ex":"Selamat datang, Datuk.","exRu":"Добро пожаловать, Датук.","use":"Титул жалуют король или правитель штата. Говорите «Datuk» или «Datuk Kamal». Жена — Datin. Вариант Dato' (титул штата) звучит так же.","tr":"дату'","exTr":"селамат датанг, дату'."}],"rule":{"title":"Два «мы»: kami и kita","ref":"g-kami","text":["В русском одно «мы», в малайском — два. kami — «мы без вас»: я и мои люди. kita — «мы с вами»: включая того, с кем говорим.","На встречах это важно: kami — ваша сторона, делегация, компания. kita — общее дело обеих сторон."],"ex":[{"ms":"Kami dari Rusia.","ru":"Мы (наша делегация) из России.","tr":"ками дари русия."},{"ms":"Kita mula sekarang?","ru":"Начнём (все вместе) сейчас?","tr":"кита мула секаранг?"},{"ms":"Kami setuju, dan kita boleh tandatangan esok.","ru":"Мы (наша сторона) согласны, и мы (обе стороны) можем подписать завтра.","tr":"ками сетуджу, дан кита болэх тандатанган эсо'."}],"mistake":"Сказать хозяевам «Kita sudah bincang…» о решении, которое приняла только ваша делегация. Прозвучит, будто хозяева тоже участвовали. Говорите о своей стороне — kami.","cmp":"Похоже на разницу «мы с тобой» и «мы с ребятами» — только в малайском это отдельные слова."},"dialog":{"scene":"Висма Путра (МИД Малайзии), Путраджая. Студентов-международников принимает Датук Камал, генеральный директор Европейского департамента.","img":"p_boardroom","lines":[{"n":"Puan Rahimah","v":"f","ms":"Selamat pagi, Datuk. Saya Rahimah dari Universiti Malaya.","ru":"Доброе утро, Датук. Я Рахима из Университета Малайя.","tr":"селамат паги, дату'. сая рахимах дари университи малая."},{"n":"Datuk Kamal","v":"m2","ms":"Selamat pagi, Puan Rahimah. Selamat datang ke Wisma Putra.","ru":"Доброе утро, госпожа Рахима. Добро пожаловать в Висма Путра.","tr":"селамат паги, пуан рахимах. селамат датанг ке висма путра."},{"n":"Puan Rahimah","v":"f","ms":"Terima kasih, Datuk. Ini pelajar kami, Sasha. Dia dari Rusia.","ru":"Спасибо, Датук. Это Саша, из наших студентов. Из России.","tr":"терима касих, дату'. ини пеладжар ками, саша. дия дари русия."},{"n":"Datuk Kamal","v":"m2","ms":"Apa khabar, Sasha?","ru":"Как поживаете, Саша?","tr":"апа хабар, саша?"},{"n":"Sasha","v":"m","ms":"Khabar baik, Datuk. Terima kasih. Kami gembira dapat datang ke sini.","ru":"Хорошо, Датук, спасибо. Мы рады, что смогли сюда приехать.","tr":"хабар баи', дату'. терима касих. ками гембира дапат датанг ке сини."},{"n":"Datuk Kamal","v":"m2","ms":"Mereka juga pelajar Puan?","ru":"Они тоже ваши студенты?","tr":"мерека джуга пеладжар пуан?"},{"n":"Puan Rahimah","v":"f","ms":"Ya, Datuk. Mereka dari Jepun dan Korea.","ru":"Да, Датук. Они из Японии и Кореи.","tr":"я, дату'. мерека дари джепун дан корэа."},{"n":"Datuk Kamal","v":"m2","ms":"Bagus. Kita mula sekarang?","ru":"Отлично. Начнём?","tr":"багус. кита мула секаранг?"},{"n":"Puan Rahimah","v":"f","ms":"Boleh, Datuk.","ru":"Да, конечно, Датук.","tr":"болэх, дату'."}]},"slang":[{"ms":"korang","ru":"вы, ребята (вы все)","ex":"Korang nak makan apa?","exRu":"Ребята, вы что будете есть?","ok":"С друзьями и однокурсниками. Из «kau orang» — «вы, люди».","no":"С преподавателем, начальником, делегацией. Там: «tuan-tuan dan puan-puan» или «semua».","say":"korang","tr":"коранг","exTr":"коранг на' макан апа?"},{"ms":"kitorang","ru":"мы (своя компания)","ex":"Kitorang dah sampai.","exRu":"Мы уже на месте.","ok":"Дружеская переписка и разговор. По смыслу это kami — без собеседника.","no":"Официальная речь и письма.","say":"kitorang","tr":"киторанг","exTr":"киторанг дах сампай."}],"build":[{"ru":"Мы (без вас) из Казани.","ms":"Kami dari Kazan.","extra":["kita","mereka"],"tr":"ками дари казань."},{"ru":"Это делегация из Японии.","ms":"Mereka delegasi dari Jepun.","extra":["kami","Rusia"],"tr":"мерека дэлэгаси дари джепун."},{"ru":"Он(а) — министр иностранных дел (уважительно).","ms":"Beliau Menteri Luar Negeri.","extra":["awak","kami"],"tr":"белияу ментэри луар негери."}],"reply":[{"p":"Awak dari mana?","pRu":"(Датук) Откуда вы?","o":["Saya dari Rusia, Datuk.","Aku dari Rusia.","Kami tidak faham."],"a":0,"why":"aku — «я» только для близких друзей и семьи. С Датуком — saya.","pTr":"ава' дари мана?","oTr":["сая дари русия, дату'.","аку дари русия.","ками тида' фахам."]},{"p":"Korang dari mana?","pRu":"(друг) Вы откуда, ребята?","o":["Kitorang dari Rusia.","Beliau dari Rusia.","Sama-sama."],"a":0,"why":"Друг спросил «korang» — можно ответить в тон: kitorang (или нейтрально kami).","pTr":"коранг дари мана?","oTr":["киторанг дари русия.","белияу дари русия.","сама-сама."]}],"test":[{"q":"На переговорах о позиции вашей делегации: «Мы считаем…»","o":["Kami","Kita","Mereka"],"a":0,"why":"Только ваша сторона — kami."},{"q":"Вы предлагаете обеим сторонам начать:","o":["Kami mula sekarang?","Kita mula sekarang?","Mereka mula sekarang?"],"a":1,"why":"Все вместе — kita."},{"q":"Об уважаемом профессоре: «Он из Кембриджа».","o":["Dia dari Cambridge.","Beliau dari Cambridge.","Awak dari Cambridge."],"a":1,"why":"beliau — уважительное «он/она»."},{"q":"Как обратиться к сотруднику ресепшена (мужчине)?","o":["Encik","Datin","Cik"],"a":0,"why":"Encik — к мужчине без титула. Datin — жена Датука, Cik — к молодой женщине."},{"q":"Где уместнее всего «anda»?","o":["В анкете и на слайде презентации","В разговоре с другом","В обращении к Датуку"],"a":0,"why":"anda — безличное письменное «вы»."},{"q":"«Jepun» — это…","o":["Япония","Индонезия","Корея"],"a":0,"why":"Jepun — малайзийская форма, в Индонезии — Jepang."}],"culture":"Почётные титулы в Малайзии важнее должности: Tun → Tan Sri → Datuk Seri → Datuk / Dato'. Жёны: Toh Puan, Puan Sri, Datin Seri, Datin. Если титул напечатан на визитке, используйте его всегда: пропущенный титул воспринимается как неуважение.","story":"Доктор Рахима везёт иностранных студентов в МИД, в Путраджаю. Датук Камал, генеральный директор Европейского департамента, приглашает Сашу на стажировку.","reading":{"title":"Lawatan ke Wisma Putra","kind":"Дневник Саши","img":"p_putrajaya","words":85,"gloss":[{"ms":"pergi","ru":"ехать, идти","tr":"перги"},{"ms":"Ketua Pengarah","ru":"генеральный директор","tr":"кетуа пенгарах"},{"ms":"jawab","ru":"отвечать","tr":"джаваб"},{"ms":"panggil","ru":"звать, называть","tr":"панггил"},{"ms":"tentang","ru":"о, про","tr":"тентанг"},{"ms":"perlu","ru":"нужно, нуждаться","tr":"перлу"},{"ms":"pelatih","ru":"стажёр","tr":"пелатих"},{"ms":"mungkin","ru":"может быть","tr":"мунгкин"}],"q":[{"q":"Кто такой Датук Камал?","o":["Генеральный директор Европейского департамента","Преподаватель","Водитель"],"a":0},{"q":"Почему Датук говорит «Kami perlu pelatih», а не «Kita perlu»?","o":["Министерство — его сторона, студенты в него не входят","Это ошибка","kami вежливее"],"a":0,"why":"kami — «мы без вас»: Датук говорит о своём министерстве, а не о себе вместе со студентами."},{"q":"Как Саша обращался к Датуку?","o":["По титулу: «Datuk»","awak","kamu"],"a":0}],"blocks":[{"h":"Дневник Саши","v":"m","lines":[{"ms":"Hari ini kami pergi ke Wisma Putra di Putrajaya.","ru":"Сегодня мы ездили в Висма Путра в Путраджае.","tr":"хари ини ками перги ке висма путра ди путраджая."},{"ms":"Kami pelajar Puan Rahimah: saya, Yuki dari Jepun dan Min-jun dari Korea.","ru":"Мы — студенты госпожи Рахимы: я, Юки из Японии и Мин Джун из Кореи.","tr":"ками пеладжар пуан рахимах: сая, юки дари джепун дан мин-джун дари корэа."},{"ms":"Datuk Kamal Ketua Pengarah Bahagian Eropah.","ru":"Датук Камал — генеральный директор Европейского департамента.","tr":"дату' камал кетуа пенгарах бахагиян эропах."},{"ms":"Beliau baik dan cakap perlahan.","ru":"Он добрый и говорит медленно.","tr":"белияу баи' дан чакап перлахан."},{"ms":"Beliau tanya: «Awak dari mana?» Saya jawab: «Saya dari Rusia, Datuk.»","ru":"Он спросил: «Вы откуда?» Я ответил(а): «Я из России, Датук».","tr":"белияу таня: «ава' дари мана?» сая джаваб: «сая дари русия, дату'.»"},{"ms":"Saya tidak panggil beliau «awak». Saya panggil beliau «Datuk»!","ru":"Я не называл(а) его «awak». Я называл(а) его «Датук»!","tr":"сая тида' панггил белияу «ава'». сая панггил белияу «дату'»!"},{"ms":"Kami cakap tentang ASEAN dan Rusia.","ru":"Мы говорили об АСЕАН и России.","tr":"ками чакап тентанг асиан дан русия."},{"ms":"Kemudian Datuk cakap: «Kami perlu pelatih yang boleh cakap bahasa Rusia.»","ru":"Потом Датук сказал: «Нам (министерству) нужен стажёр, который говорит по-русски».","tr":"кемудиян дату' чакап: «ками перлу пелатих янг болэх чакап бахаса русия.»"},{"ms":"Mungkin saya!","ru":"Может быть, это я!","tr":"мунгкин сая!"}]}]},"writing":[{"kind":"email","title":"Благодарность Датуку","img":"p_boardroom","task":"Напишите Датуку Камалу короткое письмо от имени группы: поблагодарите за приём, скажите, кто вы (студенты госпожи Рахимы), подпишитесь. Пишите «kami» о вашей группе.","need":[["Обращение по титулу",["datuk"]],["«Мы» без адресата",["kami"]],["Благодарность",["terima kasih"]],["Подпись",["sasha","pelajar"]]],"hint":[{"ms":"Kami gembira dapat datang ke Wisma Putra.","ru":"Мы рады, что смогли приехать в Висма Путра.","tr":"ками гембира дапат датанг ке висма путра."},{"ms":"Kami pelajar Puan Rahimah dari Universiti Malaya.","ru":"Мы студенты госпожи Рахимы из Университета Малайя.","tr":"ками пеладжар пуан рахимах дари университи малая."}],"model":[{"ms":"Datuk,","ru":"Датук!","tr":"дату',"},{"ms":"Terima kasih banyak, Datuk.","ru":"Большое спасибо, Датук.","tr":"терима касих баня', дату'."},{"ms":"Kami pelajar Puan Rahimah dari Universiti Malaya.","ru":"Мы студенты госпожи Рахимы из Университета Малайя.","tr":"ками пеладжар пуан рахимах дари университи малая."},{"ms":"Kami gembira dapat datang ke Wisma Putra.","ru":"Мы рады, что смогли побывать в Висма Путра.","tr":"ками гембира дапат датанг ке висма путра."},{"ms":"Terima kasih. Sasha, pelajar dari Rusia.","ru":"Спасибо. Саша, студент(ка) из России.","tr":"терима касих. саша, пеладжар дари русия."}]},{"kind":"chat","title":"Чат группы","img":"p_students","task":"Юки пишет в общий чат. Ответьте по-дружески: где встретитесь вы все (kita) и где уже ваша компания (kami или kitorang).","from":{"n":"Yuki","v":"f","ms":"Korang, esok kita jumpa di mana?","ru":"Ребята, где завтра встречаемся?","tr":"коранг, эсо' кита джумпа ди мана?"},"need":[["kita — все вместе",["kita"]],["kami / kitorang — ваша компания",["kami","kitorang"]],["Место",["di "]]],"hint":[{"ms":"di fakulti","ru":"на факультете","tr":"ди факулти"},{"ms":"di perpustakaan","ru":"в библиотеке","tr":"ди перпустакаан"},{"ms":"Kitorang tunggu di sana.","ru":"Мы будем ждать там.","tr":"киторанг тунггу ди сана."}],"model":[{"ms":"Kita jumpa di fakulti, Yuki.","ru":"Встречаемся на факультете, Юки.","tr":"кита джумпа ди факулти, юки."},{"ms":"Kami (saya dan Min-jun) tunggu di sana.","ru":"Мы (я и Мин Джун) будем ждать там.","tr":"ками (сая дан мин-джун) тунггу ди сана."},{"ms":"Jumpa esok!","ru":"До завтра!","tr":"джумпа эсо'!"}]}],"n":14,"schema":{"pat":["s","v","o"],"rows":[[["s","Kami","мы (без вас)"],["v","dari","из"],["o","Rusia","России"]],[["s","Kita","мы (с вами)"],["v","makan","поедим"],["l","di mamak","в мамаке"]]],"note":"kami — мы без собеседника, kita — мы вместе с ним."}},{"id":"d4","week":2,"day":4,"img":"p_openoffice","meme":["m_tahu"],"ms":"Di pejabat: ini dan itu","title":"В офисе: это и то","goal":"Назвать предметы в офисе, спросить «что это?», уточнить «какой?», обменяться визитками.","can":["Показывать: ini (это) и itu (то)","Спросить «Что это?» и «Который?»","Обменяться визитками по этикету","Понимать порядок «fail ini» — «эта папка»"],"words":[{"ms":"ini","ru":"это, этот (рядом)","ex":"Ini kad nama saya.","exRu":"Это моя визитка.","use":"Рядом с говорящим. После существительного значит «этот»: fail ini.","tr":"ини","exTr":"ини кад нама сая."},{"ms":"itu","ru":"то, тот (дальше)","ex":"Itu bilik mesyuarat.","exRu":"Там — переговорная.","use":"Дальше от говорящего или уже упомянутое: laporan itu — «тот (самый) отчёт».","tr":"иту","exTr":"иту били' мешуарат."},{"ms":"Apa ini?","ru":"Что это?","ex":"Maaf, apa ini?","exRu":"Извините, что это?","use":"В разговоре часто наоборот: «Ini apa?».","tr":"апа ини?","exTr":"мааф, апа ини?"},{"ms":"pejabat","ru":"офис, контора","ex":"Pejabat saya di Putrajaya.","exRu":"Мой офис в Путраджае.","use":"Малайзийское слово. В Индонезии — kantor. Любой офис, частный и государственный.","tr":"педжабат","exTr":"педжабат сая ди путраджая."},{"ms":"bilik mesyuarat","ru":"переговорная, зал совещаний","ex":"Bilik mesyuarat di tingkat lima.","exRu":"Переговорная на пятом этаже.","use":"bilik — комната, mesyuarat — совещание, tingkat — этаж.","ar":"mesyuarat ← араб. مشاورة «совещание» (как «шура»)","tr":"били' мешуарат","exTr":"били' мешуарат ди тингкат лима."},{"ms":"kad nama","ru":"визитная карточка","ex":"Boleh saya dapat kad nama encik?","exRu":"Можно мне вашу визитку?","use":"Обязательна на любой встрече — берите с собой пачку.","tr":"кад нама","exTr":"болэх сая дапат кад нама энчи'?"},{"ms":"fail","ru":"папка, дело (с документами)","ex":"Fail ini untuk Datuk.","exRu":"Эта папка — для Датука.","use":"И бумажная папка, и компьютерный файл.","tr":"фаил","exTr":"фаил ини унту' дату'."},{"ms":"dokumen","ru":"документ","ex":"Dokumen itu sudah siap.","exRu":"Тот документ уже готов.","use":"Нейтрально и официально. siap — готов.","tr":"докумэн","exTr":"докумэн иту судах сияп."},{"ms":"telefon bimbit","ru":"мобильный телефон","ex":"Telefon bimbit saya di atas meja.","exRu":"Мой мобильный на столе.","use":"Официальное слово. В речи — «telefon», «handphone» или «HP» (эйч-пи).","tr":"тэлэфон бимбит","exTr":"тэлэфон бимбит сая ди атас мэджа."},{"ms":"komputer riba","ru":"ноутбук","ex":"Komputer riba ini untuk awak.","exRu":"Этот ноутбук — для тебя.","use":"Норма DBP. В офисе почти все говорят «laptop» — это тоже нормально.","tr":"компутер риба","exTr":"компутер риба ини унту' ава'."},{"ms":"yang mana?","ru":"который? какой (из)?","ex":"Fail yang mana?","exRu":"Какая папка?","use":"Выбор из нескольких. yang — «который»: fail yang merah — папка, которая красная.","tr":"янг мана?","exTr":"фаил янг мана?"},{"ms":"Sila ambil","ru":"Возьмите, пожалуйста","ex":"Ini kad nama saya. Sila ambil.","exRu":"Вот моя визитка. Возьмите, пожалуйста.","use":"sila — вежливое приглашение что-то сделать. Малайзийское «sila», индонезийское «silakan».","tr":"сила амбил","exTr":"ини кад нама сая. сила амбил."}],"rule":{"title":"ini и itu — после слова","ref":"g-order","text":["ini и itu ставятся ПОСЛЕ существительного, как и все определения: fail ini — «эта папка».","Если ini/itu стоит в начале, получается целое предложение: Ini fail — «Это папка». Порядок слов меняет смысл."],"ex":[{"ms":"Ini pejabat saya.","ru":"Это мой офис.","tr":"ини педжабат сая."},{"ms":"Pejabat ini besar.","ru":"Этот офис большой.","tr":"педжабат ини бесар."},{"ms":"Dokumen itu untuk mesyuarat esok.","ru":"Тот документ — для завтрашнего совещания.","tr":"докумэн иту унту' мешуарат эсо'."}],"mistake":"«Ini dokumen penting» вместо «Dokumen ini penting». Первое — «Это важный документ», второе — «Этот документ важный». Русский порядок «этот документ» тянет поставить ini вперёд.","cmp":"В русском «этот» стоит перед словом, в малайском — после: «документ этот»."},"dialog":{"scene":"Первый день стажировки в Европейском департаменте МИД, Путраджая.","img":"p_office","lines":[{"n":"Mei Ling","v":"f","ms":"Selamat pagi, Sasha! Selamat datang ke pejabat kami.","ru":"Доброе утро, Саша! Добро пожаловать в наш офис.","tr":"селамат паги, саша! селамат датанг ке педжабат ками."},{"n":"Sasha","v":"m","ms":"Selamat pagi, Mei Ling. Terima kasih.","ru":"Доброе утро, Мэй Линг. Спасибо.","tr":"селамат паги, мэй линг. терима касих."},{"n":"Mei Ling","v":"f","ms":"Ini meja awak, dan itu bilik mesyuarat.","ru":"Это твой стол, а там переговорная.","tr":"ини мэджа ава', дан иту били' мешуарат."},{"n":"Sasha","v":"m","ms":"Bilik mesyuarat itu besar! Apa ini?","ru":"Какая большая переговорная! А это что?","tr":"били' мешуарат иту бесар! апа ини?"},{"n":"Mei Ling","v":"f","ms":"Ini fail projek ASEAN. Sila baca hari ini.","ru":"Это папка проекта АСЕАН. Прочитай её сегодня, пожалуйста.","tr":"ини фаил проджэ' асиан. сила бача хари ини."},{"n":"Sasha","v":"m","ms":"Fail yang mana? Yang merah?","ru":"Какая папка? Красная?","tr":"фаил янг мана? янг мэрах?"},{"n":"Mei Ling","v":"f","ms":"Ya, yang merah. Oh ya, ini kad nama saya.","ru":"Да, красная. Ах да, вот моя визитка.","tr":"я, янг мэрах. ох я, ини кад нама сая."},{"n":"Sasha","v":"m","ms":"Terima kasih. Ini kad nama saya. Sila ambil.","ru":"Спасибо. Вот моя. Возьми, пожалуйста.","tr":"терима касих. ини кад нама сая. сила амбил."},{"n":"Mei Ling","v":"f","ms":"Okey! Komputer riba awak ada di sini.","ru":"Окей! Твой ноутбук — вот здесь.","tr":"окей! компутер риба ава' ада ди сини."},{"n":"Sasha","v":"m","ms":"Bagus, terima kasih banyak!","ru":"Отлично, большое спасибо!","tr":"багус, терима касих баня'!"}]},"slang":[{"ms":"ni / tu","ru":"это / то (коротко)","ex":"Apa ni?","exRu":"Это что?","ok":"Устная речь: «fail ni», «bilik tu». Очень частотно.","no":"На письме и в выступлении — полные ini, itu.","say":"ni / tu","tr":"ни / ту","exTr":"апа ни?"},{"ms":"okey","ru":"окей, хорошо","ex":"Okey, boleh.","exRu":"Окей, можно.","ok":"Везде в неформальном общении, в офисе тоже.","no":"В официальной речи и письмах: «baik» («хорошо, принято»).","say":"okey","tr":"окей","exTr":"окей, болэх."}],"build":[{"ru":"Этот офис большой.","ms":"Pejabat ini besar.","extra":["itu","saya"],"tr":"педжабат ини бесар."},{"ru":"Это моя визитка.","ms":"Ini kad nama saya.","extra":["itu","awak"],"tr":"ини кад нама сая."},{"ru":"Какая папка?","ms":"Fail yang mana?","extra":["apa","ini"],"tr":"фаил янг мана?"}],"reply":[{"p":"Sasha, sila ambil fail itu.","pRu":"Саша, возьми, пожалуйста, ту папку.","o":["Fail yang mana?","Selamat pagi.","Saya dari Rusia."],"a":0,"why":"Не ясно, какая папка, — уточните: «Fail yang mana?».","pTr":"саша, сила амбил фаил иту.","oTr":["фаил янг мана?","селамат паги.","сая дари русия."]},{"p":"Ini kad nama saya.","pRu":"Вот моя визитка.","o":["Terima kasih. Ini kad nama saya.","Apa khabar?","Tidak faham."],"a":0,"why":"Обмен визитками: поблагодарите и дайте свою.","pTr":"ини кад нама сая.","oTr":["терима касих. ини кад нама сая.","апа хабар?","тида' фахам."]}],"test":[{"q":"«Эта папка» по-малайски:","o":["ini fail","fail ini","fail itu ini"],"a":1,"why":"ini — после существительного."},{"q":"«Ini dokumen penting» значит…","o":["Это важный документ","Этот документ важный","Тот документ важный"],"a":0,"why":"ini в начале = «это …»."},{"q":"Как по-малайзийски «офис»?","o":["kantor","pejabat","ofis"],"a":1,"why":"kantor — индонезийское слово."},{"q":"Как передать визитку?","o":["Левой рукой","Двумя руками или правой","Положить на стол не глядя"],"a":1,"why":"Левая рука считается нечистой."},{"q":"«Yang mana?» значит…","o":["Который?","Что это?","Где?"],"a":0,"why":"yang mana — выбор из нескольких."},{"q":"Малайзийское соответствие индонезийскому «silakan» (прошу):","o":["sila","silah","tolong"],"a":0,"why":"В Малайзии — sila."}],"culture":"Визитку дают и принимают обеими руками или правой (левую можно подставить под правое запястье). Прочитайте её и положите на стол перед собой, не в задний карман. Левая рука в малайской и индийской традиции считается нечистой: ничего не передавайте левой.","story":"Приглашение принято: первый день стажировки в Европейском департаменте МИД. Коллега Мэй Линг показывает офис и выдаёт первую папку — проект АСЕАН.","reading":{"title":"Hari pertama di pejabat","kind":"Дневник + з ер телефона словами, номер комнаты словами. Каждую графу — отдельной строкой.","need":[["Nama",["nama"]],["Negara",["rusia","negara"]],["Телефон словами",["kosong"]],["Комната",["bilik"]]],"hint":[{"ms":"Nama: …","ru":"Имя: …","tr":"нама: …"},{"ms":"Negara: Rusia","ru":"Страна: Россия","tr":"негара: русия"},{"ms":"Nombor telefon: …","ru":"Телефон: …","tr":"номбор тэлэфон: …"}],"model":[{"ms":"Nama: Sasha","ru":"Имя: Саша","tr":"нама: саша"},{"ms":"Negara: Rusia","ru":"Страна: Россия","tr":"негара: русия"},{"ms":"Nombor telefon: kosong satu tujuh, lima lima tiga, lapan dua sembilan kosong","ru":"Телефон: 017-553-8290","tr":"номбор тэлэфон: косонг сату туджух, лима лима тига, лапан дуа сембилан косонг"},{"ms":"Bilik: dua puluh tiga","ru":"Комната: 23","tr":"били': дуа пулух тига"}]}],"n":16,"schema":{"pat":["k","x","o"],"rows":[[["k","dua","два"],["x","orang","(счётное: люди)"],["o","pelajar","студента"]],[["k","tiga","три"],["x","buah","(счётное: вещи)"],["o","kereta","машины"]]],"note":"Число перед словом, счётное слово между ними. Само слово во множественное не ставят."}},{"id":"d6","week":2,"day":6,"img":"p_meeting","meme":["m_alamak"],"ms":"Masa dan jadual","title":"Время и расписание","goal":"Спросить и назвать время, договориться о встрече на сегодня или завтра, предупредить об опоздании.","can":["Спросить «Который час?» и «Во сколько?»","Назвать время: 10:30, 4:15, три часа дня","Говорить «вчера / сегодня / завтра» по-малайзийски","Извиниться за опоздание"],"words":[{"ms":"Pukul berapa?","ru":"Который час? Во сколько?","ex":"Pukul berapa sekarang?","exRu":"Который сейчас час?","use":"И «который час», и «во сколько»: «Mesyuarat pukul berapa?» — Во сколько совещание?","tr":"пукул берапа?","exTr":"пукул берапа секаранг?"},{"ms":"pukul","ru":"(в) … часов","ex":"Pukul tiga petang.","exRu":"Три часа дня.","use":"Перед временем на часах: pukul + число.","tr":"пукул","exTr":"пукул тига петанг."},{"ms":"setengah","ru":"половина (…:30)","ex":"Pukul dua setengah.","exRu":"Половина третьего (2:30).","use":"Ставится ПОСЛЕ часа: pukul sepuluh setengah = 10:30. Логика английского «half past».","tr":"сетенгах","exTr":"пукул дуа сетенгах."},{"ms":"suku","ru":"четверть","ex":"Pukul empat suku.","exRu":"Четверть пятого (4:15).","use":"kurang suku — без четверти: pukul lima kurang suku = 4:45.","tr":"суку","exTr":"пукул эмпат суку."},{"ms":"minit","ru":"минута","ex":"Sepuluh minit lagi.","exRu":"Ещё десять минут.","tr":"минит","exTr":"сепулух минит лаги."},{"ms":"sekarang","ru":"сейчас","ex":"Saya di pejabat sekarang.","exRu":"Я сейчас в офисе.","tr":"секаранг","exTr":"сая ди педжабат секаранг."},{"ms":"hari ini","ru":"сегодня","ex":"Hari ini ada mesyuarat.","exRu":"Сегодня есть совещание.","use":"hari — день, ini — этот: «этот день».","tr":"хари ини","exTr":"хари ини ада мешуарат."},{"ms":"esok","ru":"завтра","ex":"Jumpa esok pukul sembilan.","exRu":"Увидимся завтра в девять.","use":"Малайзийское. В Индонезии — besok. Послезавтра — lusa.","tr":"эсо'","exTr":"джумпа эсо' пукул сембилан."},{"ms":"semalam","ru":"вчера","ex":"Semalam saya di Putrajaya.","exRu":"Вчера я был(а) в Путраджае.","use":"Ловушка: в Малайзии semalam = вчера, а в Индонезии это «прошлой ночью» (вчера там — kemarin).","tr":"семалам","exTr":"семалам сая ди путраджая."},{"ms":"tengah hari","ru":"полдень, обеденное время","ex":"Kita makan tengah hari bersama?","exRu":"Пообедаем вместе?","use":"Примерно 12:00–14:00. makan tengah hari — обед.","tr":"тенгах хари","exTr":"кита макан тенгах хари берсама?"},{"ms":"lewat","ru":"поздно; опаздывать","ex":"Maaf, saya lewat lima minit.","exRu":"Извините, я опаздываю на пять минут.","use":"Малайзийское. В Индонезии — terlambat.","tr":"лэват","exTr":"мааф, сая лэват лима минит."},{"ms":"awal","ru":"рано","ex":"Saya datang awal.","exRu":"Я приду пораньше.","ar":"awal ← араб. أوّل «первый, начало»","tr":"авал","exTr":"сая датанг авал."}],"rule":{"title":"Время на часах: pukul + число + часть суток","ref":"g-time","text":["pukul tiga petang = 15:00. Малайзийцы говорят по 12-часовой системе и уточняют часть суток: pagi (утро), tengah hari (полдень), petang (день до вечера), malam (вечер, ночь).","pukul — время на часах, jam — длительность: pukul dua = в два часа, dua jam = два часа подряд."],"ex":[{"ms":"Pukul lapan pagi.","ru":"8:00 утра.","tr":"пукул лапан паги."},{"ms":"Pukul sepuluh setengah pagi.","ru":"10:30 утра.","tr":"пукул сепулух сетенгах паги."},{"ms":"Mesyuarat dua jam.","ru":"Совещание длится два часа.","tr":"мешуарат дуа джам."}],"mistake":"Половину ставят после часа: pukul sepuluh setengah — это 10:30, а не «половина десятого». Русская привычка «половина одиннадцатого» сбивает чаще всего. И не забывайте часть суток: «pukul tujuh» без pagi/malam двусмысленно.","cmp":"Как русское «в три часа дня»: число + часть суток."},"dialog":{"scene":"Звонок секретарю департамента протокола МИД: нужно встретиться с Хафизом, который готовит визит российской делегации.","img":"perdana","lines":[{"n":"Sasha","v":"m","ms":"Selamat pagi, Puan. Saya Sasha, pelatih di Bahagian Eropah.","ru":"Доброе утро. Это Саша, стажёр Европейского департамента.","tr":"селамат паги, пуан. сая саша, пелатих ди бахагиян эропах."},{"n":"Puan Salmah","v":"f","ms":"Selamat pagi. Ya, boleh saya bantu?","ru":"Доброе утро. Да, чем могу помочь?","tr":"селамат паги. я, болэх сая банту?"},{"n":"Sasha","v":"m","ms":"Mesyuarat dengan Encik Hafiz hari ini pukul berapa?","ru":"Во сколько сегодня встреча с господином Хафизом?","tr":"мешуарат денган энчи' хафиз хари ини пукул берапа?"},{"n":"Puan Salmah","v":"f","ms":"Bukan hari ini, esok. Pukul sepuluh setengah pagi.","ru":"Не сегодня, а завтра. В 10:30 утра.","tr":"букан хари ини, эсо'. пукул сепулух сетенгах паги."},{"n":"Sasha","v":"m","ms":"Esok pukul sepuluh setengah. Di bilik mesyuarat?","ru":"Завтра в 10:30. В переговорной?","tr":"эсо' пукул сепулух сетенгах. ди били' мешуарат?"},{"n":"Puan Salmah","v":"f","ms":"Ya, bilik mesyuarat tingkat lima. Mesyuarat satu jam.","ru":"Да, переговорная на пятом этаже. Встреча на час.","tr":"я, били' мешуарат тингкат лима. мешуарат сату джам."},{"n":"Sasha","v":"m","ms":"Baik, Puan. Saya datang awal.","ru":"Хорошо. Я приду пораньше.","tr":"баи', пуан. сая датанг авал."},{"n":"Puan Salmah","v":"f","ms":"Bagus. Encik Hafiz tidak suka orang lewat.","ru":"Отлично. Господин Хафиз не любит, когда опаздывают.","tr":"багус. энчи' хафиз тида' сука оранг лэват."},{"n":"Sasha","v":"m","ms":"Faham. Terima kasih, Puan. Jumpa esok.","ru":"Понятно. Спасибо. До завтра.","tr":"фахам. терима касих, пуан. джумпа эсо'."}]},"slang":[{"ms":"kejap / jap","ru":"секунду, минутку","ex":"Kejap ya, saya check.","exRu":"Секунду, сейчас проверю.","ok":"Разговор, телефон, чат. «Jap» — ещё короче.","no":"Официально: «Sila tunggu sebentar» (урок 11).","say":"kejap / jap","tr":"кеджап / джап","exTr":"кеджап я, сая чек."},{"ms":"lepak","ru":"тусоваться, сидеть расслабленно","ex":"Jom lepak kat mamak malam ni.","exRu":"Пошли вечером посидим в мамаке.","ok":"С друзьями. Мамак + lepak — национальный досуг. kat — разговорное «di».","no":"О работе: «saya lepak di pejabat» прозвучит как «я бездельничаю на работе».","say":"lepak","tr":"лэпа'","exTr":"джом лэпа' кат мама' малам ни."}],"build":[{"ru":"Половина третьего (2:30).","ms":"Pukul dua setengah.","extra":["suku","jam"],"tr":"пукул дуа сетенгах."},{"ru":"Я опаздываю на пять минут.","ms":"Saya lewat lima minit.","extra":["awal","esok"],"tr":"сая лэват лима минит."},{"ru":"Увидимся завтра.","ms":"Jumpa esok.","extra":["semalam","hari"],"tr":"джумпа эсо'."}],"reply":[{"p":"Mesyuarat pukul berapa?","pRu":"Во сколько совещание?","o":["Pukul sepuluh setengah pagi.","Dua jam.","Semalam."],"a":0,"why":"Спросили время на часах — pukul …","pTr":"мешуарат пукул берапа?","oTr":["пукул сепулух сетенгах паги.","дуа джам.","семалам."]},{"p":"Maaf, saya lewat sepuluh minit.","pRu":"Извините, я опоздал(а) на десять минут.","o":["Tak apa. Sila duduk.","Selamat pagi.","Pukul berapa?"],"a":0,"why":"Ответ на извинение: «Ничего. Садитесь, пожалуйста».","pTr":"мааф, сая лэват сепулух минит.","oTr":["та' апа. сила дуду'.","селамат паги.","пукул берапа?"]}],"test":[{"q":"Как сказать 10:30 утра?","o":["pukul sepuluh setengah pagi","pukul setengah sepuluh pagi","jam sepuluh tiga puluh"],"a":0,"why":"Половина — после часа: 10 + половина."},{"q":"«Semalam» в Малайзии значит…","o":["вчера","прошлой ночью","сегодня вечером"],"a":0,"why":"В Индонезии — «прошлой ночью», в Малайзии — «вчера»."},{"q":"«Завтра» по-малайзийски:","o":["besok","esok","lusa"],"a":1,"why":"besok — индонезийское, lusa — послезавтра."},{"q":"«Dua jam» — это…","o":["два часа (длительность)","в два часа","2:15"],"a":0,"why":"jam — длительность, pukul — время на часах."},{"q":"Pukul empat suku —","o":["4:15","4:45","4:30"],"a":0,"why":"suku — четверть после часа."},{"q":"«Опаздывать» по-малайзийски:","o":["terlambat","lewat","awal"],"a":1,"why":"terlambat — индонезийская норма."}],"culture":"Официальные мероприятия в Малайзии начинаются вовремя, а самые высокие гости приезжают последними — к их приезду все уже на местах. На неформальную встречу могут и опоздать (шутливо «janji Melayu» — «малайское обещание»), но на работе на это не рассчитывайте.","story":"Департамент протокола готовит визит российской делегации. Саша, единственный стажёр с русским языком, должен(на) встретиться с Хафизом, который отвечает за визит.","reading":{"title":"Jadual esok","kind":"Расписание Саши на завтра","img":"p_meeting","words":100,"gloss":[{"ms":"sibuk","ru":"занятой, насыщенный","tr":"сибу'"},{"ms":"rumah","ru":"дом","tr":"румах"},{"ms":"mahu","ru":"хотеть","tr":"маху"},{"ms":"datang","ru":"приходить","tr":"датанг"}],"q":[{"q":"Во сколько встреча с Хафизом?","o":["10:30","9:30","10:15"],"a":0,"why":"sepuluh setengah = 10 и половина = 10:30."},{"q":"Что у Саши в 15:15?","o":["Урок малайского","Обед","Лекция"],"a":0},{"q":"Что случилось вчера (semalam)?","o":["Саша опоздал(а) на 5 минут","Саша пришёл(ла) рано","Встреча отменилась"],"a":0}],"blocks":[{"h":"Расписание и заметки Саши","v":"m","lines":[{"ms":"Esok hari yang sibuk.","ru":"Завтра насыщенный день.","tr":"эсо' хари янг сибу'."},{"ms":"Pukul lapan pagi: kuliah hubungan antarabangsa di universiti.","ru":"8:00 — лекция по международным отношениям в университете.","tr":"пукул лапан паги: кулиях хубунган антарабангса ди университи."},{"ms":"Pukul sepuluh setengah pagi: mesyuarat dengan Encik Hafiz di Wisma Putra.","ru":"10:30 — встреча с господином Хафизом в Висма Путра.","tr":"пукул сепулух сетенгах паги: мешуарат денган энчи' хафиз ди висма путра."},{"ms":"Mesyuarat itu satu jam.","ru":"Встреча длится час.","tr":"мешуарат иту сату джам."},{"ms":"Pukul satu tengah hari: makan tengah hari dengan Mei Ling.","ru":"13:00 — обед с Мэй Линг.","tr":"пукул сату тенгах хари: макан тенгах хари денган мэй линг."},{"ms":"Pukul tiga suku petang: kelas bahasa Melayu.","ru":"15:15 — урок малайского.","tr":"пукул тига суку петанг: келас бахаса мелаю."},{"ms":"Pukul lapan malam: saya belajar di rumah.","ru":"20:00 — занимаюсь дома.","tr":"пукул лапан малам: сая беладжар ди румах."},{"ms":"Semalam saya lewat lima minit ke kuliah.","ru":"Вчера я опоздал(а) на лекцию на пять минут.","tr":"семалам сая лэват лима минит ке кулиях."},{"ms":"Esok saya mahu datang awal, pukul tujuh setengah.","ru":"Завтра хочу прийти пораньше, в 7:30.","tr":"эсо' сая маху датанг авал, пукул туджух сетенгах."}]}]},"writing":[{"kind":"chat","title":"Подтверждение встречи","img":"p_meeting","task":"Напишите секретарю Салмах: представьтесь, подтвердите время встречи с Хафизом (завтра, 10:30 утра) и скажите, что придёте пораньше.","need":[["Приветствие",["selamat"]],["Представиться",["saya sasha","pelatih"]],["Время",["pukul sepuluh setengah"]],["Завтра",["esok"]],["Приду рано",["awal"]]],"hint":[{"ms":"…, betul?","ru":"…, верно?","tr":"…, бетул?"},{"ms":"Saya datang awal.","ru":"Я приду пораньше.","tr":"сая датанг авал."}],"model":[{"ms":"Selamat petang, Puan Salmah.","ru":"Добрый день, госпожа Салмах.","tr":"селамат петанг, пуан салмах."},{"ms":"Saya Sasha, pelatih di Bahagian Eropah.","ru":"Это Саша, стажёр Европейского департамента.","tr":"сая саша, пелатих ди бахагиян эропах."},{"ms":"Mesyuarat dengan Encik Hafiz esok pukul sepuluh setengah pagi, betul?","ru":"Встреча с господином Хафизом завтра в 10:30 утра, верно?","tr":"мешуарат денган энчи' хафиз эсо' пукул сепулух сетенгах паги, бетул?"},{"ms":"Saya datang awal. Terima kasih, Puan.","ru":"Я приду пораньше. Спасибо.","tr":"сая датанг авал. терима касих, пуан."}]},{"kind":"chat","title":"Опаздываю!","img":"p_lrt","task":"Вы опаздываете на лекцию на 10 минут. Напишите Аишах: извинитесь, скажите, на сколько опаздываете и где вы сейчас; спросите, во сколько начинается следующая пара.","need":[["Извинение",["maaf"]],["Опаздываю",["lewat"]],["Минуты",["minit"]],["Сейчас",["sekarang"]],["Вопрос о времени",["pukul berapa"]]],"hint":[{"ms":"Saya dalam Grab sekarang.","ru":"Я сейчас в Grab.","tr":"сая далам грэб секаранг."},{"ms":"Kelas seterusnya pukul berapa?","ru":"Во сколько следующая пара?","tr":"келас сетерусня пукул берапа?"}],"model":[{"ms":"Aisyah, maaf! Saya lewat sepuluh minit.","ru":"Аишах, прости! Опаздываю на десять минут.","tr":"аишах, мааф! сая лэват сепулух минит."},{"ms":"Saya dalam Grab sekarang.","ru":"Я сейчас в Grab.","tr":"сая далам грэб секаранг."},{"ms":"Kelas seterusnya pukul berapa?","ru":"Во сколько следующая пара?","tr":"келас сетерусня пукул берапа?"}]}],"n":17,"schema":{"pat":["x","k","t"],"rows":[[["x","pukul","в (час)"],["k","tiga","три"],["t","petang","дня"]],[["x","pukul","в (час)"],["k","lapan setengah","полвосьмого"],["t","pagi","утра"]]],"note":"pukul + число + часть суток: pagi, tengah hari, petang, malam."}},{"id":"d7","week":2,"day":7,"img":"p_mamak_students","meme":["m_rendang","m_chefcat"],"ms":"Di kedai mamak","title":"В мамаке: заказ и счёт","goal":"Заказать еду и напитки в мамаке, попросить поменьше сахара, взять с собой, попросить счёт и угостить друга.","can":["Сделать заказ: Saya nak …","Попросить kurang manis и air kosong","Ответить «здесь или с собой»","Попросить счёт и угостить"],"words":[{"ms":"nak","ru":"хотеть (разг.)","ex":"Saya nak teh tarik.","exRu":"Я хочу teh tarik.","use":"Разговорное от hendak. Нейтрально — mahu, официально — ingin: «Saya ingin mengucapkan terima kasih».","tr":"на'","exTr":"сая на' тэх тари'."},{"ms":"makan","ru":"есть; еда","ex":"Jom makan!","exRu":"Пошли поедим!","use":"makan tengah hari — обед, makan malam — ужин.","tr":"макан","exTr":"джом макан!"},{"ms":"minum","ru":"пить","ex":"Minum apa?","exRu":"Что будете пить?","use":"Первый вопрос официанта.","tr":"минум","exTr":"минум апа?"},{"ms":"teh tarik","ru":"«тянутый» чай с молоком","ex":"Satu teh tarik, kurang manis.","exRu":"Один teh tarik, поменьше сахара.","use":"Национальный напиток: чай со сгущёнкой, который «тянут», переливая из кружки в кружку для пены.","img":"teh_tarik","tr":"тэх тари'","exTr":"сату тэх тари', куранг манис."},{"ms":"kopi","ru":"кофе","ex":"Kopi O satu.","exRu":"Один чёрный кофе с сахаром.","use":"kopi — с молоком и сахаром, kopi O — чёрный с сахаром, kopi O kosong — чёрный без сахара.","tr":"копи","exTr":"копи о сату."},{"ms":"nasi lemak","ru":"рис на кокосовом молоке","ex":"Nasi lemak di sini sedap.","exRu":"Здесь вкусный nasi lemak.","use":"Неофициальное национальное блюдо: рис, острый самбал, анчоусы, арахис, яйцо. Часто едят на завтрак.","img":"nasi_lemak","tr":"наси лема'","exTr":"наси лема' ди сини седап."},{"ms":"roti canai","ru":"слоёная лепёшка с карри","ex":"Roti canai dua, kuah campur.","exRu":"Две roti canai, соус смешанный.","use":"Классика мамака. roti telur — с яйцом.","img":"roti_making","tr":"роти чанай","exTr":"роти чанай дуа, куах чампур."},{"ms":"air kosong","ru":"простая вода","ex":"Air kosong satu.","exRu":"Одну простую воду.","use":"Буквально «пустая вода». Иногда стоит 50 сен, иногда бесплатно.","tr":"аир косонг","exTr":"аир косонг сату."},{"ms":"kurang manis","ru":"поменьше сахара","ex":"Teh tarik kurang manis, ya.","exRu":"Teh tarik поменьше сахара, хорошо?","use":"Напитки в Малайзии очень сладкие — пригодится. Без сахара: «tanpa gula» или «kosong».","tr":"куранг манис","exTr":"тэх тари' куранг манис, я."},{"ms":"bungkus","ru":"с собой (упаковать)","ex":"Nasi lemak satu, bungkus.","exRu":"Один nasi lemak с собой.","use":"Нейтральное «на вынос». Разговорный синоним — tapau (сленг дня).","img":"nasi_bungkus","tr":"бунгкус","exTr":"наси лема' сату, бунгкус."},{"ms":"makan sini","ru":"здесь (поесть на месте)","ex":"Makan sini atau bungkus?","exRu":"Здесь или с собой?","use":"Стандартный вопрос официанта.","tr":"макан сини","exTr":"макан сини атау бунгкус?"},{"ms":"Berapa semua?","ru":"Сколько всего?","ex":"Boss, berapa semua?","exRu":"Сколько с нас всего?","use":"Попросить счёт. Разговорно также: «Kira!» — «Посчитайте!».","tr":"берапа семуа?","exTr":"бос, берапа семуа?"}],"rule":{"title":"Заказ: nak + что, число перед словом","ref":"g-polite","text":["Заказ строится просто: Saya nak + блюдо. Можно и без «saya nak»: «Satu teh tarik!».","В нейтральной речи число стоит перед существительным: dua roti canai. В мамаке часто говорят и наоборот — teh tarik satu. Это нормальная разговорная форма."],"ex":[{"ms":"Saya nak nasi lemak.","ru":"Мне nasi lemak.","tr":"сая на' наси лема'."},{"ms":"Dua roti canai dan satu kopi.","ru":"Две roti canai и один кофе.","tr":"дуа роти чанай дан сату копи."},{"ms":"Boleh saya dapat air kosong?","ru":"Можно мне простой воды?","tr":"болэх сая дапат аир косонг?"}],"mistake":"Говорить «Sila teh tarik» в значении «чай, пожалуйста». sila — это приглашение («прошу садиться»), а не просьба. В заказе «пожалуйста» вообще не нужно: вежливость передают тон и «terima kasih».","cmp":"Как в русском кафе: «Мне чай» — без глагола «дайте»."},"dialog":{"scene":"Вечер пятницы, мамак рядом с кампусом.","img":"p_mamak_friends","lines":[{"n":"Pelayan","v":"m2","ms":"Ya, boss, nak order apa?","ru":"Да, что заказываем?","tr":"я, бос, на' одер апа?"},{"n":"Aisyah","v":"f","ms":"Saya nak nasi lemak dan teh tarik kurang manis.","ru":"Мне nasi lemak и teh tarik поменьше сахара.","tr":"сая на' наси лема' дан тэх тари' куранг манис."},{"n":"Sasha","v":"m","ms":"Saya nak roti canai dua dan air kosong satu.","ru":"Мне две roti canai и одну воду.","tr":"сая на' роти чанай дуа дан аир косонг сату."},{"n":"Pelayan","v":"m2","ms":"Makan sini atau bungkus?","ru":"Здесь или с собой?","tr":"макан сини атау бунгкус?"},{"n":"Sasha","v":"m","ms":"Makan sini.","ru":"Здесь.","tr":"макан сини."},{"n":"Pelayan","v":"m2","ms":"Okey, sekejap ya.","ru":"Окей, минутку.","tr":"окей, секеджап я."},{"n":"Aisyah","v":"f","ms":"Sasha, roti canai di sini sedap!","ru":"Саша, здесь вкусные roti canai!","tr":"саша, роти чанай ди сини седап!"},{"n":"Sasha","v":"m","ms":"Ya, sedap! Boss, berapa semua?","ru":"Да, вкусно! Сколько с нас?","tr":"я, седап! бос, берапа семуа?"},{"n":"Pelayan","v":"m2","ms":"Semua dua belas ringgit.","ru":"Всего двенадцать ринггитов.","tr":"семуа дуа белас ринггит."},{"n":"Sasha","v":"m","ms":"Hari ini saya belanja, Aisyah.","ru":"Сегодня я угощаю, Аишах.","tr":"хари ини сая беланджа, аишах."},{"n":"Aisyah","v":"f","ms":"Wah, terima kasih! Lain kali saya pula.","ru":"Ого, спасибо! В следующий раз — я.","tr":"вах, терима касих! лаин кали сая пула."}]},"slang":[{"ms":"tapau","ru":"с собой, на вынос","ex":"Nasi lemak satu, tapau.","exRu":"Один nasi lemak на вынос.","ok":"Ларьки, мамаки, фудкорты. Слово пришло из кантонского — пример того, как смешиваются языки Малайзии.","no":"В ресторане отеля и в письменной речи — bungkus.","say":"tapau","tr":"тапау","exTr":"наси лема' сату, тапау."},{"ms":"boss","ru":"обращение к продавцу или официанту","ex":"Boss, teh tarik satu!","exRu":"Шеф, один teh tarik!","ok":"В мамаке и на рынке к мужчине любого возраста — дружелюбно, без иронии. К женщине — «kak» («сестрица»).","no":"В дорогом ресторане и к вашему настоящему начальнику — там Encik / Puan.","say":"boss","tr":"бос","exTr": что»."},{"q":"Индонезийскому «kirim» (отправить) соответствует малайзийское…","o":["hantar","pergi","buat"],"a":0,"why":"hantar — отправить, отвезти."},{"q":"«Dah makan?» — это…","o":["Приветствие-забота","Приглашение в ресторан","Вопрос о диете"],"a":0,"why":"Так здороваются и проявляют заботу."},{"q":"В официальном отчёте вместо «dah» пишем…","o":["sudah / telah","belum","nak"],"a":0,"why":"dah — только разговорное."}],"culture":"«Dah makan?» («Уже поел(а)?») — это приветствие, а не приглашение на обед. Отвечают «Dah» или «Belum» и спрашивают в ответ: «Awak?». Так малайзийцы показывают заботу.","story":"Неделя 2. Датук Камал ждёт отчёт о форуме АСЕАН к утру. Мэй Линг торопит Сашу и обещает проверить малайский.","reading":{"title":"Laporan untuk Datuk","kind":"Письмо коллеги + дневник","img":"p_cafe_laptop","words":120,"gloss":[{"ms":"sebelum","ru":"до, перед","tr":"себелум"},{"ms":"dulu","ru":"сначала","tr":"дулу"},{"ms":"semak","ru":"проверять","tr":"сема'"},{"ms":"betulkan","ru":"исправлять","tr":"бетулкан"},{"ms":"penat","ru":"усталый","tr":"пенат"}],"q":[{"q":"Когда Датук прочитает отчёт?","o":["Завтра утром, до совещания","Сегодня вечером","На следующей неделе"],"a":0},{"q":"Что сделает Мэй Линг?","o":["Проверит и поправит язык","Напишет отчёт сама","Отправит его Датуку"],"a":0},{"q":"«Saya baru hantar» значит…","o":["Я только что отправил(а)","Я отправлю новое","Я ещё не отправил(а)"],"a":0}],"blocks":[{"h":"Письмо от Мэй Линг","v":"f","lines":[{"ms":"Sasha, Datuk Kamal sudah tanya tentang laporan Forum Belia ASEAN.","ru":"Саша, Датук Камал уже спрашивал про отчёт о Молодёжном форуме АСЕАН.","tr":"саша, дату' камал судах таня тентанг лапоран форум белия асиан."},{"ms":"Beliau akan baca laporan itu esok pagi, sebelum mesyuarat pukul sembilan.","ru":"Он прочитает его завтра утром, до совещания в девять.","tr":"белияу акан бача лапоран иту эсо' паги, себелум мешуарат пукул сембилан."},{"ms":"Awak sudah siap? Kalau belum, tidak apa.","ru":"У тебя готово? Если ещё нет, ничего страшного.","tr":"ава' судах сияп? калау белум, тида' апа."},{"ms":"Hantar kepada saya dulu sebelum pukul lima petang ini.","ru":"Сначала пришли мне, до пяти вечера.","tr":"хантар кепада сая дулу себелум пукул лима петанг ини."},{"ms":"Saya akan semak dan betulkan bahasa. Terima kasih, Mei Ling.","ru":"Я проверю и поправлю язык. Спасибо, Мэй Линг.","tr":"сая акан сема' дан бетулкан бахаса. терима касих, мэй линг."}]},{"h":"Дневник Саши, 18:00","v":"m","lines":[{"ms":"Saya masih di pejabat. Sekarang pukul enam petang.","ru":"Я всё ещё в офисе. Сейчас шесть вечера.","tr":"сая масих ди педжабат. секаранг пукул энам петанг."},{"ms":"Laporan sudah siap! Saya baru hantar kepada Mei Ling.","ru":"Отчёт готов! Я только что отправил(а) его Мэй Линг.","tr":"лапоран судах сияп! сая бару хантар кепада мэй линг."},{"ms":"Mei Ling sedang semak laporan itu sekarang.","ru":"Мэй Линг сейчас его проверяет.","tr":"мэй линг седанг сема' лапоран иту секаранг."},{"ms":"Saya penat, tetapi gembira.","ru":"Я устал(а), но доволен(льна).","tr":"сая пенат, тетапи гембира."},{"ms":"Nanti saya akan pergi makan dengan Aisyah.","ru":"Потом пойду поесть с Аишах.","tr":"нанти сая акан перги макан денган аишах."}]}]},"writing":[{"kind":"email","title":"Статус отчёта","img":"p_office","task":"Ответьте Мэй Линг: что уже сделано (sudah), что ещё нет (belum), что делаете сейчас (sedang) и когда отправите (akan).","need":[["sudah",["sudah"]],["belum",["belum"]],["sedang",["sedang"]],["akan",["akan"]],["Время отправки",["pukul","petang","nanti"]]],"hint":[{"ms":"Bahagian pertama sudah siap.","ru":"Первая часть готова.","tr":"бахагиян пертама судах сияп."},{"ms":"Kesimpulan belum siap.","ru":"Выводы ещё не готовы.","tr":"кесимпулан белум сияп."}],"model":[{"ms":"Mei Ling, terima kasih.","ru":"Мэй Линг, спасибо.","tr":"мэй линг, терима касих."},{"ms":"Bahagian pertama laporan sudah siap.","ru":"Первая часть отчёта готова.","tr":"бахагиян пертама лапоран судах сияп."},{"ms":"Kesimpulan belum siap. Saya sedang buat sekarang.","ru":"Выводы ещё не готовы — пишу прямо сейчас.","tr":"кесимпулан белум сияп. сая седанг буат секаранг."},{"ms":"Saya akan hantar sebelum pukul lima petang.","ru":"Отправлю до пяти вечера.","tr":"сая акан хантар себелум пукул лима петанг."},{"ms":"Sasha","ru":"Саша","tr":"саша"}]},{"kind":"diary","title":"Дневник: мой день","img":"p_desk_write","task":"Напишите 5 предложений о сегодняшнем дне: что уже сделали, что ещё нет, что делаете сейчас, что будете делать вечером, где всё ещё находитесь.","need":[["sudah",["sudah","dah"]],["belum",["belum"]],["sedang",["sedang"]],["akan",["akan"]],["masih",["masih"]]],"hint":[{"ms":"Saya sudah makan tengah hari.","ru":"Я уже пообедал(а).","tr":"сая судах макан тенгах хари."},{"ms":"Saya masih di universiti.","ru":"Я всё ещё в университете.","tr":"сая масих ди университи."}],"model":[{"ms":"Hari ini saya sudah pergi ke kuliah.","ru":"Сегодня я уже сходил(а) на лекцию.","tr":"хари ини сая судах перги ке кулиях."},{"ms":"Saya belum makan malam.","ru":"Я ещё не ужинал(а).","tr":"сая белум макан малам."},{"ms":"Sekarang saya sedang belajar bahasa Melayu.","ru":"Сейчас я учу малайский.","tr":"секаранг сая седанг беладжар бахаса мелаю."},{"ms":"Saya masih di perpustakaan.","ru":"Я всё ещё в библиотеке.","tr":"сая масих ди перпустакаан."},{"ms":"Nanti saya akan pergi ke mamak dengan Aisyah.","ru":"Потом пойду в мамак с Аишах.","tr":"нанти сая акан перги ке мама' денган аишах."}]}],"n":22,"schema":{"pat":["s","x","v","o"],"rows":[[["s","Saya","я"],["x","sudah","уже"],["v","makan","поел(а)"]],[["s","Dia","она"],["x","sedang","сейчас"],["v","mesyuarat","на совещании"]],[["s","Kami","мы"],["x","akan","будем"],["v","datang","приедем"],["t","esok","завтра"]]],"note":"Время — маленьким словом перед глаголом: sudah, sedang, akan, belum."}},{"id":"d9","week":3,"day":9,"img":"x_monorail","meme":["m_upin_sad"],"ms":"Naik Grab ke Putrajaya","title":"По городу: Grab, LRT, дорога","goal":"Спросить дорогу, объяснить водителю маршрут, попросить остановиться, говорить «где / куда / откуда».","can":["Спросить «Где …?»","Объяснить: прямо, налево, направо, остановитесь здесь","Различать di, ke и dari","Поговорить с водителем Grab"],"words":[{"ms":"Di mana?","ru":"Где?","ex":"Stesen LRT di mana?","exRu":"Где станция LRT?","use":"Где находится. «Ke mana?» — куда? «Dari mana?» — откуда?","tr":"ди мана?","exTr":"стэсэн эл-ар-ти ди мана?"},{"ms":"ke","ru":"в, на (куда)","ex":"Saya nak pergi ke Wisma Putra.","exRu":"Мне нужно в Висма Путра.","use":"Направление: ke pejabat, ke KLIA.","tr":"ке","exTr":"сая на' перги ке висма путра."},{"ms":"naik","ru":"ехать на; подниматься","ex":"Saya naik LRT ke kampus.","exRu":"Я езжу в кампус на LRT.","use":"naik + транспорт: naik Grab, naik bas, naik kereta api (поезд). Также «подниматься»: naik ke tingkat lima.","tr":"наи'","exTr":"сая наи' эл-ар-ти ке кампус."},{"ms":"stesen","ru":"станция","ex":"Kita jumpa di stesen KL Sentral.","exRu":"Встретимся на станции KL Sentral.","use":"stesen LRT, stesen MRT, stesen bas.","img":"sentral_sign","tr":"стэсэн","exTr":"кита джумпа ди стэсэн кей-эл сентрал."},{"ms":"belok kiri","ru":"повернуть налево","ex":"Belok kiri di lampu isyarat.","exRu":"Поверните налево на светофоре.","use":"kiri — левый. lampu isyarat — светофор.","tr":"бело' кири","exTr":"бело' кири ди лампу ишарат."},{"ms":"belok kanan","ru":"повернуть направо","ex":"Lepas ini, belok kanan.","exRu":"После этого — направо.","use":"kanan — правый.","tr":"бело' канан","exTr":"лепас ини, бело' канан."},{"ms":"jalan terus","ru":"прямо","ex":"Jalan terus, kemudian belok kiri.","exRu":"Прямо, потом налево.","use":"jalan — идти, дорога; terus — прямо, сразу.","tr":"джалан терус","exTr":"джалан терус, кемудиян бело' кири."},{"ms":"berhenti","ru":"остановиться","ex":"Boleh berhenti di sini?","exRu":"Можно остановиться здесь?","use":"Остановить такси или автобус. Знак «Berhenti» — «Стоп».","tr":"берхенти","exTr":"болэх берхенти ди сини?"},{"ms":"di sini","ru":"здесь","ex":"Saya tunggu di sini.","exRu":"Я подожду здесь.","use":"di sana — там, di situ — вон там (рядом с собеседником).","tr":"ди сини","exTr":"сая тунггу ди сини."},{"ms":"dekat","ru":"близко; около","ex":"Hotel saya dekat KLCC.","exRu":"Мой отель рядом с KLCC.","use":"dekat stesen — рядом со станцией. В речи часто «kat» вместо «di».","tr":"декат","exTr":"хотел сая декат кей-эл-си-си."},{"ms":"jauh","ru":"далеко","ex":"Putrajaya jauh dari sini?","exRu":"Путраджая далеко отсюда?","use":"tak jauh — недалеко, jauh sangat — очень далеко.","tr":"джаух","exTr":"путраджая джаух дари сини?"},{"ms":"kereta","ru":"машина, автомобиль","ex":"Kereta Grab sudah sampai.","exRu":"Машина Grab уже приехала.","use":"Малайзийское. В Индонезии «mobil», а «kereta» там — поезд! В Малайзии поезд — kereta api.","tr":"керэта","exTr":"керэта грэб судах сампай."}],"rule":{"title":"di, ke, dari: где, куда, откуда","ref":"g-place","text":["Русское «в» в малайском — два слова. di — где (на месте): di pejabat — в офисе (нахожусь). ke — куда (движение): ke pejabat — в офис (иду).","dari — откуда: dari pejabat — из офиса. Все три пишутся отдельно от следующего слова."],"ex":[{"ms":"Saya di stesen LRT.","ru":"Я на станции LRT.","tr":"сая ди стэсэн эл-ар-ти."},{"ms":"Saya nak pergi ke Putrajaya.","ru":"Я хочу поехать в Путраджаю.","tr":"сая на' перги ке путраджая."},{"ms":"Dia datang dari KLIA.","ru":"Он(а) едет из аэропорта KLIA.","tr":"дия датанг дари кей-эл-ай-эй."}],"mistake":"«Saya pergi di pejabat» — ошибка: с движением нужно ke. Проверка: вопрос «где?» — di, «куда?» — ke, «откуда?» — dari.","cmp":"Как русские «в офисе / в офис / из офиса» — только вместо окончаний разные предлоги."},"dialog":{"scene":"Grab от станции до Висма Путра, Путраджая.","img":"p_grab","lines":[{"n":"Encik Ravi","v":"m2","ms":"Selamat petang. Sasha, ya? Nak pergi ke Wisma Putra?","ru":"Добрый день. Саша, да? Едем в Висма Путра?","tr":"селамат петанг. саша, я? на' перги ке висма путра?"},{"n":"Sasha","v":"m","ms":"Ya, betul. Jauh dari sini?","ru":"Да, верно. Это далеко отсюда?","tr":"я, бетул. джаух дари сини?"},{"n":"Encik Ravi","v":"m2","ms":"Tak jauh sangat. Empat puluh minit, kalau tak jem.","ru":"Не очень. Минут сорок, если без пробок.","tr":"та' джаух сангат. эмпат пулух минит, калау та' джэм."},{"n":"Sasha","v":"m","ms":"Okey. Saya ada mesyuarat pukul tiga.","ru":"Окей. У меня встреча в три.","tr":"окей. сая ада мешуарат пукул тига."},{"n":"Encik Ravi","v":"m2","ms":"Jangan risau, sempat.","ru":"Не волнуйтесь, успеем.","tr":"джанган рисау, семпат."},{"n":"Encik Ravi","v":"m2","ms":"Kita dah sampai Putrajaya. Bangunan yang mana?","ru":"Мы уже в Путраджае. Какое здание?","tr":"кита дах сампай путраджая. бангунан янг мана?"},{"n":"Sasha","v":"m","ms":"Wisma Putra. Jalan terus, kemudian belok kanan.","ru":"Висма Путра. Прямо, потом направо.","tr":"висма путра. джалан терус, кемудиян бело' канан."},{"n":"Encik Ravi","v":"m2","ms":"Belok kanan… okey. Di sini?","ru":"Направо… окей. Здесь?","tr":"бело' канан… окей. ди сини?"},{"n":"Sasha","v":"m","ms":"Ya. Boleh berhenti di sini, dekat pintu itu?","ru":"Да. Можно остановиться здесь, у той двери?","tr":"я. болэх берхенти ди сини, декат пинту иту?"},{"n":"Encik Ravi","v":"m2","ms":"Boleh. Terima kasih, semoga berjaya!","ru":"Конечно. Спасибо, удачи!","tr":"болэх. терима касих, семога берджая!"},{"n":"Sasha","v":"m","ms":"Terima kasih, bang!","ru":"Спасибо!","tr":"терима касих, банг!"}]},"slang":[{"ms":"jem","ru":"пробка","ex":"Jalan ke KLCC jem teruk!","exRu":"По дороге к KLCC жуткая пробка!","ok":"Везде в разговоре. От английского jam.","no":"В официальном тексте: «kesesakan lalu lintas».","say":"jem","tr":"джэм","exTr":"джалан ке кей-эл-си-си джэм теру'!"},{"ms":"bang / kak","ru":"к мужчине / женщине чуть старше","ex":"Bang, berhenti sini.","exRu":"Брат, остановите здесь.","ok":"Водитель, продавец, официант. От abang (старший брат) и kakak (старшая сестра).","no":"В офисе к руководителю и к официальным лицам — Encik / Puan.","say":"b ","meme":["m_chef"],"ms":"Kerja dan jawatan","title":"Работа и должности","goal":"Рассказать, где и кем вы работаете, за что отвечаете, и расспросить собеседника на деловом форуме.","can":["Назвать место работы и сектор","Спросить и назвать должность","Сказать, за что вы отвечаете","Строить глаголы с приставкой ber-"],"words":[{"ms":"bekerja","ru":"работать","ex":"Saya bekerja di Kuala Lumpur.","exRu":"Я работаю в Куала-Лумпуре.","use":"Нейтрально-официально. В разговоре часто просто kerja: «Awak kerja di mana?».","tr":"бекерджа","exTr":"сая бекерджа ди куала лумпур."},{"ms":"syarikat","ru":"компания, фирма","ex":"Syarikat kami dari Rusia.","exRu":"Наша компания из России.","use":"Любая фирма. «Sdn. Bhd.» в названии — аналог ООО.","ar":"syarikat ← араб. شركة; тат. ширкәт","tr":"шарикат","exTr":"шарикат ками дари русия."},{"ms":"kerajaan","ru":"правительство; государственный","ex":"Dia pegawai kerajaan.","exRu":"Он(а) госслужащий.","use":"От raja — правитель. Малайзийское; в Индонезии правительство — pemerintah.","tr":"кераджаан","exTr":"дия пегавай кераджаан."},{"ms":"swasta","ru":"частный (сектор)","ex":"Saya bekerja di sektor swasta.","exRu":"Я работаю в частном секторе.","use":"kerajaan и swasta — госсектор и частный.","tr":"сваста","exTr":"сая бекерджа ди сэктор сваста."},{"ms":"kementerian","ru":"министерство","ex":"Kementerian Luar Negeri di Putrajaya.","exRu":"Министерство иностранных дел — в Путраджае.","use":"Kementerian Luar Negeri (KLN) — МИД; его здание и неофициальное имя — Wisma Putra.","tr":"кементэриян","exTr":"кементэриян луар негери ди путраджая."},{"ms":"jawatan","ru":"должность","ex":"Apa jawatan encik?","exRu":"Какая у вас должность?","use":"Вопрос при знакомстве на форуме — нормален.","tr":"джаватан","exTr":"апа джаватан энчи'?"},{"ms":"pengurus","ru":"менеджер, управляющий","ex":"Beliau pengurus besar syarikat itu.","exRu":"Он(а) генеральный директор той компании.","use":"pengurus besar — генеральный директор. В Индонезии — manajer.","tr":"пенгурус","exTr":"белияу пенгурус бесар шарикат иту."},{"ms":"pegawai","ru":"служащий, должностное лицо","ex":"Pegawai protokol akan sambut kita.","exRu":"Нас встретит сотрудник протокола.","use":"Особенно в госсекторе: Pegawai Tadbir dan Diplomatik (PTD) — дипломатическая и административная служба.","tr":"пегавай","exTr":"пегавай протокол акан самбут кита."},{"ms":"setiausaha","ru":"секретарь","ex":"Setiausaha Datuk akan telefon awak.","exRu":"Секретарь Датука вам позвонит.","use":"И секретарь, и высокий пост: Ketua Setiausaha — генеральный секретарь министерства. В Индонезии — sekretaris.","tr":"сетияусаха","exTr":"сетияусаха дату' акан тэлэфон ава'."},{"ms":"bahagian","ru":"отдел, департамент","ex":"Saya di Bahagian Eropah.","exRu":"Я в Европейском департаменте.","use":"Структура министерства: Bahagian → Unit → Seksyen.","tr":"бахагиян","exTr":"сая ди бахагиян эропах."},{"ms":"bertanggungjawab","ru":"отвечать (за)","ex":"Saya bertanggungjawab atas kerjasama dengan ASEAN.","exRu":"Я отвечаю за сотрудничество с АСЕАН.","use":"bertanggungjawab atas + что-то. tanggungjawab — ответственность.","tr":"бертанггунгджаваб","exTr":"сая бертанггунгджаваб атас керджасама денган асиан."},{"ms":"berasal dari","ru":"быть родом из","ex":"Saya berasal dari Kazan.","exRu":"Я родом из Казани.","use":"Чуть официальнее, чем просто «dari». Хорошо звучит при знакомстве на форуме.","tr":"берасал дари","exTr":"сая берасал дари казань."}],"rule":{"title":"Приставка ber-: из слова — действие","ref":"g-ber","text":["Приставка ber- превращает слово в действие или состояние «иметь / делать это»: kerja (работа) → bekerja (работать), asal (происхождение) → berasal (быть родом).","Перед словом, где в первом слоге есть r, ber- теряет r: ber + kerja = bekerja, ber + ajar = belajar. Глаголы с ber- обычно не требуют дополнения."],"ex":[{"ms":"Saya bekerja di kementerian.","ru":"Я работаю в министерстве.","tr":"сая бекерджа ди кементэриян."},{"ms":"Kami bermesyuarat setiap Isnin.","ru":"У нас совещание каждый понедельник.","tr":"ками бермешуарат сетияп иснин."},{"ms":"Mereka berasal dari Sabah.","ru":"Они родом с Сабаха.","tr":"мерека берасал дари сабах."}],"mistake":"В разговоре можно «Saya kerja di…», но на интервью, в резюме и в речи — bekerja. Обратная ошибка — добавлять ber- к любому глаголу: «berpergi» не существует, только pergi.","cmp":"Похоже на русское «работа → работать»: от существительного делаем глагол. В малайском это делает приставка ber-."},"dialog":{"scene":"Нетворкинг на бизнес-форуме, Конгресс-центр Куала-Лумпура.","img":"p_seminar","lines":[{"n":"Puan Lee","v":"f","ms":"Selamat petang. Saya Lee, pengurus syarikat logistik di Port Klang.","ru":"Добрый день. Я Ли, менеджер логистической компании в Порт-Кланге.","tr":"селамат петанг. сая ли, пенгурус шарикат логисти' ди порт кланг."},{"n":"Sasha","v":"m","ms":"Selamat petang, Puan Lee. Saya Sasha, pelatih di Bahagian Eropah, Kementerian Luar Negeri.","ru":"Добрый день, госпожа Ли. Я Саша, стажёр Европейского департамента МИД.","tr":"селамат петанг, пуан ли. сая саша, пелатих ди бахагиян эропах, кементэриян луар негери."},{"n":"Puan Lee","v":"f","ms":"Menarik! Awak berasal dari mana?","ru":"Интересно! А вы откуда родом?","tr":"менари'! ава' берасал дари мана?"},{"n":"Sasha","v":"m","ms":"Saya berasal dari Kazan, Rusia. Puan bekerja di sektor swasta?","ru":"Я родом из Казани, Россия. Вы работаете в частном секторе?","tr":"сая берасал дари казань, русия. пуан бекерджа ди сэктор сваста?"},{"n":"Puan Lee","v":"f","ms":"Ya. Tetapi syarikat kami banyak bekerjasama dengan kerajaan.","ru":"Да. Но наша компания много сотрудничает с правительством.","tr":"я. тетапи шарикат ками баня' бекерджасама денган кераджаан."},{"n":"Sasha","v":"m","ms":"Puan bertanggungjawab atas apa?","ru":"А за что вы отвечаете?","tr":"пуан бертанггунгджаваб атас апа?"},{"n":"Puan Lee","v":"f","ms":"Saya bertanggungjawab atas pasaran Eropah dan Rusia. Ini kad nama saya.","ru":"Я отвечаю за рынки Европы и России. Вот моя визитка.","tr":"сая бертанггунгджаваб атас пасаран эропах дан русия. ини кад нама сая."},{"n":"Sasha","v":"m","ms":"Terima kasih. Boleh kita berhubung lagi?","ru":"Спасибо. Будем на связи?","tr":"терима касих. болэх кита берхубунг лаги?"},{"n":"Puan Lee","v":"f","ms":"Sudah tentu. WhatsApp saya bila-bila masa.","ru":"Конечно. Пишите в WhatsApp в любое время.","tr":"судах тенту. уотсап сая била-била маса."}]},"slang":[{"ms":"makan gaji","ru":"работать по найму","ex":"Saya makan gaji je, bukan bos.","exRu":"Я просто наёмный работник, не начальник.","ok":"Шутливо с друзьями. Буквально «есть зарплату».","no":"В резюме и на собеседовании: «bekerja sebagai…» — «работаю в должности…».","say":"makan gaji","tr":"макан гаджи","exTr":"сая макан гаджи дже, букан бос."},{"ms":"bos","ru":"начальник, шеф","ex":"Bos saya cuti hari ini.","exRu":"Мой шеф сегодня в отпуске.","ok":"Разговор с коллегами.","no":"При самом начальнике и в письмах: Ketua, Pengarah или Encik / Puan + имя.","say":"bos","tr":"бос","exTr":"бос сая чути хари ини."}],"build":[{"ru":"Я работаю в министерстве.","ms":"Saya bekerja di kementerian.","extra":["kerja","ke"],"tr":"сая бекерджа ди кементэриян."},{"ru":"Я родом из Казани.","ms":"Saya berasal dari Kazan.","extra":["di","ke"],"tr":"сая берасал дари казань."},{"ru":"Какая у вас должность?","ms":"Apa jawatan encik?","extra":["siapa","pengurus"],"tr":"апа джаватан энчи'?"}],"reply":[{"p":"Awak bekerja di mana?","pRu":"Где вы работаете?","o":["Saya bekerja di sebuah syarikat swasta.","Saya berasal dari Rusia.","Pukul sembilan."],"a":0,"why":"Спросили «где работаете» — называем место. sebuah — «одна» (счётное слово).","pTr":"ава' бекерджа ди мана?","oTr":["сая бекерджа ди себуах шарикат сваста.","сая берасал дари русия.","пукул сембилан."]},{"p":"Ini kad nama saya.","pRu":"Вот моя визитка.","o":["Terima kasih, Puan. Boleh kita berhubung lagi?","Saya bos.","Takpe."],"a":0,"why":"Поблагодарить и предложить остаться на связи.","pTr":"ини кад нама сая.","oTr":["терима касих, пуан
