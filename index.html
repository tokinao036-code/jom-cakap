a.org/wikipedia/commons/thumb/e/e5/Melaka_Malaysia_Stadthuys-01.jpg/960px-Melaka_Malaysia_Stadthuys-01.jpg","file":"Melaka Malaysia Stadthuys-01.jpg","lic":"CC BY-SA 3.0","cap":"Мелака, Стадтхёйс"},"c_langkawi":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Makam_Mahsuri.jpg/960px-Makam_Mahsuri.jpg","file":"Makam Mahsuri.jpg","lic":"CC BY-SA 4.0","cap":"Гробница Махсури, Лангкави"},"c_ledang":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Gunung_Ledang_waterfall.jpg/960px-Gunung_Ledang_waterfall.jpg","file":"Gunung Ledang waterfall.jpg","lic":"Public domain","cap":"Гора Леданг"},"c_zapin":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Zapin.jpg/960px-Zapin.jpg","file":"Zapin.jpg","lic":"CC BY-SA 2.0","cap":"Танец запин"}},"alphabet":[{"l":"a","r":"а","ex":"apa","ru":"что","note":"Как русское «а». В конце слова в Малайзии часто звучит ослабленно, почти «ə»: apa ≈ «апэ». В транскрипции пишем «а».","tr":"апа"},{"l":"e","r":"е","ex":"selamat","ru":"здравствуйте (в приветствиях)","note":"Чаще всего — короткий нейтральный звук, как безударный гласный в слове «мешок». Согласную перед ним НЕ смягчаем: «селамат» читаем как [сəламат].","tr":"селамат"},{"l":"e","r":"э","ex":"boleh","ru":"можно","note":"В части слов «e» открытое, как «э» в слове «это». Мы всегда пишем такие слова через «э». Также «э» в начале слова: esok — «эсо'».","tr":"болэх"},{"l":"i","r":"и","ex":"kita","ru":"мы (включая вас)","note":"Как «и». Сочетание ia читаем «ия»: Rusia — «русия», dia — «дия».","tr":"кита"},{"l":"o","r":"о","ex":"orang","ru":"человек","note":"Как «о», без перехода в «а»: всегда чёткое «о».","tr":"оранг"},{"l":"u","r":"у","ex":"satu","ru":"один","note":"Как «у».","tr":"сату"},{"l":"c","r":"ч","ex":"cakap","ru":"говорить","note":"Всегда «ч», никогда не «к» и не «ц».","tr":"чакап"},{"l":"j","r":"дж","ex":"jumpa","ru":"встречать","note":"Слитное «дж», как в слове «джем».","tr":"джумпа"},{"l":"sy","r":"ш","ex":"syarikat","ru":"компания","note":"Как «ш». Часто в словах из арабского: syarikat ← شركة.","tr":"шарикат"},{"l":"kh","r":"х","ex":"khabar","ru":"новость, дела","note":"Арабский звук خ, как русское «х». Тот же, что в татарском «хәбәр».","tr":"хабар"},{"l":"ng","r":"нг","ex":"dengan","ru":"с (кем-то)","note":"ОДИН носовой звук, как в английском sing: язык не касается зубов, отдельного «г» нет.","tr":"денган"},{"l":"ngg","r":"нгг","ex":"tinggal","ru":"жить, оставаться","note":"Тот же носовой звук плюс настоящее «г»: тин-ггал.","tr":"тинггал"},{"l":"ny","r":"нь","ex":"banyak","ru":"много","note":"Мягкое «нь», как в слове «няня»: banyak — «баня'».","tr":"баня'"},{"l":"y","r":"й","ex":"saya","ru":"я","note":"«й»; ya, yu пишем как «я», «ю»: saya — «сая».","tr":"сая"},{"l":"w","r":"в","ex":"wang","ru":"деньги","note":"Губной звук, как английское w: губы округлены, зубы губу не касаются.","tr":"ванг"},{"l":"h","r":"х","ex":"rumah","ru":"дом","note":"Лёгкий выдох, мягче русского «х». В конце слова тоже звучит: rumah — «румах».","tr":"румах"},{"l":"r","r":"р","ex":"rakan","ru":"коллега, друг","note":"Раскатистое или мягкое «р». В Куала-Лумпуре на конце слова часто почти пропадает: pasar ≈ «паса».","tr":"ракан"},{"l":"k (в конце)","r":"'","ex":"tidak","ru":"не","note":"В конце слова «k» не произносят как «к»: голос резко обрывается (гортанная смычка). Обозначаем апострофом: тида'.","tr":"тида'"},{"l":"g","r":"г","ex":"pagi","ru":"утро","note":"Всегда твёрдое «г».","tr":"паги"},{"l":"ai","r":"ай","ex":"pakai","ru":"носить, использовать","note":"В конце слова — «ай». Внутри слова часто два слога: baik — «ба-и'».","tr":"пакай"},{"l":"au","r":"ау","ex":"pulau","ru":"остров","note":"«ау» одним слогом в конце слова.","tr":"пулау"}],"readTips":["Ударение слабое и обычно падает на предпоследний слог. Не выделяйте его сильно — малайская речь звучит ровно.","Буквы читаются почти всегда одинаково: выучив таблицу, вы сможете прочитать любое слово.","Двойная гласная не тянется: kerajaan — «кера-джа-ан», два отдельных «а».","Дефис — это повтор слова: sama-sama, kanak-kanak. Читаем оба раза полностью."],"sources":[{"title":"Colloquial Malay: The Complete Course for Beginners","who":"Zaharah Othman, Routledge, 2-е изд. (2012, переиздания)","why":"Автор — малайзийский преподаватель, курс построен на современной разговорной речи Малайзии. 16 уроков: диалоги из жизни, грамматика без жаргона, культурные заметки, бесплатное аудио от носителей. Отсюда взяты логика подачи «ситуация → диалог → правило» и разговорный регистр.","url":"https://www.routledge.com/Colloquial-Malay-The-Complete-Course-for-Beginners/Othman/p/book/9781138958609"},{"title":"Bahasa Melayu Komunikasi 1 и 2 (курс MPU)","who":"Обязательный курс малайского для иностранных студентов вузов Малайзии","why":"Ровно ваша ситуация: международный студент в Малайзии. 14-недельный модуль: кампус, общежитие, транспорт, магазин, базовая письменная речь. Единого учебника нет (вузы пишут свои модули), поэтому берём структуру и темы, а не тексты. По нему построен «университетский» блок программы.","url":"https://en.wikipedia.org/wiki/Mata_Pelajaran_Umum"},{"title":"Complete Malay (Teach Yourself)","who":"Christopher Byrnes, Tam Lye Suan, Eva Nyimas; Hodder / John Murray","why":"Ведёт от нуля до уровня B2: работа, город, ресторан, врач. Хорошая последовательность грамматики (аффиксы ber-, meN-, di-) — по ней выстроена грамматическая линия месяцев 2–3. Один из соавторов говорит на индонезийском, поэтому лексику сверяем по малайзийским нормам.","url":"https://www.langcen.cam.ac.uk/resources/langm/data/my_113.html"},{"title":"Speak Standard Malay / Malay for Daily Use","who":"Liaw Yock Fang, Marshall Cavendish","why":"Пособия по стандартному (baku) малайскому для иностранцев от известного лингвиста. Опора для точных формулировок правил и нейтрального делового регистра.","url":"https://e-flt.nus.edu.sg/v5n12008/rev_sew.pdf"},{"title":"Нормы: Tatabahasa Dewan, словарь PRPM (DBP) и правила деловой переписки","who":"Dewan Bahasa dan Pustaka; руководства по surat rasmi (Arkib Negara, вузы Малайзии)","why":"DBP — государственный регулятор малайского языка в Малайзии. Его словарь (prpm.dbp.gov.my) и грамматика — арбитр в спорных случаях «малайзийское или индонезийское?». Руководства по официальным письмам дают структуру писем: PERKARA, «Dengan hormatnya», «Sekian, terima kasih».","url":"https://prpm.dbp.gov.my/"},{"title":"Дополнительно: Talk In Malay (онлайн)","who":"Онлайн-курс разговорного малайзийского","why":"Подходит для ежедневного аудирования живой речи с частицами lah, kan, je. Не основа программы: независимых обзоров мало, поэтому используем как тренажёр слуха.","url":"https://www.mezzoguild.com/online-malay-courses/"}],"principles":["Сначала речь, потом теория: каждое правило вытекает из диалога, который вы уже слышали.","Две линии параллельно: «быт и кампус» и «работа и протокол». С первой недели — обращения, визитки, письма.","Не больше 12 новых единиц в день. Остальное — повторение карточками (интервальное повторение).","Только малайзийская норма: слова сверены с DBP. Где Индонезия говорит иначе, это отмечено.","Арабский и татарский — ваши союзники: сотни малайских слов пришли из арабского (waktu, khabar, syarikat, maklum). Такие слова помечены."],"map":[{"w":1,"m":1,"t":"Знакомство и базовая речь","g":"Предложение без «быть», tidak/bukan, kami/kita, ini/itu, числа 0–10, время","r":"Представиться, обратиться по статусу, обменяться визитками и номерами, договориться о времени, заказать в мамаке."},{"w":2,"m":1,"t":"Город, кампус, офис, делегация","g":"sudah/belum/akan, di/ke/dari, принадлежность, sila/tolong, приставка ber-, регистры","r":"Доехать на Grab, поговорить с преподавателем, представиться на форуме, встретить делегацию, написать короткое официальное письмо."},{"w":3,"m":1,"t":"Дни, даты, планы","g":"Дни недели (Isnin, Selasa… — арабские корни), месяцы, даты; mahu/hendak/ingin; вопросы bila/berapa lama","r":"Назначить и перенести встречу, рассказать о планах на неделю, заполнить календарь мероприятия."},{"w":4,"m":1,"t":"Деньги, покупки, рынок","g":"Числа до миллиона, ringgit/sen, счётные слова (orang, buah, ekor, keping), lebih/kurang/paling","r":"Купить на рынке и в торговом центре, торговаться, сравнить цены. Контрольная месяца (уровень A1)."},{"w":5,"m":2,"t":"Жильё и здоровье","g":"Повелительное наклонение (-lah, jangan, cuba), ada/tiada, pernah","r":"Снять комнату, объясниться в клинике, вызвать мастера, поговорить с соседями."},{"w":6,"m":2,"t":"Глагол с meN- (1)","g":"meN-: mem-/men-/meng-/meny-; какие буквы «выпадают»; переходные глаголы","r":"Рассказать о рабочем дне, звонить по телефону, оставить сообщение."},{"w":7,"m":2,"t":"Биография и опыт","g":"pernah, baru, tadi, dulu; ke-…-an (kesihatan, kerajaan); связки kemudian, selepas itu","r":"Рассказать о себе на собеседовании, составить короткое резюме, описать прошлую поездку."},{"w":8,"m":2,"t":"Поручения на работе","g":"Суффиксы -kan и -i; boleh tolong + глагол; tolong + -kan","r":"Попросить и поручить, согласовать сроки, подтвердить выполнение. Контрольная месяца (A2)."},{"w":9,"m":3,"t":"Официальный стиль и пассив","g":"Пассив di- и ter-; «Mesyuarat akan diadakan…»; объявления и пресс-релизы","r":"Понимать объявления, повестки, новости Bernama, писать уведомления."},{"w":10,"m":3,"t":"Политика и экономика","g":"Существительные pe-, pe-…-an, per-…-an (pembangunan, perundingan, perjanjian)","r":"Говорить о торговле, инвестициях, ASEAN, отношениях Малайзии и России."},{"w":11,"m":3,"t":"Мнение и аргументы","g":"Menurut saya, pada pendapat saya; walaupun, oleh itu, namun; сравнение","r":"Участвовать в дискуссии на семинаре, вежливо не соглашаться."},{"w":12,"m":3,"t":"Презентация","g":"Структура выступления; peratus, meningkat, menurun; описание графиков","r":"Сделать 5-минутную презентацию с цифрами и ответить на вопросы."},{"w":13,"m":3,"t":"Совещание","g":"Agenda, minit mesyuarat, cadangan, keputusan; условные kalau/jika/sekiranya","r":"Вести и протоколировать совещание, онлайн-созвон."},{"w":14,"m":4,"t":"Приёмы и праздники","g":"Small talk, комплименты, восклицания; частицы kan, pun, je","r":"Поддержать беседу на приёме, open house на Hari Raya, Тахун Бару Чина, Дипавали, Гавай."},{"w":15,"m":4,"t":"Деловая переписка (2)","g":"Полная форма surat rasmi, memo, приглашение, ответ, отказ","r":"Написать официальное письмо, приглашение и вежливый отказ."},{"w":16,"m":4,"t":"Свободная речь: быт и работа","g":"Повторение аффиксов, разговорные сокращения и их нормы","r":"Ролевые игры без подготовки. Контрольная «4 месяца»: уверенное общение в быту и на работе."},{"w":17,"m":4,"t":"Дипломатическая лексика","g":"Kementerian Luar Negeri, perjanjian, memorandum persefahaman (MoU), hubungan dua hala; номинализация","r":"Обсуждать повестку двусторонних отношений и документы."},{"w":18,"m":5,"t":"Протокол высшего уровня","g":"YAB, YB, Tan Sri, Tuanku; основы bahasa istana (дворцовой речи): santap, beradu, berangkat","r":"Правильно обратиться к министру, депутату, члену королевской семьи."},{"w":19,"m":5,"t":"Речь на форуме","g":"Ucapan aluan, penghargaan, penutup; peribahasa (пословицы) для речей","r":"Произнести приветственное слово на 3 минуты."},{"w":20,"m":5,"t":"Переговоры","g":"Cadangan, tawaran, bersetuju, mempertimbangkan; вежливый отказ и компромисс","r":"Вести переговоры, фиксировать договорённости."},{"w":21,"m":5,"t":"СМИ и интервью","g":"Kenyataan media, sidang media; цитирование: menurut, katanya","r":"Дать короткий комментарий журналисту, читать Berita Harian и Bernama."},{"w":22,"m":5,"t":"Финал: визит делегации","g":"Повторение всего курса","r":"Симуляция: встреча делегации, переговоры, письмо-итог, выступление. Самооценка B1+ / B2."}]},"lessons":[{"id":"d1","week":1,"day":1,"img":"p_um_gate","ms":"Salam dan perkenalan","title":"Приветствие и знакомство","goal":"Поздороваться в любое время дня, представиться, спросить имя, сказать, откуда вы и кто вы.","can":["Сказать «доброе утро» и «добрый день» по-малайзийски","Представиться и спросить имя вежливо","Сказать, что вы студент из России","Поблагодарить, ответить на благодарность, попрощаться"],"words":[{"ms":"Selamat pagi","ru":"Доброе утро","ex":"Selamat pagi, Encik Hafiz.","exRu":"Доброе утро, господин Хафиз.","use":"Примерно до 11–12 часов. Нейтрально: подходит и для кафе, и для министерства.","ar":"selamat ← араб. سلامة «благополучие»","tr":"селамат паги","exTr":"селамат паги, энчи' хафиз."},{"ms":"Selamat petang","ru":"Добрый день","ex":"Selamat petang, tuan-tuan dan puan-puan.","exRu":"Добрый день, дамы и господа.","use":"С полудня до заката (~19:00). В Индонезии в это время говорят «sore», в Малайзии — только petang. Вечером — Selamat malam.","tr":"селамат петанг","exTr":"селамат петанг, туан-туан дан пуан-пуан."},{"ms":"Apa khabar?","ru":"Как дела? Как поживаете?","ex":"Apa khabar, Puan Rahimah?","exRu":"Как поживаете, госпожа Рахима?","use":"Универсально: и другу, и Датуку. Буквально «какие новости?».","ar":"khabar ← араб. خبر «новость»; тат. хәбәр","tr":"апа хабар?","exTr":"апа хабар, пуан рахимах?"},{"ms":"Khabar baik","ru":"Хорошо (дела хорошо)","ex":"Khabar baik, terima kasih. Encik pula?","exRu":"Хорошо, спасибо. А вы?","use":"Стандартный ответ. Можно и одним словом: «Baik».","tr":"хабар баи'","exTr":"хабар баи', терима касих. энчи' пула?"},{"ms":"Nama saya …","ru":"Меня зовут …","ex":"Nama saya Sasha.","exRu":"Меня зовут Саша.","use":"Буквально «имя моё …». Подходит везде — от кампуса до переговоров.","tr":"нама сая …","exTr":"нама сая саша."},{"ms":"Siapa nama encik?","ru":"Как вас зовут? (мужчине)","ex":"Maaf, siapa nama encik?","exRu":"Извините, как вас зовут?","use":"Обращение стоит вместо «вас». Женщине: «Siapa nama puan?», ровеснику: «Siapa nama awak?».","tr":"сияпа нама энчи'?","exTr":"мааф, сияпа нама энчи'?"},{"ms":"Saya dari Rusia","ru":"Я из России","ex":"Saya dari Rusia, dari Kazan.","exRu":"Я из России, из Казани.","use":"И на форуме, и в такси. Rusia — так по-малайски «Россия».","tr":"сая дари русия","exTr":"сая дари русия, дари казань."},{"ms":"Saya pelajar","ru":"Я студент / студентка","ex":"Saya pelajar hubungan antarabangsa.","exRu":"Я учусь на международных отношениях.","use":"pelajar — учащийся: студент или школьник. Аспирант — pelajar pascasiswazah.","tr":"сая пеладжар","exTr":"сая пеладжар хубунган антарабангса."},{"ms":"Gembira berkenalan dengan anda","ru":"Рад(а) познакомиться","ex":"Gembira berkenalan dengan Datuk.","exRu":"Рад(а) познакомиться с вами, Датук.","use":"Вместо «anda» лучше подставить обращение: dengan Encik Hafiz, dengan Datuk. Между ровесниками проще: «Selamat berkenalan».","tr":"гембира беркеналан денган анда","exTr":"гембира беркеналан денган дату'."},{"ms":"Terima kasih","ru":"Спасибо","ex":"Terima kasih, Cik Nurul.","exRu":"Спасибо, Нурул.","use":"Везде. Сильнее: «Terima kasih banyak» — большое спасибо.","tr":"терима касих","exTr":"терима касих, чи' нурул."},{"ms":"Sama-sama","ru":"Пожалуйста (в ответ на «спасибо»)","ex":"Sama-sama, Sasha.","exRu":"Не за что, Саша.","use":"Только как ответ на благодарность. «Пожалуйста» в просьбе — другие слова (sila, tolong — урок 11).","tr":"сама-сама","exTr":"сама-сама, саша."},{"ms":"Jumpa lagi","ru":"До встречи","ex":"Jumpa lagi esok!","exRu":"До встречи завтра!","use":"Дружески-нейтрально. Официально прощаются так: «Terima kasih, selamat petang».","tr":"джумпа лаги","exTr":"джумпа лаги эсо'!"}],"rule":{"title":"Без глагола «быть»","ref":"g-be","text":["В малайском нет глагола «быть» в настоящем времени. «Я студент» — просто Saya pelajar: два слова, ничего между ними.","Определение стоит после главного слова: nama saya — «имя моё» = меня зовут. Это правило работает везде: bilik mesyuarat — «комната совещаний», kereta merah — «машина красная»."],"ex":[{"ms":"Saya pelajar.","ru":"Я студент(ка).","tr":"сая пеладжар."},{"ms":"Nama saya Sasha.","ru":"Меня зовут Саша.","tr":"нама сая саша."},{"ms":"Encik Hafiz pegawai kementerian.","ru":"Господин Хафиз — сотрудник министерства.","tr":"энчи' хафиз пегавай кементэриян."}],"mistake":"Русскоязычные часто вставляют adalah («является») в каждое предложение: «Saya adalah pelajar». Грамматически это возможно, но в живой речи звучит как канцелярит. adalah нужен в официальных текстах и определениях — это неделя 9.","cmp":"Как русское «Я — студент»: тире вместо «есть». В малайском не нужно даже тире."},"dialog":{"scene":"Неделя ориентации, Universiti Malaya. Международный отдел, первый день.","img":"p_students","lines":[{"n":"Aisyah","v":"f","ms":"Selamat pagi! Apa khabar?","ru":"Доброе утро! Как дела?","tr":"селамат паги! апа хабар?"},{"n":"Sasha","v":"m","ms":"Selamat pagi. Khabar baik, terima kasih.","ru":"Доброе утро. Хорошо, спасибо.","tr":"селамат паги. хабар баи', терима касих."},{"n":"Aisyah","v":"f","ms":"Nama saya Aisyah. Siapa nama awak?","ru":"Меня зовут Аишах. А тебя?","tr":"нама сая аишах. сияпа нама ава'?"},{"n":"Sasha","v":"m","ms":"Nama saya Sasha. Saya dari Rusia.","ru":"Меня зовут Саша. Я из России.","tr":"нама сая саша. сая дари русия."},{"n":"Aisyah","v":"f","ms":"Oh, dari Rusia! Awak pelajar baru?","ru":"О, из России! Ты из новых студентов?","tr":"ох, дари русия! ава' пеладжар бару?"},{"n":"Sasha","v":"m","ms":"Ya, saya pelajar hubungan antarabangsa.","ru":"Да, я учусь на международных отношениях.","tr":"я, сая пеладжар хубунган антарабангса."},{"n":"Aisyah","v":"f","ms":"Gembira berkenalan dengan awak, Sasha.","ru":"Рада познакомиться, Саша.","tr":"гембира беркеналан денган ава', саша."},{"n":"Sasha","v":"m","ms":"Saya pun. Terima kasih, Aisyah.","ru":"Я тоже. Спасибо, Аишах.","tr":"сая пун. терима касих, аишах."},{"n":"Aisyah","v":"f","ms":"Sama-sama. Jumpa lagi!","ru":"Не за что. До встречи!","tr":"сама-сама. джумпа лаги!"},{"n":"Sasha","v":"m","ms":"Jumpa lagi!","ru":"До встречи!","tr":"джумпа лаги!"}]},"slang":[{"ms":"jom","ru":"давай, пошли","ex":"Jom minum kopi!","exRu":"Пошли выпьем кофе!","ok":"С однокурсниками, коллегами, даже с начальником в неформальной обстановке — малайзийцы говорят «jom» постоянно.","no":"В официальном письме и речи. Там: «Marilah kita…» («Давайте же…»). И это чисто малайзийское слово: в Индонезии скажут «ayo».","say":"jom","tr":"джом","exTr":"джом минум копи!"},{"ms":"-lah","ru":"частица: смягчает или подталкивает","ex":"Jomlah, kita dah lewat!","exRu":"Ну пошли же, мы опаздываем!","ok":"В разговоре почти к любому слову: okeylah («ну ладно»), tak apalah («да ничего»), cepatlah («давай быстрее»).","no":"Разговорное «lah» после английских слов (okeylah, sorrylah) — не в письме и не на переговорах. В книжном языке -lah тоже есть, но как выделение: «Inilah…» — «Вот именно это…».","say":"lah","tr":"лах","exTr":"джомлах, кита дах лэват!"}],"build":[{"ru":"Меня зовут Саша.","ms":"Nama saya Sasha.","extra":["awak","dari"],"tr":"нама сая саша."},{"ru":"Я из России.","ms":"Saya dari Rusia.","extra":["nama","pagi"],"tr":"сая дари русия."},{"ru":"Рад(а) познакомиться с вами.","ms":"Gembira berkenalan dengan anda.","extra":["saya","baik"],"tr":"гембира беркеналан денган анда."}],"reply":[{"p":"Apa khabar?","pRu":"Как дела?","o":["Khabar baik, terima kasih.","Sama-sama.","Jumpa lagi."],"a":0,"why":"На «Apa khabar?» отвечают «Khabar baik».","pTr":"апа хабар?","oTr":["хабар баи', терима касих.","сама-сама.","джумпа лаги."]},{"p":"Terima kasih!","pRu":"Спасибо!","o":["Selamat pagi.","Sama-sama.","Saya pelajar."],"a":1,"why":"Ответ на благодарность — «Sama-sama».","pTr":"терима касих!","oTr":["селамат паги.","сама-сама.","сая пеладжар."]},{"p":"Siapa nama awak?","pRu":"Как тебя зовут?","o":["Saya dari Rusia.","Nama saya Sasha.","Khabar baik."],"a":1,"why":"Спросили имя — «Nama saya …».","pTr":"сияпа нама ава'?","oTr":["сая дари русия.","нама сая саша.","хабар баи'."]}],"test":[{"q":"Как поздороваться в 15:00?","o":["Selamat pagi","Selamat petang","Selamat malam"],"a":1,"why":"В Малайзии petang — с полудня до заката."},{"q":"«Saya pelajar» значит…","o":["Я студент(ка)","Я учу","Я преподаватель"],"a":0,"why":"Глагола «быть» нет: «я — студент»."},{"q":"Как ответить на «Terima kasih»?","o":["Apa khabar?","Sama-sama.","Jumpa lagi."],"a":1,"why":"Sama-sama — «не за что»."},{"q":"Как спросить имя у мужчины старше вас на конференции?","o":["Siapa nama encik?","Siapa nama kamu?","Nama saya?"],"a":0,"why":"Encik — вежливое обращение к мужчине; kamu — к младшим."},{"q":"Какое слово значит «из» в «Saya … Rusia»?","o":["dari","ke","di"],"a":0,"why":"dari — откуда."},{"q":"«Jumpa lagi» значит…","o":["До встречи","Доброе утро","Спасибо"],"a":0,"why":"jumpa — встречаться, lagi — снова."}],"culture":"Малайцы часто здороваются лёгким касанием ладоней, а потом прикладывают руку к груди — «от сердца». Мужчина и женщина могут не пожимать руки: подождите, протянет ли собеседник руку первым, а если нет — кивните, приложив правую ладонь к груди. Между мусульманами принято «Assalamualaikum», ответ — «Waalaikumussalam», как в арабском.","story":"Саша — студент(ка) из Казани — только что прилетел(а) учиться на международных отношениях в Universiti Malaya. Первый день ориентации: знакомство с Аишах, которая станет проводником по Малайзии.","reading":{"title":"Profil Sasha","kind":"Анкета на доске знакомств","img":"p_um_gate","words":45,"gloss":[{"ms":"baru","ru":"новый","tr":"бару"},{"ms":"kawan","ru":"друг, подруга","tr":"каван"},{"ms":"di","ru":"в, на (где)","tr":"ди"},{"ms":"juga","ru":"тоже","tr":"джуга"}],"q":[{"q":"Откуда Саша?","o":["Из Казани","Из Куала-Лумпура","Из Сабаха"],"a":0},{"q":"Кто такая Аишах?","o":["Подруга Саши, тоже студентка","Преподаватель","Секретарь"],"a":0},{"q":"Что значит «pelajar baru»?","o":["Новый студент","Хороший студент","Студент-иностранец"],"a":0}],"blocks":[{"h":"Анкета Саши","v":"m","lines":[{"ms":"Selamat pagi! Nama saya Sasha.","ru":"Доброе утро! Меня зовут Саша.","tr":"селамат паги! нама сая саша."},{"ms":"Saya dari Rusia, dari Kazan.","ru":"Я из России, из Казани.","tr":"сая дари русия, дари казань."},{"ms":"Saya pelajar hubungan antarabangsa.","ru":"Я учусь на международных отношениях.","tr":"сая пеладжар хубунган антарабангса."},{"ms":"Saya pelajar baru di Universiti Malaya.","ru":"Я новый студент Университета Малайя.","tr":"сая пеладжар бару ди университи малая."},{"ms":"Kawan saya Aisyah. Dia dari Kuala Lumpur.","ru":"Мою подругу зовут Аишах. Она из Куала-Лумпура.","tr":"каван сая аишах. дия дари куала лумпур."},{"ms":"Aisyah pelajar juga.","ru":"Аишах тоже студентка.","tr":"аишах пеладжар джуга."},{"ms":"Gembira berkenalan dengan anda. Jumpa lagi!","ru":"Рад(а) знакомству. До встречи!","tr":"гембира беркеналан денган анда. джумпа лаги!"}]}]},"writing":[{"kind":"chat","title":"Ответ в WhatsApp","img":"p_students","task":"Аишах написала вам после ориентации. Ответьте: поздоровайтесь, назовите имя, скажите, откуда вы и кто вы, попрощайтесь.","from":{"n":"Aisyah","v":"f","ms":"Hai! Saya Aisyah dari orientasi tadi. Siapa nama awak? Awak dari mana?","ru":"Привет! Я Аишах, с ориентации. Как тебя зовут? Ты откуда?","tr":"хай! сая аишах дари ориэнтаси тади. сияпа нама ава'? ава' дари мана?"},"need":[["Приветствие",["hai","selamat","apa khabar"]],["Имя",["nama saya"]],["Откуда вы",["dari"]],["Кто вы",["pelajar"]],["Прощание",["jumpa lagi","terima kasih"]]],"hint":[{"ms":"Hai Aisyah!","ru":"Привет, Аишах!","tr":"хай аишах!"},{"ms":"Saya pelajar …","ru":"Я студент(ка) …","tr":"сая пеладжар …"},{"ms":"Gembira berkenalan dengan awak.","ru":"Рад(а) познакомиться.","tr":"гембира беркеналан денган ава'."}],"model":[{"ms":"Hai Aisyah! Nama saya Sasha.","ru":"Привет, Аишах! Меня зовут Саша.","tr":"хай аишах! нама сая саша."},{"ms":"Saya dari Rusia, dari Kazan.","ru":"Я из России, из Казани.","tr":"сая дари русия, дари казань."},{"ms":"Saya pelajar hubungan antarabangsa.","ru":"Я учусь на международных отношениях.","tr":"сая пеладжар хубунган антарабангса."},{"ms":"Gembira berkenalan dengan awak. Jumpa lagi!","ru":"Рад(а) знакомству. До встречи!","tr":"гембира беркеналан денган ава'. джумпа лаги!"}]},{"kind":"form","title":"Карточка «Давайте знакомиться»","img":"p_um_gate","task":"Для доски знакомств международного отдела напишите о себе 4–5 предложений: приветствие, имя, страна и город, где и что вы учите, вежливое завершение.","need":[["Приветствие",["selamat"]],["Имя",["nama saya"]],["Страна или город",["dari"]],["Учёба",["pelajar","universiti"]],["Завершение",["gembira berkenalan","jumpa lagi"]]],"hint":[{"ms":"Saya dari Tatarstan, Rusia.","ru":"Я из Татарстана, Россия.","tr":"сая дари татарстан, русия."},{"ms":"Saya pelajar di Universiti Malaya.","ru":"Я студент(ка) Университета Малайя.","tr":"сая пеладжар ди университи малая."}],"model":[{"ms":"Selamat petang!","ru":"Добрый день!","tr":"селамат петанг!"},{"ms":"Nama saya Sasha. Saya dari Kazan, Rusia.","ru":"Меня зовут Саша. Я из Казани, Россия.","tr":"нама сая саша. сая дари казань, русия."},{"ms":"Saya pelajar hubungan antarabangsa di Universiti Malaya.","ru":"Я учусь на международных отношениях в Университете Малайя.","tr":"сая пеладжар хубунган антарабангса ди университи малая."},{"ms":"Gembira berkenalan dengan anda!","ru":"Рад(а) знакомству!","tr":"гембира беркеналан денган анда!"}]}]},{"id":"d2","week":1,"day":2,"img":"p_flag_students","ms":"Bahasa dan faham","title":"Языки и понимание","goal":"Сказать, на каких языках говорите, признаться, что не поняли, попросить повторить и говорить медленнее.","can":["Сказать, кто вы по национальности","Сказать, что учите малайский и говорите немного","Сказать «не понимаю» и попросить повторить медленнее","Различать tidak и bukan"],"words":[{"ms":"orang Rusia","ru":"русский, россиянин (человек)","ex":"Saya orang Rusia.","exRu":"Я из России (россиянин / россиянка).","use":"orang (человек) + страна = национальность или житель: orang Malaysia, orang Jepun.","tr":"оранг русия","exTr":"сая оранг русия."},{"ms":"bahasa","ru":"язык","ex":"Saya cakap tiga bahasa.","exRu":"Я говорю на трёх языках.","use":"Язык как система общения. «Bahasa» без уточнения в Малайзии часто значит малайский.","tr":"бахаса","exTr":"сая чакап тига бахаса."},{"ms":"Bahasa Melayu","ru":"малайский язык","ex":"Bahasa Melayu bahasa rasmi Malaysia.","exRu":"Малайский — официальный язык Малайзии.","use":"Официально также «Bahasa Malaysia» — оба названия верны. Индонезийский — отдельная норма: Bahasa Indonesia.","tr":"бахаса мелаю","exTr":"бахаса мелаю бахаса расми малайсия."},{"ms":"Bahasa Inggeris","ru":"английский язык","ex":"Encik cakap bahasa Inggeris?","exRu":"Вы говорите по-английски?","use":"В Малайзии пишется «Inggeris», в Индонезии — «Inggris». Мелочь, но в письме сразу видно, какую норму вы учили.","tr":"бахаса инггерис","exTr":"энчи' чакап бахаса инггерис?"},{"ms":"belajar","ru":"учиться, изучать","ex":"Saya belajar bahasa Melayu.","exRu":"Я учу малайский.","use":"belajar + предмет, без предлога.","tr":"беладжар","exTr":"сая беладжар бахаса мелаю."},{"ms":"cakap","ru":"говорить","ex":"Dia cakap bahasa Melayu dan bahasa Arab.","exRu":"Он(а) говорит по-малайски и по-арабски.","use":"Нейтрально-разговорное. Официально: bertutur, berbahasa. Индонезийцы чаще говорят «bicara».","tr":"чакап","exTr":"дия чакап бахаса мелаю дан бахаса араб."},{"ms":"sikit","ru":"немного","ex":"Saya cakap bahasa Melayu sikit.","exRu":"Я немного говорю по-малайски.","use":"Разговорная форма. Нейтральная и письменная — sedikit.","tr":"сикит","exTr":"сая чакап бахаса мелаю сикит."},{"ms":"faham","ru":"понимать","ex":"Saya faham sikit.","exRu":"Я немного понимаю.","use":"Малайзийская норма. В Индонезии — paham или mengerti.","ar":"faham ← араб. فهم «понимание»","tr":"фахам","exTr":"сая фахам сикит."},{"ms":"tidak","ru":"не (с действиями и качествами)","ex":"Saya tidak faham.","exRu":"Я не понимаю.","use":"Нейтральное и официальное «не». В речи сокращается до «tak» (сленг этого урока).","tr":"тида'","exTr":"сая тида' фахам."},{"ms":"Maaf","ru":"Извините","ex":"Maaf, encik cakap bahasa Inggeris?","exRu":"Извините, вы говорите по-английски?","use":"И «простите», и «извините, можно спросить». Сильнее: «Minta maaf» — прошу прощения.","ar":"из арабского, корень ع-ف-و «прощать» (как в عفوًا)","tr":"мааф","exTr":"мааф, энчи' чакап бахаса инггерис?"},{"ms":"Boleh ulang?","ru":"Можете повторить?","ex":"Maaf, boleh ulang sekali lagi?","exRu":"Извините, можете повторить ещё раз?","use":"Вежливо в любой ситуации. boleh — можно, ulang — повторить.","tr":"болэх уланг?","exTr":"мааф, болэх уланг секали лаги?"},{"ms":"perlahan sikit","ru":"помедленнее","ex":"Boleh cakap perlahan sikit?","exRu":"Можете говорить чуть помедленнее?","use":"Главная фраза первых недель. Официальнее: «Boleh bercakap dengan lebih perlahan?»","tr":"перлахан сикит","exTr":"болэх чакап перлахан сикит?"}],"rule":{"title":"Два «не»: tidak и bukan","ref":"g-neg","text":["«Не» в малайском — два слова. tidak — перед действием или качеством: tidak faham (не понимаю), tidak jauh (недалеко).","bukan — перед предметом или человеком: bukan pelajar (не студент), bukan kopi (не кофе). Проверка: если по-русски можно вставить «является», нужно bukan."],"ex":[{"ms":"Saya tidak faham.","ru":"Я не понимаю.","tr":"сая тида' фахам."},{"ms":"Dia bukan pensyarah, dia pelajar.","ru":"Он(а) не преподаватель, а студент.","tr":"дия букан пеншарах, дия пеладжар."},{"ms":"Ini bukan teh, ini kopi.","ru":"Это не чай, это кофе.","tr":"ини букан тэх, ини копи."}],"mistake":"«Saya tidak pelajar» — ошибка: перед существительным нужно bukan. В русском «не» одно, поэтому эта ошибка очень частая.","cmp":"В русском одно «не» на все случаи. Малайский различает «не делаю» (tidak) и «не являюсь» (bukan)."},"dialog":{"scene":"Молодёжный форум АСЕАН, Конгресс-центр Куала-Лумпура. Стойка регистрации.","img":"klcc_conv","lines":[{"n":"Nurul","v":"f","ms":"Selamat pagi. Selamat datang ke Forum Belia ASEAN.","ru":"Доброе утро. Добро пожаловать на Молодёжный форум АСЕАН.","tr":"селамат паги. селамат датанг ке форум белия асиан."},{"n":"Sasha","v":"m","ms":"Selamat pagi. Nama saya Sasha, dari Rusia.","ru":"Доброе утро. Меня зовут Саша, я из России.","tr":"селамат паги. нама сая саша, дари русия."},{"n":"Nurul","v":"f","ms":"Oh, peserta dari Rusia! Awak cakap bahasa Melayu?","ru":"О, участник из России! Вы говорите по-малайски?","tr":"ох, песерта дари русия! ава' чакап бахаса мелаю?"},{"n":"Sasha","v":"m","ms":"Sikit. Saya belajar bahasa Melayu.","ru":"Немного. Я учу малайский.","tr":"сикит. сая беладжар бахаса мелаю."},{"n":"Nurul","v":"f","ms":"Bagus! Ini kad peserta awak dan ini jadual forum hari ini.","ru":"Отлично! Вот ваш бейдж участника, а это программа форума на сегодня.","tr":"багус! ини кад песерта ава' дан ини джадуал форум хари ини."},{"n":"Sasha","v":"m","ms":"Maaf, saya tidak faham. Boleh ulang perlahan sikit?","ru":"Извините, я не понял(а). Можете повторить помедленнее?","tr":"мааф, сая тида' фахам. болэх уланг перлахан сикит?"},{"n":"Nurul","v":"f","ms":"Ini kad peserta. Ini jadual.","ru":"Это бейдж. Это программа.","tr":"ини кад песерта. ини джадуал."},{"n":"Sasha","v":"m","ms":"Oh, faham! Terima kasih.","ru":"А, понятно! Спасибо.","tr":"ох, фахам! терима касих."},{"n":"Nurul","v":"f","ms":"Tak apa, bahasa Inggeris pun boleh.","ru":"Ничего, можно и по-английски.","tr":"та' апа, бахаса инггерис пун болэх."},{"n":"Sasha","v":"m","ms":"Tidak, tidak. Saya mahu cakap bahasa Melayu!","ru":"Нет-нет. Я хочу говорить по-малайски!","tr":"тида', тида'. сая маху чакап бахаса мелаю!"},{"n":"Nurul","v":"f","ms":"Bagus! Bahasa Melayu awak boleh tahan!","ru":"Здорово! А малайский у вас неплохой!","tr":"багус! бахаса мелаю ава' болэх тахан!"}]},"slang":[{"ms":"tak","ru":"не (коротко от tidak)","ex":"Tak apa, saya faham.","exRu":"Ничего, я понимаю.","ok":"В устной речи почти всегда: tak faham, tak boleh, tak apa. Так говорят и начальники, и министры в интервью.","no":"В письме, докладе, официальной речи — только tidak.","say":"tak","tr":"та'","exTr":"та' апа, сая фахам."},{"ms":"boleh tahan","ru":"неплохо, вполне ничего","ex":"Nasi lemak di sini boleh tahan.","exRu":"Nasi lemak здесь вполне ничего.","ok":"Похвалить по-дружески: еду, чей-то малайский, фильм.","no":"В оценке чужой работы для начальства или партнёров — звучит снисходительно («сойдёт»). Там: «sangat baik».","say":"boleh tahan","tr":"болэх тахан","exTr":"наси лема' ди сини болэх тахан."}],"build":[{"ru":"Я не понимаю.","ms":"Saya tidak faham.","extra":["bukan","sikit"],"tr":"сая тида' фахам."},{"ru":"Он(а) не преподаватель.","ms":"Dia bukan pensyarah.","extra":["tidak","saya"],"tr":"дия букан пеншарах."},{"ru":"Можете говорить помедленнее?","ms":"Boleh cakap perlahan sikit?","extra":["faham","ulang"],"tr":"болэх чакап перлахан сикит?"}],"reply":[{"p":"Awak cakap bahasa Melayu?","pRu":"Вы говорите по-малайски?","o":["Sikit. Saya belajar bahasa Melayu.","Saya bukan bahasa Melayu.","Sama-sama."],"a":0,"why":"«Немного, я учу малайский» — естественный ответ. «Saya bukan bahasa Melayu» значит «я не малайский язык».","pTr":"ава' чакап бахаса мелаю?","oTr":["сикит. сая беладжар бахаса мелаю.","сая букан бахаса мелаю.","сама-сама."]},{"p":"Ini kad peserta awak dan jadual forum hari ini.","pRu":"(быстро) Вот ваш бейдж и программа на сегодня.","o":["Maaf, boleh ulang perlahan sikit?","Selamat petang.","Saya orang Rusia."],"a":0,"why":"Не расслышали — просите повторить медленнее. Это нормально и вежливо.","pTr":"ини кад песерта ава' дан джадуал форум хари ини.","oTr":["мааф, болэх уланг перлахан сикит?","селамат петанг.","сая оранг русия."]}],"test":[{"q":"Как сказать «Я не студент»?","o":["Saya bukan pelajar.","Saya tidak pelajar.","Saya pelajar tidak."],"a":0,"why":"Перед существительным (pelajar) — bukan."},{"q":"Как сказать «Я не понимаю»?","o":["Saya bukan faham.","Saya tidak faham.","Tidak saya faham."],"a":1,"why":"faham — действие, значит tidak."},{"q":"Малайзийское написание «английский язык»:","o":["Bahasa Inggris","Bahasa Inggeris","Bahasa England"],"a":1,"why":"Inggeris — малайзийское, Inggris — индонезийское."},{"q":"Слово «sikit» — это…","o":["разговорное «немного»","«медленно»","«много»"],"a":0,"why":"sikit — разговорная форма sedikit."},{"q":"Вы не расслышали фразу. Что сказать?","o":["Boleh ulang?","Boleh cakap?","Saya pelajar."],"a":0,"why":"Boleh ulang? — Можете повторить?"},{"q":"Какое «не» писать в официальном письме?","o":["tak","tidak","tak lah"],"a":1,"why":"tak — только в устной речи."}],"culture":"Малайзия многоязычна: малайцы, китайцы и индийцы в одном разговоре переходят с малайского на английский и обратно («bahasa rojak» — «язык-салат»). Вам часто будут отвечать по-английски из вежливости. Мягко продолжайте по-малайски: это ценят, особенно госслужащие — малайский является языком государственной службы.","story":"В выходные Аишах берёт Сашу на Молодёжный форум АСЕАН в KLCC. Первая попытка говорить по-малайски с незнакомыми людьми — и первое «не понимаю».","reading":{"title":"Forum Belia ASEAN","kind":"Объявление + заметка Саши","img":"p_flag_students","words":70,"gloss":[{"ms":"pertama","ru":"первый","tr":"пертама"},{"ms":"banyak","ru":"много","tr":"баня'"},{"ms":"negara","ru":"страна","tr":"негара"},{"ms":"tanya","ru":"спрашивать","tr":"таня"},{"ms":"semua","ru":"всё, все","tr":"семуа"},{"ms":"tetapi","ru":"но","tr":"тетапи"}],"q":[{"q":"Какие языки на форуме?","o":["Английский и малайский","Только малайский","Малайский и китайский"],"a":0},{"q":"Что пишет Саша о понимании?","o":["Понимает не всё, но немного","Понимает всё","Ничего не понимает"],"a":0},{"q":"Почему в «Saya bukan orang Malaysia» стоит bukan, а не tidak?","o":["Перед существительным (orang) — bukan","Это ошибка","bukan — вежливее"],"a":0}],"blocks":[{"h":"Объявление на стойке регистрации","v":"f","lines":[{"ms":"Forum Belia ASEAN, hari pertama.","ru":"Молодёжный форум АСЕАН, первый день.","tr":"форум белия асиан, хари пертама."},{"ms":"Peserta dari banyak negara ada di sini.","ru":"Здесь участники из многих стран.","tr":"песерта дари баня' негара ада ди сини."},{"ms":"Bahasa forum: bahasa Inggeris dan bahasa Melayu.","ru":"Языки форума: английский и малайский.","tr":"бахаса форум: бахаса инггерис дан бахаса мелаю."},{"ms":"Tidak faham? Sila tanya di meja pendaftaran.","ru":"Не понимаете? Спрашивайте у стойки регистрации.","tr":"тида' фахам? сила таня ди мэджа пендафтаран."}]},{"h":"Заметка Саши в телефоне","v":"m","lines":[{"ms":"Hari ini saya cakap bahasa Melayu sikit.","ru":"Сегодня я немного говорил(а) по-малайски.","tr":"хари ини сая чакап бахаса мелаю сикит."},{"ms":"Saya tidak faham semua, tetapi saya faham sikit.","ru":"Я понимаю не всё, но немного понимаю.","tr":"сая тида' фахам семуа, тетапи сая фахам сикит."},{"ms":"Cik Nurul cakap perlahan sikit. Dia baik.","ru":"Нурул говорила помедленнее. Она добрая.","tr":"чи' нурул чакап перлахан сикит. дия баи'."},{"ms":"Saya bukan orang Malaysia, tetapi saya mahu cakap bahasa Melayu.","ru":"Я не малайзиец, но я хочу говорить по-малайски.","tr":"сая букан оранг малайсия, тетапи сая маху чакап бахаса мелаю."},{"ms":"Aisyah cakap: «Bahasa Melayu awak boleh tahan!»","ru":"Аишах сказала: «Твой малайский неплох!»","tr":"аишах чакап: «бахаса мелаю ава' болэх тахан!»"}]}]},"writing":[{"kind":"chat","title":"Сообщение организатору форума","img":"p_flag_students","task":"Нурул из оргкомитета написала вам. Ответьте: вы говорите по-малайски немного, учите язык, попросите писать и говорить медленнее.","from":{"n":"Cik Nurul","v":"f","ms":"Selamat datang ke Forum Belia ASEAN! Awak cakap bahasa Melayu?","ru":"Добро пожаловать на Молодёжный форум АСЕАН! Вы говорите по-малайски?","tr":"селамат датанг ке форум белия асиан! ава' чакап бахаса мелаю?"},"need":[["Благодарность",["terima kasih"]],["«Немного»",["sikit","sedikit"]],["«Учу малайский»",["belajar"]],["Просьба о медленном темпе",["perlahan"]]],"hint":[{"ms":"Saya cakap bahasa Melayu sikit.","ru":"Я немного говорю по-малайски.","tr":"сая чакап бахаса мелаю сикит."},{"ms":"Boleh cakap perlahan sikit?","ru":"Можно помедленнее?","tr":"болэх чакап перлахан сикит?"}],"model":[{"ms":"Terima kasih, Cik Nurul!","ru":"Спасибо, Нурул!","tr":"терима касих, чи' нурул!"},{"ms":"Saya cakap bahasa Melayu sikit. Saya belajar bahasa Melayu.","ru":"Я немного говорю по-малайски. Я учу малайский.","tr":"сая чакап бахаса мелаю сикит. сая беладжар бахаса мелаю."},{"ms":"Boleh cakap perlahan sikit?","ru":"Можно говорить помедленнее?","tr":"болэх чакап перлахан сикит?"},{"ms":"Bahasa Inggeris pun boleh. Terima kasih!","ru":"Можно и по-английски. Спасибо!","tr":"бахаса инггерис пун болэх. терима касих!"}]},{"kind":"form","title":"Анкета участника: языки","img":"p_asean","task":"В анкете участника есть графа «Bahasa». Напишите 4 предложения: на каких языках вы говорите, какой учите, какой понимаете немного. Обязательно используйте tidak и bukan.","need":[["Языки, на которых говорите",["cakap bahasa","bahasa rusia"]],["Что учите",["belajar"]],["tidak",["tidak"]],["bukan",["bukan"]]],"hint":[{"ms":"bahasa Tatar","ru":"татарский язык","tr":"бахаса татар"},{"ms":"bahasa Arab","ru":"арабский язык","tr":"бахаса араб"},{"ms":"Saya bukan orang Malaysia, tetapi…","ru":"Я не малайзиец, но…","tr":"сая букан оранг малайсия, тетапи…"}],"model":[{"ms":"Saya cakap bahasa Rusia dan bahasa Tatar.","ru":"Я говорю по-русски и по-татарски.","tr":"сая чакап бахаса русия дан бахаса татар."},{"ms":"Saya cakap bahasa Inggeris sikit.","ru":"Я немного говорю по-английски.","tr":"сая чакап бахаса инггерис сикит."},{"ms":"Saya belajar bahasa Arab dan bahasa Melayu.","ru":"Я учу арабский и малайский.","tr":"сая беладжар бахаса араб дан бахаса мелаю."},{"ms":"Saya bukan orang Malaysia, tetapi saya faham sikit.","ru":"Я не малайзиец, но немного понимаю.","tr":"сая букан оранг малайсия, тетапи сая фахам сикит."},{"ms":"Saya tidak faham bahasa Cina.","ru":"Я не понимаю китайский.","tr":"сая тида' фахам бахаса чина."}]}]},{"id":"d3","week":1,"day":3,"img":"p_putrajaya","ms":"Kami, kita dan gelaran","title":"Местоимения и обращения","goal":"Говорить о себе и других, выбирать правильное «мы», обращаться к людям по статусу — от коллеги до Датука.","can":["Выбрать между awak, anda и обращением по титулу","Различать kami и kita на переговорах","Говорить об уважаемом человеке через beliau","Обращаться: Encik, Puan, Cik, Tuan, Datuk"],"words":[{"ms":"awak","ru":"ты, вы (ровеснику)","ex":"Awak dari mana?","exRu":"Ты откуда?","use":"Дружески-нейтрально: однокурсники, коллеги одного уровня. Старшему по статусу — по титулу: Encik, Puan, Datuk.","tr":"ава'","exTr":"ава' дари мана?"},{"ms":"anda","ru":"вы (формально, письменно)","ex":"Terima kasih atas kerjasama anda.","exRu":"Спасибо за ваше сотрудничество.","use":"Анкеты, объявления, реклама, слайды презентации. В разговоре с конкретным человеком звучит холодно — лучше обращение по титулу.","tr":"анда","exTr":"терима касих атас керджасама анда."},{"ms":"dia","ru":"он, она","ex":"Dia kawan saya.","exRu":"Это мой друг (моя подруга).","use":"Одно слово для мужчин и женщин. О старших по статусу — beliau.","tr":"дия","exTr":"дия каван сая."},{"ms":"beliau","ru":"он, она (уважительно)","ex":"Beliau Menteri Luar Negeri.","exRu":"Он(а) — министр иностранных дел.","use":"О министрах, профессорах, старших. О себе или о ровеснике — никогда.","tr":"белияу","exTr":"белияу ментэри луар негери."},{"ms":"kami","ru":"мы (без вас)","ex":"Kami dari Universiti Kazan.","exRu":"Мы из Казанского университета.","use":"Моя сторона без собеседника. На переговорах — позиция вашей делегации.","tr":"ками","exTr":"ками дари университи казань."},{"ms":"kita","ru":"мы (вместе с вами)","ex":"Kita jumpa esok.","exRu":"Увидимся завтра (мы с вами).","use":"Включает собеседника. На переговорах kita — обе стороны вместе.","tr":"кита","exTr":"кита джумпа эсо'."},{"ms":"mereka","ru":"они","ex":"Mereka delegasi dari Jepun.","exRu":"Это делегация из Японии.","use":"Для людей. Jepun — малайзийское «Япония» (в Индонезии Jepang).","tr":"мерека","exTr":"мерека дэлэгаси дари джепун."},{"ms":"Encik","ru":"господин (к мужчине)","ex":"Encik Hafiz, ini Sasha.","exRu":"Господин Хафиз, это Саша.","use":"К любому взрослому мужчине без титула: коллега, клиент, сотрудник ресепшена. Encik + имя, а не фамилия.","tr":"энчи'","exTr":"энчи' хафиз, ини саша."},{"ms":"Puan","ru":"госпожа (к женщине)","ex":"Puan Rahimah pensyarah saya.","exRu":"Госпожа Рахима — мой преподаватель.","use":"К взрослой женщине, особенно на работе. Если сомневаетесь между Puan и Cik — выбирайте Puan.","tr":"пуан","exTr":"пуан рахимах пеншарах сая."},{"ms":"Cik","ru":"к молодой женщине","ex":"Terima kasih, Cik Nurul.","exRu":"Спасибо, Нурул.","use":"Молодой незамужней женщине: сотрудница, студентка. Взрослой женщине на работе — Puan.","tr":"чи'","exTr":"терима касих, чи' нурул."},{"ms":"Tuan","ru":"господин (с особым уважением)","ex":"Terima kasih, tuan.","exRu":"Благодарю вас, господин.","use":"Старшему чиновнику, руководителю, иностранному гостю. В письме «Tuan/Puan» — «Уважаемый(ая)».","tr":"туан","exTr":"терима касих, туан."},{"ms":"Datuk","ru":"Датук (почётный титул)","ex":"Selamat datang, Datuk.","exRu":"Добро пожаловать, Датук.","use":"Титул жалуют король или правитель штата. Говорите «Datuk» или «Datuk Kamal». Жена — Datin. Вариант Dato' (титул штата) звучит так же.","tr":"дату'","exTr":"селамат датанг, дату'."}],"rule":{"title":"Два «мы»: kami и kita","ref":"g-kami","text":["В русском одно «мы», в малайском — два. kami — «мы без вас»: я и мои люди. kita — «мы с вами»: включая того, с кем говорим.","На встречах это важно: kami — ваша сторона, делегация, компания. kita — общее дело обеих сторон."],"ex":[{"ms":"Kami dari Rusia.","ru":"Мы (наша делегация) из России.","tr":"ками дари русия."},{"ms":"Kita mula sekarang?","ru":"Начнём (все вместе) сейчас?","tr":"кита мула секаранг?"},{"ms":"Kami setuju, dan kita boleh tandatangan esok.","ru":"Мы (наша сторона) согласны, и мы (обе стороны) можем подписать завтра.","tr":"ками сетуджу, дан кита болэх тандатанган эсо'."}],"mistake":"Сказать хозяевам «Kita sudah bincang…» о решении, которое приняла только ваша делегация. Прозвучит, будто хозяева тоже участвовали. Говорите о своей стороне — kami.","cmp":"Похоже на разницу «мы с тобой» и «мы с ребятами» — только в малайском это отдельные слова."},"dialog":{"scene":"Висма Путра (МИД Малайзии), Путраджая. Студентов-международников принимает Датук Камал, генеральный директор Европейского департамента.","img":"p_boardroom","lines":[{"n":"Puan Rahimah","v":"f","ms":"Selamat pagi, Datuk. Saya Rahimah dari Universiti Malaya.","ru":"Доброе утро, Датук. Я Рахима из Университета Малайя.","tr":"селамат паги, дату'. сая рахимах дари университи малая."},{"n":"Datuk Kamal","v":"m2","ms":"Selamat pagi, Puan Rahimah. Selamat datang ke Wisma Putra.","ru":"Доброе утро, госпожа Рахима. Добро пожаловать в Висма Путра.","tr":"селамат паги, пуан рахимах. селамат датанг ке висма путра."},{"n":"Puan Rahimah","v":"f","ms":"Terima kasih, Datuk. Ini pelajar kami, Sasha. Dia dari Rusia.","ru":"Спасибо, Датук. Это Саша, из наших студентов. Из России.","tr":"терима касих, дату'. ини пеладжар ками, саша. дия дари русия."},{"n":"Datuk Kamal","v":"m2","ms":"Apa khabar, Sasha?","ru":"Как поживаете, Саша?","tr":"апа хабар, саша?"},{"n":"Sasha","v":"m","ms":"Khabar baik, Datuk. Terima kasih. Kami gembira dapat datang ke sini.","ru":"Хорошо, Датук, спасибо. Мы рады, что смогли сюда приехать.","tr":"хабар баи', дату'. терима касих. ками гембира дапат датанг ке сини."},{"n":"Datuk Kamal","v":"m2","ms":"Mereka juga pelajar Puan?","ru":"Они тоже ваши студенты?","tr":"мерека джуга пеладжар пуан?"},{"n":"Puan Rahimah","v":"f","ms":"Ya, Datuk. Mereka dari Jepun dan Korea.","ru":"Да, Датук. Они из Японии и Кореи.","tr":"я, дату'. мерека дари джепун дан корэа."},{"n":"Datuk Kamal","v":"m2","ms":"Bagus. Kita mula sekarang?","ru":"Отлично. Начнём?","tr":"багус. кита мула секаранг?"},{"n":"Puan Rahimah","v":"f","ms":"Boleh, Datuk.","ru":"Да, конечно, Датук.","tr":"болэх, дату'."}]},"slang":[{"ms":"korang","ru":"вы, ребята (вы все)","ex":"Korang nak makan apa?","exRu":"Ребята, вы что будете есть?","ok":"С друзьями и однокурсниками. Из «kau orang» — «вы, люди».","no":"С преподавателем, начальником, делегацией. Там: «tuan-tuan dan puan-puan» или «semua».","say":"korang","tr":"коранг","exTr":"коранг на' макан апа?"},{"ms":"kitorang","ru":"мы (своя компания)","ex":"Kitorang dah sampai.","exRu":"Мы уже на месте.","ok":"Дружеская переписка и разговор. По смыслу это kami — без собеседника.","no":"Официальная речь и письма.","say":"kitorang","tr":"киторанг","exTr":"киторанг дах сампай."}],"build":[{"ru":"Мы (без вас) из Казани.","ms":"Kami dari Kazan.","extra":["kita","mereka"],"tr":"ками дари казань."},{"ru":"Это делегация из Японии.","ms":"Mereka delegasi dari Jepun.","extra":["kami","Rusia"],"tr":"мерека дэлэгаси дари джепун."},{"ru":"Он(а) — министр иностранных дел (уважительно).","ms":"Beliau Menteri Luar Negeri.","extra":["awak","kami"],"tr":"белияу ментэри луар негери."}],"reply":[{"p":"Awak dari mana?","pRu":"(Датук) Откуда вы?","o":["Saya dari Rusia, Datuk.","Aku dari Rusia.","Kami tidak faham."],"a":0,"why":"aku — «я» только для близких друзей и семьи. С Датуком — saya.","pTr":"ава' дари мана?","oTr":["сая дари русия, дату'.","аку дари русия.","ками тида' фахам."]},{"p":"Korang dari mana?","pRu":"(друг) Вы откуда, ребята?","o":["Kitorang dari Rusia.","Beliau dari Rusia.","Sama-sama."],"a":0,"why":"Друг спросил «korang» — можно ответить в тон: kitorang (или нейтрально kami).","pTr":"коранг дари мана?","oTr":["киторанг дари русия.","белияу дари русия.","сама-сама."]}],"test":[{"q":"На переговорах о позиции вашей делегации: «Мы считаем…»","o":["Kami","Kita","Mereka"],"a":0,"why":"Только ваша сторона — kami."},{"q":"Вы предлагаете обеим сторонам начать:","o":["Kami mula sekarang?","Kita mula sekarang?","Mereka mula sekarang?"],"a":1,"why":"Все вместе — kita."},{"q":"Об уважаемом профессоре: «Он из Кембриджа».","o":["Dia dari Cambridge.","Beliau dari Cambridge.","Awak dari Cambridge."],"a":1,"why":"beliau — уважительное «он/она»."},{"q":"Как обратиться к сотруднику ресепшена (мужчине)?","o":["Encik","Datin","Cik"],"a":0,"why":"Encik — к мужчине без титула. Datin — жена Датука, Cik — к молодой женщине."},{"q":"Где уместнее всего «anda»?","o":["В анкете и на слайде презентации","В разговоре с другом","В обращении к Датуку"],"a":0,"why":"anda — безличное письменное «вы»."},{"q":"«Jepun» — это…","o":["Япония","Индонезия","Корея"],"a":0,"why":"Jepun — малайзийская форма, в Индонезии — Jepang."}],"culture":"Почётные титулы в Малайзии важнее должности: Tun → Tan Sri → Datuk Seri → Datuk / Dato'. Жёны: Toh Puan, Puan Sri, Datin Seri, Datin. Если титул напечатан на визитке, используйте его всегда: пропущенный титул воспринимается как неуважение.","story":"Доктор Рахима везёт иностранных студентов в МИД, в Путраджаю. Датук Камал, генеральный директор Европейского департамента, приглашает Сашу на стажировку.","reading":{"title":"Lawatan ke Wisma Putra","kind":"Дневник Саши","img":"p_putrajaya","words":85,"gloss":[{"ms":"pergi","ru":"ехать, идти","tr":"перги"},{"ms":"Ketua Pengarah","ru":"генеральный директор","tr":"кетуа пенгарах"},{"ms":"jawab","ru":"отвечать","tr":"джаваб"},{"ms":"panggil","ru":"звать, называть","tr":"панггил"},{"ms":"tentang","ru":"о, про","tr":"тентанг"},{"ms":"perlu","ru":"нужно, нуждаться","tr":"перлу"},{"ms":"pelatih","ru":"стажёр","tr":"пелатих"},{"ms":"mungkin","ru":"может быть","tr":"мунгкин"}],"q":[{"q":"Кто такой Датук Камал?","o":["Генеральный директор Европейского департамента","Преподаватель","Водитель"],"a":0},{"q":"Почему Датук говорит «Kami perlu pelatih», а не «Kita perlu»?","o":["Министерство — его сторона, студенты в него не входят","Это ошибка","kami вежливее"],"a":0,"why":"kami — «мы без вас»: Датук говорит о своём министерстве, а не о себе вместе со студентами."},{"q":"Как Саша обращался к Датуку?","o":["По титулу: «Datuk»","awak","kamu"],"a":0}],"blocks":[{"h":"Дневник Саши","v":"m","lines":[{"ms":"Hari ini kami pergi ke Wisma Putra di Putrajaya.","ru":"Сегодня мы ездили в Висма Путра в Путраджае.","tr":"хари ини ками перги ке висма путра ди путраджая."},{"ms":"Kami pelajar Puan Rahimah: saya, Yuki dari Jepun dan Min-jun dari Korea ь","ex":"Lima minit lagi.","exRu":"Ещё пять минут.","tr":"лима","exTr":"лима минит лаги."},{"ms":"enam","ru":"шесть","ex":"Kelas pukul enam petang.","exRu":"Занятие в шесть вечера.","tr":"энам","exTr":"келас пукул энам петанг."},{"ms":"tujuh","ru":"семь","ex":"Tujuh hari seminggu.","exRu":"Семь дней в неделю.","tr":"туджух","exTr":"туджух хари семинггу."},{"ms":"lapan","ru":"восемь","ex":"Lapan peserta dari Rusia.","exRu":"Восемь участников из России.","use":"Малайзийская форма. В Индонезии — delapan.","tr":"лапан","exTr":"лапан песерта дари русия."},{"ms":"sembilan","ru":"девять","ex":"Pejabat buka pukul sembilan.","exRu":"Офис открывается в девять.","tr":"сембилан","exTr":"педжабат бука пукул сембилан."},{"ms":"sepuluh","ru":"десять","ex":"Sepuluh ringgit.","exRu":"Десять ринггитов.","use":"se- + puluh. Никогда не «satu puluh».","tr":"сепулух","exTr":"сепулух ринггит."},{"ms":"Berapa?","ru":"Сколько? Какой номер?","ex":"Berapa nombor telefon awak?","exRu":"Какой у тебя номер телефона?","use":"О количестве, цене, номере, возрасте. «Berapa harga?» — сколько стоит?","tr":"берапа?","exTr":"берапа номбор тэлэфон ава'?"}],"rule":{"title":"Числа 11–99 как конструктор","ref":"g-num","text":["11–19: число + belas («-надцать»): dua belas = 12. Для 10 и 11 «satu» превращается в se-: sepuluh, sebelas.","Десятки: число + puluh: dua puluh = 20, dua puluh lima = 25. Сотни так же: seratus (100), dua ratus (200)."],"ex":[{"ms":"sebelas","ru":"11","tr":"себелас"},{"ms":"dua puluh lima","ru":"25","tr":"дуа пулух лима"},{"ms":"sembilan puluh sembilan","ru":"99","tr":"сембилан пулух сембилан"}],"mistake":"«Satu puluh» и «satu belas» — так не говорят: только sepuluh и sebelas. И ещё: номер телефона малайзийцы диктуют по одной цифре — kosong satu tujuh…","cmp":"Логика как в русском «две-надцать», «два-дцать». Малайский ещё прозрачнее: dua belas — буквально «два-надцать»."},"dialog":{"scene":"Второй день форума АСЕАН. В перерыве — обмен номерами для WhatsApp.","img":"p_seminar","lines":[ се.","tr":"секаранг","exTr":"сая ди педжабат секаранг."},{"ms":"hari ini","ru":"сегодня","ex":"Hari ini ada mesyuarat.","exRu":"Сегодня есть совещание.","use":"hari — день, ini — этот: «этот день».","tr":"хари ини","exTr":"хари ини ада мешуарат."},{"ms":"esok","ru":"завтра","ex":"Jumpa esok pukul sembilan.","exRu":"Увидимся завтра в девять.","use":"Малайзийское. В Индонезии — besok. Послезавтра — lusa.","tr":"эсо'","exTr":"джумпа эсо' пукул сембилан."},{"ms":"semalam","ru":"вчера","ex":"Semalam saya di Putrajaya.","exRu":"Вчера я был(а) в Путраджае.","use":"Ловушка: в Малайзии semalam = вчера, а в Индонезии это «прошлой ночью» (вчера там — kemarin).","tr":"семалам","exTr":"семалам сая ди путраджая."},{"ms":"tengah hari","ru":"полдень, обеденное время","ex":"Kita makan tengah hari bersama?","exRu":"Пообедаем вместе?","use":"Примерно 12:00–14:00. makan tengah hari — обед.","tr":"тенгах хари","exTr":"кита макан тенгах хари берсама?"},{"ms":"lewat","ru":"поздно; опаздывать","ex":"Maaf, saya lewat lima minit.","exRu":"Извините, я опаздываю на пять минут.","use":"Малайзийское. В Индонезии — terlambat.","tr":"лэват","exTr":"мааф, сая лэват лима минит."},{"ms":"awal","ru":"рано","ex":"Saya datang awal.","exRu":"Я приду пораньше.","ar":"awal ← араб. أوّل «первый, начало»","tr":"авал","exTr":"сая датанг авал."}],"rule":{"title":"Время на часах: pukul + число + часть суток","ref":"g-time","text":["pukul tiga petang = 15:00. Малайзийцы говорят по 12-часовой системе и уточняют часть суток: pagi (утро), tengah hari (полдень), petang (день до вечера), malam (вечер, ночь).","pukul — время на часах, jam — длительность: pukul dua = в два часа, dua jam = два часа подряд."],"ex":[{"ms":"Pukul lapan pagi.","ru":"8:00 утра.","tr":"пукул лапан паги."},{"ms":"Pukul sepuluh setengah pagi.","ru":"10:30 утра.","tr":"пукул сепулух сетенгах паги."},{"ms":"Mesyuarat dua jam.","ru":"Совещание длится два часа.","tr":"мешуарат дуа джам."}],"mistake":"Половину ставят после часа: pukul sepuluh setengah — это 10:30, а не «половина десятого». Русская привычка «половина одиннадцатого» сбивает чаще всего. И не забывайте часть суток: «pukul tujuh» без pagi/malam двусмысленно.","cmp":"Как русское «в три часа дня»: число + часть суток."},"dialog":{"scene":"Звонок секретарю департамента протокола МИД: нужно встретиться с Хафизом, который готовит визит российской делегации.","img":"perdana","lines":[{"n":"Sasha","v":"m","ms":"Selamat pagi, Puan. Saya Sasha, pelatih di Bahagian Eropah.","ru":"Доброе утро. Это Саша, стажёр Европейского департамента.","tr":"селамат паги, пуан. сая саша, пелатих ди бахагиян эропах."},{"n":"Puan Salmah","v":"f","ms":"Selamat pagi. Ya, boleh saya bantu?","ru":"Доброе утро. Да, чем могу помочь?","tr":"селамат паги. я, болэх сая банту?"},{"n":"Sasha","v":"m","ms":"Mesyuarat dengan Encik Hafiz hari ini pukul berapa?","ru":"Во сколько сегодня встреча с господином Хафизом?","tr":"мешуарат денган энчи' хафиз хари ини пукул берапа?"},{"n":"Puan Salmah","v":"f","ms":"Bukan hari ini, esok. Pukul sepuluh setengah pagi.","ru":"Не сегодня, а завтра. В 10:30 утра.","tr":"букан хари ини, эсо'. пукул сепулух сетенгах паги."},{"n":"Sasha","v":"m","ms":"Esok pukul sepuluh setengah. Di bilik mesyuarat?","ru":"Завтра в 10:30. В переговорной?","tr":"эсо' пукул сепулух сетенгах. ди били' мешуарат?"},{"n":"Puan Salmah","v":"f","ms":"Ya, bilik mesyuarat tingkat lima. Mesyuarat satu jam.","ru":"Да, переговорная на пятом этаже. Встреча на час.","tr":"я, били' мешуарат тингкат лима. мешуарат сату джам."},{"n":"Sasha","v":"m","ms":"Baik, Puan. Saya datang awal.","ru":"Хорошо. Я приду пораньше.","tr":"баи', пуан. сая датанг авал."},{"n":"Puan Salmah","v":"f","ms":"Bagus. Encik Hafiz tidak suka orang lewat.","ru":"Отлично. Господин Хафиз не любит, когда опаздывают.","tr":"багус. энчи' хафиз тида' сука оранг лэват."},{"n":"Sasha","v":"m","ms":"Faham. Terima kasih, Puan. Jumpa esok.","ru":"Понятно. Спасибо. До завтра.","tr":"фахам. терима касих, пуан. джумпа эсо'."}]},"sla  lusa — послезавтра."},{"q":"«Dua jam» — это…","o":["два часа (длительность)","в два часа","2:15"],"a":0,"why":"jam — длительность, pukul — время на часах."},{"q":"Pukul empat suku —","o":["4:15","4:45","4:30"],"a":0,"why":"suku — четверть после часа."},{"q":"«Опаздывать» по-малайзийски:","o":["terlambat","lewat","awal"],"a":1,"why":"terlambat — индонезийская норма."}],"culture":"Официальные мероприятия в Малайзии начинаются вовремя, а самые высокие гости приезжают последними — к их приезду все уже на местах. На неформальную встречу могут и опоздать (шутливо «janji Melayu» — «малайское обещание»), но на работе на это не рассчитывайте.","story":"Департамент протокола готовит визит российской делегации. Саша, единственный стажёр с русским языком, должен(на) встретиться с Хафизом, который отвечает за визит.","reading":{"title":"Jadual esok","kind":"Расписание Саши на завтра","img":"p_meeting","words":100,"gloss":[{"ms":"sibuk","ru":"занятой, насыщенный","tr":"сибу'"},{"ms":"rumah","ru":"дом","tr":"румах"},{"ms":"mahu","ru":"хотеть","tr":"маху"},{"ms":"datang","ru":"приходить","tr":"датанг"}],"q":[{"q":"Во сколько встреча с Хафизом?","o":["10:30","9:30","10:15"],"a":0,"why":"sepuluh setengah = 10 и половина = 10:30."},{"q":"Что у Саши в 15:15?","o":["Урок малайского","Обед","Лекция"],"a":0},{"q":"Что случилось вчера (semalam)?","o":["Саша опоздал(а) на 5 минут","Саша пришёл(ла) рано","Встреча отменилась"],"a":0}],"blocks":[{"h":"Расписание и заметки Саши","v":"m","lines":[{"ms":"Esok hari yang sibuk.","ru":"Завтра насыщенный день.","tr":"эсо' хари янг сибу'."},{"ms":"Pukul lapan pagi: kuliah hubungan antarabangsa di universiti.","ru":"8:00 — лекция по международным отношениям в университете.","tr":"пукул лапан паги: кулиях хубунган антарабангса ди университи."},{"ms":"Pukul sepuluh setengah pagi: mesyuarat dengan Encik Hafiz di Wisma Putra.","ru":"10:30 — встреча с господином Хафизом в Висма Путра.","tr":"пукул сепулух сетенгах паги: мешуарат денган энчи' хафиз ди висма
