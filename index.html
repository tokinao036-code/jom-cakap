lajar.","ru":"Я студент(ка).","tr":"сая пеладжар."},{"ms":"Kopi ini sedap.","ru":"Этот кофе вкусный.","tr":"копи ини седап."},{"ms":"Mesyuarat di tingkat lima.","ru":"Совещание на пятом этаже.","tr":"мешуарат ди тингкат лима."}],"cmp":"В русском тоже нет «есть» в настоящем: «Я — студент». Малайский идёт ещё дальше: не нужно даже тире."},{"id":"g-order","title":"Порядок слов: главное — впереди","short":"bilik mesyuarat, fail ini, kereta merah","lesson":"d4","text":["Главное слово стоит первым, всё, что его описывает, — после: «комната совещаний», «папка эта», «машина красная».","Порядок всего предложения как в русском нейтральном: кто → что делает → что / где / когда. Saya baca laporan di pejabat."],"term":"Определение — слово, которое отвечает на вопрос «какой? чей? который?».","table":{"head":["Малайский","Буквально","По-русски"],"rows":[["bilik mesyuarat","комната совещания","переговорная"],["fail ini","папка эта","эта папка"],["kereta merah","машина красная","красная машина"],["nombor telefon saya","номер телефона мой","мой номер телефона"],["Menteri Luar Negeri","министр внешних стран","министр иностранных дел"]]},"ex":[{"ms":"Bilik mesyuarat ini besar.","ru":"Эта переговорная большая.","tr":"били' мешуарат ини бесар."},{"ms":"Saya baca laporan di pejabat.","ru":"Я читаю отчёт в офисе.","tr":"сая бача лапоран ди педжабат."},{"ms":"Dia pegawai kementerian yang baru.","ru":"Он(а) новый сотрудник министерства.","tr":"дия пегавай кементэриян янг бару."}],"cmp":"Русский ставит определение перед словом («красная машина»), малайский — после. Мысленно переворачивайте: сначала предмет, потом его признаки."},{"id":"g-pron","title":"Местоимения и обращения","short":"saya, awak, anda, dia, beliau, Encik, Puan","lesson":"d3","text":["Местоимения не меняются: saya — и «я», и «меня», и «мне». Рода нет: dia — и он, и она.","К старшим и в официальной обстановке «вы» заменяют обращением: «Datuk nak minum apa?» — «Что вы будете пить, Датук?» (буквально «Датук хочет пить что?»)."],"table":{"head":["Значение","Нейтрально / вежливо","Разговорно","Официально, с уважением"],"rows":[["я","saya","aku (только близким)","saya"],["ты, вы","awak","kau, hang (север)","Encik / Puan / Tuan / Datuk; anda — письменно"],["он, она","dia","dia","beliau"],["мы (без вас)","kami","kitorang","kami"],["мы (с вами)","kita","kita","kita"],["вы (все)","kamu semua","korang","tuan-tuan dan puan-puan"],["они","mereka","diorang","mereka"]]},"ex":[{"ms":"Saya dari Rusia.","ru":"Я из России.","tr":"сая дари русия."},{"ms":"Beliau Menteri Luar Negeri.","ru":"Он(а) — министр иностранных дел.","tr":"белияу ментэри луар негери."},{"ms":"Puan nak minum apa?","ru":"Что вы будете пить? (к женщине)","tr":"пуан на' минум апа?"}],"cmp":"Как русское «Не желаете ли чаю, Анна Петровна?» вместо «Хочешь чаю?» — только в малайском так говорят постоянно, а не только в особых случаях."},{"id":"g-kami","title":"kami и kita: два «мы»","short":"kami — без вас, kita — с вами","lesson":"d3","text":["kami — «мы», в которое не входит собеседник: я и мои коллеги, наша делегация.","kita — «мы», в которое входит собеседник: мы с вами, обе стороны, все присутствующие."],"table":{"head":["Ситуация","Какое «мы»","Почему"],"rows":[["Позиция вашей делегации на переговорах","kami","Хозяева в решение не входят"],["Предложение начать встречу","kita","Начинают все"],["«Наша компания из России» — партнёру","kami","Партнёр не в вашей компании"],["«Наше сотрудничество» — с партнёром","kita","Сотрудничество общее"]]},"ex":[{"ms":"Kami bersetuju.","ru":"Мы (наша сторона) согласны.","tr":"ками берсетуджу."},{"ms":"Kita mula sekarang.","ru":"Начнём сейчас (все вместе).","tr":"кита мула секаранг."},{"ms":"Kerjasama kita semakin kukuh.","ru":"Наше (общее) сотрудничество крепнет.","tr":"керджасама кита семакин кукух."}],"cmp":"В русском одно «мы» — смысл понятен из контекста. В малайском выбор видно сразу, и ошибка меняет смысл."},{"id":"g-neg","title":"Отрицание: tidak, bukan, belum, jangan","short":"четыре «не» для разных случаев","lesson":"d2","text":["tidak — не (с действием или качеством). bukan — не (с предметом или человеком). belum — ещё не. jangan — не делай! (запрет).","В речи tidak сокращается до tak, но на письме — только tidak."],"table":{"head":["Слово","Когда","Пример","Перевод"],"rows":[["tidak","действие, качество","Saya tidak faham.","Я не понимаю."],["bukan","предмет, человек","Ini bukan kopi.","Это не кофе."],["belum","ещё не, но будет","Laporan belum siap.","Отчёт ещё не готов."],["jangan","запрет, просьба не делать","Jangan lewat.","Не опаздывайте."]]},"ex":[{"ms":"Dia bukan pensyarah.","ru":"Он(а) не преподаватель.","tr":"дия букан пеншарах."},{"ms":"Tempat ini tidak jauh.","ru":"Это место недалеко.","tr":"темпат ини тида' джаух."},{"ms":"Jangan risau.","ru":"Не волнуйтесь.","tr":"джанган рисау."}],"cmp":"Русское «не» одно. Проверка: если можно сказать «не является» — bukan; если «ещё не» — belum; если «не делай!» — jangan; иначе — tidak."},{"id":"g-q","title":"Вопросы","short":"apa, siapa, di mana, bila, berapa, kenapa, bagaimana","lesson":"d1","text":["Вопросительное слово ставят в начало или на место ответа: «Awak dari mana?» — «Ты откуда?» (буквально «ты из где?»).","Вопрос «да / нет» можно задать интонацией: «Awak pelajar?» Официально в начало ставят adakah: «Adakah tuan pelajar?»."],"table":{"head":["Слово","Значение","Пример"],"rows":[["apa","что","Apa ini?"],["siapa","кто","Siapa nama encik?"],["di mana / ke mana / dari mana","где / куда / откуда","Stesen di mana?"],["bila","когда","Bila mesyuarat?"],["berapa","сколько","Berapa harga?"],["pukul berapa","во сколько","Pukul berapa sekarang?"],["kenapa / mengapa","почему (разг. / офиц.)","Kenapa lewat?"],["bagaimana","как","Bagaimana penerbangan tuan?"],["yang mana","который","Fail yang mana?"]]},"ex":[{"ms":"Awak dari mana?","ru":"Ты откуда?","tr":"ава' дари мана?"},{"ms":"Bila tarikh akhir?","ru":"Когда срок сдачи?","tr":"била тарих ахир?"},{"ms":"Adakah tuan perlukan bantuan?","ru":"Нужна ли вам помощь?","tr":"адаках туан перлукан бантуан?"}],"cmp":"Как в русском разговорном «Ты откуда?» — порядок слов не меняется, работает интонация."},{"id":"g-aspect","title":"Время без времён","short":"sudah, belum, sedang, akan, masih, baru","lesson":"d8","text":["Глагол не меняется никогда. Время понятно из слов-меток или из слов времени (semalam, esok).","Если контекст ясен, метку можно опустить: «Semalam saya pergi ke Putrajaya» — «Вчера я ездил(а) в Путраджаю»."],"table":{"head":["Метка","Смысл","Пример"],"rows":[["sudah / telah","уже сделано","Saya sudah makan."],["belum","ещё не","Saya belum makan."],["sedang","сейчас, в процессе","Saya sedang makan."],["akan","будет","Saya akan makan."],["masih","всё ещё","Saya masih makan."],["baru","только что","Saya baru makan."],["pernah","когда-либо (опыт)","Saya pernah makan durian."]]},"ex":[{"ms":"Delegasi sudah tiba.","ru":"Делегация уже прибыла.","tr":"дэлэгаси судах тиба."},{"ms":"Datuk sedang bermesyuarat.","ru":"Датук сейчас на совещании.","tr":"дату' седанг бермешуарат."},{"ms":"Kami akan hantar laporan esok.","ru":"Мы отправим отчёт завтра.","tr":"ками акан хантар лапоран эсо'."}],"cmp":"Вместо окончаний («-л», «буду») — отдельные слова, похожие на русские «уже», «ещё не», «сейчас», «буду»."},{"id":"g-place","title":"di, ke, dari: где, куда, откуда","short":"di pejabat / ke pejabat / dari pejabat","lesson":"d9","text":["di — где (на месте), ke — куда (движение), dari — откуда.","Пространственные слова добавляются после: di atas meja (на столе), di dalam bilik (в комнате), di sebelah stesen (рядом со станцией)."],"table":{"head":["Вопрос","Предлог","Пример","Перевод"],"rows":[["где?","di","di pejabat","в офисе"],["куда?","ke","ke pejabat","в офис"],["откуда?","dari","dari pejabat","из офиса"],["на чём?","di atas","di atas meja","на столе"],["внутри","di dalam","di dalam bilik","в комнате"],["рядом","di sebelah / dekat","di sebelah stesen","рядом со станцией"]]},"ex":[{"ms":"Saya di stesen LRT.","ru":"Я на станции LRT.","tr":"сая ди стэсэн эл-ар-ти."},{"ms":"Kami pergi ke KLIA.","ru":"Мы едем в KLIA.","tr":"ками перги ке кей-эл-ай-эй."},{"ms":"Mereka datang dari Sabah.","ru":"Они приехали с Сабаха.","tr":"мерека датанг дари сабах."}],"cmp":"Русский различает «в офисе / в офис» окончаниями, малайский — предлогами. Задайте вопрос «где? куда? откуда?» — и выбор очевиден."},{"id":"g-num","title":"Числа","short":"satu… sepuluh, belas, puluh, ratus, ribu, juta","lesson":"d5","text":["Числа собираются как конструктор: belas = -надцать, puluh = десятки, ratus = сотни, ribu = тысячи, juta = миллионы.","Вместо satu перед этими словами — приставка se-: sepuluh, sebelas, seratus, seribu."],"table":{"head":["Число","Малайский"],"rows":[["0","kosong (на письме и в счёте также sifar)"],["1–5","satu, dua, tiga, empat, lima"],["6–10","enam, tujuh, lapan, sembilan, sepuluh"],["11, 12","sebelas, dua belas"],["20, 25","dua puluh, dua puluh lima"],["100, 250","seratus, dua ratus lima puluh"],["1 000","seribu"],["2 026","dua ribu dua puluh enam"],["1 000 000","sejuta"]]},"ex":[{"ms":"dua belas","ru":"12","tr":"дуа белас"},{"ms":"dua puluh lima","ru":"25","tr":"дуа пулух лима"},{"ms":"seratus ringgit","ru":"100 ринггитов","tr":"сератус ринггит"}],"cmp":"Логика как в русском «две-надцать», «два-дцать», но без исключений вроде «сорок» и «девяносто»."},{"id":"g-time","title":"Часы и время суток","short":"pukul tiga petang, setengah, suku","lesson":"d6","text":["Время: pukul + число + часть суток. setengah (половина) и suku (четверть) ставятся после часа.","pukul — момент на часах, jam — длительность."],"table":{"head":["Время","Малайский"],"rows":[["8:00 утра","pukul lapan pagi"],["12:30","pukul dua belas setengah tengah hari"],["15:15","pukul tiga suku petang"],["16:45","pukul lima kurang suku petang"],["20:00","pukul lapan malam"],["2 часа (длительность)","dua jam"]]},"ex":[{"ms":"Pukul lapan pagi.","ru":"Восемь утра.","tr":"пукул лапан паги."},{"ms":"Pukul tiga suku petang.","ru":"Четверть четвёртого дня.","tr":"пукул тига суку петанг."},{"ms":"Mesyuarat dua jam.","ru":"Совещание длится два часа.","tr":"мешуарат дуа джам."}],"cmp":"Внимание: pukul sepuluh setengah — это 10:30, а не «половина десятого» (9:30) по-русски."},{"id":"g-poss","title":"Принадлежность: чьё?","short":"buku saya, jadualnya","lesson":"d10","text":["Владелец ставится после предмета: buku saya — моя книга, pejabat Datuk — офис Датука.","-nya — его, её, их, а также «этот, тот самый»: harganya — его цена. -ku, -mu — только для близких."],"table":{"head":["По-русски","Малайский"],"rows":[["моя книга","buku saya"],["твой стол","meja awak"],["его / её расписание","jadual dia / jadualnya"],["наш офис (без вас)","pejabat kami"],["наше (общее) сотрудничество","kerjasama kita"],["офис министра","pejabat menteri"]]},"ex":[{"ms":"Ini meja awak.","ru":"Это твой стол.","tr":"ини мэджа ава'."},{"ms":"Pensyarah kami dari Sabah.","ru":"Наш преподаватель с Сабаха.","tr":"пеншарах ками дари сабах."},{"ms":"Jadualnya ada di portal.","ru":"Его расписание — на портале.","tr":"джадуалня ада ди портал."}],"cmp":"Как русское «книга Маши» — только малайский так делает и с «моя / твоя»."},{"id":"g-polite","title":"Просьбы и вежливость","short":"sila, tolong, boleh saya, minta, mohon, jemput","lesson":"d11","text":["У «пожалуйста» несколько малайских вариантов. Выбор зависит от того, в чьих интересах действие.","Вежливость в малайском — в обращении (Encik, Puan, Datuk) и в мягких формах, а не в одном волшебном слове."],"table":{"head":["Слово","Смысл","Пример"],"rows":[["sila","прошу вас (для вашего удобства)","Sila duduk."],["tolong","помогите мне, сделайте для меня","Tolong hantar dokumen ini."],["boleh saya…?","можно мне…?","Boleh saya masuk?"],["minta","прошу дать","Minta satu borang."],["mohon","прошу (официально)","Mohon maklum balas."],["jemput","приглашаю, угощайтесь","Jemput makan."]]},"ex":[{"ms":"Sila masuk.","ru":"Проходите, пожалуйста.","tr":"сила масу'."},{"ms":"Tolong tutup pintu.","ru":"Закройте, пожалуйста, дверь.","tr":"толонг тутуп пинту."},{"ms":"Boleh saya duduk di sini?","ru":"Можно мне сесть здесь?","tr":"болэх сая дуду' ди сини?"}],"cmp":"Как в русском «прошу», «будьте добры», «можно мне», «угощайтесь» — только в малайском выбор обязателен."},{"id":"g-ber","title":"Приставка ber-","short":"kerja → bekerja, asal → berasal","lesson":"d12","text":["ber- делает из слова глагол со смыслом «иметь / делать / находиться в состоянии»: kerja → bekerja (работать), mesyuarat → bermesyuarat (проводить совещание).","Перед словами, где в первом слоге есть r, получается be-: bekerja. Исключение, которое надо запомнить: ber + ajar = belajar."],"term":"Приставка — частица в начале слова, меняющая его смысл (как русское «по-» в «работать — поработать»).","table":{"head":["Корень","С ber-","Значение"],"rows":[["kerja (работа)","bekerja","работать"],["asal (происхождение)","berasal","быть родом"],["mesyuarat (совещание)","bermesyuarat","совещаться"],["tanggungjawab (ответственность)","bertanggungjawab","отвечать за"],["cakap (говорить)","bercakap","разговаривать"],["ajar (учить)","belajar","учиться"]]},"ex":[{"ms":"Saya bekerja di kementerian.","ru":"Я работаю в министерстве.","tr":"сая бекерджа ди кементэриян."},{"ms":"Kami bermesyuarat setiap Isnin.","ru":"У нас совещание каждый понедельник.","tr":"ками бермешуарат сетияп иснин."},{"ms":"Mereka berasal dari Sabah.","ru":"Они родом с Сабаха.","tr":"мерека берасал дари сабах."}],"cmp":"Похоже на русское образование глаголов от существительных: «работа → работать», «совет → совещаться»."},{"id":"g-register","title":"Разговорный и официальный регистр","short":"tak / tidak, nak / ingin, dah / sudah","lesson":"d13","text":["В Малайзии разговорный и официальный малайский заметно различаются. Ошибка регистра звучит так же странно, как «чё как, господин министр?»","Правило: с друзьями — разговорные формы; на работе в разговоре — нейтральные; в письмах, речах и с делегациями — официальные."],"term":"Регистр — стиль речи для определённой ситуации: дружеский, рабочий, официальный.","table":{"head":["Разговорно","Нейтрально","Официально","Значение"],"rows":[["tak","tidak","tidak","не"],["nak","mahu","ingin / hendak","хотеть"],["dah","sudah","telah","уже"],["kat","di","di","в, на"],["je","saja","sahaja","только"],["takpe","tak apa","tidak mengapa","ничего страшного"],["jom","mari","marilah kita","давайте"],["awak","awak","tuan / puan","вы"],["korang","kamu semua","tuan-tuan dan puan-puan","вы все"]]},"ex":[{"ms":"Saya tak faham.","ru":"Я не понимаю (разговорно).","tr":"сая та' фахам."},{"ms":"Saya tidak faham.","ru":"Я не понимаю (нейтрально).","tr":"сая тида' фахам."},{"ms":"Marilah kita mulakan mesyuarat.","ru":"Давайте начнём заседание (официально).","tr":"марилах кита мулакан мешуарат."}],"cmp":"Как русские «не-а / нет / никак нет» — смысл один, ситуации разные."},{"id":"g-plural","title":"Множественное число","short":"удвоение: pelajar-pelajar; semua, para, banyak","lesson":"d3","text":["Отдельного окончания множественного числа нет. Часто число понятно из контекста: dua pelajar — два студента (без удвоения!).","Если нужно подчеркнуть множество, слово удваивают через дефис (pelajar-pelajar) или добавляют semua (все), para (официально о людях), banyak (много)."],"table":{"head":["Форма","Пример","Перевод"],"rows":[["без изменения","Ada tiga bilik.","Есть три комнаты."],["удвоение","Dokumen-dokumen itu penting.","Те документы важные."],["semua","Semua peserta sudah tiba.","Все участники прибыли."],["para (официально)","para tetamu","гости (уважительно)"],["banyak","banyak syarikat","много компаний"]]},"ex":[{"ms":"Dua orang pelajar.","ru":"Двое студентов.","tr":"дуа оранг пеладжар."},{"ms":"Semua peserta sudah tiba.","ru":"Все участники прибыли.","tr":"семуа песерта судах тиба."},{"ms":"Para tetamu dijemput masuk.","ru":"Гостей приглашают войти.","tr":"пара тетаму диджемпут масу'."}],"cmp":"После числа удвоение не нужно — как если бы по-русски говорили «два студент»: число уже показывает множество."},{"id":"g-letter","title":"Официальное письмо","short":"Tuan/Puan → PERKARA → Dengan hormatnya → Sekian","lesson":"d14","text":["У малайзийского официального письма постоянная схема. Её соблюдение важнее изящества стиля.","Абзацы нумеруют начиная со второго. Тема (PERKARA) — заглавными и жирным."],"table":{"head":["Часть","Формула","Значение"],"rows":[["Обращение","Tuan/Puan, / Datuk,","Уважаемый(ая)"],["Тема","PERKARA: …","Тема: …"],["Вступление","Dengan hormatnya, saya merujuk kepada perkara di atas.","С уважением, ссылаюсь на вышеуказанный вопрос."],["Новость","Sukacita dimaklumkan bahawa…","Рады сообщить, что…"],["Приложение","Bersama-sama ini dilampirkan…","Прилагается…"],["Просьба","Saya mohon maklum balas…","Прошу ответить…"],["Благодарность","Kerjasama tuan amatlah dihargai.","Будем признательны за содействие."],["Концовка","Sekian, terima kasih.","На этом всё, спасибо."],["Подпись","Yang benar, / Saya yang menjalankan amanah,","Искренне ваш(а)"]]},"ex":[{"ms":"Dengan hormatnya, saya merujuk kepada perkara di atas.","ru":"С уважением, ссылаюсь на вышеуказанный вопрос.","tr":"денган хорматня, сая меруджу' кепада перкара ди атас."},{"ms":"Sukacita dimaklumkan bahawa delegasi akan tiba pada hari Isnin.","ru":"Рады сообщить, что делегация прибудет в понедельник.","tr":"сукачита дима'лумкан бахава дэлэгаси акан тиба пада хари иснин."},{"ms":"Sekian, terima kasih.","ru":"На этом всё, спасибо.","tr":"секиян, терима касих."}],"cmp":"Схема почти как в русском деловом письме: обращение, тема, ссылка на предыдущую переписку, суть, «С уважением»."},{"id":"g-my-id","title":"Малайзийский или индонезийский?","short":"esok / besok, kereta / mobil, pejabat / kantor","lesson":"d2","text":["Малайзийский и индонезийский — две нормы одного языка: понимают друг друга, но слова и написание часто различаются.","В приложении всегда малайзийская норма (по словарю DBP). Индонезийские варианты в Малайзии поймут, но сразу услышат «чужой» акцент в лексике."],"table":{"head":["Значение", ":"дангдут","say":[],"songs":[]},{"ms":"Rap Melayu","genre":"Хип-хоп","ru":"Малайский рэп","sub":"С конца 90-х","text":"От Too Phat до Joe Flizzow и нового поколения. Отличительная черта — смесь малайского, английского и сленга в одной строке.","tr":"рап мелаю","say":[],"songs":[]},{"ms":"Indie","genre":"Инди-рок, инди-поп","ru":"Инди","sub":"2000-е — сейчас","text":"Независимые группы с гитарным звуком: Hujan (с 2005 года), Bunkface и другие; сегодня — независимые артисты вроде Mimifly, которые побеждают крупные лейблы.","songs":[{"ms":"Pagi Yang Gelap","ru":"Hujan — «Тёмное утро»","tr":"паги янг гелап"},{"ms":"Situasi","ru":"Bunkface — «Ситуация»","tr":"ситуаси"}],"yt":"Hujan Pagi Yang Gelap","tr":"индиэ","say":[]},{"ms":"Lagu raya","genre":"Праздничная песня","ru":"Праздничные песни","sub":"Звучат весь месяц Шавваль","text":"Отдельный «жанр» по сути: каждый год выходят новые песни к Хари Рае, но больше всего любят старые — Saloma, Sudirman, P. Ramlee, M. Nasir.","songs":[{"ms":"Satu Hari Di Hari Raya","ru":"М. Насир","tr":"сату хари ди хари рая"},{"ms":"Dendang Perantau","ru":"П. Рамли","tr":"денданг перантау"}],"tr":"лагу рая","say":[]}]}]},{"id":"era","ms":"Zaman muzik","title":"Эпохи музыки","img":"merdeka","intro":"Эпохальная музыка — от театра бангсаван до TikTok. Если знать, какая песня из какого времени, легко поддержать разговор с людьми любого возраста.","groups":[{"h":"От бангсавана до наших дней","items":[{"ms":"Zaman bangsawan dan keroncong","genre":"Кронконг, музыка театра","ru":"1930–1940-е: театр и кронконг","sub":"Эпоха граммофона","text":"Передвижной театр бангсаван смешивал малайские сюжеты с западными мелодиями. На пластинках — кронконг и ранний малайский поп; одна из первых записей — «Tudung Periok» певицы Момо Латифф.","songs":[{"ms":"Tudung Periok","ru":"«Крышка от котла» — Момо Латифф","tr":"тудунг перио'"}],"tr":"заман бангсаван дан керончонг","say":[]},{"ms":"Zaman keemasan filem Melayu","genre":"Песни кино","ru":"1950–1960-е: золотой век кино","sub":"П. Рамли и студия на Джалан Ампас","text":"Малайские фильмы снимали в Сингапуре, и песни из них знала вся страна. Главные голоса — П. Рамли и Салома. Эти песни до сих пор звучат в рекламе и на праздниках.","songs":[{"ms":"Getaran Jiwa","ru":"П. Рамли","tr":"гетаран джива"},{"ms":"Selamat Hari Raya","ru":"Салома","tr":"селамат хари рая"}],"tr":"заман кеэмасан филем мелаю","say":[]},{"ms":"Zaman pop yeh-yeh","genre":"Pop yeh-yeh","ru":"1965–1971: гитарные группы","sub":"Влияние Beatles","text":"Молодёжь собирала группы-kugiran с электрогитарами. «Oh Fatimah» A. Ramlie — гимн эпохи. Многие старшие малайзийцы помнят эти песни с танцплощадок.","songs":[{"ms":"Oh Fatimah","ru":"A. Ramlie","tr":"ох фатимах"}],"tr":"заман поп йех-йех","say":[]},{"ms":"Zaman Sudirman dan Alleycats","genre":"Поп, блюз, рок","ru":"1970–1980-е: поп и телевидение","sub":"Начало AJL (1986)","text":"Эпоха больших звёзд телевидения: Судирман, Шарифа Айни, Alleycats, Шейла Маджид с альбомом «Dimensi Baru» (1985). В 1986 году прошёл первый Anugerah Juara Lagu — победила «Sekadar Di Pinggiran» Франциски Питер.","songs":[{"ms":"Balik Kampung","ru":"Судирман","tr":"бали' кампунг"},{"ms":"Sekadar Di Pinggiran","ru":"Франциска Питер","tr":"секадар ди пинггиран"}],"tr":"заман судирман дан аллейчатс","say":[]},{"ms":"Zaman rock kapak","genre":"Rock kapak","ru":"Конец 1980-х — 1990-е: рок","sub":"Search, Wings, Ella","text":"Самая громкая эпоха: стадионные концерты, кассеты, баллады о любви. «Isabella» Search и «Pengemis Cinta» Эллы знают все, кому сейчас за 40.","songs":[{"ms":"Isabella","ru":"Search","tr":"исабелла"},{"ms":"Pengemis Cinta","ru":"Ella","tr":"пенгемис чинта"}],"tr":"заман роч' капа'","say":[]},{"ms":"Zaman nasyid dan irama Malaysia","genre":"Нашид, irama Malaysia, world music","ru":"1990-е: поиск своего звука","sub":"Raihan, Сити Нурхализа, Зайналабидин","text":"Малайзия ищет собственное звучание: нашид-группа Raihan ставит рекорд продаж, Сити Нурхализа соединяет поп и традицию, Зайналабидин — world music. Параллельно рождается малайзийский хип-хоп.","songs":[{"ms":"Puji-Pujian","ru":"Raihan","tr":"пуджи-пуджиян"},{"ms":"Hijau","ru":"Zainalabidin","tr":"хиджау"}],"tr":"заман нашид дан ирама малайсия","say":[]},{"ms":"Zaman realiti TV dan hip-hop","genre":"Поп, хип-хоп","ru":"2000-е: реалити-шоу и рэп","sub":"Akademi Fantasia, Too Phat","text":"Телешоу «Akademi Fantasia» делает звёзд за один сезон (Мави, Аизат), Too Phat выводит малайзийский рэп в Азию, Файзал Тахир поёт «Gemuruh», Юна начинает карьеру в интернете.","songs":[{"ms":"Gemuruh","ru":"Файзал Тахир","tr":"гемурух"}],"tr":"заман реалити тв дан хип-хоп","say":[]},{"ms":"Zaman YouTube dan indie","genre":"Инди, поп, хип-хоп","ru":"2010-е: YouTube и инди","sub":"Hujan, Bunkface, Joe Flizzow","text":"Артисты прорываются через YouTube, инди-группы собирают фестивали, «Apa Khabar» Joe Flizzow и SonaOne получает премии, «Hati Kering» Хаэля Хусаини выигрывает AJL.","songs":[{"ms":"Apa Khabar","ru":"Joe Flizzow и SonaOne","tr":"апа хабар"},{"ms":"Hati Kering","ru":"Хаэль Хусаини","tr":"хати керинг"}],"tr":"заман йоутубе дан индиэ","say":[]},{"ms":"Zaman TikTok","genre":"Поп, инди, этно-поп","ru":"2020-е: эпоха TikTok","sub":"Сейчас","text":"Хиты рождаются из 15-секундных видео: Putera Bobo, Mimifly, ретро-волна MASDO. Растёт интерес к языкам Борнео (Ryenald Guntabid, Mawat), а AJL40 выигрывает группа K.O.I.","songs":[{"ms":"Tiwikarma","ru":"K.O.I","tr":"тивикарма"},{"ms":"Serumpun","ru":"Mimifly","tr":"серумпун"}],"tr":"заман тикто'","say":[]}]}]},{"id":"makanan","ms":"Makanan","title":"Еда","img":"nasi_lemak","intro":"Еда — главная тема разговоров в Малайзии. Вопрос «Dah makan?» заменяет «как дела?», а спор о лучшем nasi lemak может длиться часами. Вот что надо попробовать и как об этом говорить.","groups":[{"h":"Национальная классика","items":[{"ms":"Nasi lemak","ru":"Наси лемак","sub":"Неофициальное национальное блюдо","img":"nasi_lemak","text":"Рис на кокосовом молоке с листом пандана, острым самбалом, жареными анчоусами (ikan bilis), арахисом и яйцом. Едят на завтрак, часто «bungkus» — завёрнутым в банановый лист.","say":[{"ms":"Nasi lemak bungkus satu, sambal lebih.","ru":"Один наси лемак с собой, побольше самбала.","tr":"наси лема' бунгкус сату, самбал лебэх."}],"tr":"наси лема'","songs":[]},{"ms":"Roti canai","ru":"Роти чанай","sub":"Звезда мамака","img":"roti_making","text":"Тонкая слоёная лепёшка, которую повар раскручивает в воздухе. Макают в карри или дал. «Roti canai banjir» — «затопленная» лепёшка, залитая соусом.","say":[{"ms":"Roti canai banjir satu!","ru":"Одну роти чанай, залить соусом!","tr":"роти чанай банджир сату!"}],"tr":"роти чанай","songs":[]},{"ms":"Satay","ru":"Сатай","sub":"Шашлычки с арахисовым соусом","img":"c_satay","text":"Маленькие шашлычки из курицы или говядины с арахисовым соусом (kuah kacang), огурцом и рисовыми кубиками ketupat. Самый известный — из городка Каджанг.","say":[{"ms":"Sate ayam sepuluh cucuk.","ru":"Десять шпажек куриного сатая.","tr":"сате аям сепулух чучу'."}],"tr":"сатай","songs":[]},{"ms":"Rendang","ru":"Ренданг","sub":"Праздничное мясо в специях","img":"c_rendang","text":"Говядина, часами тушённая в кокосовом молоке и специях до тёмной корочки. Обязательное блюдо на Хари Раю. Когда в британском кулинарном шоу назвали ренданг «недостаточно хрустящим», возмущалась вся страна.","say":[{"ms":"Rendang tok dari Perak paling sedap.","ru":"Ренданг ток из Перака — самый вкусный.","tr":"ренданг то' дари пера' палинг седап."}],"tr":"ренданг","songs":[]},{"ms":"Teh tarik","ru":"Те тарик","sub":"Национальный напиток","img":"p_tehtarik","text":"Чай со сгущённым молоком, который «тянут», переливая с высоты для пены. Есть даже соревнования мастеров teh tarik.","say":[{"ms":"Teh tarik kurang manis satu.","ru":"Один те тарик, поменьше сахара.","tr":"тэх тари' куранг манис сату."}],"tr":"тэх тари'","songs":[]}]},{"h":"Вкусы штатов","items":[{"ms":"Laksa","ru":"Лакса","sub":"Суп с лапшой: у каждого штата свой","img":"c_laksa","text":"Asam laksa из Пенанга — кислый рыбный суп с тамариндом; laksa Sarawak — с креветками и кокосовым молоком; curry laksa — с карри. Спросить «Laksa mana paling sedap?» — начать долгий спор.","say":[{"ms":"Laksa mana paling sedap?","ru":"Какая лакса самая вкусная?","tr":"лакса мана палинг седап?"}],"tr":"лакса","songs":[]},{"ms":"Char kway teow","ru":"Чар квей теу","sub":"Жареная лапша, Пенанг","img":"c_ckt","text":"Широкая рисовая лапша на сильном огне с креветками и ростками. Китайско-малайзийская классика. Важно: традиционная версия часто готовится на свином жире — мусульмане ищут табличку «halal».","say":[{"ms":"Kedai ini halal?","ru":"Это заведение халяльное?","tr":"кедай ини халал?"}],"tr":"чхар квай теов","songs":[]},{"ms":"Nasi kandar","ru":"Наси кандар","sub":"Рис и карри, Пенанг","img":"c_kandar","text":"Тамильско-мусульманская традиция: рис и десятки карри на выбор. Просите «kuah campur» — смешать несколько соусов поверх риса.","say":[{"ms":"Kuah campur, ya.","ru":"Соусы смешать, пожалуйста.","tr":"куах чампур, я."}],"tr":"наси кандар","songs":[]},{"ms":"Nasi kerabu","ru":"Наси керабу","sub":"Голубой рис, Келантан","img":"c_kerabu","text":"Рис окрашен в голубой цвет цветами клитории (bunga telang), подаётся с зеленью, кокосом и рыбой. Визитная карточка северо-восточных штатов.","say":[{"ms":"Nasi ini biru kerana bunga telang.","ru":"Этот рис синий из-за цветов клитории.","tr":"наси ини биру керана бунга теланг."}],"tr":"наси керабу","songs":[]},{"ms":"Ayam percik","ru":"Аям перчик","sub":"Курица в кокосовом соусе на гриле, Келантан","img":"c_percik","text":"Курицу поливают пряным кокосовым соусом и жарят на углях. Особенно популярна в Рамадан на базарах.","say":[{"ms":"Ayam percik ini pedas sikit.","ru":"Этот аям перчик немного острый.","tr":"аям перчи' ини педас сикит."}],"tr":"аям перчи'","songs":[]},{"ms":"Keropok lekor","ru":"Кропок лекор","sub":"Рыбные палочки, Тренгану","img":"c_lekor","text":"Жареные палочки из рыбы и саго, с соусом чили. Лучший перекус у моря на восточном побережье.","say":[{"ms":"Keropok lekor dua ringgit.","ru":"Кропок лекор на два ринггита.","tr":"керопо' лекор дуа ринггит."}],"tr":"керопо' лекор","songs":[]}]},{"h":"Мамак, улица, десерты","items":[{"ms":"Mee goreng mamak","ru":"Ми горенг мамак","sub":"Жареная лапша по-индийски","img":"c_meegoreng","text":"Жёлтая лапша с яйцом, тофу и острым соусом. Еда «после футбола в полночь».","say":[{"ms":"Mee goreng mamak, tak nak pedas.","ru":"Ми горенг мамак, не острое.","tr":"меэ горенг мама', та' на' педас."}],"tr":"меэ горенг мама'","songs":[]},{"ms":"Roti John","ru":"Роти Джон","sub":"Омлет-сэндвич","img":"c_rotijohn","text":"Длинный багет, обжаренный с яйцом, луком и фаршем. По легенде назван в честь англичанина «Джона». Хит вечерних рынков.","say":[{"ms":"Roti John daging satu.","ru":"Один роти Джон с говядиной.","tr":"роти джохн дагинг сату."}],"tr":"роти джохн","songs":[]},{"ms":"Cendol","ru":"Чендол","sub":"Холодный десерт","img":"c_cendol","text":"Зелёные рисовые «червячки», колотый лёд, кокосовое молоко и пальмовый сахар gula Melaka. Спасение в жару.","say":[{"ms":"Cendol satu, gula Melaka lebih.","ru":"Один чендол, побольше пальмового сахара.","tr":"чендол сату, гула мелака лебэх."}],"tr":"чендол","songs":[]},{"ms":"Kuih-muih","ru":"Куих","sub":"Малайские сладости","img":"c_kuih","text":"Яркие маленькие пирожные из рисовой муки, кокоса и пандана: kuih lapis (слоёный), onde-onde (шарики с жидким сахаром внутри), seri muka. Их приносят на встречи и к чаю в офис.","say":[{"ms":"Jemput makan kuih.","ru":"Угощайтесь сладостями.","tr":"джемпут макан куих."}],"tr":"куих-муих","songs":[]},{"ms":"Durian","ru":"Дуриан","sub":"«Король фруктов»","img":"c_durian","text":"Фрукт с сильнейшим запахом: его запрещено вносить в отели и общественный транспорт. Сорт Musang King считается лучшим. Предложение попробовать дуриан — знак дружбы; честно скажите, понравился ли.","say":[{"ms":"Saya nak cuba durian!","ru":"Хочу попробовать дуриан!","tr":"сая на' чуба дуриян!"}],"tr":"дуриян","songs":[]}]}]},{"id":"perayaan","ms":"Perayaan","title":"Праздники","img":"p_raya","intro":"В Малайзии отмечают праздники всех народов, и на каждый принято поздравлять соседей и коллег. Главное слово — «rumah terbuka», «открытый дом»: в праздник хозяева принимают всех гостей, даже незнакомых.","groups":[{"h":"Мусульманские праздники","items":[{"ms":"Hari Raya Aidilfitri","ru":"Ураза-байрам (Хари Рая)","sub":"Главный праздник года","img":"p_raya","text":"После месяца поста все едут домой — «balik kampung», дороги стоят в пробках. Утром просят друг у друга прощения, дети получают «duit raya» (деньги в зелёных конвертах), на столе ketupat, lemang и rendang. Праздник длится целый месяц открытых домов.","say":[{"ms":"Selamat Hari Raya Aidilfitri, maaf zahir dan batin.","ru":"С праздником Ураза-байрам! Прости меня за всё — и явное, и тайное.","tr":"селамат хари рая аидилфитри, мааф захир дан батин."},{"ms":"Jemput datang ke rumah terbuka kami.","ru":"Приходите к нам на «открытый дом».","tr":"джемпут датанг ке румах тербука ками."}],"tr":"хари рая аидилфитри","songs":[]},{"ms":"Bulan Ramadan","ru":"Рамадан","sub":"Месяц поста","img":"c_ketupat","text":"Днём мусульмане не едят и не пьют; вечером открываются «bazar Ramadan» с сотнями лотков еды. Есть при постящихся коллегах не запрещено, но вежливо делать это незаметно. Ифтар называется «berbuka puasa».","say":[{"ms":"Selamat berpuasa!","ru":"Лёгкого поста!","tr":"селамат берпуаса!"},{"ms":"Jom berbuka puasa bersama.","ru":"Давайте вместе разговеемся.","tr":"джом бербука пуаса берсама."}],"tr":"булан рамадан","songs":[]},{"ms":"Hari Raya Aidiladha","ru":"Курбан-байрам (Хари Рая Хаджи)","sub":"Праздник жертвоприношения","text":"Проводят «korban» — жертвоприношение, мясо раздают родным и бедным. Празднуют скромнее, чем Хари Раю Айдильфитри.","say":[{"ms":"Salam Aidiladha.","ru":"С Курбан-байрамом.","tr":"салам аидиладха."}],"tr":"хари рая аидиладха","songs":[]}]},{"h":"Праздники других народов","items":[{"ms":"Tahun Baru Cina","ru":"Китайский Новый год","sub":"Январь–февраль","img":"c_yeesang","text":"Красные фонари, «ang pow» (деньги в красных конвертах) и «yee sang» — салат, который все вместе подбрасывают палочками как можно выше, загадывая удачу. Это малайзийско-сингапурская традиция. По-китайски поздравляют «Gong Xi Fa Cai».","say":[{"ms":"Selamat Tahun Baru Cina!","ru":"С Китайским Новым годом!","tr":"селамат тахун бару чина!"}],"tr":"тахун бару чина","songs":[]},{"ms":"Deepavali","ru":"Дипавали","sub":"Индуистский праздник огней · октябрь–ноябрь","img":"c_kolam","text":"Дома украшают масляными лампами и узорами «kolam» из цветного риса, угощают сладостями и murukku. Индийские семьи тоже устраивают открытые дома.","say":[{"ms":"Selamat Hari Deepavali!","ru":"С праздником Дипавали!","tr":"селамат хари деэпавали!"}],"tr":"деэпавали","songs":[]},{"ms":"Thaipusam","ru":"Тайпусам","sub":"Паломничество к пещерам Бату","img":"c_batucaves","text":"Сотни тысяч тамилов-индуистов поднимаются по 272 ступеням храма в пещерах Бату с подношениями «kavadi». Одно из самых впечатляющих зрелищ страны.","say":[{"ms":"Kita pergi ke Batu Caves untuk melihat Thaipusam.","ru":"Поедем в пещеры Бату посмотреть Тайпусам.","tr":"кита перги ке бату чавес унту' мелихат тхаипусам."}],"tr":"тхаипусам","songs":[]},{"ms":"Hari Gawai","ru":"Гавай — праздник урожая","sub":"Саравак · 1 июня","img":"c_gawai","text":"Праздник даяков Саравака (ибанов, бидаюхов и других): длинные дома, рисовое вино tuak, танцы. Поздравление на ибанском: «Gayu guru, gerai nyamai» — «долгой жизни, здоровья и благополучия».","say":[{"ms":"Selamat Hari Gawai! Gayu guru, gerai nyamai.","ru":"С праздником Гавай! Долгих лет, здоровья и благополучия.","tr":"селамат хари гавай! гаю гуру, герай нямай."}],"tr":"хари гавай","songs":[]},{"ms":"Pesta Kaamatan","ru":"Кааматан — праздник урожая","sub":"Сабах · май","img":"c_kaamatan","text":"Праздник кадазан-дусунов Сабаха в честь духа риса. Главное событие — конкурс Unduk Ngadau. Поздравляют на кадазан-дусун: «Kotobian Tadau Tagazo Do Kaamatan».","say":[{"ms":"Kotobian Tadau Tagazo Do Kaamatan!","ru":"С праздником Кааматан! (на кадазан-дусун)","tr":"котобиян тадау тагазо до кааматан!"}],"tr":"песта кааматан","songs":[]}]},{"h":"Национальные даты","items":[{"ms":"Hari Merdeka","ru":"День независимости · 31 августа","sub":"1957 год","img":"p_flag_students","text":"31 августа 1957 года Тунку Абдул Рахман на стадионе Мердека семь раз провозгласил «Merdeka!» — «Свобода!». Сейчас это парад, флаги на каждой машине и песни по радио весь август.","say":[{"ms":"Selamat Hari Merdeka!","ru":"С Днём независимости!","tr":"селамат хари мердека!"},{"ms":"Merdeka! Merdeka! Merdeka!","ru":"Свобода! Свобода! Свобода!","tr":"мердека! мердека! мердека!"}],"tr":"хари мердека","songs":[]},{"ms":"Hari Malaysia","ru":"День Малайзии · 16 сентября","sub":"1963 год","text":"В этот день 1963 года Малайя, Сабах, Саравак и Сингапур объединились в Малайзию (Сингапур вышел в 1965-м). Для жителей Сабаха и Саравака эта дата особенно важна.","say":[{"ms":"Selamat Hari Malaysia!","ru":"С Днём Малайзии!","tr":"селамат хари малайсия!"}],"tr":"хари малайсия","songs":[]}]}]},{"id":"adat","ms":"Adat dan budi bahasa","title":"Этикет и обычаи","img":"p_raya_home","intro":"«Budi bahasa» — вежливость и воспитанность — малайцы ценят выше всего. Эти правила помогут не обидеть хозяев и коллег, даже если вы ещё плохо говорите.","groups":[{"h":"В гостях и на улице","items":[{"ms":"Buka kasut","ru":"Снимать обувь","sub":"Дома, в мечети, иногда в офисе","text":"Перед входом в дом обувь оставляют у двери. Если у входа в офис стоят туфли — снимите и свои.","say":[{"ms":"Boleh saya masuk?","ru":"Можно войти?","tr":"болэх сая масу'?"},{"ms":"Jemput masuk.","ru":"Проходите, пожалуйста.","tr":"джемпут масу'."}],"tr":"бука касут","songs":[]},{"ms":"Tangan kanan","ru":"Правая рука","sub":"Еда, деньги, документы","text":"Всё передают и берут правой рукой (или двумя). Левая считается нечистой. Едят тоже правой — даже когда едят руками.","say":[{"ms":"Terima kasih.","ru":"Спасибо.","tr":"терима касих."}],"tr":"танган канан","songs":[]},{"ms":"Tunjuk dengan ibu jari","ru":"Показывать большим пальцем","sub":"Не указательным!","text":"Указывать на человека или предмет указательным пальцем грубо. Малайцы показывают большим пальцем правой руки, сжав остальные.","say":[{"ms":"Pejabat itu di sana.","ru":"Офис вон там.","tr":"педжабат иту ди сана."}],"tr":"тунджу' денган ибу джари","songs":[]},{"ms":"Tumpang lalu","ru":"«Позвольте пройти»","sub":"Проходя мимо сидящих","text":"Если проходите перед людьми, слегка наклонитесь, вытяните правую руку вниз и скажите «tumpang lalu». Это очень ценят старшие.","say":[{"ms":"Tumpang lalu, ya.","ru":"Позвольте пройти.","tr":"тумпанг лалу, я."}],"tr":"тумпанг лалу","songs":[]},{"ms":"Jangan sentuh kepala","ru":"Не трогать голову","sub":"Голова — самая уважаемая часть тела","text":"Даже детей не гладят по голове. Ноги, наоборот, «низкая» часть тела: не направляйте ступни на людей, сидя на полу.","say":[{"ms":"Maaf, saya tidak tahu.","ru":"Извините, я не знал(а).","tr":"мааф, сая тида' таху."}],"tr":"джанган сентух кепала","songs":[]},{"ms":"Minta diri","ru":"Вежливо уйти","sub":"Прощание в гостях","text":"Уходя, не исчезают молча: говорят «minta diri dulu» — «позвольте откланяться» и благодарят хозяев.","say":[{"ms":"Saya minta diri dulu. Terima kasih atas jemputan.","ru":"Позвольте откланяться. Спасибо за приглашение.","tr":"сая минта дири дулу. терима касих атас джемпутан."}],"tr":"минта дири","songs":[]}]},{"h":"Ценности","items":[{"ms":"Gotong-royong","ru":"Готонг-ройонг — общий труд","sub":"Помощь всей деревней","text":"Соседи вместе готовят свадьбу, чистят мечеть, строят дом. Слово используют и в офисе: «Kita gotong-royong siapkan laporan ini» — «давайте все вместе доделаем отчёт».","say":[{"ms":"Jom gotong-royong!","ru":"Давайте все вместе!","tr":"джом готонг-ройонг!"}],"tr":"готонг-ройонг","songs":[]},{"ms":"Kenduri","ru":"Кендури — угощение для общины","sub":"Свадьбы, рождения, поминки","text":"Большое угощение, на которое зовут родных, соседей и коллег. Приглашение на kenduri — знак доверия; дарят конверт с деньгами.","say":[{"ms":"Terima kasih atas jemputan ke kenduri.","ru":"Спасибо за приглашение на угощение.","tr":"терима касих атас джемпутан ке кендури."}],"tr":"кендури","songs":[]},{"ms":"Malu","ru":"Малу — стыд и скромность","sub":"Сохранить лицо","text":"Не критикуйте человека при всех и не спорьте громко: это заставит его «hilang muka» — потерять лицо. Замечания делают наедине и мягко.","say":[{"ms":"Boleh kita bincang sekejap?","ru":"Можно ненадолго поговорить?","tr":"болэх кита бинчанг секеджап?"}],"tr":"малу","songs":[]},{"ms":"Hormat orang tua","ru":"Уважение к старшим","sub":"Pak Cik, Mak Cik","text":"К незнакомым старшим обращаются «Pak Cik» (дядя) и «Mak Cik» (тётя), при встрече целуют или прикладывают ко лбу их руку (salam cium tangan).","say":[{"ms":"Apa khabar, Pak Cik?","ru":"Как поживаете, дядя?","tr":"апа хабар, па' чи'?"}],"tr":"хормат оранг туа","songs":[]}]},{"h":"Свадьба, дом и одежда","items":[{"ms":"Majlis perkahwinan Melayu","ru":"Малайская свадьба","sub":"Kenduri kahwin","text":"Сначала религиозный обряд akad nikah, потом праздник: жениха встречают компангом и силатом, молодые сидят на троне (bersanding) как «король и королева на один день» (raja sehari). Гостям дарят сувенир bunga telur — раньше это было яйцо в цветке.","say":[{"ms":"Selamat pengantin baru!","ru":"Поздравляем молодожёнов!","tr":"селамат пенгантин бару!"},{"ms":"Raja sehari.","ru":"Король на один день.","tr":"раджа сехари."}],"tr":"маджлис перкахвинан мелаю","songs":[]},{"ms":"Malam berinai","ru":"Ночь хны","sub":"Перед свадьбой","text":"Невесте (а иногда и жениху) расписывают руки хной. Как и в арабском мире, хна — знак праздника и благословения.","tr":"малам беринай","say":[],"songs":[]},{"ms":"Rumah kampung","ru":"Деревенский дом на сваях","sub":"Традиционная архитектура","text":"Деревянный дом на сваях спасает от наводнений и зверей, под ним прохладно. Крыши разных штатов отличаются формой; в Негери-Сембилан — изогнутые «рога» минангкабау.","tr":"румах кампунг","say":[],"songs":[]},{"ms":"Baju Melayu dan songkok","ru":"Баджу мелаю и сонгкок","sub":"Мужской костюм","text":"Рубашка с брюками из одной ткани, юбка-sampin из сонгкета и чёрная шапочка songkok. Воротник «cekak musang» — стоячий, «teluk belanga» — круглый, характерный для Джохора. Надевают по пятницам и в праздники.","say":[{"ms":"Dia pakai baju Melayu dan songkok pada hari Jumaat.","ru":"По пятницам он надевает баджу мелаю и сонгкок.","tr":"дия пакай баджу мелаю дан сонгко' пада хари джума'ат."}],"tr":"баджу мелаю дан сонгко'","songs":[]},{"ms":"Baju kurung dan baju kebaya","ru":"Баджу курунг и кебая","sub":"Женский костюм","text":"Baju kurung — свободная длинная блуза с юбкой, повседневная одежда в школах и офисах. Kebaya — приталенная блуза, особенно у перанаканок Мелаки и Пенанга.","tr":"баджу курунг дан баджу кебая","say":[],"songs":[]},{"ms":"Kain pelekat dan batik","ru":"Саронг в клетку и батик","sub":"Домашняя одежда","text":"Клетчатый саронг kain pelekat мужчины носят дома и в мечеть, батиковый саронг — женщины. Название пелекат, по одной версии, — от индийского города Пуликат.","tr":"каин пелекат дан бати'","say":[],"songs":[]}]}]},{"id":"seni","ms":"Seni dan permainan","title":"Искусство и игры","img":"c_wau","intro":"Традиционные искусства Малайзии — гордость страны; несколько из них внесены в список нематериального наследия ЮНЕСКО. О них часто говорят на официальных приёмах.","groups":[{"h":"Наследие","items":[{"ms":"Silat","ru":"Силат","sub":"Боевое искусство · ЮНЕСКО (2019)","img":"c_silat","text":"Малайское боевое искусство и одновременно танец. На свадьбах жениха встречают выступлением силата (silat pengantin).","say":[{"ms":"Silat ialah seni mempertahankan diri Melayu.","ru":"Силат — малайское искусство самозащиты.","tr":"силат иялах сени мемпертаханкан дири мелаю."}],"tr":"силат","songs":[]},{"ms":"Pantun","ru":"Пантун","sub":"Поэтическое четверостишие · ЮНЕСКО (2020)","text":"Четыре строки: первые две — образ природы, вторые две — смысл, рифма abab. Пантуном начинают и заканчивают речи — даже министры. Ниже классический народный пантун о добрых делах.","say":[{"ms":"Pulau Pandan jauh ke tengah,","ru":"Остров Пандан далеко в море,","tr":"пулау пандан джаух ке тенгах,"},{"ms":"Gunung Daik bercabang tiga;","ru":"Гора Даик о трёх вершинах;","tr":"гунунг даи' берчабанг тига;"},{"ms":"Hancur badan dikandung tanah,","ru":"Истлеет тело в земле,","tr":"ханчур бадан дикандунг танах,"},{"ms":"Budi yang baik dikenang juga.","ru":"А добрые дела будут помнить.","tr":"буди янг баи' дикенанг джуга."}],"tr":"пантун","songs":[]},{"ms":"Songket","ru":"Сонгкет","sub":"Ткань с золотой нитью · ЮНЕСКО (2021)","img":"c_songket","text":"Парча, в которую вплетают золотые или серебряные нити. Из неё шьют свадебные и королевские наряды; лучшие мастера — в Тренгану и Келантане.","say":[{"ms":"Kain songket ini sangat cantik.","ru":"Эта ткань сонгкет очень красивая.","tr":"каин сонгкет ини сангат чанти'."}],"tr":"сонгкет","songs":[]},{"ms":"Batik Malaysia","ru":"Малайзийский батик","sub":"Рисунок воском на ткани","text":"В отличие от индонезийского, малайзийский батик — крупные яркие цветы и листья, рисованные кистью; людей и животных обычно не изображают. Госслужащие носят батик по четвергам.","say":[{"ms":"Saya pakai baju batik hari ini.","ru":"Сегодня я в батике.","tr":"сая пакай баджу бати' хари ини."}],"tr":"бати' малайсия","songs":[]},{"ms":"Mak Yong","ru":"Мак Йонг","sub":"Танцевальная драма · ЮНЕСКО (2005)","text":"Древний театр Келантана: музыка, танец, импровизация, главную мужскую роль играет женщина.","tr":"ма' йонг","say":[],"songs":[]},{"ms":"Wayang kulit","ru":"Ваянг кулит — театр теней","sub":"Келантан","img":"c_wayang","text":"Один мастер (tok dalang) ведёт всех кукол из кожи и озвучивает героев под оркестр. Сюжеты — из эпоса «Рамаяна» в малайской версии.","say":[{"ms":"Tok dalang menggerakkan semua patung.","ru":"Ток даланг управляет всеми куклами.","tr":"то' даланг менггераккан семуа патунг."}],"tr":"ваянг кулит","songs":[]},{"ms":"Zapin","ru":"Запин","sub":"Танец арабского происхождения, Джохор","img":"c_zapin","text":"Пришёл с арабскими купцами — тут пригодится ваш арабский. Танцуют под уд (gambus) и барабаны marwas.","tr":"запин","say":[],"songs":[]},{"ms":"Keris","ru":"Крис","sub":"Кинжал с волнистым клинком","img":"c_keris","text":"Священное оружие и символ малайского достоинства; часть королевских регалий и свадебного наряда жениха.","tr":"керис","say":[],"songs":[]}]},{"h":"Народные игры","items":[{"ms":"Wau","ru":"Вау — воздушный змей","sub":"Келантан","img":"c_wau","text":"Огромные расписные змеи; самый известный — «wau bulan» с полумесяцем. Силуэт вау — на логотипе Malaysia Airlines.","say":[{"ms":"Wau bulan terbang tinggi.","ru":"Вау булан летит высоко.","tr":"вау булан тербанг тингги."}],"tr":"вау","songs":[]},{"ms":"Sepak takraw","ru":"Сепак такрау","sub":"Волейбол ногами","img":"c_takraw","text":"Плетёный мяч бьют ногами, коленями и головой через сетку. Акробатика, от которой захватывает дух; популярна в школах и деревнях.","tr":"сепа' такрав","say":[],"songs":[]},{"ms":"Congkak","ru":"Конгкак","sub":"Игра с ракушками","img":"c_congkak","text":"Деревянная доска с лунками, в которые раскладывают ракушки или камешки. В неё играют бабушки с внуками на Хари Раю.","tr":"чонгка'","say":[],"songs":[]},{"ms":"Gasing","ru":"Гасинг — волчок","sub":"Восточное побережье","text":"Тяжёлые деревянные волчки могут вращаться больше часа; в Келантане и Тренгану проводят турниры.","tr":"гасинг","say":[],"songs":[]}]}]},{"id":"cerita","ms":"Cerita rakyat","title":"Легенды и фольклор","img":"c_melaka","intro":"Эти истории малайзийцы знают с детства: по ним снимают фильмы и мультфильмы, на них ссылаются в речах и шутках.","groups":[{"h":"Герои Мелаки","items":[{"ms":"Hang Tuah","ru":"Ханг Туах","sub":"Адмирал султаната Мелака, XV век","img":"c_melaka","text":"Легендарный воин, символ верности султану. Ему приписывают слова «Takkan Melayu hilang di dunia» — «Не исчезнут малайцы на земле». Эту фразу часто цитируют политики.","say":[{"ms":"Takkan Melayu hilang di dunia.","ru":"Не исчезнут малайцы на земле.","tr":"та'кан мелаю хиланг ди дуния."}],"tr":"ханг туах","songs":[]},{"ms":"Hang Jebat","ru":"Ханг Джебат","sub":"Друг, восставший ради справедливости","text":"Когда султан несправедливо приговорил Ханг Туаха, его друг Джебат восстал — и Туах сам убил его по приказу. Спор «кто прав — верный Туах или справедливый Джебат?» идёт веками и учит дискутировать.","say":[{"ms":"Raja adil raja disembah, raja zalim raja disanggah.","ru":"Справедливому правителю кланяются, тирану — противостоят.","tr":"раджа адил раджа дисембах, раджа залим раджа дисанггах."}],"tr":"ханг джебат","songs":[]},{"ms":"Parameswara dan pokok Melaka","ru":"Основание Мелаки","sub":"Около 1400 года","text":"Принц Парамешвара отдыхал под деревом, когда крошечный олень-мышь (pelanduk) ударом отбросил его охотничью собаку. Увидев смелость слабого, принц основал здесь город и назвал его по имени дерева — Melaka.","say":[{"ms":"Pelanduk itu menendang anjing.","ru":"Олень-мышь лягнул собаку.","tr":"пеланду' иту мененданг анджинг."}],"tr":"парамесвара дан поко' мелака","songs":[]},{"ms":"Puteri Gunung Ledang","ru":"Принцесса горы Леданг","sub":"Легенда Джохора","img":"c_ledang","text":"Султан Мелаки сватается к волшебной принцессе. Она требует невозможного: мост из золота, семь подносов комариных сердец и чашу крови его сына. Султан отступает — история о пределах власти.","say":[{"ms":"Tujuh dulang hati nyamuk.","ru":"Семь подносов комариных сердец.","tr":"туджух дуланг хати няму'."}],"tr":"путери гунунг леданг","songs":[]}]},{"h":"Сказки и легенды","items":[{"ms":"Sang Kancil","ru":"Санг Канчил — хитрый олень-мышь","sub":"Любимый герой детских сказок","text":"Маленький, но умный: например, «пересчитывает» крокодилов и по их спинам перебегает реку. Слово «kancil» — синоним хитреца; так же называлась популярная малолитражка Perodua.","say":[{"ms":"Sang Kancil yang cerdik.","ru":"Хитроумный Санг Канчил.","tr":"санг канчил янг черди'."}],"tr":"санг канчил","songs":[]},{"ms":"Mahsuri","ru":"Махсури","sub":"Легенда Лангкави","img":"c_langkawi","text":"Невинную девушку казнили по ложному обвинению; из раны потекла белая кровь — знак невиновности. Умирая, она прокляла остров на семь поколений. Её гробница — популярное место на Лангкави.","say":[{"ms":"Darah Mahsuri berwarna putih.","ru":"Кровь Махсури была белой.","tr":"дарах махсури берварна путих."}],"tr":"махсури","songs":[]},{"ms":"Badang","ru":"Баданг — силач","sub":"Легенда о силе","text":"Бедный рыбак поймал духа, и тот наградил его невероятной силой. Баданг поднимал камни, которые не могли сдвинуть сотни людей.","tr":"баданг","say":[],"songs":[]},{"ms":"Si Tanggang","ru":"Си Танггант — неблагодарный сын","sub":"Нравоучительная легенда","text":"Разбогатевший сын отрёкся от бедной матери — и превратился в камень вместе с кораблём. «Anak derhaka» — «непочтительный ребёнок» — сильное обвинение до сих пор.","say":[{"ms":"Jangan jadi anak derhaka.","ru":"Не будь неблагодарным ребёнком.","tr":"джанган джади ана' дерхака."}],"tr":"си тангганг","songs":[]},{"ms":"Pontianak dan hantu-hantu","ru":"Понтианак и другие духи","sub":"Малайские «ужастики»","text":"Pontianak — призрак женщины в белом, orang minyak — «масляный человек», toyol — дух-воришка. Фильмы ужасов про них собирают полные залы; шутить о них — обычное дело среди молодёжи.","say":[{"ms":"Awak percaya pontianak?","ru":"Ты веришь в понтианака?","tr":"ава' перчая понтияна'?"}],"tr":"понтияна' дан ханту-ханту","songs":[]}]},{"h":"Легенды разных штатов","items":[{"ms":"Hang Li Po","ru":"Ханг Ли По — китайская принцесса","sub":"Мелака, XV век","text":"По «Малайским анналам», принцессу из Китая выдали за султана Мелаки, и её свита поселилась на холме Букит Чина. Колодец Ханг Ли По в Мелаке показывают туристам — символ давних связей с Китаем.","say":[{"ms":"Perigi Hang Li Po di Bukit Cina.","ru":"Колодец Ханг Ли По на холме Букит Чина.","tr":"периги ханг ли по ди букит чина."}],"tr":"ханг ли по","songs":[]},{"ms":"Puteri Saadong","ru":"Принцесса Саадонг","sub":"Келантан","text":"Легендарная правительница Келантана, пожертвовавшая собой ради мужа и народа. Её имя носят улицы и сериалы; символ женской силы в малайской истории.","tr":"путери саадонг","say":[],"songs":[]},{"ms":"Batu Belah Batu Bertangkup","ru":"«Раскрывающийся камень»","sub":"Сказка о матери и детях","text":"Обиженная детьми мать уходит к волшебному камню, который её поглощает. Грустная сказка, которую рассказывают детям о почтении к родителям.","say":[{"ms":"Batu belah, batu bertangkup, telanlah aku.","ru":"Камень-скала, раскройся, поглоти меня.","tr":"бату белах, бату бертангкуп, теланлах аку."}],"tr":"бату белах бату бертангкуп","songs":[]},{"ms":"Naga Tasik Chini","ru":"Дракон озера Чини","sub":"Паханг","text":"По преданию, в озере Чини живёт дракон и скрыт затонувший древний город. Местные жители народа джакун рассказывают о нём гостям.","say":[{"ms":"Ada naga di Tasik Chini?","ru":"В озере Чини живёт дракон?","tr":"ада нага ди таси' чхини?"}],"tr":"нага таси' чхини","songs":[]},{"ms":"Bujang Senang","ru":"Буджанг Сенанг — гигантский крокодил","sub":"Саравак","text":"Огромный крокодил с белой полосой на спине, наводивший страх на реку Батанг Лупар в 1980–90-х. Полулегенда-полуправда: о нём сняли фильм и пишут до сих пор.","tr":"буджанг сенанг","say":[],"songs":[]},{"ms":"Mat Kilau","ru":"Мат Килау","sub":"Паханг · реальный герой","text":"Воин, восставший против британцев в 1890-х; позже десятилетиями жил под чужим именем. Фильм о нём (2022) стал одним из самых кассовых малайских фильмов.","say":[{"ms":"Mat Kilau pahlawan Pahang.","ru":"Мат Килау — герой Паханга.","tr":"мат килау пахлаван паханг."}],"tr":"мат килау","songs":[]}]}]},{"id":"sejarah","ms":"Sejarah","title":"История","img":"c_melaka","intro":"Короткая история Малайзии в 17 событиях — то, что каждый малайзиец проходил в школе по предмету «Sejarah». Даты пригодятся на переговорах и приёмах.","groups":[{"h":"Древность и султанаты","items":[{"ms":"Lembah Bujang","ru":"Долина Буджанг, Кедах","sub":"Примерно II–XIV века","text":"Древнейший археологический комплекс страны: индуистско-буддийские храмы и порт, торговавший с Индией и Китаем. Доказательство, что Малайский полуостров был перекрёстком торговли задолго до Мелаки.","tr":"лембах буджанг","say":[],"songs":[]},{"ms":"Kesultanan Melayu Melaka","ru":"Султанат Мелака","sub":"Около 1400–1511","img":"c_melaka","text":"Основан принцем Парамешварой; стал главным портом пролива и центром распространения ислама в регионе. Отсюда — малайский как язык торговли всего архипелага, придворный этикет и образ «золотого века».","say":[{"ms":"Melaka pernah menjadi pusat perdagangan dunia.","ru":"Мелака когда-то была центром мировой торговли.","tr":"мелака пернах менджади пусат пердаганган дуния."}],"tr":"кесултанан мелаю мелака","songs":[]},{"ms":"Portugis menawan Melaka","ru":"Португальцы захватывают Мелаку","sub":"1511","text":"Флот Афонсу де Албукерки взял Мелаку. Последний султан ушёл на юг — от его потомков ведут род султанаты Джохора и Перака. Португальцы оставили крепость A Famosa и слова, которые вы уже встречали: almari (шкаф, от armário), garpu (вилка, от garfo), sekolah (школа, от escola), bendera (флаг, от bandeira).","say":[{"ms":"Almari, garpu, sekolah dan bendera berasal daripada bahasa Portugis.","ru":"Almari, garpu, sekolah и bendera пришли из португальского.","tr":"алмари, гарпу, секолах дан бендера берасал дарипада бахаса португис."}],"tr":"португис менаван мелака","songs":[]},{"ms":"Belanda di Melaka","ru":"Голландцы в Мелаке","sub":"1641","text":"Голландская Ост-Индская компания отбила Мелаку у португальцев. От голландцев осталось красное здание Stadthuys — символ Мелаки сегодня.","tr":"беланда ди мелака","say":[],"songs":[]}]},{"h":"Британская эпоха и война","items":[{"ms":"British di Pulau Pinang","ru":"Британцы на Пенанге","sub":"1786","text":"Фрэнсис Лайт основал британское поселение на Пенанге. Затем появились Стрейтс-Сетлментс (Пенанг, Мелака, Сингапур) и британские «резиденты» при султанах. Британцы ввезли рабочих из Китая и Индии — так сложилось многонациональное общество.","tr":"бритисх ди пулау пинанг","say":[],"songs":[]},{"ms":"Pendudukan Jepun","ru":"Японская оккупация","sub":"1941–1945","text":"Японская армия заняла Малайю и Сингапур за несколько недель. Оккупация стала тяжёлым временем и разбудила национальное движение: стало ясно, что колониальная власть не всесильна.","tr":"пендудукан джепун","say":[],"songs":[]},{"ms":"Malayan Union dan UMNO","ru":"Малайский союз и рождение UMNO","sub":"1946","text":"Британский план лишить султанов власти вызвал массовые протесты малайцев; так родилась партия UMNO. План отменили, в 1948 году создали Федерацию Малайя.","tr":"малаян унион дан умно","say":[],"songs":[]},{"ms":"Darurat","ru":"Чрезвычайное положение","sub":"1948–1960","text":"Двенадцатилетняя борьба с коммунистическими партизанами в джунглях. В это время людей переселяли в «новые деревни», а власти готовили страну к независимости.","tr":"дарурат","say":[],"songs":[]}]},{"h":"Независимая Малайзия","items":[{"ms":"Merdeka 1957","ru":"Независимость","sub":"31 августа 1957","img":"merdeka","text":"Тунку Абдул Рахман провозгласил независимость Федерации Малайя на стадионе Мердека. Первый король — Туанку Абдул Рахман из Негери-Сембилан.","say":[{"ms":"Merdeka! Merdeka! Merdeka!","ru":"Свобода! Свобода! Свобода!","tr":"мердека! мердека! мердека!"}],"tr":"мердека 1957","songs":[]},{"ms":"Penubuhan Malaysia","ru":"Создание Малайзии","sub":"16 сентября 1963","text":"Малайя, Сабах, Саравак и Сингапур объединились. Индонезия ответила «конфронтацией» (Konfrontasi, 1963–1966).","tr":"пенубухан малайсия","say":[],"songs":[]},{"ms":"Singapura keluar","ru":"Выход Сингапура","sub":"9 августа 1965","text":"Из-за политических разногласий Сингапур стал отдельным государством. Две страны остаются ближайшими соседями и партнёрами.","tr":"сингапура келуар","say":[],"songs":[]},{"ms":"ASEAN 1967","ru":"Создание АСЕАН","sub":"8 августа 1967","text":"Малайзия — одна из пяти стран-основательниц АСЕАН (Бангкокская декларация). Для вас, международника, это ключевая дата.","say":[{"ms":"Malaysia ialah salah satu negara pengasas ASEAN.","ru":"Малайзия — одна из стран-основательниц АСЕАН.","tr":"малайсия иялах салах сату негара пенгасас асиан."}],"tr":"асиан 1967","songs":[]},{"ms":"13 Mei 1969 dan Rukun Negara","ru":"13 мая 1969 и Рукун Негара","sub":"1969–1971","text":"Межэтнические столкновения после выборов потрясли страну. Ответом стали Рукун Негара (1970) и Новая экономическая политика (1971) — курс на сокращение неравенства между народами. Тема чувствительная: о ней говорят осторожно.","tr":"13 мэй 1969 дан рукун негара","say":[],"songs":[]},{"ms":"Wawasan 2020 dan Menara Petronas","ru":"«Видение 2020» и башни Петронас","sub":"1991–1998","img":"petronas","text":"Махатхир Мохамад объявил цель — стать развитой страной к 2020 году. Символы эпохи: башни Петронас (1998, тогда самые высокие в мире), Путраджая, аэропорт KLIA, национальный автомобиль Proton.","tr":"вавасан 2020 дан менара петронас","say":[],"songs":[]},{"ms":"Krisis kewangan Asia","ru":"Азиатский финансовый кризис","sub":"1997–1998","text":"Малайзия отказалась от программы МВФ и привязала ринггит к доллару — решение, которое до сих пор обсуждают экономисты.","tr":"крисис кеванган асия","say":[],"songs":[]},{"ms":"Pertukaran kerajaan 2018","ru":"Первая смена власти","sub":"2018","text":"Впервые с 1957 года коалиция Barisan Nasional проиграла выборы; премьером снова стал 92-летний Махатхир. С тех пор политика страны стала более конкурентной.","tr":"пертукаран кераджаан 2018","say":[],"songs":[]},{"ms":"Malaysia hari ini","ru":"Малайзия сегодня","sub":"2020-е","text":"С ноября 2022 года премьер-министр — Анвар Ибрахим, правительство национального единства. В 2025 году Малайзия председательствовала в АСЕАН; саммит прошёл в Куала-Лумпуре.","say":[{"ms":"Malaysia menjadi Pengerusi ASEAN pada tahun 2025.","ru":"В 2025 году Малайзия председательствовала в АСЕАН.","tr":"малайсия менджади пенгеруси асиан пада тахун 2025."}],"tr":"малайсия хари ини","songs":[]}]}]},{"id":"peribahasa","ms":"Peribahasa","title":"Пословицы","img":"c_songket","intro":"Peribahasa — пословицы — украшают речь, особенно официальную. Уместная пословица в выступлении сразу показывает уважение к малайской культуре.","groups":[{"h":"Для речей и переговоров","items":[{"ms":"Di mana bumi dipijak, di situ langit dijunjung","ru":"«Где ступаешь по земле, там чтишь небо»","sub":"≈ «В чужой монастырь со своим уставом не ходят»","text":"Уважай обычаи той страны, где находишься. Идеальна для иностранца в речи: показывает, что вы уважаете Малайзию.","say":[{"ms":"Di mana bumi dipijak, di situ langit dijunjung.","ru":"Где ступаешь по земле, там чтишь небо.","tr":"ди мана буми дипиджа', ди ситу лангит диджунджунг."}],"tr":"ди мана буми дипиджа', ди ситу лангит диджунджунг","songs":[]},{"ms":"Bersatu teguh, bercerai roboh","ru":"«Вместе — крепко, порознь — рухнем»","sub":"О единстве","text":"Любимая пословица речей об АСЕАН и сотрудничестве.","say":[{"ms":"Bersatu teguh, bercerai roboh.","ru":"Вместе мы сильны, порознь падём.","tr":"берсату тегух, берчерай робох."}],"tr":"берсату тегух, берчерай робох","songs":[]},{"ms":"Berat sama dipikul, ringan sama dijinjing","ru":"«Тяжёлое несём вместе, лёгкое тоже вместе»","sub":"О партнёрстве","text":"И трудности, и успехи делим поровну. Хорошо звучит в конце переговоров.","say":[{"ms":"Berat sama dipikul, ringan sama dijinjing.","ru":"Тяжёлое несём вместе, и лёгкое вместе.","tr":"берат сама дипикул, ринган сама диджинджинг."}],"tr":"берат сама дипикул, ринган сама диджинджинг","songs":[]},{"ms":"Bagai aur dengan tebing","ru":"«Как бамбук и речной берег»","sub":"О взаимной поддержке","text":"Бамбук держит берег, берег держит бамбук. Так говорят о добрых соседях — и о дружбе стран.","say":[{"ms":"Hubungan kita bagai aur dengan tebing.","ru":"Наши отношения — как бамбук и берег.","tr":"хубунган кита багай аур денган тебинг."}],"tr":"багай аур денган тебинг","songs":[]},{"ms":"Sedikit-sedikit, lama-lama jadi bukit","ru":"«Понемногу — и получится холм»","sub":"≈ «По капле — море»","text":"Про ежедневные небольшие усилия — ровно про изучение языка.","say":[{"ms":"Sedikit-sedikit, lama-lama jadi bukit.","ru":"Понемногу — и выйдет холм.","tr":"седикит-седикит, лама-лама джади букит."}],"tr":"седикит-седикит, лама-лама джади букит","songs":[]}]},{"h":"Для жизни","items":[{"ms":"Malu bertanya sesat jalan","ru":"«Стыдишься спросить — заблудишься»","sub":"Спрашивайте!","text":"Не бойтесь переспрашивать — эту пословицу вам скажут с улыбкой, если вы смущаетесь.","say":[{"ms":"Malu bertanya sesat jalan.","ru":"Стыдишься спросить — заблудишься.","tr":"малу бертаня сесат джалан."}],"tr":"малу бертаня сесат джалан","songs":[]},{"ms":"Seperti katak di bawah tempurung","ru":"«Как лягушка под кокосовой скорлупой»","sub":"О узком кругозоре","text":"Человек, который ничего не видел, кроме своего угла. Повод путешествовать и учить языки.","say":[{"ms":"Jangan jadi katak di bawah tempurung.","ru":"Не будь лягушкой под скорлупой.","tr":"джанган джади ката' ди бавах темпурунг."}],"tr":"сеперти ката' ди бавах темпурунг","songs":[]},{"ms":"Ada udang di sebalik batu","ru":"«За камнем прячется креветка»","sub":"≈ «Тут что-то нечисто»","text":"Скрытый мотив. Так говорят, когда предложение кажется слишком щедрым.","say":[{"ms":"Saya rasa ada udang di sebalik batu.","ru":"Мне кажется, тут есть подвох.","tr":"сая раса ада уданг ди себали' бату."}],"tr":"ада уданг ди себали' бату","songs":[]},{"ms":"Bagai pinang dibelah dua","ru":"«Как разрезанный пополам орех арека»","sub":"Идеальная пара","text":"Говорят о молодожёнах, которые идеально подходят друг другу. Без этой фразы не обходится ни одна свадьба.","say":[{"ms":"Pengantin ini bagai pinang dibelah dua.","ru":"Молодые — как две половинки ореха.","tr":"пенгантин ини багай пинанг дибелах дуа."}],"tr":"багай пинанг дибелах дуа","songs":[]},{"ms":"Hujan emas di negeri orang, hujan batu di negeri sendiri","ru":"«В чужой стране — золотой дождь, дома — каменный»","sub":"≈ «В гостях хорошо, а дома лучше»","text":"Продолжение: «…lebih baik di negeri sendiri» — «а всё же лучше дома».","say":[{"ms":"Hujan emas di negeri orang, hujan batu di negeri sendiri, lebih baik di negeri sendiri.","ru":"В чужой стране золотой дождь, дома каменный, — а дома всё же лучше.","tr":"худжан эмас ди негери оранг, худжан бату ди негери сендири, лебэх баи' ди негери сендири."}],"tr":"худжан эмас ди негери оранг, худжан бату ди негери сендири","songs":[]},{"ms":"Harimau mati meninggalkan belang","ru":"«Тигр умирает — остаются полосы»","sub":"О добром имени","text":"Полная форма: «…manusia mati meninggalkan nama» — «человек умирает — остаётся имя».","say":[{"ms":"Harimau mati meninggalkan belang, manusia mati meninggalkan nama.","ru":"Тигр умирает — остаются полосы, человек умирает — остаётся имя.","tr":"харимау мати менинггалкан беланг, манусия мати менинггалкан нама."}],"tr":"харимау мати менинггалкан беланг","songs":[]}]},{"h":"О согласии, труде и характере","items":[{"ms":"Bulat air kerana pembetung, bulat manusia kerana muafakat","ru":"«Вода собирается в трубе, люди — в согласии»","sub":"О консенсусе","text":"Сила — в согласии и совещании (muafakat — из арабского «موافقة»). Идеально для речей о многосторонних переговорах.","say":[{"ms":"Bulat air kerana pembetung, bulat manusia kerana muafakat.","ru":"Вода едина в трубе, люди едины в согласии.","tr":"булат аир керана пембетунг, булат манусия керана муафакат."}],"tr":"булат аир керана пембетунг, булат манусия керана муафакат","songs":[]},{"ms":"Tak kenal maka tak cinta","ru":"«Не узнаешь — не полюбишь»","sub":"Для знакомства и культурных программ","text":"Любимая фраза для начала презентаций о своей стране или для приглашения на культурное мероприятие.","say":[{"ms":"Tak kenal maka tak cinta.","ru":"Не узнаешь — не полюбишь.","tr":"та' кенал мака та' чинта."}],"tr":"та' кенал мака та' чинта","songs":[]},{"ms":"Jauh perjalanan, luas pandangan","ru":"«Дальше путь — шире взгляд»","sub":"О путешествиях и учёбе","text":"Тот, кто много путешествует, больше понимает. Хорошо подходит иностранному студенту.","say":[{"ms":"Jauh perjalanan, luas pandangan.","ru":"Дальше путь — шире кругозор.","tr":"джаух перджаланан, луас панданган."}],"tr":"джаух перджаланан, луас панданган","songs":[]},{"ms":"Hendak seribu daya, tak hendak seribu dalih","ru":"«Захочешь — найдёшь тысячу способов, не захочешь — тысячу отговорок»","sub":"≈ «Кто хочет — ищет возможности»","text":"Про мотивацию: в учёбе и на работе.","say":[{"ms":"Hendak seribu daya, tak hendak seribu dalih.","ru":"Захочешь — тысяча способов, не захочешь — тысяча отговорок.","tr":"хенда' серибу дая, та' хенда' серибу далих."}],"tr":"хенда' серибу дая, та' хенда' серибу далих","songs":[]},{"ms":"Yang bulat tidak datang bergolek, yang pipih tidak datang melayang","ru":"«Круглое само не прикатится, плоское само не прилетит»","sub":"≈ «Без труда не вытащишь и рыбку из пруда»","text":"Ничего не даётся без усилий.","say":[{"ms":"Yang bulat tidak datang bergolek, yang pipih tidak datang melayang.","ru":"Круглое не прикатится, плоское не прилетит само.","tr":"янг булат тида' датанг берголе', янг пипих тида' датанг мелаянг."}],"tr":"янг булат тида' датанг берголе', янг пипих тида' датанг мелаянг","songs":[]},{"ms":"Alah bisa tegal biasa","ru":"«Яд теряет силу от привычки»","sub":"≈ «Повторение — мать учения»","text":"Трудное становится лёгким, если делать это каждый день. Девиз ваших карточек.","say":[{"ms":"Alah bisa tegal biasa.","ru":"Привычка побеждает трудность.","tr":"алах биса тегал бияса."}],"tr":"алах биса тегал бияса","songs":[]},{"ms":"Air tenang jangan disangka tiada buaya","ru":"«В тихой воде не думай, что нет крокодила»","sub":"≈ «В тихом омуте черти водятся»","text":"Спокойный человек или ситуация могут скрывать опасность.","say":[{"ms":"Air tenang jangan disangka tiada buaya.","ru":"В тихой воде тоже бывают крокодилы.","tr":"аир тенанг джанган дисангка тияда буая."}],"tr":"аир тенанг джанган дисангка тияда буая","songs":[]},{"ms":"Kalau tiada angin, masakan pokok bergoyang","ru":"«Без ветра дерево не качается»","sub":"≈ «Нет дыма без огня»","text":"У слухов всегда есть причина.","say":[{"ms":"Kalau tiada angin, masakan pokok bergoyang.","ru":"Без ветра и дерево не качается.","tr":"калау тияда ангин, масакан поко' бергоянг."}],"tr":"калау тияда ангин, масакан поко' бергоянг","songs":[]},{"ms":"Bagai kacang lupakan kulit","ru":"«Как арахис, забывший скорлупу»","sub":"О неблагодарности","text":"Человек, забывший тех, кто ему помог. Строгая оценка — используйте осторожно.","say":[{"ms":"Jangan jadi seperti kacang lupakan kulit.","ru":"Не будь арахисом, забывшим скорлупу.","tr":"джанган джади сеперти качанг лупакан кулит."}],"tr":"багай качанг лупакан кулит","songs":[]},{"ms":"Tak lapuk dek hujan, tak lekang dek panas","ru":"«Не гниёт от дождя, не трескается от жары»","sub":"О вечных ценностях","text":"Так говорят о традициях и дружбе, которые не стареют. Красиво звучит в тостах на приёмах.","say":[{"ms":"Persahabatan kita tak lapuk dek hujan, tak lekang dek panas.","ru":"Наша дружба не боится ни дождя, ни жары.","tr":"персахабатан кита та' лапу' де' худжан, та' леканг де' панас."}],"tr":"та' лапу' де' худжан, та' леканг де' панас","songs":[]}]},{"h":"Пантун на прощание","items":[{"ms":"Kalau ada sumur di ladang","ru":"Пантун «Если в поле есть колодец»","sub":"Классическое прощание в конце речи","text":"Народный пантун, которым заканчивают выступления, письма и встречи: надежда увидеться снова. Выучите его — это беспроигрышный финал речи.","say":[{"ms":"Kalau ada sumur di ladang,","ru":"Если в поле есть колодец,"," /* ---------------- audio: packed neural clips, system voice as fallback ---------------- */
const spk = s => {
  s = String(s).replace(/…/g, ' ').replace(/\(глагол\)/g, '');
  if (s.toUpperCase() === s && /[A-Z]{5}/.test(s)) s = s[0] + s.slice(1).toLowerCase(); // same rule as speakable() in build.py
  return s.replace(/\s*\/\s*/g, ', ').replace(/\s+/g, ' ').trim().replace(/^[ ,]+|[ ,]+$/g, '');
};
const AU = { el: new Audio(), packs: {}, urls: {}, cur: null, btn: null };
AU.el.preload = 'auto';
function packBuf(i) {
  if (!AU.packs[i]) AU.packs[i] = fetch(`audio/${D.audio.packs[i]}.bin`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).catch(e => { delete AU.packs[i]; throw e; });
  return AU.packs[i];
}
async function clipUrl(v, text) {
  const key = `${v}|${spk(text)}`;
  if (AU.urls[key]) return AU.urls[key];
  const c = D.audio && D.audio.clips[key];
  if (!c) return null;
  try {
    const buf = await packBuf(c[0]);
    return (AU.urls[key] = URL.createObjectURL(new Blob([buf.slice(c[1], c[1] + c[2])], { type: 'audio/mpeg' })));
  } catch (e) { return null; }
}
function stopAudio() {
  try { AU.el.pause(); } catch (e) { /* ignore */ }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (AU.cur) { const r = AU.cur; AU.cur = null; r(); }
  $$('.playing').forEach(b => b.classList.remove('playing'));
}
let msVoice;
function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /ms[-_]MY/i.test(v.lang)) || vs.find(v => /^ms/i.test(v.lang)) || null;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { msVoice = pickVoice(); };
/** Play a Malay line; resolves when it ends (or is stopped). */
async function play(text, v = 'f', rate = 1, btn = null) {
  stopAudio();
  if (btn) btn.classList.add('playing');
  const url = await clipUrl(v, text);
  return new Promise(resolve => {
    const done = () => { if (AU.cur === resolve) AU.cur = null; if (btn) btn.classList.remove('playing'); resolve(); };
    AU.cur = done;
    if (url) {
      const el = AU.el;
      el.src = url; el.defaultPlaybackRate = rate; el.playbackRate = rate;
      el.preservesPitch = true; el.webkitPreservesPitch = true;
      el.onended = done; el.onerror = done;
      el.onloadedmetadata = () => { el.playbackRate = rate; };
      el.play().catch(done);
    } else if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(spk(text));
      msVoice = msVoice || pickVoice();
      if (msVoice) u.voice = msVoice;
      u.lang = 'ms-MY'; u.rate = 0.92 * rate;
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } else done();
  });
}
const sayBtns = (text, v = 'f') => `<span class="say"><button data-act="say" data-t="${esc(text)}" data-v="${v}" aria-label="Слушать">${I.play}</button><button data-act="say" data-t="${esc(text)}" data-v="${v}" data-r="0.7" aria-label="Медленно">0.7×</button></span>`;

/* ---------------- SRS (Anki-like, 3 grades) ---------------- */
const ITEMS = {};
for (const L of LESSONS) {
  L.words.forEach((w, i) => { ITEMS[`${L.id}.w${i}`] = { ...w, lesson: L.id, kind: 'w' }; });
  L.slang.forEach((s, i) => { ITEMS[`${L.id}.s${i}`] = { ms: s.ms, say: s.say, tr: s.tr, ru: s.ru, ex: s.ex, exTr: s.exTr, exRu: s.exRu, use: `Можно: ${s.ok} Нельзя: ${s.no}`, lesson: L.id, kind: 's' }; });
}
function addLessonCards(L) {
  const t = dayNum(); let n = 0;
  for (const id of Object.keys(ITEMS)) if (ITEMS[id].lesson === L.id && !S.srs[`${id}|f`]) { S.srs[`${id}|f`] = { due: t, ivl: 0, ef: 2.5, reps: 0, lapses: 0, n: 1 }; n++; }
  save(); return n;
}
function newLeft() { if (S.newLog.d !== today()) S.newLog = { d: today(), n: 0 }; return Math.max(0, S.settings.newPerDay - S.newLog.n); }
function queue() {
  const t = dayNum(), rev = [], neu = [];

  rev.sort((a, b) => S.srs[a].due - S.srs[b].due);
  // new cards: lesson order, words before slang, forward before reverse
  const ord = id => { const [iid, dir] = id.split('|'), it = ITEMS[iid]; return [LESSONS.indexOf(LBY[it.lesson]), it.kind === 's' ? 1 : 0, Number(iid.split('.')[1].slice(1)), dir === 'r' ? 1 : 0]; };
  neu.sort((a, b) => { const x = ord(a), y = ord(b); for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; });
  return { rev, neu: neu.slice(0, newLeft()), neuAll: neu.length };
}
function nextIvl(c, g) {
  if (g === 0) return 0;
  if (g === 1) return c.reps === 0 ? 1 : Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
  return c.reps === 0 ? 2 : c.reps === 1 ? 4 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ef));
}
function grade(id, g) {
  const c = S.srs[id], t = dayNum();
  if (c.n) { c.n = 0; newLeft(); S.newLog.n++; }
  const ivl = nextIvl(c, g);
  if (g === 0) { c.ef = Math.max(1.3, c.ef - 0.2); c.reps = 0; c.lapses++; }
  else { c.ef = g === 1 ? Math.max(1.3, c.ef - 0.15) : Math.min(3, c.ef + 0.05); c.reps++; }
  c.ivl = ivl; c.due = t + ivl; c.last = t;
  if (id.endsWith('|f')) { const r = id.slice(0, -1) + 'r'; if (!S.srs[r]) S.srs[r] = { due: t + 1, ivl: 0, ef: 2.5, reps: 0, lapses: 0, n: 1 }; }
  mark('reviews');
}
const ivlLabel = d => d === 0 ? 'сегодня' : d === 1 ? '1 день' : d < 5 ? `${d} дня` : d < 30 ? `${d} дн.` : `${Math.round(d / 30)} мес.`;

/* ---------------- practice: choose, build, listen & repeat, reply ---------------- */
const Practice = {
  start(L) {
    const words = shuffle(L.words).slice(0, 4);
    const tasks = [
      ...words.map(w => ({ t: 'choose', w, opts: shuffle([w.ru, ...shuffle(L.words.filter(x => x !== w)).slice(0, 3).map(x => x.ru)]) })),
      ...L.build.map(b => ({ t: 'build', b, tiles: shuffle([...b.ms.split(' ').map(clean), ...b.extra]) })),
      ...shuffle(L.dialog.lines.filter(x => x.ms.split(' ').length <= 9)).slice(0, 2).map(x => ({ t: 'listen', ms: x.ms, tr: x.tr, ru: x.ru, v: x.v })),
      { t: 'listen', ms: words[0].ex, tr: words[0].exTr, ru: words[0].exRu, v: 'm' },
      ...L.reply.map(r => ({ t: 'reply', r })),
    ];
    this.L = L; this.tasks = tasks; this.i = 0; this.res = []; this.show();
  },
  show() {
    const box = $('#pr'); if (!box) return;
    const n = this.tasks.length;
    const dots = `<div class="dots">${this.tasks.map((_, k) => `<i class="${k < this.i ? (this.res[k] === false ? 'bad' : 'ok') : k === this.i ? 'cur' : ''}"></i>`).join('')}</div>`;
    if (this.i >= n) {
      const scored = this.res.filter(x => x !== null), ok = scored.filter(Boolean).length, pct = Math.round(ok / Math.max(1, scored.length) * 100);
      const s = lst(this.L.id); s.practice = pct; save();
      box.innerHTML = `${dots}<div class="card score"><div class="kicker">Практика завершена</div><div class="num">${ok}/${scored.length}</div><p class="muted">${pct >= 80 ? 'Отлично. Переходите к тесту.' : 'Неплохо. Можно пройти практику ещё раз или идти к тесту.'}</p>
        <div class="row" style="justify-content:center;gap:10px"><button class="btn ghost small" data-act="pr-again">Ещё раз</button><button class="btn small" data-act="step" data-i="${SI.test}">К тесту ${I.next}</button></div></div>`;
      return;
    }
    const k = this.tasks[this.i];
    let html = '';
    if (k.t === 'choose') html = `<div class="card"><div class="ex-q">Выберите перевод</div><div class="row"><div class="grow"><div class="ex-prompt">${esc(k.w.ms)}</div><div class="tr">${esc(k.w.tr)}</div></div>${sayBtns(k.w.say || k.w.ms)}</div>
      <div class="opts">${k.opts.map((o, j) => `<button class="opt" data-act="pr-choose" data-j="${j}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
    if (k.t === 'build') html = `<div class="card"><div class="ex-q">Соберите фразу</div><div class="ex-prompt" style="font-size:20px">${esc(k.b.ru)}</div>
      <div class="answer-line" id="ans"></div><div class="tiles">${k.tiles.map((t, j) => `<button class="tile" data-act="pr-tile" data-j="${j}">${esc(t)}</button>`).join('')}</div>
      <div class="row" style="margin-top:16px;gap:10px"><button class="btn ghost small" data-act="pr-clear">Сбросить</button><button class="btn small grow" data-act="pr-check">Проверить</button></div><div id="fb"></div></div>`;
    if (k.t === 'listen') html = `<div class="card center"><div class="ex-q">Послушайте и повторите вслух</div>
      <button class="big-play" data-act="pr-listen" id="bigPlay">${I.resume}</button><div class="phase" id="phase">Нажмите — фраза прозвучит дважды, между повторами пауза для вас</div>

    if (k.t === 'reply') html = `<div class="card"><div class="ex-q">Ответьте на реплику</div><div class="bub" data-act="say" data-t="${esc(k.r.p)}" data-v="f" style="max-width:100%"><div class="ms">${esc(k.r.p)}</div><span class="tr">${esc(k.r.pTr)}</span><div class="ru">${esc(k.r.pRu)}</div></div>
      <div class="opts">${k.r.o.map((o, j) => `<button class="opt" data-act="pr-reply" data-j="${j}">${esc(o)}<span class="tr">${esc(k.r.oTr[j])}</span></button>`).join('')}</div><div id="fb"></div></div>`;

  answer(ok, el, why, right) {

};
const clean = s => s.replace(/[.,?!]/g, '');

/* ---------------- test ---------------- */
const Test = {
  start(L) {
    const qs = L.test.map(t => ({ ...t }));
    for (const w of shuffle(L.words).slice(0, 2)) {
      const opts = shuffle([w.ru, ...shuffle(L.words.filter(x => x !== w)).slice(0, 2).map(x => x.ru)]);
      qs.push({ listen: w.say || w.ms, q: 'Послушайте и выберите перевод', o: opts, a: opts.indexOf(w.ru), why: `${w.ms} — ${w.ru}` });

    if (this.i >= n) {
      const pct = Math.round(this.ok / n * 100), s = lst(this.L.id);
      s.best = Math.max(s.best || 0, pct); save();
      box.innerHTML = `<div class="card score"><div class="kicker">Мини-тест</div><div class="num">${pct}%</div><p class="muted">${this.ok} из ${n} верно. ${pct >= 80 ? 'Урок усвоен.' : pct >= 60 ? 'Хорошо, но повторите правило и слова.' : 'Стоит вернуться к словам и правилу.'}</p>
        <div class="row" style="justify-content:center;gap:10px"><button class="btn ghost small" data-act="ts-again">Ещё раз</button><button class="btn small" data-act="step" data-i="${SI.finish}">К итогам ${I.next}</button></div></div>`;
      return;
    }
    const q = this.qs[this.i];
    box.innerHTML = `<div class="dots">${this.qs.map((_, k) => `<i class="${k < this.i ? 'ok' : k === this.i ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="card"><div class="ex-q">Вопрос ${this.i + 1} из ${n}</div>
      ${q.listen ? `<button class="big-play" data-act="say" data-t="${esc(q.listen)}" data-v="f">${I.play}</button>` : ''}
      <div class="ex-prompt" style="font-size:20px">${esc(q.q)}</div>
