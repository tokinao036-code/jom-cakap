<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jom Cakap</title>
<meta name="description" content="Малайзийский малайский с нуля: уроки, озвучка, карточки, грамматика.">
<meta name="theme-color" content="#EDF0F3">
<meta name="robots" content="noindex, nofollow">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Jom Cakap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Jom Cakap — "Liquid Glass": light, frosted translucent layers over a blurred ambient photo.
   Photos inside cards are shown as they are (no filters); only the full-screen ambient layer is blurred. */
:root {
  --bg: #EDF0F3;
  --ink: #0D1220;
  --ink2: rgba(13, 18, 32, .64);
  --ink3: rgba(13, 18, 32, .44);
  --hair: rgba(13, 18, 32, .08);
  --fill: rgba(13, 18, 32, .055);
  --glass: rgba(255, 255, 255, .56);
  --glass-hi: rgba(255, 255, 255, .8);
  --glass-brd: rgba(255, 255, 255, .72);
  --glass-edge: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(255, 255, 255, .25);
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 12px 32px -10px rgba(16, 24, 40, .18);
  --shadow-lg: 0 2px 6px rgba(16, 24, 40, .06), 0 24px 60px -16px rgba(16, 24, 40, .28);
  --blur: blur(26px) saturate(180%);
  --accent: #2F6FE4;
  --red: #E5352B;
  --green: #22A06B;
  --gold: #F0AE00;
  --violet: #7A5AF8;
  --stage: #2E9E6B;
  --r-xl: 30px;
  --r-lg: 24px;
  --r: 18px;
  --r-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  /* sentence-schema slot colours */
  --s-s: #2F6FE4; --s-v: #E5352B; --s-o: #22A06B; --s-d: #7A5AF8; --s-p: #F07A1A;
  --s-l: #0FA3B1; --s-t: #C99000; --s-q: #D6409F; --s-n: #3D4659; --s-k: #4F46E5; --s-x: #8A93A6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C11; --ink: #F3F5F9; --ink2: rgba(243, 245, 249, .68); --ink3: rgba(243, 245, 249, .46);
    --hair: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
    --glass: rgba(28, 32, 42, .52); --glass-hi: rgba(44, 50, 64, .72); --glass-brd: rgba(255, 255, 255, .13);
    --glass-edge: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(255, 255, 255, .03);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 26px 64px -16px rgba(0, 0, 0, .7);
    --accent: #5B8DFF; --red: #FF5A4E; --green: #3CC88A; --gold: #FFC53D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C11; --ink: #F3F5F9; --ink2: rgba(243, 245, 249, .68); --ink3: rgba(243, 245, 249, .46);
  --hair: rgba(255, 255, 255, .1); --fill: rgba(255, 255, 255, .08);
  --glass: rgba(28, 32, 42, .52); --glass-hi: rgba(44, 50, 64, .72); --glass-brd: rgba(255, 255, 255, .13);
  --glass-edge: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(255, 255, 255, .03);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px -12px rgba(0, 0, 0, .6);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 26px 64px -16px rgba(0, 0, 0, .7);
  --accent: #5B8DFF; --red: #FF5A4E; --green: #3CC88A; --gold: #FFC53D;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font); letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
}
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.025em; line-height: 1.12; }
h1 { font-size: 34px; font-weight: 750; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 650; }
p { margin: 0 0 10px; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
img { display: block; max-width: 100%; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.hidden { display: none !important; }

/* ---------------- ambient background ---------------- */
#amb { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
#amb .layer { position: absolute; inset: -12%; background-size: cover; background-position: center;
  filter: blur(64px) saturate(1.5); opacity: 0; transform: scale(1.12); transition: opacity 1.1s var(--ease); }
#amb .layer.on { opacity: .55; }
:root[data-theme="dark"] #amb .layer.on { opacity: .42; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #amb .layer.on { opacity: .42; } }
#amb .tint { position: absolute; inset: 0;
  background: radial-gradient(70% 50% at 15% 0%, color-mix(in srgb, var(--stage) 30%, transparent), transparent 70%),
              radial-gradient(60% 45% at 100% 30%, rgba(255, 255, 255, .5), transparent 70%),
              linear-gradient(180deg, transparent 40%, var(--bg) 100%);
  transition: background .8s var(--ease); }
:root[data-theme="dark"] #amb .tint { background: radial-gradient(70% 50% at 15% 0%, color-mix(in srgb, var(--stage) 35%, transparent), transparent 70%), linear-gradient(180deg, transparent 35%, var(--bg) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #amb .tint { background: radial-gradient(70% 50% at 15% 0%, color-mix(in srgb, var(--stage) 35%, transparent), transparent 70%), linear-gradient(180deg, transparent 35%, var(--bg) 100%); } }

/* ---------------- layout ---------------- */
#view { max-width: 640px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom)); }
body.focus #view { padding-bottom: calc(130px + env(safe-area-inset-bottom)); }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.list { display: grid; gap: 10px; }
.exl { display: grid; gap: 8px; }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); }
.kicker { font-size: 12.5px; font-weight: 600; color: var(--ink3); letter-spacing: .01em; }
.link { font-weight: 600; font-size: 15px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 28px 4px 12px; }
.sec h2 { font-size: 20px; }

/* ---------------- glass surfaces ---------------- */
.glass, .card, .sheet, #nav, .sticky, .foot-actions, .pop, .icon-btn, .opt, .tog, .seg, .say button, .chipbar .tog, .toast {
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge), var(--shadow);
}
.card { border-radius: var(--r-lg); padding: 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
.list > .card { margin-bottom: 0; }
.card.tight { padding: 14px 16px; }
.card.flat { box-shadow: var(--glass-edge); }
a.card { color: inherit; display: block; }
a.card.row { display: flex; }
.card h3 + p { margin-top: 4px; }

.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px;
  border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 650; font-size: 16px; position: relative; overflow: hidden;
  transition: transform .25s var(--spring), opacity .2s; text-decoration: none; white-space: nowrap; }
.btn:active { transform: scale(.96); }
.btn svg { width: 18px; height: 18px; }
.btn.block { display: flex; width: 100%; }
.btn.small { height: 40px; padding: 0 16px; font-size: 15px; }
.btn.ghost { background: var(--glass); color: var(--ink); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge); }
.btn.red { background: var(--red); color: #fff; }
.btn.gold, .btn.accent { background: var(--accent); color: #fff; }
.btn.green { background: var(--green); color: #fff; }
.btn[disabled] { opacity: .4; pointer-events: none; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--fill);
  font-size: 12.5px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip.red { background: color-mix(in srgb, var(--red) 13%, transparent); color: var(--red); }
.chip.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: color-mix(in srgb, var(--gold) 70%, var(--ink)); }
.chip.green { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
.chip.navy, .chip.blue { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }

.status { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--ink2); font-size: 13px; font-weight: 700; }
.status svg { width: 15px; height: 15px; }
.status.done { background: var(--green); color: #fff; }
.status.part { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }

.callout .kicker { display: block; margin-bottom: 4px; }
.callout.red .kicker { color: var(--red); }
.callout.navy .kicker { color: var(--accent); }
.callout.gold .kicker { color: color-mix(in srgb, var(--gold) 75%, var(--ink)); }

/* transcription, Malay text */
.tr { color: var(--ink3); font-size: 14px; font-style: italic; letter-spacing: 0; }
.tr::before { content: "["; } .tr::after { content: "]"; }
.ms { font-weight: 600; font-size: 17px; }
.w-ms { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.w-ru { font-weight: 600; margin-top: 2px; }

/* tappable words */
.w { cursor: pointer; border-radius: 6px; transition: background .2s; padding: 0 1px; margin: 0 -1px;
  background-image: linear-gradient(currentColor, currentColor); background-size: 100% 1px; background-position: 0 100%;
  background-repeat: no-repeat; background-blend-mode: normal; }
.w { background-image: linear-gradient(color-mix(in srgb, currentColor 22%, transparent), color-mix(in srgb, currentColor 22%, transparent)); }
.w:hover, .w.on { background-color: color-mix(in srgb, var(--accent) 16%, transparent); }
.pop { position: absolute; z-index: 60; border-radius: 18px; padding: 12px 14px; min-width: 170px; max-width: 280px;
  background: var(--glass-hi); box-shadow: var(--glass-edge), var(--shadow-lg); animation: popIn .32s var(--spring) both; }
.pop .pw { font-family: var(--display); font-weight: 700; font-size: 19px; }
.pop .pru { font-weight: 600; margin-top: 2px; }
.pop .pph { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair); font-size: 14px; color: var(--ink2); }
.pop .pph b { color: var(--ink); }
.pop .say { position: absolute; top: 10px; right: 10px; }
.pop .say button { width: 32px; height: 32px; }
.pop .say button + button { display: none; }
@keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.94); } }

/* audio buttons */
.say { display: inline-flex; gap: 6px; flex: none; }
.say button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-size: 12px; font-weight: 700; transition: transform .25s var(--spring); }
.say button + button { width: auto; padding: 0 10px; border-radius: 999px; color: var(--ink2); }
.say button svg { width: 18px; height: 18px; }
.say button:active { transform: scale(.9); }
.playing { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), var(--glass-edge) !important; }
.say button.playing { background: var(--accent); color: #fff; }

/* example rows */
.exi, .ex { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--fill); }
.exi .ms, .ex .ms { font-size: 16px; }

/* ---------------- floating tab bar ---------------- */
#nav { position: fixed; z-index: 40; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(480px, calc(100% - 20px)); height: 66px; border-radius: 33px; display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px; background: var(--glass-hi); box-shadow: var(--glass-edge), var(--shadow-lg); transition: transform .45s var(--ease), opacity .3s; }
body.focus #nav { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
#nav .pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 6); border-radius: 27px;
  background: rgba(255, 255, 255, .92); box-shadow: 0 2px 10px rgba(16, 24, 40, .12), inset 0 1px 0 #fff;
  transform: translateX(calc(var(--ix, 0) * 100%)); transition: transform .5s var(--spring); }
:root[data-theme="dark"] #nav .pill { background: rgba(255, 255, 255, .14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #nav .pill { background: rgba(255, 255, 255, .14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); } }
#nav a { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--ink3); font-size: 10px; font-weight: 600; text-decoration: none; transition: color .3s; letter-spacing: -.02em; white-space: nowrap; }
#nav a svg { width: 22px; height: 22px; transition: transform .4s var(--spring); }
#nav a.on { color: var(--ink); }
#nav a.on svg { transform: scale(1.08); }
#nav .dot { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
  background: var(--red); color: #fff; font-size: 10px; line-height: 17px; text-align: center; font-weight: 700; }

/* ---------------- headers ---------------- */
.top { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
.top h1 { font-size: 34px; }
.greet { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 6px 2px 16px; }
.greet .hi { font-family: var(--display); font-size: 30px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; cursor: pointer; }

/* ---------------- PATH ---------------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { border-radius: var(--r-lg); padding: 14px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge), var(--shadow); text-decoration: none; color: inherit; display: block; }
.stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
.stat span { display: block; font-size: 12.5px; color: var(--ink2); margin-top: 6px; font-weight: 500; }
.stat.red b { color: var(--red); } .stat.navy b { color: var(--accent); } .stat.gold b { color: color-mix(in srgb, var(--gold) 80%, var(--ink)); }
.stat .wk { display: flex; gap: 3px; margin-top: 8px; }
.stat .wk i { flex: 1; height: 5px; border-radius: 3px; background: var(--fill); }
.stat .wk i.on { background: var(--red); }

.cont { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: var(--r-xl); margin: 14px 0 6px; color: inherit; text-decoration: none; }
.cont .ph { width: 86px; height: 86px; border-radius: 20px; overflow: hidden; flex: none; background: var(--fill); }
.cont .ph img { width: 100%; height: 100%; object-fit: cover; }
.cont h3 { margin: 2px 0 4px; font-size: 19px; }
.cont .go { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; }
.cont .go svg { width: 22px; height: 22px; }

.stage { position: relative; border-radius: var(--r-xl); overflow: hidden; margin: 26px 0 0; min-height: 132px; color: #fff; display: flex; align-items: flex-end;
  box-shadow: var(--shadow-lg); isolation: isolate; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.stage::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0, 0, 0, .05) 0%, rgba(0, 0, 0, .62) 100%); }
.stage .in { padding: 16px 18px; width: 100%; }
.stage .lv { position: absolute; top: 12px; right: 12px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, .4); }
.stage h2 { font-size: 24px; color: #fff; }
.stage .k { font-size: 12.5px; font-weight: 600; opacity: .85; }
.stage .bar { margin-top: 10px; background: rgba(255, 255, 255, .25); }
.stage .bar i { background: #fff; }

.road { position: relative; margin: 0 auto; }
.road svg.track { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.road .seg-base { fill: none; stroke-linecap: round; }
.road .seg-todo { opacity: .45; }
.road .flow { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; opacity: .9; }
@keyframes flow { to { stroke-dashoffset: -32; } }
.node { position: absolute; width: 150px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-decoration: none; color: inherit; z-index: 2; }
.node .disc { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-brd);
  box-shadow: var(--glass-edge), var(--shadow); color: var(--c, var(--stage)); transition: transform .35s var(--spring); }
.node:active .disc { transform: scale(.92); }
.node .disc svg.ic { width: 30px; height: 30px; }
/* progress ring: centred on the disc whatever its border, rotated so it starts at 12 o'clock */
.node .disc .prog { position: absolute; left: 50%; top: 50%; width: 88px; height: 88px; transform: translate(-50%, -50%) rotate(-90deg); pointer-events: none; }
.node .disc .prog circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.node .disc .prog .bg { stroke: var(--fill); }
.node .disc .prog .fg { stroke: var(--c, var(--stage)); transition: stroke-dashoffset 1s var(--ease); }
.node .num { position: absolute; top: -4px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 6px; font-size: 12px; font-weight: 750;
  display: grid; place-items: center; background: var(--ink); color: var(--bg); }
.node.done .disc { background: var(--c, var(--stage)); color: #fff; border-color: transparent; }
.node.done .num { background: #fff; color: var(--c, var(--stage)); }
.node.now .disc { animation: pulse 2.4s var(--ease) infinite; }
@keyframes pulse { 0% { box-shadow: var(--glass-edge), var(--shadow), 0 0 0 0 color-mix(in srgb, var(--c, var(--stage)) 45%, transparent); }
  70% { box-shadow: var(--glass-edge), var(--shadow), 0 0 0 16px transparent; } 100% { box-shadow: var(--glass-edge), var(--shadow), 0 0 0 0 transparent; } }
.node .lbl { font-size: 12.5px; font-weight: 650; text-align: center; line-height: 1.2; max-width: 120px; padding: 3px 8px; border-radius: 10px;
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
.node .now-tag { position: absolute; top: -30px; padding: 4px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 11.5px; font-weight: 700; white-space: nowrap;
  animation: bob 2s var(--ease) infinite; }
.node .now-tag::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: var(--ink); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.scenery { position: absolute; transform: translate(-50%, -50%); color: var(--c, var(--stage)); opacity: .32; pointer-events: none; }
.scenery svg { width: 34px; height: 34px; }
.goal-flag { display: flex; align-items: center; gap: 12px; margin: 8px 0 0; padding: 14px 16px; border-radius: var(--r-lg); }
.goal-flag .medal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-weight: 800; font-size: 13px; }
.later { display: grid; gap: 8px; margin-top: 12px; }
.later .card { opacity: .7; }

/* node sheet */
.overlay { position: fixed; inset: 0; z-index: 70; background: rgba(10, 14, 24, .28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center; animation: fade .3s var(--ease) both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(640px, 100%); max-height: 88vh; overflow: auto; border-radius: 30px 30px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
  background: var(--glass-hi); animation: up .5s var(--ease) both; }
@keyframes up { from { transform: translateY(100%); } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--hair); margin: 0 auto 12px; }
.sheet .cover { border-radius: 22px; overflow: hidden; height: 190px; margin-bottom: 14px; background: var(--fill); position: relative; }
.sheet .cover img { width: 100%; height: 100%; object-fit: cover; }
.sheet .cover .credit { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.sheet h2 { margin: 2px 0 4px; }

/* ---------------- lesson ---------------- */
.sticky { position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 30; border-radius: 24px; padding: 10px 12px 12px; margin: 0 0 16px; background: var(--glass-hi); }
.sticky .t { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-name { font-size: 12px; font-weight: 600; color: var(--ink3); }
.steps { display: grid; grid-auto-flow: column; gap: 4px; margin-top: 10px; }
.steps button { height: 5px; border-radius: 3px; background: var(--fill); transition: background .4s; position: relative; }
.steps button::before { content: ""; position: absolute; inset: -8px 0; }
.steps button.done { background: color-mix(in srgb, var(--stage) 55%, transparent); }
.steps button.cur { background: var(--stage); }
.foot-actions { position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(616px, calc(100% - 24px)); display: flex; gap: 8px; padding: 8px; border-radius: 34px; background: var(--glass-hi); box-shadow: var(--glass-edge), var(--shadow-lg); }
.foot-actions .btn { flex: 1; }
.foot-actions .btn.ghost:first-child:not(:last-child) { flex: none; width: 50px; padding: 0; }
#stepBody.slide-r > * { animation: inR .5s var(--ease) both; }
#stepBody.slide-l > * { animation: inL .5s var(--ease) both; }
@keyframes inR { from { opacity: 0; transform: translateX(26px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-26px); } }

.lhero { position: relative; border-radius: var(--r-xl); overflow: hidden; min-height: 230px; display: flex; align-items: flex-end; color: #fff; margin-bottom: 12px; box-shadow: var(--shadow-lg); isolation: isolate; }
.lhero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.lhero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 30%, rgba(0, 0, 0, .66)); }
.lhero .in { padding: 18px; }
.lhero h1 { font-size: 30px; color: #fff; }
.lhero .k { font-size: 13px; font-weight: 600; opacity: .9; }
.lhero .cap { position: absolute; top: 12px; left: 12px; font-size: 11px; padding: 4px 9px; border-radius: 999px; background: rgba(0, 0, 0, .28); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.can { display: flex; gap: 10px; align-items: flex-start; }
.can .status { width: 24px; height: 24px; margin-top: 1px; }

/* memes */
.meme { padding: 0; }
.meme .mi { background: #000; display: flex; justify-content: center; }
.meme .mi img { max-height: 420px; width: auto; max-width: 100%; }
.meme .mb { padding: 14px 16px 16px; }
.meme .mb .ms { font-size: 19px; }
.meme .tag { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #fff;
  background: rgba(0, 0, 0, .35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.memes { display: grid; gap: 12px; }

/* word deck: swipe through big cards */
.deck { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 18px; scrollbar-width: none; overscroll-behavior-x: contain; }
.deck::-webkit-scrollbar { display: none; }
.wcard { flex: 0 0 88%; scroll-snap-align: center; margin: 0; display: flex; flex-direction: column; gap: 12px; min-height: 380px; }
.wcard .pic { border-radius: 16px; overflow: hidden; height: 150px; margin: -4px -4px 0; }
.wcard .pic img { width: 100%; height: 100%; object-fit: cover; }
.wcard .n { font-size: 12px; font-weight: 700; color: var(--ink3); }
.wcard .w-ms { font-size: 32px; }
.wcard .note { font-size: 14px; color: var(--ink2); }
.wcard .ar { font-size: 14px; padding: 10px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--gold) 12%, transparent); }
.wcard .ar b { display: block; font-size: 12px; color: color-mix(in srgb, var(--gold) 75%, var(--ink)); }
.deck-dots { display: flex; justify-content: center; gap: 5px; margin: -6px 0 14px; }
.deck-dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--hair); transition: width .35s var(--ease), background .3s; }
.deck-dots i.on { width: 20px; background: var(--ink); }
.mini-list .row { padding: 10px 2px; border-bottom: 1px solid var(--hair); }
.mini-list .row:last-child { border-bottom: 0; }

/* sentence schema */
.schema { display: grid; gap: 14px; }
.sch-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.slot { --c: var(--s-x); border-radius: 14px; padding: 7px 11px 8px; min-width: 64px; position: relative;
  background: color-mix(in srgb, var(--c) 13%, var(--glass)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
  animation: slotIn .55s var(--spring) both; animation-delay: calc(var(--k, 0) * 90ms + var(--r0, 0) * 260ms); }
.slot .sl { font-size: 10.5px; font-weight: 750; letter-spacing: .03em; text-transform: uppercase; color: var(--c); }
.slot .sm { font-weight: 700; font-size: 17px; line-height: 1.2; margin-top: 1px; }
.slot .sr { font-size: 12.5px; color: var(--ink2); margin-top: 1px; }
@keyframes slotIn { from { opacity: 0; transform: translateY(10px) scale(.85); } }
.slot.s { --c: var(--s-s); } .slot.v { --c: var(--s-v); } .slot.o { --c: var(--s-o); } .slot.d { --c: var(--s-d); } .slot.p { --c: var(--s-p); }
.slot.l { --c: var(--s-l); } .slot.t { --c: var(--s-t); } .slot.q { --c: var(--s-q); } .slot.n { --c: var(--s-n); } .slot.k { --c: var(--s-k); } .slot.x { --c: var(--s-x); }
.sch-pat { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 4px; }
.sch-pat span { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; }
.sch-pat i { color: var(--ink3); font-style: normal; font-size: 12px; }
.sch-note { font-size: 14px; color: var(--ink2); margin: 2px 0 0; }

/* dialog */
.scene { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: var(--r-lg); margin-bottom: 12px; }
.scene .ph { width: 70px; height: 70px; border-radius: 16px; overflow: hidden; flex: none; }
.scene .ph img { width: 100%; height: 100%; object-fit: cover; }
.toggle-row { display: flex; gap: 8px; margin: 0 0 12px; }
.tog { height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink2); transition: background .25s, color .25s; }
.tog.on { background: var(--ink); color: var(--bg); border-color: transparent; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.bub { max-width: 86%; align-self: flex-start; padding: 10px 14px 11px; border-radius: 20px 20px 20px 6px; position: relative;
  background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge), var(--shadow); cursor: pointer; }
.bub.me { align-self: flex-end; border-radius: 20px 20px 6px 20px; background: var(--accent); color: #fff; border-color: transparent; }
.bub .who { font-size: 12px; font-weight: 700; color: var(--ink3); margin-bottom: 2px; }
.bub.me .who { color: rgba(255, 255, 255, .7); }
.bub .ms { font-size: 16.5px; }
.bub .tr { display: block; font-size: 13.5px; margin-top: 3px; }
.bub.me .tr { color: rgba(255, 255, 255, .66); }
.bub .ru { font-size: 14px; color: var(--ink2); margin-top: 4px; }
.bub.me .ru { color: rgba(255, 255, 255, .82); }
.chat.no-tr .tr, .reading.no-tr .tr { display: none; }
.chat.no-ru .ru, .reading.no-ru .ru { display: none; }
.bub.playing { transform: scale(1.02); }
.bub .pl { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--accent); }
.bub.me .pl { background: rgba(255, 255, 255, .2); color: #fff; }
.bub .pl svg { width: 14px; height: 14px; }
.bub .who { padding-right: 28px; }

/* reading */
.rhero { height: 200px; overflow: hidden; }
.rhero img { width: 100%; height: 100%; object-fit: cover; }
.photo-credit { font-size: 11.5px; color: var(--ink3); margin-top: 4px; }
.rblock .kicker { margin-bottom: 6px; }
.rl { margin: 0; padding: 9px 10px; border-radius: 12px; cursor: pointer; transition: background .2s; }
.rl:hover { background: var(--fill); }
.rl .ms { display: block; font-weight: 550; font-size: 17px; }
.rl .tr { display: block; font-size: 13.5px; margin-top: 2px; }
.rl .ru { display: block; font-size: 14px; color: var(--ink2); margin-top: 2px; }
.rl.playing { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: none !important; }

/* slang */
.ok-no { display: grid; gap: 8px; margin-top: 12px; }
.ok-no > div { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); font-size: 14px; }
.ok-no svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.ok-no .ok { background: color-mix(in srgb, var(--green) 11%, transparent); } .ok-no .ok svg { color: var(--green); }
.ok-no .no { background: color-mix(in srgb, var(--red) 10%, transparent); } .ok-no .no svg { color: var(--red); }

/* letter and writing */
.letter { border-radius: var(--r); background: var(--fill); padding: 6px; display: grid; gap: 2px; }
.letter .ln { display: flex; gap: 10px; padding: 9px 10px; border-radius: 12px; cursor: pointer; font-size: 15.5px; }
.letter .ln:hover { background: var(--glass); }
.letter .ln .n { font-size: 12px; font-weight: 700; color: var(--ink3); min-width: 0; }
.letter .ln .n:empty { display: none; }
.letter .ln .ru { display: block; font-size: 13.5px; color: var(--ink2); margin-top: 2px; }
.letter .ln.b { font-weight: 700; } .letter .ln.sig { font-style: italic; }
.wpic { border-radius: 16px; overflow: hidden; height: 160px; margin-top: 10px; }
.wpic img { width: 100%; height: 100%; object-fit: cover; }
textarea { width: 100%; min-height: 130px; margin-top: 12px; padding: 14px; border-radius: var(--r); border: 1px solid var(--glass-brd); background: var(--glass-hi);
  resize: vertical; outline: none; font-size: 16px; line-height: 1.5; box-shadow: var(--glass-edge); transition: box-shadow .25s; }
textarea:focus, input[type="search"]:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
input[type="search"] { width: 100%; height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--glass-brd); background: var(--glass-hi); outline: none; }
.need-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* practice and test */
.ex-q { font-size: 12.5px; font-weight: 650; color: var(--ink3); margin-bottom: 8px; }
.ex-prompt { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { text-align: left; padding: 14px 16px; border-radius: var(--r); font-weight: 600; font-size: 16px; transition: transform .25s var(--spring), background .25s; }
.opt:active { transform: scale(.98); }
.opt .tr { display: block; font-size: 13px; font-weight: 500; }
.opt.right { background: color-mix(in srgb, var(--green) 20%, var(--glass)); border-color: color-mix(in srgb, var(--green) 50%, transparent); }
.opt.wrong { background: color-mix(in srgb, var(--red) 16%, var(--glass)); border-color: color-mix(in srgb, var(--red) 45%, transparent); animation: shake .4s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tile { padding: 10px 14px; border-radius: 14px; font-weight: 650; font-size: 16px; background: var(--glass-hi); border: 1px solid var(--glass-brd);
  box-shadow: var(--glass-edge), 0 2px 6px rgba(16, 24, 40, .08); transition: transform .25s var(--spring), opacity .2s; }
.tile:active { transform: scale(.94); }
.tile.used { opacity: .25; pointer-events: none; }
.answer-line { min-height: 58px; margin-top: 14px; padding: 8px; border-radius: var(--r); border: 1.5px dashed var(--hair); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.answer-line.right { border-color: var(--green); border-style: solid; background: color-mix(in srgb, var(--green) 9%, transparent); }
.answer-line.wrong { border-color: var(--red); border-style: solid; }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); font-size: 15px; animation: popIn .35s var(--spring) both; }
.feedback b { display: block; margin-bottom: 2px; }
.feedback.good { background: color-mix(in srgb, var(--green) 13%, transparent); }
.feedback.bad { background: color-mix(in srgb, var(--red) 11%, transparent); }
.dots { display: flex; gap: 4px; margin-bottom: 12px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); transition: background .3s; }
.dots i.ok { background: var(--green); } .dots i.bad { background: var(--red); } .dots i.cur { background: var(--ink); }
.big-play { width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center; margin: 10px auto 14px; background: var(--accent); color: #fff;
  box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--accent) 70%, transparent); transition: transform .3s var(--spring); }
.big-play:active { transform: scale(.92); }
.big-play svg { width: 32px; height: 32px; }
.big-play.playing { animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.06); } }
.phase { font-size: 14px; color: var(--ink2); min-height: 20px; }
.score { text-align: center; }
.score .num { font-family: var(--display); font-size: 64px; font-weight: 800; letter-spacing: -.04em; margin: 4px 0; }
.score .meme-mini { max-width: 240px; margin: 4px auto 12px; border-radius: 16px; overflow: hidden; }

/* flashcards */
.fc-wrap { perspective: 1400px; margin: 4px 0 16px; }
.fc { position: relative; min-height: 400px; transform-style: preserve-3d; transition: transform .7s var(--spring); cursor: pointer; }
.fc.flip { transform: rotateY(180deg); }
.fc .face { position: absolute; inset: 0; border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge), var(--shadow-lg); overflow: auto; }
.fc .face.back { transform: rotateY(180deg); justify-content: flex-start; }
.fc .dir { position: absolute; top: 16px; left: 0; right: 0; font-size: 12px; font-weight: 650; color: var(--ink3); }
.fc .big { font-family: var(--display); font-size: 36px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
.fc .pic { width: calc(100% + 44px); margin: -22px -22px 16px; height: 150px; overflow: hidden; }
.fc .pic img { width: 100%; height: 100%; object-fit: cover; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grades button { height: 62px; border-radius: 20px; font-weight: 700; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: transform .25s var(--spring); position: relative; overflow: hidden; }
.grades button:active { transform: scale(.95); }
.grades small { font-size: 11.5px; font-weight: 600; opacity: .85; }
.grades .g0 { background: var(--red); } .grades .g1 { background: var(--gold); color: #2A1F00; } .grades .g2 { background: var(--green); }
.bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--stage); transition: width 1s var(--ease); }

/* settings */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.setting:last-child { border-bottom: 0; padding-bottom: 0; } .setting:first-child { padding-top: 0; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; gap: 2px; box-shadow: var(--glass-edge); }
.seg button { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink2); transition: background .25s; }
.seg button.on { background: var(--ink); color: var(--bg); }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--fill); position: relative; transition: background .3s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .35s var(--spring); }
.switch.on { background: var(--green); } .switch.on::after { transform: translateX(20px); }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--fill); }
.heat i.l1 { background: color-mix(in srgb, var(--green) 35%, transparent); } .heat i.l2 { background: color-mix(in srgb, var(--green) 65%, transparent); } .heat i.l3 { background: var(--green); }

/* tables */
.tbl { overflow-x: auto; border-radius: var(--r-lg); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge), var(--shadow); }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 650; color: var(--ink3); padding: 12px 14px 8px; }
.tbl td { padding: 10px 14px; border-top: 1px solid var(--hair); vertical-align: top; }
.say-cell { width: 1%; }

/* dictionary */
.dict-tools { position: sticky; top: calc(6px + env(safe-area-inset-top)); z-index: 20; margin: 14px -6px 0; padding: 10px; border-radius: 26px;
  background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge), var(--shadow); }
.abc { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.abc::-webkit-scrollbar { display: none; }
.abc button { flex: none; width: 30px; height: 30px; border-radius: 50%; font-weight: 700; font-size: 13px; color: var(--ink2); background: var(--fill); }
.abc button:active { background: var(--ink); color: var(--bg); }
.dl { font-family: var(--display); font-size: 28px; font-weight: 800; margin: 22px 6px 8px; letter-spacing: -.03em; scroll-margin-top: 190px; }
.card.dict { padding: 4px 16px; }
.dw { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.card.dict > .dw:last-child, .card.dict > .dx:last-child { border-bottom: 0; }
.dw .chip { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.dx { padding: 2px 0 12px; border-bottom: 1px solid var(--hair); animation: popIn .3s var(--spring) both; }

/* timeline (course map, history, music eras) */
.tl { position: relative; padding-left: 22px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--hair); }
.tl .m { font-size: 12.5px; font-weight: 700; color: var(--ink3); margin: 18px 0 8px; }
.tl .w { position: relative; padding: 12px 14px; margin-bottom: 8px; border-radius: var(--r); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-brd); box-shadow: var(--glass-edge); }
.tl .w::before { content: ""; position: absolute; left: -21px; top: 17px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink3); }
.tl .w.done::before { background: var(--green); border-color: var(--green); }
.tl .w.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(var(--red), var(--accent)); border-radius: 1px; opacity: .5; }
.timeline > .card::before { content: ""; position: absolute; left: -19px; top: 22px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
.timeline > .card { overflow: visible; }

/* culture */
.chero { position: relative; border-radius: var(--r-xl); overflow: hidden; min-height: 210px; display: flex; align-items: flex-end; color: #fff; margin-bottom: 14px; box-shadow: var(--shadow-lg); isolation: isolate; }
.chero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.chero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 25%, rgba(0, 0, 0, .7)); }
.chero .in { padding: 18px; }
.chero h1 { color: #fff; font-size: 30px; }
.chero .k { font-size: 13px; font-weight: 600; opacity: .88; }
.chero .cap { position: absolute; top: 12px; left: 12px; font-size: 11px; padding: 4px 9px; border-radius: 999px; background: rgba(0, 0, 0, .3); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 12px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.topic { flex: 0 0 150px; height: 190px; scroll-snap-align: start; border-radius: 22px; overflow: hidden; position: relative; color: #fff; text-decoration: none; box-shadow: var(--shadow); isolation: isolate; }
.topic .ph, .topic .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.topic::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, .7)); }
.topic .tt { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; }
.topic .tt b { display: block; font-size: 15px; line-height: 1.2; }
.topic .tt span { font-size: 12px; opacity: .85; }
.hist { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 14px; scrollbar-width: none; }
.hist::-webkit-scrollbar { display: none; }
.hist a { flex: 0 0 240px; scroll-snap-align: start; color: inherit; text-decoration: none; padding: 0; margin: 0; }
.hist .hp { height: 150px; overflow: hidden; background: var(--fill); }
.hist .hp img { width: 100%; height: 100%; object-fit: cover; }
.hist .hb { padding: 12px 14px 14px; }
.hist .yr { font-family: var(--display); font-size: 17px; font-weight: 800; color: var(--red); letter-spacing: -.02em; margin-bottom: 2px; }
.hist .hp.noimg { display: grid; place-items: center; padding: 16px; text-align: center; color: #fff; background: linear-gradient(135deg, #C8312B, #1D3A8A); }
.hist .hp.noimg span { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.ci { padding: 0; }
.ci .ci-pic { height: 190px; overflow: hidden; background: var(--fill); }
.ci .ci-pic img { width: 100%; height: 100%; object-fit: cover; }
.ci .ci-body { padding: 16px 18px 18px; }
.ci-title { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.genre { margin-top: 6px; }
.mono { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 750; font-size: 15px; background: var(--fill); color: var(--ink2); }
.chipbar { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 4px; padding: 2px 16px 8px; scrollbar-width: none; position: sticky; top: calc(6px + env(safe-area-inset-top)); z-index: 20; }
.chipbar::-webkit-scrollbar { display: none; }
.chipbar .tog { flex: none; }

/* misc feedback */
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 18px; border-radius: 999px;
  font-size: 14.5px; font-weight: 600; background: var(--glass-hi); box-shadow: var(--glass-edge), var(--shadow-lg); animation: toast 2.4s var(--ease) both; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 14px) scale(.95); } 12%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 6px); } }
.burst { position: fixed; z-index: 95; pointer-events: none; }
.burst i { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); animation: burst .7s var(--ease) forwards; }
.burst i:nth-child(3n) { --c: var(--red); } .burst i:nth-child(3n+1) { --c: var(--gold); }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }
.pop-anim { animation: popOk .5s var(--spring); }
@keyframes popOk { 40% { transform: scale(1.05); } }
.ripple { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: currentColor; opacity: .25; pointer-events: none; animation: ripple .6s var(--ease) forwards; }
@keyframes ripple { to { transform: scale(30); opacity: 0; } }
.petals { position: fixed; inset: 0; z-index: 96; pointer-events: none; overflow: hidden; }
.petals i { position: absolute; top: -40px; width: 22px; height: 22px; color: var(--red); animation: fall var(--d) var(--dl) ease-in forwards; }
@keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
.bloom { width: 80px; height: 80px; margin: 0 auto 8px; color: var(--red); animation: bloom 1s var(--spring) both; }
@keyframes bloom { from { transform: scale(0) rotate(-90deg); } }
.flower { width: 40px; height: 40px; color: var(--red); flex: none; }

/* entrance */
.enter { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; animation-timing-function: var(--ease); }

/* ring in listen & repeat */
.lr-text { text-align: center; margin: 14px 0 6px; min-height: 120px; }
.lr-text .ms { font-family: var(--display); font-size: 26px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -.02em; }
.ring { width: 96px; height: 96px; margin: 10px auto; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .bg { stroke: var(--fill); } .ring .fg { stroke: var(--accent); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 650; color: var(--ink2); }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; }

@media (min-width: 700px) {
  .wcard { flex-basis: 70%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
