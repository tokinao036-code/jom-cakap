  rev.sort((a, b) => S.srs[a].due - S.srs[b].due);
  // new cards: lesson order, words before slang, forward before reverse
  const ord = id => { const [iid, dir] = id.split('|'), it = ITEMS[iid]; return [LESSONS.indexOf(LBY[it.lesson]), it.kind === 's' ? 1 : 0, Number(iid.split('.')[1].slice(1)), dir === 'r' ? 1 : 0]; };
  neu.sort((a, b) => { const x = ord(a), y = ord(b); for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; });
  return { rev, neu: neu.slice(0, newLeft()), neuAll: neu.length };
}
function nextIvl(c, g) {
  if (g === 0) return 0;
  if (g === 1) return c.reps === 0 ? 1 : Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
  return c.reps === 0 ? 2 : c.reps === 1 ? 4 : Math.max(c.ivl + 1, Math.round(c.ivl * c.ef));
}
function grade(id, g) {
  const c = S.srs[id], t = dayNum();
  if (c.n) { c.n = 0; newLeft(); S.newLog.n++; }
  const ivl = nextIvl(c, g);
  if (g === 0) { c.ef = Math.max(1.3, c.ef - 0.2); c.reps = 0; c.lapses++; }
  else { c.ef = g === 1 ? Math.max(1.3, c.ef - 0.15) : Math.min(3, c.ef + 0.05); c.reps++; }
  c.ivl = ivl; c.due = t + ivl; c.last = t;

}

/* ---------------- tap a word: exact meaning from the lexicon ---------------- */
const LEX = D.lex || { w: {}, p: {} };
const WRE = /[A-Za-zÀ-ÿ'’-]+/g;
const wkey = w => w.toLowerCase().replace(/^[-'’]+|[-'’]+$/g, '');
/** Escape a Malay string and wrap every known word in a tappable span. */
function tw(s) {

  for (const m of s.matchAll(WRE)) {
    const w = m[0], k = wkey(w);
    out += esc(s.slice(last, m.index)) + (LEX.w[k] ? `<span class="w" data-w="${esc(k)}">${esc(w)}</span>` : esc(w));
    last = m.index + w.length;
  }
  return out + esc(s.slice(last));
}

/* ---------------- practice: choose, build, listen & repeat, reply ---------------- */
const Practice = {
  start(L) {

    const tasks = [
      ...words.map(w => ({ t: 'choose', w, opts: shuffle([w.ru, ...shuffle(L.words.filter(x => x !== w)).slice(0, 3).map(x => x.ru)]) })),

        <div class="row" style="justify-content:center;gap:10px"><button class="btn ghost small" data-act="pr-again">Ещё раз</button><button class="btn small" data-act="step" data-i="${SI.test}">К тесту ${I.next}</button></div></div>`;

    if (k.t === 'build') html = `<div class="card"><div class="ex-q">Соберите фразу</div><div class="ex-prompt" style="font-size:20px">${esc(k.b.ru)}</div>
      <div class="answer-line" id="ans"></div><div class="tiles">${k.tiles.map((t, j) => `<button class="tile" data-act="pr-tile" data-j="${j}">${esc(t)}</button>`).join('')}</div>
      <div class="row" style="margin-top:16px;gap:10px"><button class="btn ghost small" data-act="pr-clear">Сбросить</button><button class="btn small grow" data-act="pr-check">Проверить</button></div><div id="fb"></div></div>`;
    if (k.t === 'listen') html = `<div class="card center"><div class="ex-q">Послушайте и повторите вслух</div>
      <button class="big-play" data-act="pr-listen" id="bigPlay">${I.resume}</button><div class="phase" id="phase">Нажмите — фраза прозвучит дважды, между повторами пауза для вас</div>
      <div id="lt" class="hidden" style="margin-top:12px"><div class="ms" style="font-size:20px">${tw(k.ms)}</div><div class="tr">${esc(k.tr)}</div><div class="muted small">${esc(k.ru)}</div></div>
      <div class="row" style="justify-content:center;gap:10px;margin-top:16px"><button class="btn ghost small" data-act="pr-show">Показать текст</button><button class="btn small" data-act="pr-next">Готово ${I.next}</button></div></div>`;
    if (k.t === 'reply') html = `<div class="card"><div class="ex-q">Ответьте на реплику</div><div class="bub" data-act="say" data-t="${esc(k.r.p)}" data-v="f" style="max-width:100%"><span class="pl">${I.resume}</span><div class="ms">${tw(k.r.p)}</div><span class="tr">${esc(k.r.pTr)}</span><div class="ru">${esc(k.r.pRu)}</div></div>
      <div class="opts">${k.r.o.map((o, j) => `<button class="opt" data-act="pr-reply" data-j="${j}">${esc(o)}<span class="tr">${esc(k.r.oTr[j])}</span></button>`).join('')}</div><div id="fb"></div></div>`;
    box.innerHTML = dots + html;
    k.ans = [];
    if (k.t === 'choose' && S.settings.autoplay) play(k.w.say || k.w.ms, 'f');
  },
  answer(ok, el, why, right) {
    const k = this.tasks[this.i];
    if (this.res[this.i] === undefined) this.res[this.i] = ok;
    if (ok && el) burst(el);
    $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><b>${ok ? 'Верно!' : 'Не совсем.'}</b>${right ? `Правильно: <b style="display:inline">${esc(right)}</b>. ` : ''}${esc(why || '')}</div>
      <button class="btn block" style="margin-top:12px" data-act="pr-next">Дальше ${I.next}</button>`;
    if (k.t === 'build' || k.t === 'reply') play(k.t === 'build' ? k.b.ms : k.r.o[k.r.a], k.t === 'build' ? 'f' : 'm');

const clean = s => s.replace(/[.,?!]/g, '');
const norm = s => clean(s).toLowerCase().replace(/\s+/g, ' ').trim();

  },
  show() {

        <div class="row" style="justify-content:center;gap:10px"><button class="btn ghost small" data-act="ts-again">Ещё раз</button><button class="btn small" data-act="step" data-i="${SI.finish}">К итогам ${I.next}</button></div></div>`;

/* ---------------- listen & repeat (sheet) ---------------- */
const LR = {
  items: [], i: 0, tok: 0, rate: 1, paused: false, el: null,
  open(items, title) {
    this.close(true);
    this.items = items; this.i = 0; this.rate = 1; this.paused = false; this.title = title;
    const o = document.createElement('div'); o.className = 'overlay'; o.id = 'lr';
    o.innerHTML = `<div class="sheet"><div class="grab"></div><div class="row between"><div><div class="kicker">Слушать и повторять</div><b>${esc(title)}</b></div><button class="icon-btn" data-act="lr-close" aria-label="Закрыть">${I.x}</button></div>
      <div class="lr-text" id="lrText"></div><div class="phase" id="lrPhase"></div><div class="ring" id="lrRing"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="lrArc" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"/></svg><span id="lrRingT"></span></div>
      <div class="ctrls"><button class="icon-btn" data-act="lr-prev" aria-label="Назад">${I.back}</button><button class="big-play" style="width:64px;height:64px;margin:0" data-act="lr-pause" id="lrPause" aria-label="Пауза">${I.pause}</button><button class="icon-btn" data-act="lr-next" aria-label="Дальше">${I.next}</button><button class="icon-btn" data-act="lr-rate" id="lrRate" style="width:auto;padding:0 12px;font-weight:800">1×</button></div>
      <p class="faint small center" style="margin:12px 0 0">Фраза звучит → пауза для вашего повтора вслух → фраза звучит снова.</p></div>`;
    o.addEventListener('click', e => { if (e.target === o) this.close(); });
    document.body.appendChild(o); this.el = o;
    this.run();
  },
  close(silent) { this.tok++; stopAudio(); const o = $('#lr'); if (o) o.remove(); this.el = null; if (!silent) { /* nothing else */ } },
  async run() {
    const tok = ++this.tok;
    while (this.el && tok === this.tok && this.i < this.items.length) {
      const it = this.items[this.i];
      this.paint(it, 'Слушайте', 0);
      const t0 = performance.now();
      await play(it.say || it.ms, it.v || 'f', this.rate);
      if (tok !== this.tok) return;
      const pause = Math.min(9000, Math.max(1800, (performance.now() - t0) * 1.25 + 900));
      this.paint(it, 'Ваша очередь: повторите вслух', pause);
      await this.wait(pause, tok);
      if (tok !== this.tok) return;
      this.paint(it, 'Ещё раз — сравните', 0);
      await play(it.say || it.ms, it.v || 'f', this.rate);
      if (tok !== this.tok) return;
      await this.wait(800, tok);
      if (tok !== this.tok) return;
      this.i++;
    }
    if (this.el && tok === this.tok) { $('#lrText').innerHTML = `<div class="flower" style="width:64px;height:64px;margin:0 auto">${FLOWER}</div><div class="ms">Bagus!</div><div class="muted">Готово: ${this.items.length} ${plural(this.items.length, 'фраза', 'фразы', 'фраз')}</div>`; $('#lrPhase').textContent = ''; $('#lrRing').classList.add('hidden'); mark('listen'); }
  },
  wait(ms, tok) {
    const arc = $('#lrArc'), t = $('#lrRingT'), start = performance.now();
    return new Promise(res => {
      const tick = () => {
        if (tok !== this.tok || !this.el) return res();
        const p = Math.min(1, (performance.now() - start) / ms);
        if (arc) arc.style.strokeDashoffset = String(327 * p);
        if (p >= 1) return res();
        requestAnimationFrame(tick);
      };
      if (t) t.textContent = ms > 1000 ? 'говорите' : '';
      tick();
    });
  },
  paint(it, phase, pause) {
    if (!this.el) return;
    $('#lrText').innerHTML = `<div class="faint tiny">${this.i + 1} / ${this.items.length}</div><div class="ms">${tw(it.ms)}</div><div class="tr">${esc(it.tr)}</div><div class="muted small">${esc(it.ru)}</div>`;
    $('#lrPhase').textContent = phase;
    $('#lrRing').classList.toggle('hidden', !pause);
    const arc = $('#lrArc'); if (arc) arc.style.strokeDashoffset = '0';
    $('#lrRingT').textContent = '';
  },
  jump(d) { this.i = Math.max(0, Math.min(this.items.length - 1, this.i + d)); this.paused = false; $('#lrPause').innerHTML = I.pause; stopAudio(); this.run(); },
  toggle() { if (this.paused) { this.paused = false; $('#lrPause').innerHTML = I.pause; this.run(); } else { this.paused = true; this.tok++; stopAudio(); $('#lrPause').innerHTML = I.resume; $('#lrPhase').textContent = 'Пауза'; } },
};

/* ---------------- dialog player ---------------- */
async function playDialog(L) {
  const tok = ++LR.tok;
  const bubs = $$('#chat .bub');
  for (let i = 0; i < L.dialog.lines.length; i++) {
    if (tok !== LR.tok || !bubs[i] || !document.body.contains(bubs[i])) return;
    bubs[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
    await play(L.dialog.lines[i].ms, L.dialog.lines[i].v, 1, bubs[i]);
    await sleep(350);
  }
}

}

/* ---------------- DICTIONARY (Kamus): every word in the app, A–Z ---------------- */
let DICT = null;
function dictData() {
  if (DICT) return DICT;
  const by = new Map(), add = (k, e) => { if (k && !by.has(k)) by.set(k, e); };
  for (const L of LESSONS) {
    L.words.forEach(w => add(w.ms.toLowerCase(), { ms: w.ms, tr: w.tr, ru: w.ru, L, ex: w.ex, exTr: w.exTr, exRu: w.exRu, say: w.say || w.ms }));
    L.slang.forEach(x => add(x.ms.toLowerCase(), { ms: x.ms, tr: x.tr, ru: x.ru, L, ex: x.ex, exTr: x.exTr, exRu: x.exRu, say: x.say, slang: 1 }));
    L.reading.gloss.forEach(g => add(g.ms.toLowerCase(), { ms: g.ms, tr: g.tr, ru: g.ru, L, say: g.ms }));
  }
  // every other word form met in the app's texts; names of people are not vocabulary
  for (const [k, [ru, trn]] of Object.entries(LEX.w)) if (!/\((имя|фамилия)\)$/.test(ru)) add(k, { ms: k, tr: trn, ru, say: k });
  const sortKey = e => e.ms.toLowerCase().replace(/^[^a-z]+/, '');
  DICT = [...by.values()].sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'ms'));
  DICT.forEach((e, i) => { e.i = i; e.letter = (sortKey(e)[0] || '#').toUpperCase(); e.hay = (e.ms + ' ' + e.ru).toLowerCase(); });
  return DICT;
}
const KS = { q: '', only: false };
function dictRows() {
  const q = KS.q.trim().toLowerCase();
  const list = dictData().filter(e => (!KS.only || e.L) && (!q || e.hay.includes(q)));
  if (!list.length) return '<p class="muted small center" style="margin-top:20px">Ничего не найдено</p>';
  let out = '', cur = '';
  for (const e of list) {
    if (e.letter !== cur) { out += `${cur ? '</div>' : ''}<div class="dl" id="L-${e.letter}">${e.letter}</div><div class="card dict">`; cur = e.letter; }
    out += `<div class="dw" data-act="dict" data-i="${e.i}"><div class="grow"><b>${esc(e.ms)}</b> <span class="tr">${esc(e.tr)}</span><div class="muted small">${esc(e.ru)}</div></div>${e.L ? `<span class="chip" style="--c:${stageOf(e.L).color}">${e.slang ? 'сленг · ' : ''}ур. ${e.L.n}</span>` : ''}</div>`;
  }
  return out + '</div>';
}

/* ---------------- motion: staggered entrance, count-up, bars, ripple, petals ---------------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function enhance(root) {
  if (!root) return;
  const kids = [...root.children].filter(el => !el.classList.contains('sticky') && el.id !== 'foot');
  kids.slice(0, 14).forEach((el, i) => { el.style.setProperty('--i', i); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); });
  // safety net: if the browser never runs the animation (hidden tab, power saving), content must not stay invisible
  setTimeout(() => { kids.forEach(el => el.classList.remove('enter')); root.classList.remove('slide-l', 'slide-r'); }, 1400);
  requestAnimationFrame(() => $$('.bar i[data-w]', root).forEach(b => { b.style.width = b.dataset.w + '%'; }));
  $$('[data-count]', root).forEach(el => {
    const to = Number(el.dataset.count); if (REDUCED || !to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 700;
    const tick = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function petals(n = 26) {

    p.style.left = `${Math.random() * 100}%`; p.style.setProperty('--d', `${2.4 + Math.random() * 2}s`); p.style.setProperty('--dl', `${Math.random() * .8}s`);
    p.style.setProperty('--x', `${(Math.random() - .5) * 160}px`); p.style.setProperty('--r', `${(Math.random() - .5) * 720}deg`);
    p.innerHTML = FLOWER; box.appendChild(p);

}

  }
  if (e.target.id === 'dictSearch') { KS.q = e.target.value; clearTimeout(wTimer); wTimer = setTimeout(() => { $('#dictList').innerHTML = dictRows(); }, 120); return; }
  if (e.target.id === 'cardSearch') { const ids = Object.keys(S.srs).filter(id => id.endsWith('|f')).map(id => id.slice(0, -2)).filter(id => ITEMS[id]); $('#cardList').innerHTML = cardRows(ids, e.target.value.toLowerCase().trim()); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'impFile' && e.target.files[0]) { const r = new FileReader(); r.onload = () => importState(r.result); r.readAsText(e.target.files[0]); }
});

/* ---------------- boot ---------------- */
function boot() {
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); });
  $('#nav').innerHTML = '<span class="pill"></span>' + NAV.map(([r, t]) => `<a href="#/${r}" data-r="${r}">${I[r]}<span>${t}</span></a>`).join('');
  const amb = document.createElement('div'); amb.id = 'amb'; amb.innerHTML = '<div class="layer"></div><div class="layer"></div><div class="tint"></div>'; document.body.prepend(amb);
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      let w = null; try { w = localStorage.getItem('jomcakap:warm'); } catch (e) { /* ignore */ }
      if (w !== window.BUILD && navigator.onLine) setTimeout(warm, 3000);
    }).catch(() => { /* offline mode unavailable */ });
  }
}
boot();

</script>
