23.jpg","file":"Mee goreng mamak 20231114 133123.jpg","lic":"CC0","cap":"Ми горенг мамак"},"c_rotijohn":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Street_stall_roti_john.jpg/960px-Street_stall_roti_john.jpg","file":"Street stall roti john.jpg","lic":"CC BY-SA 4.0","cap":"Роти Джон"},"c_lekor":{"url":"https://upload.wikimedia.org/wikipedia/commons/5/51/Keropok_lekor_in_Terengganu%2C_Malaysia.jpg","file":"Keropok lekor in Terengganu, Malaysia.jpg","lic":"CC BY-SA 2.0","cap":"Кропок лекор, Тренгану"},"c_percik":{"url":"https://upload.wikimedia.org/wikipedia/commons/d/d6/AyamPercikKelantan.jpg","file":"AyamPercikKelantan.jpg","lic":"CC BY-SA 4.0","cap":"Аям перчик, Келантан"},"c_ketupat":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Ketupat_weaving_1.jpg/960px-Ketupat_weaving_1.jpg","file":"Ketupat weaving 1.jpg","lic":"CC BY-SA 4.0","cap":"Плетение кетупата"},"c_wau":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Wau_di_Pesta_Flora_Kelantan_2023.jpg/960px-Wau_di_Pesta_Flora_Kelantan_2023.jpg","file":"Wau di Pesta Flora Kelantan 2023.jpg","lic":"CC BY-SA 4.0","cap":"Воздушный змей вау"},"c_silat":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Silat_Melayu.jpg/960px-Silat_Melayu.jpg","file":"Silat Melayu.jpg","lic":"CC BY-SA 4.0","cap":"Силат Мелаю"},"c_wayang":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Wayang_Kulit_Kelantan-Patani.jpg/960px-Wayang_Kulit_Kelantan-Patani.jpg","file":"Wayang Kulit Kelantan-Patani.jpg","lic":"CC BY-SA 4.0","cap":"Театр теней ваянг кулит"},"c_songket":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Menenun_songket_asli_20241116_111954.jpg/960px-Menenun_songket_asli_20241116_111954.jpg","file":"Menenun songket asli 20241116 111954.jpg","lic":"CC BY-SA 4.0","cap":"Ткачество сонгкета"},"c_takraw":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Sepak_Takraw_%283828519859%29_%28cropped%29.jpg/960px-Sepak_Takraw_%283828519859%29_%28cropped%29.jpg","file":"Sepak Takraw (3828519859) (cropped).jpg","lic":"CC BY 2.0","cap":"Сепак такрау"},"c_congkak":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Congkak_board_at_D%27Lagoon_chalet_in_Perhentian_Islands.jpg/960px-Congkak_board_at_D%27Lagoon_chalet_in_Perhentian_Islands.jpg","file":"Congkak board at D'Lagoon chalet in Perhentian Islands.jpg","lic":"CC BY-SA 4.0","cap":"Доска для игры конгкак"},"c_keris":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Silat_Melayu_Keris_Lok_9.JPG/960px-Silat_Melayu_Keris_Lok_9.JPG","file":"Silat Melayu Keris Lok 9.JPG","lic":"CC BY-SA 4.0","cap":"Крис в силате"},"c_batucaves":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Thaipusam_2025_Sri_Subramaniar_Swamy_Temple_and_Crowds_at_Batu_Caves_%28250211%29.jpg/960px-Thaipusam_2025_Sri_Subramaniar_Swamy_Temple_and_Crowds_at_Batu_Caves_%28250211%29.jpg","file":"Thaipusam 2025 Sri Subramaniar Swamy Temple and Crowds at Batu Caves (250211).jpg","lic":"CC BY-SA 4.0","cap":"Тайпусам у пещер Бату"},"c_gawai":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Gawai_Dayak_2024_-_09.jpg/960px-Gawai_Dayak_2024_-_09.jpg","file":"Gawai Dayak 2024 - 09.jpg","lic":"CC BY-SA 4.0","cap":"Праздник Гавай, Саравак"},"c_kaamatan":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Penampang_Sabah_Unduk-Ngadau-2014-Finale-01.jpg/960px-Penampang_Sabah_Unduk-Ngadau-2014-Finale-01.jpg","file":"Penampang Sabah Unduk-Ngadau-2014-Finale-01.jpg","lic":"CC BY-SA 3.0","cap":"Ундук Нгадау, праздник Кааматан"},"c_yeesang":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Yeesang.JPG/960px-Yeesang.JPG","file":"Yeesang.JPG","lic":"CC BY-SA 3.0","cap":"Йи-сан на Китайский Новый год"},"c_kolam":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Deepavali_Kolam_in_Malaysia.jpg/960px-Deepavali_Kolam_in_Malaysia.jpg","file":"Deepavali Kolam in Malaysia.jpg","lic":"CC BY 2.0","cap":"Коллам на Дипавали"},"c_melaka":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Melaka_Malaysia_Stadthuys-01.jpg/960px-Melaka_Malaysia_Stadthuys-01.jpg","file":"Melaka Malaysia Stadthuys-01.jpg","lic":"CC BY-SA 3.0","cap":"Мелака, Стадтхёйс"},"c_langkawi":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Makam_Mahsuri.jpg/960px-Makam_Mahsuri.jpg","file":"Makam Mahsuri.jpg","lic":"CC BY-SA 4.0","cap":"Гробница Махсури, Лангкави"},"c_ledang":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Gunung_Ledang_waterfall.jpg/960px-Gunung_Ledang_waterfall.jpg","file":"Gunung Ledang waterfall.jpg","lic":"Public domain","cap":"Гора Леданг"},"c_zapin":{"url":"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Zapin.jpg/960px-Zapin.jpg","file":"Zapin.jpg","lic":"CC BY-SA 2.0","cap":"Танец запин"}},"alphabet":[{"l":"a","r":"а","ex":"apa","ru":"что","note":"Как русское «а». В конце слова в Малайзии часто звучит ослабленно, почти «ə»: apa ≈ «апэ». В транскрипции пишем «а».","tr":"апа"},{"l":"e","r":"е","ex":"selamat","ru":"здравствуйте (в приветствиях)","note":"Чаще всего — короткий нейтральный звук, как безударный гласный в слове «мешок». Согласную перед ним НЕ смягчаем: «селамат» читаем как [сəламат].","tr":"селамат"},{"l":"e","r":"э","ex":"boleh","ru":"можно","note":"В части слов «e» открытое, как «э» в слове «это». Мы всегда пишем такие слова через «э». Также «э» в начале слова: esok — «эсо'».","tr":"болэх"},{"l":"i","r":"и","ex":"kita","ru":"мы (включая вас)","note":"Как «и». Сочетание ia читаем «ия»: Rusia — «русия», dia — «дия».","tr":"кита"},{"l":"o","r":"о","ex":"orang","ru":"человек","note":"Как «о», без перехода в «а»: всегда чёткое «о».","tr":"оранг"},{"l":"u","r":"у","ex":"satu","ru":"один","note":"Как «у».","tr":"сату"},{"l":"c","r":"ч","ex":"cakap","ru":"говорить","note":"Всегда «ч», никогда не «к» и не «ц».","tr":"чакап"},{"l":"j","r":"дж","ex":"jumpa","ru":"встречать","note":"Слитное «дж», как в слове «джем».","tr":"джумпа"},{"l":"sy","r":"ш","ex":"syarikat","ru":"компания","note":"Как «ш». Часто в словах из арабского: syarikat ← شركة.","tr":"шарикат"},{"l":"kh","r":"х","ex":"khabar","ru":"новость, дела","note":"Арабский звук خ, как русское «х». Тот же, что в татарском «хәбәр».","tr":"хабар"},{"l":"ng","r":"нг","ex":"dengan","ru":"с (кем-то)","note":"ОДИН носовой звук, как в английском sing: язык не касается зубов, отдельного «г» нет.","tr":"денган"},{"l":"ngg","r":"нгг","ex":"tinggal","ru":"жить, оставаться","note":"Тот же носовой звук плюс настоящее «г»: тин-ггал.","tr":"тинггал"},{"l":"ny","r":"нь","ex":"banyak","ru":"много","note":"Мягкое «нь», как в слове «няня»: banyak — «баня'».","tr":"баня'"},{"l":"y","r":"й","ex":"saya","ru":"я","note":"«й»; ya, yu пишем как «я», «ю»: saya — «сая».","tr":"сая"},{"l":"w","r":"в","ex":"wang","ru":"деньги","note":"Губной звук, как английское w: губы округлены, зубы губу не касаются.","tr":"ванг"},{"l":"h","r":"х","ex":"rumah","ru":"дом","note":"Лёгкий выдох, мягче русского «х». В конце слова тоже звучит: rumah — «румах».","tr":"румах"},{"l":"r","r":"р","ex":"rakan","ru":"коллега, друг","note":"Раскатистое или мягкое «р». В Куала-Лумпуре на конце слова часто почти пропадает: pasar ≈ «паса».","tr":"ракан"},{"l":"k (в конце)","r":"'","ex":"tidak","ru":"не","note":"В конце слова «k» не произносят как «к»: голос резко обрывается (гортанная смычка). Обозначаем апострофом: тида'.","tr":"тида'"},{"l":"g","r":"г","ex":"pagi","ru":"утро","note":"Всегда твёрдое «г».","tr":"паги"},{"l":"ai","r":"ай","ex":"pakai","ru":"носить, использовать","note":"В конце слова — «ай». Внутри слова часто два слога: baik — «ба-и'».","tr":"пакай"},{"l":"au","r":"ау","ex":"pulau","ru":"остров","note":"«ау» одним слогом в конце слова.","tr":"пулау"}],"readTips":["Ударение слабое и обычно падает на предпоследний слог. Не выделяйте его сильно — малайская речь звучит ровно.","Буквы читаются почти всегда одинаково: выучив таблицу, вы сможете прочитать любое слово.","Двойная гласная не тянется: kerajaan — «кера-джа-ан», два отдельных «а».","Дефис — это повтор слова: sama-sama, kanak-kanak. Читаем оба раза полностью."],"sources":[{"title":"Colloquial Malay: The Complete Course for Beginners","who":"Zaharah Othman, Routledge, 2-е изд. (2012, переиздания)","why":"Автор — малайзийский преподаватель, курс построен на современной разговорной речи Малайзии. 16 уроков: диалоги из жизни, грамматика без жаргона, культурные заметки, бесплатное аудио от носителей. Отсюда взяты логика подачи «ситуация → диалог → правило» и разговорный регистр.","url":"https://www.routledge.com/Colloquial-Malay-The-Complete-Course-for-Beginners/Othman/p/book/9781138958609"},{"title":"Bahasa Melayu Komunikasi 1 и 2 (курс MPU)","who":"Обязательный курс малайского для иностранных студентов вузов Малайзии","why":"Ровно ваша ситуация: международный студент в Малайзии. 14-недельный модуль: кампус, общежитие, транспорт, магазин, базовая письменная речь. Единого учебника нет (вузы пишут свои модули), поэтому берём структуру и темы, а не тексты. По нему построен «университетский» блок программы.","url":"https://en.wikipedia.org/wiki/Mata_Pelajaran_Umum"},{"title":"Complete Malay (Teach Yourself)","who":"Christopher Byrnes, Tam Lye Suan, Eva Nyimas; Hodder / John Murray","why":"Ведёт от нуля до уровня B2: работа, город, ресторан, врач. Хорошая последовательность грамматики (аффиксы ber-, meN-, di-) — по ней выстроена грамматическая линия месяцев 2–3. Один из соавторов говорит на индонезийском, поэтому лексику сверяем по малайзийским нормам.","url":"https://www.langcen.cam.ac.uk/resources/langm/data/my_113.html"},{"title":"Speak Standard Malay / Malay for Daily Use","who":"Liaw Yock Fang, Marshall Cavendish","why":"Пособия по стандартному (baku) малайскому для иностранцев от известного лингвиста. Опора для точных формулировок правил и нейтрального делового регистра.","url":"https://e-flt.nus.edu.sg/v5n12008/rev_sew.pdf"},{"title":"Нормы: Tatabahasa Dewan, словарь PRPM (DBP) и правила деловой переписки","who":"Dewan Bahasa dan Pustaka; руководства по surat rasmi (Arkib Negara, вузы Малайзии)","why":"DBP — государственный регулятор малайского языка в Малайзии. Его словарь (prpm.dbp.gov.my) и грамматика — арбитр в спорных случаях «малайзийское или индонезийское?». Руководства по официальным письмам дают структуру писем: PERKARA, «Dengan hormatnya», «Sekian, terima kasih».","url":"https://prpm.dbp.gov.my/"},{"title":"Дополнительно: Talk In Malay (онлайн)","who":"Онлайн-курс разговорного малайзийского","why":"Подходит для ежедневного аудирования живой речи с частицами lah, kan, je. Не основа программы: независимых обзоров мало, поэтому используем как тренажёр слуха.","url":"https://www.mezzoguild.com/online-malay-courses/"}],"principles":["Сначала речь, потом теория: каждое правило вытекает из диалога, который вы уже слышали.","Две линии параллельно: «быт и кампус» и «работа и протокол». С первой недели — обращения, визитки, письма.","Не больше 12 новых единиц в день. Остальное — повторение карточками (интервальное повторение).","Только малайзийская норма: слова сверены с DBP. Где Индонезия говорит иначе, это отмечено.","Арабский и татарский — ваши союзники: сотни малайских слов пришли из арабского (waktu, khabar, syarikat, maklum). Такие слова помечены."],"map":[{"w":1,"m":1,"t":"Быт и семья: первые слова","g":"Владелец после слова (emak saya), ada/tiada, описание после предмета, глагол без спряжения, kenapa/sebab, …tak?","r":"Рассказать о семье, доме, еде, своём дне, чувствах и хобби; купить на рынке; поговорить о погоде, днях недели и здоровье; попрощаться и поблагодарить."},{"w":2,"m":1,"t":"Знакомство и базовая речь","g":"Предложение без «быть», tidak/bukan, kami/kita, ini/itu, числа 0–10, время","r":"Представиться, обратиться по статусу, обменяться визитками и номерами, договориться о времени, заказать в мамаке."},{"w":3,"m":1,"t":"Город, кампус, офис, делегация","g":"sudah/belum/akan, di/ke/dari, принадлежность, sila/tolong, приставка ber-, регистры","r":"Доехать на Grab, поговорить с преподавателем, представиться на форуме, встретить делегацию, написать короткое официальное письмо."},{"w":4,"m":1,"t":"Дни, даты, планы","g":"Дни недели (Isnin, Selasa… — арабские корни), месяцы, даты; mahu/hendak/ingin; вопросы bila/berapa lama","r":"Назначить и перенести встречу, рассказать о планах на неделю, заполнить календарь мероприятия."},{"w":5,"m":1,"t":"Деньги, покупки, рынок","g":"Числа до миллиона, ringgit/sen, счётные слова (orang, buah, ekor, keping), lebih/kurang/paling","r":"Купить на рынке и в торговом центре, торговаться, сравнить цены. Контрольная месяца (уровень A1)."},{"w":6,"m":2,"t":"Жильё и здоровье","g":"Повелительное наклонение (-lah, jangan, cuba), ada/tiada, pernah","r":"Снять комнату, объясниться в клинике, вызвать мастера, поговорить с соседями."},{"w":7,"m":2,"t":"Глагол с meN- (1)","g":"meN-: mem-/men-/meng-/meny-; какие буквы «выпадают»; переходные глаголы","r":"Рассказать о рабочем дне, звонить по телефону, оставить сообщение."},{"w":8,"m":2,"t":"Биография и опыт","g":"pernah, baru, tadi, dulu; ke-…-an (kesihatan, kerajaan); связки kemudian, selepas itu","r":"Рассказать о себе на собеседовании, составить короткое резюме, описать прошлую поездку."},{"w":9,"m":2,"t":"Поручения на работе","g":"Суффиксы -kan и -i; boleh tolong + глагол; tolong + -kan","r":"Попросить и поручить, согласовать сроки, подтвердить выполнение. Контрольная месяца (A2)."},{"w":10,"m":3,"t":"Официальный стиль и пассив","g":"Пассив di- и ter-; «Mesyuarat akan diadakan…»; объявления и пресс-релизы","r":"Понимать объявления, повестки, новости Bernama, писать уведомления."},{"w":11,"m":3,"t":"Политика и экономика","g":"Существительные pe-, pe-…-an, per-…-an (pembangunan, perundingan, perjanjian)","r":"Говорить о торговле, инвестициях, ASEAN, отношениях Малайзии и России."},{"w":12,"m":3,"t":"Мнение и аргументы","g":"Menurut saya, pada pendapat saya; walaupun, oleh itu, namun; сравнение","r":"Участвовать в дискуссии на семинаре, вежливо не соглашаться."},{"w":13,"m":3,"t":"Презентация","g":"Структура выступления; peratus, meningkat, menurun; описание графиков","r":"Сделать 5-минутную презентацию с цифрами и ответить на вопросы."},{"w":14,"m":3,"t":"Совещание","g":"Agenda, minit mesyuarat, cadangan, keputusan; условные kalau/jika/sekiranya","r":"Вести и протоколировать совещание, онлайн-созвон."},{"w":15,"m":4,"t":"Приёмы и праздники","g":"Small talk, комплименты, восклицания; частицы kan, pun, je","r":"Поддержать беседу на приёме, open house на Hari Raya, Тахун Бару Чина, Дипавали, Гавай."},{"w":16,"m":4,"t":"Деловая переписка (2)","g":"Полная форма surat rasmi, memo, приглашение, ответ, отказ","r":"Написать официальное письмо, приглашение и вежливый отказ."},{"w":17,"m":4,"t":"Свободная речь: быт и работа","g":"Повторение аффиксов, разговорные сокращения и их нормы","r":"Ролевые игры без подготовки. Контрольная «4 месяца»: уверенное общение в быту и на работе."},{"w":18,"m":4,"t":"Дипломатическая лексика","g":"Kementerian Luar Negeri, perjanjian, memorandum persefahaman (MoU), hubungan dua hala; номинализация","r":"Обсуждать повестку двусторонних отношений и документы."},{"w":19,"m":5,"t":"Протокол высшего уровня","g":"YAB, YB, Tan Sri, Tuanku; основы bahasa istana (дворцовой речи): santap, beradu, berangkat","r":"Правильно обратиться к министру, депутату, члену королевской семьи."},{"w":20,"m":5,"t":"Речь на форуме","g":"Ucapan aluan, penghargaan, penutup; peribahasa (пословицы) для речей","r":"Произнести приветственное слово на 3 минуты."},{"w":21,"m":5,"t":"Переговоры","g":"Cadangan, tawaran, bersetuju, mempertimbangkan; вежливый отказ и компромисс","r":"Вести переговоры, фиксировать договорённости."},{"w":22,"m":5,"t":"СМИ и интервью","g":"Kenyataan media, sidang media; цитирование: menurut, katanya","r":"Дать короткий комментарий журналисту, читать Berita Harian и Bernama."},{"w":23,"m":5,"t":"Финал: визит делегации","g":"Повторение всего курса","r":"Симуляция: встреча делегации, переговоры, письмо-итог, выступление. Самооценка B1+ / B2."}]},"lessons":[{"id":"b1","img":"f_living","meme":["m_catmug"],"ms":"Keluarga saya","title":"Моя семья","goal":"Назвать членов семьи, представить родственника и спросить «кто это?».","can":["Сказать «мама, папа, брат, сестра, бабушка» по-малайски","Представить: «Это мой старший брат»","Спросить «Кто это?»","Понимать, как малайцы называют старших и младших"],"words":[{"ms":"keluarga","ru":"семья","ex":"Ini keluarga saya.","exRu":"Это моя семья.","use":"И своя семья, и вся большая родня. Самое тёплое слово урока. Корень — из санскрита: kula «род».","tr":"келуарга","exTr":"ини келуарга сая."},{"ms":"emak","ru":"мама","ex":"Emak saya orang Malaysia.","exRu":"Моя мама — малайзийка.","use":"Дома говорят «emak» или «mak», вежливо и в письме — «ibu», многие дети говорят «mama».","tr":"эма'","exTr":"эма' сая оранг малайсия."},{"ms":"ayah","ru":"папа","ex":"Ayah saya dari Kazan.","exRu":"Мой папа из Казани.","use":"Нейтрально и тепло. Официально — «bapa», разговорно — «abah» или «papa».","tr":"аях","exTr":"аях сая дари казань."},{"ms":"abang","ru":"старший брат","ex":"Ini abang saya, Aiman.","exRu":"Это мой старший брат, Айман.","use":"Так же вежливо зовут любого парня чуть старше: продавца, водителя («bang»).","tr":"абанг","exTr":"ини абанг сая, айман."},{"ms":"kakak","ru":"старшая сестра","ex":"Kakak saya belajar di Kuala Lumpur.","exRu":"Моя старшая сестра учится в Куала-Лумпуре.","use":"Обращение к девушке чуть старше: «kak».","tr":"кака'","exTr":"кака' сая беладжар ди куала лумпур."},{"ms":"adik","ru":"младший брат или сестра","ex":"Nurin adik saya.","exRu":"Нурин — моя младшая сестра.","use":"Одно слово для обоих полов. Уточнить: adik lelaki (брат), adik perempuan (сестра).","tr":"ади'","exTr":"нурин ади' сая."},{"ms":"nenek","ru":"бабушка","ex":"Nenek tinggal di kampung.","exRu":"Бабушка живёт в деревне.","use":"Ласково — «Tok» или «Opah» (зависит от штата).","tr":"нэнэ'","exTr":"нэнэ' тинггал ди кампунг."},{"ms":"atuk","ru":"дедушка","ex":"Atuk suka minum kopi.","exRu":"Дедушка любит пить кофе.","use":"Разговорная форма слова «datuk» (дед). Не путайте с почётным титулом Datuk из урока про обращения!","tr":"ату'","exTr":"ату' сука минум копи."},{"ms":"anak","ru":"ребёнок; сын, дочь","ex":"Mak Long ada dua anak.","exRu":"У тёти двое детей.","use":"anak lelaki — сын, anak perempuan — дочь.","tr":"ана'","exTr":"ма' лонг ада дуа ана'."},{"ms":"sepupu","ru":"двоюродный брат, сестра","ex":"Aiman dan Nurin sepupu saya.","exRu":"Айман и Нурин — мои двоюродные.","use":"Двоюродных в Малайзии обычно очень много — и все близкие.","tr":"сепупу","exTr":"айман дан нурин сепупу сая."},{"ms":"Mak Long","ru":"тётя (старшая сестра мамы или папы)","ex":"Mak Long masak rendang.","exRu":"Тётя готовит ренданг.","use":"Long — «старший»: Mak Long — самая старшая тётя, Pak Long — её муж или старший дядя. Тётю по имени не зовут.","tr":"ма' лонг","exTr":"ма' лонг маса' ренданг."},{"ms":"Siapa ini?","ru":"Кто это?","ex":"Siapa ini? Ini atuk saya.","exRu":"Кто это? Это мой дедушка.","use":"Показывая на фото или человека рядом. Вежливо: «Ini siapa, ya?»","tr":"сияпа ини?","exTr":"сияпа ини? ини ату' сая."}],"rule":{"title":"Чей? Владелец стоит после","ref":"g-poss","text":["«Мой брат» по-малайски — «брат мой»: abang saya. Сначала кто, потом чей.","«Это мой брат» — Ini abang saya: ini + человек + владелец. Глагола «быть» нет, как вы уже знаете."],"ex":[{"ms":"Ini emak saya.","ru":"Это моя мама.","tr":"ини эма' сая."},{"ms":"Ayah Nurin dari Shah Alam.","ru":"Папа Нурин — из Шах-Алама.","tr":"аях нурин дари шах алам."},{"ms":"Siapa nama adik awak?","ru":"Как зовут твоего младшего брата (сестру)?","tr":"сияпа нама ади' ава'?"}],"mistake":"Сказать «saya emak» по-русски «моя мама». Это значит «я — мама». Владелец всегда после.","cmp":"Как в русском «мама Саши»: сначала кто, потом чей. Малайский так говорит и про «мою маму»."},"dialog":{"scene":"Шах-Алам, дом тёти. Саша только что приехал(а) с вокзала.","img":"f_raya","lines":[{"n":"Mak Long","v":"f","ms":"Sasha! Selamat datang! Masuk, masuk.","ru":"Саша! Добро пожаловать! Заходи, заходи.","tr":"саша! селамат датанг! масу', масу'."},{"n":"Sasha","v":"m","ms":"Terima kasih, Mak Long. Ini rumah Mak Long?","ru":"Спасибо, тётя. Это ваш дом?","tr":"терима касих, ма' лонг. ини румах ма' лонг?"},{"n":"Mak Long","v":"f","ms":"Ya. Ini Pak Long, suami Mak Long.","ru":"Да. Это дядя, мой муж.","tr":"я. ини па' лонг, суами ма' лонг."},{"n":"Pak Long","v":"m2","ms":"Apa khabar, Sasha? Emak sihat?","ru":"Как дела, Саша? Мама здорова?","tr":"апа хабар, саша? эма' сихат?"},{"n":"Sasha","v":"m","ms":"Sihat, Pak Long. Emak kirim salam.","ru":"Здорова. Мама передаёт привет.","tr":"сихат, па' лонг. эма' кирим салам."},{"n":"Mak Long","v":"f","ms":"Ini anak-anak Mak Long, Aiman dan Nurin.","ru":"А это мои дети, Айман и Нурин.","tr":"ини ана'-ана' ма' лонг, айман дан нурин."},{"n":"Nurin","v":"f","ms":"Hai! Saya Nurin. Siapa ini dalam gambar?","ru":"Привет! Я Нурин. А кто это на фото?","tr":"хай! сая нурин. сияпа ини далам гамбар?"},{"n":"Sasha","v":"m","ms":"Ini ayah saya. Dia orang Tatar.","ru":"Это мой папа. Он татарин.","tr":"ини аях сая. дия оранг татар."}]},"slang":[{"ms":"mak","ru":"мама (коротко)","ex":"Mak, saya lapar!","exRu":"Мам, я есть хочу!","ok":"Дома, с родными и друзьями. Так говорят и взрослые люди о своей маме.","no":"В официальном тексте и при знакомстве со старшими — «ibu saya».","say":"mak","tr":"ма'","exTr":"ма', сая лапар!"},{"ms":"kirim salam","ru":"передать привет","ex":"Kirim salam pada emak, ya!","exRu":"Передавай привет маме!","ok":"Везде: в разговоре, в сообщениях, в конце звонка.","no":"Не подходит как приветствие самому человеку — это именно «передай привет».","say":"kirim salam","tr":"кирим салам","exTr":"кирим салам пада эма', я!"}],"build":[{"ru":"Это моя семья.","ms":"Ini keluarga saya.","extra":["itu","awak"],"tr":"ини келуарга сая."},{"ru":"Кто это?","ms":"Siapa ini?","extra":["apa","saya"],"tr":"сияпа ини?"},{"ru":"Мой папа из Казани.","ms":"Ayah saya dari Kazan.","extra":["emak","di"],"tr":"аях сая дари казань."}],"reply":[{"p":"Siapa ini?","pRu":"Кто это? (показывает на фото)","o":["Ini emak saya.","Saya emak.","Terima kasih."],"a":0,"why":"«Это моя мама». «Saya emak» значит «я — мама».","pTr":"сияпа ини?","oTr":["ини эма' сая.","сая эма'.","терима касих."]},{"p":"Awak ada abang?","pRu":"У тебя есть старший брат?","o":["Tidak, saya ada adik.","Abang saya awak.","Sama-sama."],"a":0,"why":"«Нет, у меня есть младший(ая)». ada — «есть, иметь».","pTr":"ава' ада абанг?","oTr":["тида', сая ада ади'.","абанг сая ава'.","сама-сама."]}],"test":[{"q":"«Моя мама» по-малайски:","o":["saya emak","emak saya","emak awak"],"a":1,"why":"Владелец после: emak saya."},{"q":"«Adik» — это…","o":["младший брат или сестра","только младший брат","старшая сестра"],"a":0,"why":"adik — для обоих полов."},{"q":"Как назвать старшую тётю?","o":["Mak Long","Kak Long","Nenek"],"a":0,"why":"Long — старший."},{"q":"«Atuk» — это…","o":["дедушка","почётный титул","папа"],"a":0,"why":"atuk — дедушка; Datuk с большой буквы — титул."},{"q":"«Kirim salam» значит…","o":["передать привет","здравствуйте","до свидания"],"a":0,"why":"kirim — отправить, salam — привет."},{"q":"Как спросить «Кто это?»","o":["Siapa ini?","Apa ini?","Ini siapa saya?"],"a":0,"why":"siapa — кто, apa — что."}],"culture":"У малайцев к родственникам обращаются по старшинству: Long — самый старший, Ngah — второй, Teh или Chik — средние, Su — самый младший. Поэтому тётю зовут Mak Long, а не по имени. Даже двоюродных старших зовут «abang» и «kakak».","story":"Саша прилетел(а) в Малайзию за месяц до семестра и живёт у маминой старшей сестры в Шах-Аламе. Первый вечер: тётя Mak Long, дядя Pak Long, двоюродные Айман и Нурин — и семейный альбом.","reading":{"title":"Gambar keluarga","kind":"Подписи в семейном альбоме","img":"f_living","words":32,"gloss":[{"ms":"guru","ru":"учитель","tr":"гуру"},{"ms":"dia","ru":"он, она","tr":"дия"},{"ms":"mereka","ru":"они","tr":"мерека"},{"ms":"tinggal","ru":"жить (где-то)","tr":"тинггал"},{"ms":"kami","ru":"мы, наш (без собеседника)","tr":"ками"}],"q":[{"q":"Кем работает папа Нурин?","o":["Учителем","Врачом","Студентом"],"a":0},{"q":"Где живут бабушка и дедушка?","o":["В деревне","В Куала-Лумпуре","В Казани"],"a":0},{"q":"Кто такой Оен?","o":["Кот","Младший брат","Дедушка"],"a":0}],"blocks":[{"h":"Нурин показывает альбом","v":"f","lines":[{"ms":"Ini keluarga saya.","ru":"Это моя семья.","tr":"ини келуарга сая."},{"ms":"Ini emak saya, Mak Long Sasha.","ru":"Это моя мама, тётя Саши.","tr":"ини эма' сая, ма' лонг саша."},{"ms":"Ini ayah saya. Dia guru.","ru":"Это мой папа. Он учитель.","tr":"ини аях сая. дия гуру."},{"ms":"Ini abang saya, Aiman. Dia pelajar.","ru":"Это мой старший брат Айман. Он студент.","tr":"ини абанг сая, айман. дия пеладжар."},{"ms":"Ini nenek dan atuk. Mereka tinggal di kampung.","ru":"Это бабушка и дедушка. Они живут в деревне.","tr":"ини нэнэ' дан ату'. мерека тинггал ди кампунг."},{"ms":"Dan ini kucing kami, Oyen!","ru":"А это наш кот, Оен!","tr":"дан ини кучинг ками, ойэн!"}]}]},"writing":[{"kind":"chat","title":"Сообщение маме","img":"f_living","task":"Мама спрашивает в WhatsApp, как вас встретили. Напишите 3–4 предложения: вы у тёти, кто живёт в доме, передайте привет.","from":{"n":"Emak","v":"f","ms":"Sasha dah sampai? Siapa ada di rumah Mak Long?","ru":"Саша, ты уже доехал(а)? Кто дома у тёти?","tr":"саша дах сампай? сияпа ада ди румах ма' лонг?"},"need":[["Обращение к маме",["mak","emak"]],["Члены семьи",["pak long","aiman","nurin","abang","adik","sepupu"]],["Слово «семья» или «дом»",["keluarga","rumah"]],["Привет",["salam"]]],"hint":[{"ms":"Saya dah sampai, mak.","ru":"Я уже приехал(а), мам.","tr":"сая дах сампай, ма'."},{"ms":"Di rumah ada …","ru":"Дома есть …","tr":"ди румах ада …"},{"ms":"Mak Long kirim salam.","ru":"Тётя передаёт привет.","tr":"ма' лонг кирим салам."}],"model":[{"ms":"Mak, saya dah sampai!","ru":"Мам, я уже приехал(а)!","tr":"ма', сая дах сампай!"},{"ms":"Di rumah ada Mak Long, Pak Long, Aiman dan Nurin.","ru":"Дома тётя, дядя, Айман и Нурин.","tr":"ди румах ада ма' лонг, па' лонг, айман дан нурин."},{"ms":"Keluarga Mak Long sangat baik.","ru":"Семья тёти очень хорошая.","tr":"келуарга ма' лонг сангат баи'."},{"ms":"Mereka kirim salam pada emak dan ayah.","ru":"Они передают привет тебе и папе.","tr":"мерека кирим салам пада эма' дан аях."}]},{"kind":"form","title":"Моя семья в трёх фразах","img":"f_raya","task":"Подпишите своё семейное фото: кто на нём и откуда эти люди. Используйте «Ini … saya».","need":[["Ini … saya",["ini"]],["Мама или папа",["emak","ayah","ibu","bapa","mama","papa"]],["Брат, сестра или бабушка",["abang","kakak","adik","nenek","atuk"]],["Откуда",["dari"]]],"hint":[{"ms":"Ini ayah saya. Dia dari Kazan.","ru":"Это мой папа. Он из Казани.","tr":"ини аях сая. дия дари казань."},{"ms":"Ini adik saya.","ru":"Это мой младший брат (сестра).","tr":"ини ади' сая."}],"model":[{"ms":"Ini keluarga saya.","ru":"Это моя семья.","tr":"ини келуарга сая."},{"ms":"Ini emak saya. Dia orang Malaysia.","ru":"Это моя мама. Она малайзийка.","tr":"ини эма' сая. дия оранг малайсия."},{"ms":"Ini ayah saya. Dia dari Kazan.","ru":"Это мой папа. Он из Казани.","tr":"ини аях сая. дия дари казань."},{"ms":"Ini nenek saya. Dia tinggal di kampung.","ru":"Это моя бабушка. Она живёт в деревне.","tr":"ини нэнэ' сая. дия тинггал ди кампунг."}]}],"n":1,"schema":{"pat":["x","s","p"],"rows":[[["x","Ini","это"],["s","abang","старший брат"],["p","saya","мой"]],[["x","Ini","это"],["s","emak","мама"],["p","Nurin","Нурин (чья)"]],[["s","Ayah","папа"],["p","saya","мой"],["l","dari Kazan","из Казани"]]],"note":"Сначала кто, потом чей. «Быть» не нужно: Ini abang saya — «Это брат мой»."},"week":1},{"id":"b2","img":"x_interior","meme":["m_hayya"],"ms":"Rumah kami","title":"Наш дом","goal":"Рассказать, какие комнаты есть в доме, где что находится и какой дом — большой или маленький.","can":["Назвать комнаты: кухня, ванная, гостиная","Сказать «есть / нет» с ada и tiada","Описать дом: большой, маленький, чистый","Спросить, где туалет, вежливо"],"words":[{"ms":"rumah","ru":"дом","ex":"Rumah Mak Long besar.","exRu":"Дом у тёти большой.","use":"И здание, и «дома»: «di rumah» — дома.","tr":"румах","exTr":"румах ма' лонг бесар."},{"ms":"bilik","ru":"комната","ex":"Ini bilik awak, Sasha.","exRu":"Это твоя комната, Саша.","use":"bilik tidur — спальня, bilik mesyuarat — переговорная (урок про офис).","tr":"били'","exTr":"ини били' ава', саша."},{"ms":"dapur","ru":"кухня","ex":"Mak Long di dapur.","exRu":"Тётя на кухне.","use":"Сердце малайского дома — здесь всегда кто-то готовит.","tr":"дапур","exTr":"ма' лонг ди дапур."},{"ms":"bilik air","ru":"ванная, туалет","ex":"Bilik air di sebelah dapur.","exRu":"Ванная рядом с кухней.","use":"Буквально «комната воды». В общественных местах — tandas.","tr":"били' аир","exTr":"били' аир ди себелах дапур."},{"ms":"ruang tamu","ru":"гостиная","ex":"Kita duduk di ruang tamu.","exRu":"Посидим в гостиной.","use":"Здесь принимают гостей — tamu (гость).","tr":"руанг таму","exTr":"кита дуду' ди руанг таму."},{"ms":"katil","ru":"кровать","ex":"Katil ini selesa.","exRu":"Эта кровать удобная.","use":"В Индонезии говорят «ranjang», в Малайзии — katil.","tr":"катил","exTr":"катил ини селэса."},{"ms":"kipas","ru":"вентилятор","ex":"Tolong buka kipas.","exRu":"Включи, пожалуйста, вентилятор.","use":"Потолочный вентилятор есть в каждой комнате. «Buka» — открыть, а про технику — включить.","tr":"кипас","exTr":"толонг бука кипас."},{"ms":"ada","ru":"есть, имеется","ex":"Di rumah ada tiga bilik.","exRu":"В доме три комнаты.","use":"И «есть, имеется», и «у меня есть»: «Saya ada kucing» — у меня есть кошка.","tr":"ада","exTr":"ди румах ада тига били'."},{"ms":"tiada","ru":"нет, не имеется","ex":"Di bilik ini tiada tingkap.","exRu":"В этой комнате нет окна.","use":"Разговорно — «tak ada» или «takde».","tr":"тияда","exTr":"ди били' ини тияда тингкап."},{"ms":"besar","ru":"большой","ex":"Dapur ini besar.","exRu":"Эта кухня большая.","tr":"бесар","exTr":"дапур ини бесар."},{"ms":"kecil","ru":"маленький","ex":"Bilik saya kecil tapi cantik.","exRu":"Моя комната маленькая, но красивая.","tr":"кечил","exTr":"били' сая кечил тапи чанти'."},{"ms":"bersih","ru":"чистый","ex":"Rumah ini sangat bersih.","exRu":"Этот дом очень чистый.","use":"Противоположность — kotor (грязный).","tr":"берсих","exTr":"румах ини сангат берсих."}],"rule":{"title":"Есть или нет: ada и tiada; описание после слова","ref":"g-order","text":["«Есть, имеется» — ada, «нет» — tiada (в речи tak ada). Ada ставят перед тем, что есть: ada tiga bilik — есть три комнаты.","Описание стоит после предмета: rumah besar — большой дом. А «Дом большой» — Rumah besar: смысл понятен из интонации, или говорят Rumah ini besar."],"ex":[{"ms":"Di dapur ada kipas.","ru":"На кухне есть вентилятор.","tr":"ди дапур ада кипас."},{"ms":"Saya tiada kereta.","ru":"У меня нет машины.","tr":"сая тияда керэта."},{"ms":"Bilik kecil itu bilik saya.","ru":"Та маленькая комната — моя.","tr":"били' кечил иту били' сая."}],"mistake":"Сказать «besar rumah» по русскому образцу «большой дом». По-малайски описание всегда после: rumah besar.","cmp":"Русское «у меня есть» — это одно слово ada: Saya ada… — «у меня есть…»."},"dialog":{"scene":"Нурин показывает Саше дом.","img":"x_woodhouse","lines":[{"n":"Nurin","v":"f","ms":"Ini ruang tamu. Itu dapur.","ru":"Это гостиная. А там кухня.","tr":"ини руанг таму. иту дапур."},{"n":"Sasha","v":"m","ms":"Rumah ini besar dan bersih!","ru":"Какой большой и чистый дом!","tr":"румах ини бесар дан берсих!"},{"n":"Nurin","v":"f","ms":"Ada empat bilik. Ini bilik awak.","ru":"Здесь четыре комнаты. Вот твоя.","tr":"ада эмпат били'. ини били' ава'."},{"n":"Sasha","v":"m","ms":"Bilik ini kecil, tapi selesa. Ada kipas?","ru":"Комната маленькая, но уютная. Вентилятор есть?","tr":"били' ини кечил, тапи селэса. ада кипас?"},{"n":"Nurin","v":"f","ms":"Ada. Panas sangat di Malaysia!","ru":"Есть. В Малайзии очень жарко!","tr":"ада. панас сангат ди малайсия!"},{"n":"Sasha","v":"m","ms":"Maaf, bilik air di mana?","ru":"Извини, а где ванная?","tr":"мааф, били' аир ди мана?"},{"n":"Nurin","v":"f","ms":"Di sebelah dapur. Jangan lupa buka kasut, ya!","ru":"Рядом с кухней. И не забудь снять обувь!","tr":"ди себелах дапур. джанган лупа бука касут, я!"}]},"slang":[{"ms":"takde","ru":"нету (коротко от tak ada)","ex":"Air takde, Mak Long!","exRu":"Воды нету, тётя!","ok":"Дома, с друзьями, в чатах. Звучит очень по-малайзийски.","no":"В письмах и официальной речи — «tiada» или «tidak ada».","say":"takde","tr":"такдэ","exTr":"аир такдэ, ма' лонг!"},{"ms":"best","ru":"классный","ex":"Bilik awak best!","exRu":"Классная у тебя комната!","ok":"С друзьями и ровесниками. Английское слово, ставшее малайским сленгом.","no":"В официальном отзыве — «sangat baik».","say":"best","tr":"бэст","exTr":"били' ава' бэст!"}],"build":[{"ru":"В доме три комнаты.","ms":"Di rumah ada tiga bilik.","extra":["tiada","besar"],"tr":"ди румах ада тига били'."},{"ru":"Моя комната маленькая.","ms":"Bilik saya kecil.","extra":["besar","awak"],"tr":"били' сая кечил."},{"ru":"Где ванная?","ms":"Bilik air di mana?","extra":["dapur","ke"],"tr":"били' аир ди мана?"}],"reply":[{"p":"Di bilik awak ada kipas?","pRu":"В твоей комнате есть вентилятор?","o":["Ada, terima kasih.","Kipas saya besar rumah.","Siapa ini?"],"a":0,"why":"Ответ на вопрос с ada — «Ada» (есть) или «Tiada» (нет).","pTr":"ди били' ава' ада кипас?","oTr":["ада, терима касих.","кипас сая бесар румах.","сияпа ини?"]},{"p":"Rumah awak di Kazan besar?","pRu":"Твой дом в Казани большой?","o":["Tidak, rumah saya kecil.","Besar rumah saya.","Bilik air."],"a":0,"why":"Описание после слова: rumah kecil.","pTr":"румах ава' ди казань бесар?","oTr":["тида', румах сая кечил.","бесар румах сая.","били' аир."]}],"test":[{"q":"«Большой дом» по-малайски:","o":["besar rumah","rumah besar","rumah ada besar"],"a":1,"why":"Описание после."} ое сочинение «Мой день»","img":"x_village","words":58,"gloss":[{"ms":"pagi","ru":"утро, утром","tr":"паги"},{"ms":"petang","ru":"день, после обеда","tr":"петанг"},{"ms":"malam","ru":"вечер, ночь","tr":"малам"},{"ms":"kerja sekolah","ru":"домашнее задание","tr":"керджа секолах"},{"ms":"naik bas","ru":"на автобусе","tr":"наи' бас"}],"q":[{"q":"Во сколько Нурин встаёт?","o":["В шесть","В семь","В десять"],"a":0},{"q":"Что Нурин делает сначала?","o":["Моется","Завтракает","Играет с котом"],"a":0},{"q":"Кто каждый день встаёт поздно?","o":["Айман","Мама","Оен"],"a":0}],"blocks":[{"h":"Сочинение Нурин для школы","v":"f","lines":[{"ms":"Setiap hari saya bangun pukul enam pagi.","ru":"Каждый день я встаю в шесть утра.","tr":"сетияп хари сая бангун пукул энам паги."},{"ms":"Saya mandi dulu, lepas itu gosok gigi.","ru":"Сначала я моюсь, потом чищу зубы.","tr":"сая манди дулу, лепас иту госо' гиги."},{"ms":"Saya pakai baju sekolah dan sarapan dengan emak.","ru":"Надеваю школьную форму и завтракаю с мамой.","tr":"сая пакай баджу секолах дан сарапан денган эма'."},{"ms":"Pukul tujuh saya pergi ke sekolah naik bas.","ru":"В семь еду в школу на автобусе.","tr":"пукул туджух сая перги ке секолах наи' бас."},{"ms":"Saya balik rumah pukul dua petang.","ru":"Возвращаюсь домой в два часа дня.","tr":"сая бали' румах пукул дуа петанг."},{"ms":"Petang saya buat kerja sekolah. Kadang-kadang saya main dengan Oyen.","ru":"Днём делаю уроки. Иногда играю с Оеном.","tr":"петанг сая буат керджа секолах. каданг-каданг сая маин денган ойэн."},{"ms":"Malam saya tidur pukul sepuluh.","ru":"Вечером ложусь в десять.","tr":"малам сая тидур пукул сепулух."},{"ms":"Abang saya? Dia bangun lambat setiap hari!","ru":"Мой брат? Он каждый день встаёт поздно!","tr":"абанг сая? дия бангун ламбат сетияп хари!"}]}]},"writing":[{"kind":"diary","title":"Мой день в Шах-Аламе","img":"x_village","task":"Напишите в дневник о своём дне: когда встали, что сделали сначала и потом, когда легли. Используйте dulu и lepas itu s":"Selamat tinggal, Shah Alam","title":"Прощание и подарки","goal":"Попрощаться с родными, поблагодарить за что-то, подарить подарок, попросить «не забывай» и пообещать приезжать.","can":["Различать selamat tinggal и selamat jalan","Сказать «спасибо за…»","Попросить: «не забудь», «береги себя»","Подарить подарок и принять его"],"words":[{"ms":"selamat tinggal","ru":"до свидания (говорит уходящий)","ex":"Selamat tinggal, Mak Long!","exRu":"До свидания, тётя!","use":"tinggal — «оставаться»: вы желаете благополучия тем, кто остаётся.","tr":"селамат тинггал","exTr":"селамат тинггал, ма' лонг!"},{"ms":"selamat jalan","ru":"счастливого пути (говорит остающийся)","ex":"Selamat jalan, Sasha! Hati-hati.","exRu":"Счастливого пути, Саша! Будь осторожен (осторожна).","use":"jalan — «дорога»: желают тому, кто уходит или уезжает.","tr":"селамат джалан","exTr":"селамат джалан, саша! хати-хати."},{"ms":"pindah","ru":"переезжать","ex":"Esok saya pindah ke asrama.","exRu":"Завтра я переезжаю в общежитие.","tr":"пиндах","exTr":"эсо' сая пиндах ке асрама."},{"ms":"barang","ru":"вещи, вещь","ex":"Barang awak banyak!","exRu":"Сколько у тебя вещей!","use":"Любые вещи, товары, багаж.","tr":"баранг","exTr":"баранг ава' баня'!"},{"ms":"hadiah","ru":"подарок","ex":"Ini hadiah untuk Mak Long.","exRu":"Это подарок для тёти.","ar":"هدية hadiyya — подарок","tr":"хадиях","exTr":"ини хадиях унту' ма' лонг."},{"ms":"beri","ru":"давать, дарить","ex":"Nenek beri saya kain batik.","exRu":"Бабушка подарила мне батик.","use":"Разговорно — bagi: «Bagi saya air, boleh?»","tr":"бери","exTr":"нэнэ' бери сая каин бати'."},{"ms":"ingat","ru":"помнить; думать о","ex":"Saya akan ingat keluarga ini.","exRu":"Я буду помнить эту семью.","use":"Ingat! — «Запомни!»; ingat-ingat — «помни».","tr":"ингат","exTr":"сая акан ингат келуарга ини."},{"ms":"jaga diri","ru":"береги себя","ex":"Jaga diri baik-baik di KL.","exRu":"Береги себя в КЛ.","use":"jaga — охранять, беречь; diri — себя.","tr":"джага дири","exTr":"джага ди ong","v":"f","ms":"Ya Allah, tak payah! Cantiknya. Terima kasih, sayang.","ru":"Ой, не стоило! Какой красивый. Спасибо, родной (родная).","tr":"я аллах, та' паях! чантикня. терима касих, саянг."},{"n":"Nurin","v":"f","ms":"Sasha, jangan lupa kami, tau!","ru":"Саша, не забывай нас, слышишь!","tr":"саша, джанган лупа ками, тау!"},{"n":"Sasha","v":"m","ms":"Takkan lupa! Saya pasti datang lagi hujung minggu.","ru":"Ни за что не забуду! Обязательно приеду на выходных.","tr":"та'кан лупа! сая пасти датанг лаги худжунг минггу."},{"n":"Pak Long","v":"m2","ms":"Jaga diri baik-baik. Kalau ada masalah, telefon Pak Long.","ru":"Береги себя. Если будут проблемы — звони мне.","tr":"джага дири баи'-баи'. калау ада масалах, тэлэфон па' лонг."},{"n":"Sasha","v":"m","ms":"Baik, Pak Long. Selamat tinggal, semua!","ru":"Хорошо, дядя. До свидания, все!","tr":"баи', па' лонг. селамат тинггал, семуа!"},{"n":"Mak Long","v":"f","ms":"Selamat jalan! Datanglah lagi bila-bila masa.","ru":"Счастливого пути! Приезжай когда захочешь.","tr":"селамат джалан! датанглах лаги била-била маса."}]},"slang":[{"ms":"bai","ru":"пока (от bye)","ex":"Okey, bai! Jumpa esok.","exRu":"Ну, пока! До завтра.","ok":"С друзьями и в сообщениях; часто «bai-bai».","no":"Со старшими — «Selamat tinggal» или «Jumpa lagi».","say":"bai","tr":"бай","exTr":"окей, бай! джумпа эсо'."},{"ms":"tak payah","ru":"не надо, не стоило","ex":"Tak payah susah-susah!","exRu":"Не стоило беспокоиться!","ok":"Ответ на подарок или помощь — вежливая скромность.","no":"Это не отказ: подарок всё равно берут, двумя руками или правой.","say":"tak payah","tr":"та' паях","exTr":"та' паях сусах-сусах!"}],"build":[{"ru":"Спасибо за всё.","ms":"Terima kasih atas semuanya.","extra":["untuk","saya"],"tr":"терима касих атас семуаня."},{"ru":"Не забудь звонить бабушке!","ms":"Jangan lupa telefon nenek!","extra":["tidak","ingat"],"tr":"джанган лупа тэлэфон нэнэ'!"},{"ru":"Я обязательно приеду ещё.","ms":"Saya pasti datang lagi.","extra":["pergi","jangan"],"tr":"сая пасти датанг лаги."}],"reply":[{"p":"Selamat jalan, Sasha!","pRu":"Счастливого пути, Саша!","o":["Selamat tinggal! Terima kasih atas semuanya.","Selamat jalan juga!","Jemput makan."],"a":0,"why":"Уходящий отвечает selamat tinggal.","pTr":"селамат джалан, саша!","oTr":["селамат тинггал! терима касих атас семуаня.","селамат джалан джуга!","джемпут макан."]},{"p":"Ini hadiah untuk awak.","pRu":"Это подарок тебе.","o":["Tak payah susah-susah! Terima kasih.","Jangan lupa.","Saya sibuk."],"a":0,"why":"Скромно принять и поблагодарить.","pTr":"ини хадиях унту' ава'.","oTr":["та' паях сусах-сусах! терима касих.","джанган лупа.","сая сибу'."]}],"test":[{"q":"Вы уезжаете. Что сказать остающимся?","o":["Selamat tinggal","Selamat jalan","Selamat datang"],"a":0,"why":"tinggal — оставаться."},{"q":"«Hadiah» —","o":["подарок","письмо","вещи"],"a":0,"why":"От арабского hadiyya."},{"q":"«Не забудь»:","o":["Jangan lupa","Tidak lupa","Bukan lupa"],"a":0,"why":"Просьба «не делай» — jangan."},{"q":"«Спасибо за помощь»:","o":["Terima kasih atas bantuan.","Terima kasih bantuan atas.","Atas terima kasih."],"a":0,"why":"terima kasih atas + что."},{"q":"«Jaga diri» —","o":["береги себя","жди меня","иди домой"],"a":0,"why":"jaga — беречь."},{"q":"«Semoga berjaya!» —","o":["Удачи!","До свидания!","Не волнуйся!"],"a":0,"why":"semoga — пусть; berjaya — добиться успеха."}],"culture":"Уезжая, малайцы прощаются со старшими через salam: берут их руку и подносят ко лбу. Хозяева почти всегда дают гостю что-то с собой — еду, фрукты, «buah tangan». Подарок принимают со словами «Tak payah susah-susah» и не открывают при дарителе. А ещё у малайцев два «до свидания»: selamat tinggal говорит тот, кто уходит, selamat jalan — тот, кто остаётся.","story":"Последнее утро в Шах-Аламе: вещи собраны, дядя заводит машину. Саша дарит тёте подарок из Казани, Нурин просит не забывать, а бабушка по телефону велит беречь себя. Впереди — общежитие и семестр.","reading":{"title":"Surat untuk Mak Long","kind":"Записка на прощание","img":"f_salam","words":85,"gloss":[{"ms":"sebulan","ru":"месяц (один)","tr":"себулан"},{"ms":"perkataan","ru":"слово","tr":"перкатаан"},{"ms":"kasih sayang","ru":"любовь, забота","tr":"касих саянг"},{"ms":"chak-chak","ru":"чак-чак (татарская сладость)","tr":"чха'-чха'"},{"ms":"selalu","ru":"всегда","tr":"селалу"}],"q":[{"q":"Куда переезжает Саша?","o":["В общежитие","В Казань","К бабушке"],"a":0},{"q":"Что Саша дарит?","o":["Чай и чак-чак","Батик","Книгу"],"a":0},{"q":"Когда Саша обещает приехать?","o":["На следующих выходных","Через год","На Хари Раю"],"a":0}],"blocks":[{"h":"Записка Саши на столе","v":"m","lines":[{"ms":"Mak Long dan Pak Long yang saya sayangi,","ru":"Дорогие тётя и дядя,","tr":"ма' лонг дан па' лонг янг сая саянги,"},{"ms":"Hari ini saya pindah ke asrama.","ru":"Сегодня я переезжаю в общежитие.","tr":"хари ини сая пиндах ке асрама."},{"ms":"Terima kasih atas semuanya: makanan sedap, bilik yang selesa dan kasih sayang.","ru":"Спасибо за всё: за вкусную еду, уютную комнату и любовь.","tr":"терима касих атас семуаня: маканан седап, били' янг селэса дан касих саянг."},{"ms":"Sebulan di sini saya belajar banyak perkataan baru.","ru":"За месяц здесь я выучил(а) много новых слов.","tr":"себулан ди сини сая беладжар баня' перкатаан бару."},{"ms":"Sekarang saya boleh cakap dengan nenek dalam bahasa Melayu!","ru":"Теперь я могу говорить с бабушкой по-малайски!","tr":"секаранг сая болэх чакап денган нэнэ' далам бахаса мелаю!"},{"ms":"Ini hadiah kecil dari Kazan — teh dan chak-chak.","ru":"Это маленький подарок из Казани — чай и чак-чак.","tr":"ини хадиях кечил дари казань — тэх дан чха'-чха'."},{"ms":"Saya akan ingat keluarga ini selalu.","ru":"Я всегда буду помнить эту семью.","tr":"сая акан ингат келуарга ини селалу."},{"ms":"Jangan risau, saya akan jaga diri.","ru":"Не волнуйтесь, я буду беречь себя.","tr":"джанган рисау, сая акан джага дири."},{"ms":"Hujung minggu depan saya pasti datang lagi.","ru":"На следующих выходных обязательно приеду.","tr":"худжунг минггу депан сая пасти датанг лаги."},{"ms":"Salam sayang, Sasha.","ru":"С любовью, Саша.","tr":"салам саянг, саша."}]}]},"writing":[{"kind":"note","title":"Записка-благодарность","img":"f_living","task":"Напишите хозяевам, у которых вы гостили, записку на прощание: спасибо за что, подарок, пообещайте приехать, попросите не волноваться.","need":[["Спасибо за…",["terima kasih atas","terima kasih untuk"]],["Подарок",["hadiah"]],["Обещание",["pasti","datang lagi","akan"]],["Не волнуйтесь / не забывайте",["jangan"]]],"hint":[{"ms":"Terima kasih atas layanan yang baik.","ru":"Спасибо за тёплый приём.","tr":"терима касих атас лаянан янг баи'."},{"ms":"Saya pasti datang lagi.","ru":"Я обязательно приеду ещё.","tr":"сая пасти датанг лаги."}],"model":[{"ms":"Terima kasih atas semuanya!","ru":"Спасибо за всё!","tr":"терима касих атас семуаня!"},{"ms":"Ini hadiah kecil untuk keluarga.","ru":"Это маленький подарок для семьи.","tr":"ини хадиях кечил унту' келуарга."},{"ms":"Jangan risau, saya akan jaga diri.","ru":"Не волнуйтесь, я буду беречь себя.","tr":"джанган рисау, сая акан джага дири."},{"ms":"Saya pasti datang lagi bulan depan.","ru":"Обязательно приеду в следующем месяце.","tr":"сая пасти датанг лаги булан депан."}]},{"kind":"chat","title":"Счастливого пути","img":"f_salam","task":"Подруга Лена улетает обратно в Казань. Напишите ей: пожелайте доброй дороги и удачи, попросите беречь себя и не забывать вас.","from":{"n":"Lena","v":"f","ms":"Esok saya balik ke Kazan. Sedihnya!","ru":"Завтра я улетаю в Казань. Как грустно!","tr":"эсо' сая бали' ке казань. седихня!"},"need":[["Счастливого пути",["selamat jalan","selamat sampai"]],["Пожелание",["semoga"]],["Береги себя",["jaga diri"]],["Не забывай",["jangan lupa"]]],"hint":[{"ms":"Selamat jalan, Lena!","ru":"Счастливого пути, Лена!","tr":"селамат джалан, лена!"},{"ms":"Semoga selamat sampai.","ru":"Доброй дороги.","tr":"семога селамат сампай."}],"model":[{"ms":"Selamat jalan, Lena!","ru":"Счастливого пути, Лена!","tr":"селамат джалан, лена!"},{"ms":"Semoga selamat sampai di Kazan.","ru":"Долети благополучно до Казани.","tr":"семога селамат сампай ди казань."},{"ms":"Jaga diri baik-baik.","ru":"Береги себя.","tr":"джага дири баи'-баи'."},{"ms":"Jangan lupa saya, ya! Rindu awak.","ru":"Не забывай меня! Буду скучать.","tr":"джанган лупа сая, я! ринду ава'."}]}],"n":11,"schema":{"pat":["n","v","o"],"rows":[[["n","Jangan","не"],["v","lupa","забывай"],["o","kami","нас"]],[["v","Datang","приезжай"],["x","-lah","же"],["x","lagi","ещё"]],[["x","Terima kasih atas","спасибо за"],["o","semuanya","всё"]]],"note":"jangan + глагол — «не делай». -lah смягчает просьбу. Благодарность — terima kasih atas + что."},"week":1},{"id":"d1","week":2,"day":1,"img":"p_um_gate","meme":["m_catmug"],"ms":"Salam dan perkenalan","title":"Приветствие и знакомство","goal":"Поздороваться в любое время дня, представиться, спросить имя, сказать, откуда вы и кто вы.","can":["Сказать «доброе утро» и «добрый день» по-малайзийски","Представиться и спросить имя вежливо","Сказать, что вы студент из России","Поблагодарить, ответить на благодарность, попрощаться"],"words":[{"ms":"Selamat pagi","ru":"Доброе утро","ex":"Selamat pagi, Encik Hafiz.","exRu":"Доброе утро, господин Хафиз.","use":"Примерно до 11–12 часов. Нейтрально: подходит и для кафе, и для министерства.","ar":"selamat ← араб. سلامة «благополучие»","tr":"селамат паги","exTr":"селамат паги, энчи' хафиз."},{"ms":"Selamat petang","ru":"Добрый день","ex":"Selamat petang, tuan-tuan dan puan-puan.","exRu":"Добрый день, дамы и господа.","use":"С полудня до заката (~19:00). В Индонезии в это время говорят «sore», в Малайзии — только petang. Вечером — Selamat malam.","tr":"селамат петанг","exTr":"селамат петанг, туан-туан дан пуан-пуан."},{"ms":"Apa khabar?","ru":"Как дела? Как поживаете?","ex":"Apa khabar, Puan Rahimah?","exRu":"Как поживаете, госпожа Рахима?","use":"Универсально: и другу, и Датуку. Буквально «какие новости?».","ar":"khabar ← араб. خبر «новость»; тат. хәбәр","tr":"апа хабар?","exTr":"апа хабар, пуан рахимах?"},{"ms":"Khabar baik","ru":"Хорошо (дела хорошо)","ex":"Khabar baik, terima kasih. Encik pula?","exRu":"Хорошо, спасибо. А вы?","use":"Стандартный ответ. Можно и одним словом: «Baik».","tr":"хабар баи'","exTr":"хабар баи', терима касих. энчи' пула?"},{"ms":"Nama saya …","ru":"Меня зовут …","ex":"Nama saya Sasha.","exRu":"Меня зовут Саша.","use":"Буквально «имя моё …». Подходит везде — от кампуса до переговоров.","tr":"нама сая …","exTr":"нама сая саша."},{"ms":"Siapa nama encik?","ru":"Как вас зовут? (мужчине)","ex":"Maaf, siapa nama encik?","exRu":"Извините, как вас зовут?","use":"Обращение стоит вместо «вас». Женщине: «Siapa nama puan?», ровеснику: «Siapa nama awak?».","tr":"сияпа нама энчи'?","exTr":"мааф, сияпа нама энчи'?"},{"ms":"Saya dari Rusia","ru":"Я из России","ex":"Saya dari Rusia, dari Kazan.","exRu":"Я из России, из Казани.","use":"И на форуме, и в такси. Rusia — так по-малайски «Россия».","tr":"сая дари русия","exTr":"сая дари русия, дари казань."},{"ms":"Saya pelajar","ru":"Я студент / студентка","ex":"Saya pelajar hubungan antarabangsa.","exRu":"Я учусь на международных отношениях.","use":"pelajar — учащийся: студент или школьник. Аспирант — pelajar pascasiswazah.","tr":"сая пеладжар","exTr":"сая пеладжар хубунган антарабангса."},{"ms":"Gembira berkenalan dengan anda","ru":"Рад(а) познакомиться","ex":"Gembira berkenalan dengan Datuk.","exRu":"Рад(а) познакомиться с вами, Датук.","use":"Вместо «anda» лучше подставить обращение: dengan Encik Hafiz, dengan Datuk. Между ровесниками проще: «Selamat berkenalan».","tr":"гембира беркеналан денган анда","exTr":"гембира беркеналан денган дату'."},{"ms":"Terima kasih","ru":"Спасибо","ex":"Terima kasih, Cik Nurul.","exRu":"Спасибо, Нурул.","use":"Везде. Сильнее: «Terima kasih banyak» — большое спасибо.","tr":"терима касих","exTr":"терима касих, чи' нурул."},{"ms":"Sama-sama","ru":"Пожалуйста (в ответ на «спасибо»)","ex":"Sama-sama, Sasha.","exRu":"Не за что, Саша.","use":"Только как ответ на благодарность. «Пожалуйста» в просьбе — другие слова (sila, tolong — урок 11).","tr":"сама-сама","exTr":"сама-сама, саша."},{"ms":"Jumpa lagi","ru":"До встречи","ex":"Jumpa lagi esok!","exRu":"До встречи завтра!","use":"Дружески-нейтрально. Официально прощаются так: «Terima kasih, selamat petang».","tr":"джумпа лаги","exTr":"джумпа лаги эсо'!"}],"rule":{"title":"Без глагола «быть»","ref":"g-be","text":["В малайском нет глагола «быть» в настоящем времени. «Я студент» — просто Saya pelajar: два слова, ничего между ними.","Определение стоит после главного слова: nama saya — «имя моё» = меня зовут. Это правило работает везде: bilik mesyuarat — «комната совещаний», kereta merah — «машина красная»."],"ex":[{"ms":"Saya pelajar.","ru":"Я студент(ка).","tr":"сая пеладжар."},{"ms":"Nama saya Sasha.","ru":"Меня зовут Саша.","tr":"нама сая саша."},{"ms":"Encik Hafiz pegawai kementerian.","ru":"Господин Хафиз — сотрудник министерства.","tr":"энчи' хафиз пегавай кементэриян."}],"mistake":"Русскоязычные часто вставляют adalah («является») в каждое предложение: «Saya adalah pelajar». Грамматически это возможно, но в живой речи звучит как канцелярит. adalah нужен в официальных текстах и определениях — это неделя 9.","cmp":"Как русское «Я — студент»: тире вместо «есть». В малайском не нужно даже тире."},"dialog":{"scene":"Неделя ориентации, Universiti Malaya. Международный отдел, первый день.","img":"p_students","lines":[{"n":"Aisyah","v":"f","ms":"Selamat pagi! Apa khabar?","ru":"Доброе утро! Как дела?","tr":"селамат паги! апа хабар?"},{"n":"Sasha","v":"m","ms":"Selamat pagi. Khabar baik, terima kasih.","ru":"Доброе утро. Хорошо, спасибо.","tr":"селамат паги. хабар баи', терима касих."},{"n":"Aisyah","v":"f","ms":"Nama saya Aisyah. Siapa nama awak?","ru":"Меня зовут Аишах. А тебя?","tr":"нама сая аишах. сияпа нама ава'?"},{"n":"Sasha","v":"m","ms":"Nama saya Sasha. Saya dari Rusia.","ru":"Меня зовут Саша. Я из России.","tr":"нама сая саша. сая дари русия."},{"n":"Aisyah","v":"f","ms":"Oh, dari Rusia! Awak pelajar baru?","ru":"О, из России! Ты из новых студентов?","tr":"ох, дари русия! ава' пеладжар бару?"},{"n":"Sasha","v":"m","ms":"Ya, saya pelajar hubungan antarabangsa.","ru":"Да, я учусь на международных отношениях.","tr":"я, сая пеладжар хубунган антарабангса."},{"n":"Aisyah","v":"f","ms":"Gembira berkenalan dengan awak, Sasha.","ru":"Рада познакомиться, Саша.","tr":"гембира беркеналан денган ава', саша."},{"n":"Sasha","v":"m","ms":"Saya pun. Terima kasih, Aisyah.","ru":"Я тоже. Спасибо, Аишах.","tr":"сая пун. терима касих, аишах."},{"n":"Aisyah","v":"f","ms":"Sama-sama. Jumpa lagi!","ru":"Не за что. До встречи!","tr":"сама-сама. джумпа лаги!"},{"n":"Sasha","v":"m","ms":"Jumpa lagi!","ru":"До встречи!","tr":"джумпа лаги!"}]},"slang":[{"ms":"jom","ru":"давай, пошли","ex":"Jom minum kopi!","exRu":"Пошли выпьем кофе!","ok":"С однокурсниками, коллегами, даже с начальником в неформальной обстановке — малайзийцы говорят «jom» постоянно.","no":"В официальном письме и речи. Там: «Marilah kita…» («Давайте же…»). И это чисто малайзийское слово: в Индонезии скажут «ayo».","say":"jom","tr":"джом","exTr":"джом минум копи!"},{"ms":"-lah","ru":"частица: смягчает или подталкивает","ex":"Jomlah, kita dah lewat!","exRu":"Ну пошли же, мы опаздываем!","ok":"В разговоре почти к любому слову: okeylah («ну ладно»), tak apalah («да ничего»), cepatlah («давай быстрее»).","no":"Разговорное «lah» после английских слов (okeylah, sorrylah) — не в письме и не на переговорах. В книжном языке -lah тоже есть, но как выделение: «Inilah…» — «Вот именно это…».","say":"lah","tr":"лах","exTr":"джомлах, кита дах лэват!"}],"build":[{"ru":"Меня зовут Саша.","ms":"Nama saya Sasha.","extra":["awak","dari"],"tr":"нама сая саша."},{"ru":"Я из России.","ms":"Saya dari Rusia.","extra":["nama","pagi"],"tr":"сая дари русия."},{"ru":"Рад(а) познакомиться с вами.","ms":"Gembira berkenalan dengan anda.","extra":["saya","baik"],"tr":"гембира беркеналан денган анда."}],"reply":[{"p":"Apa khabar?","pRu":"Как дела?","o":["Khabar baik, terima kasih.","Sama-sama.","Jumpa lagi."],"a":0,"why":"На «Apa khabar?» отвечают «Khabar baik».","pTr":"апа хабар?","oTr":["хабар баи', терима касих.","сама-сама.","джумпа лаги."]},{"p":"Terima kasih!","pRu":"Спасибо!","o":["Selamat pagi.","Sama-sama.","Saya pelajar."],"a":1,"why":"Ответ на благодарность — «Sama-sama».","pTr":"терима касих!","oTr":["селамат паги.","сама-сама.","сая пеладжар."]},{"p":"Siapa nama awak?","pRu":"Как тебя зовут?","o":["Saya dari Rusia.","Nama saya Sasha.","Khabar baik."],"a":1,"why":"Спросили имя — «Nama saya …».","pTr":"сияпа нама ава'?","oTr":["сая дари русия.","нама сая саша.","хабар баи'."]}],"test":[{"q":"Как поздороваться в 15:00?","o":["Selamat pagi","Selamat petang","Selamat malam"],"a":1,"why":"В Малайзии petang — с полудня до заката."},{"q":"«Saya pelajar» значит…","o":["Я студент(ка)","Я учу","Я преподаватель"],"a":0,"why":"Глагола «быть» нет: «я — студент»."},{"q":"Как ответить на «Terima kasih»?","o":["Apa khabar?","Sama-sama.","Jumpa lagi."],"a":1,"why":"Sama-sama — «не за что»."},{"q":"Как спросить имя у мужчины старше вас на конференции?","o":["Siapa nama encik?","Siapa nama kamu?","Nama saya?"],"a":0,"why":"Encik — вежливое обращение к мужчине; kamu — к младшим."},{"q":"Какое слово значит «из» в «Saya … Rusia»?","o":["dari","ke","di"],"a":0,"why":"dari — откуда."},{"q":"«Jumpa lagi» значит…","o":["До встречи","Доброе утро","Спасибо"],"a":0,"why":"jumpa — встречаться, lagi — снова."}],"culture":"Малайцы часто здороваются лёгким касанием ладоней, а потом прикладывают руку к груди — «от сердца». Мужчина и женщина могут не пожимать руки: подождите, протянет ли собеседник руку первым, а если нет — кивните, приложив правую ладонь к груди. Между мусульманами принято «Assalamualaikum», ответ — «Waalaikumussalam», как в арабском.","story":"Месяц у родных позади — начинается семестр. Саша переезжает в общежитие Universiti Malaya и идёт на ориентацию для иностранцев: знакомство с Аишах, которая станет проводником по студенческой Малайзии.","reading":{"title":"Profil Sasha","kind":"Анкета на доске знакомств","img":"p_um_gate","words":45,"gloss":[{"ms":"baru","ru":"новый","tr":"бару"},{"ms":"kawan","ru":"друг, подруга","tr":"каван"},{"ms":"di","ru":"в, на (где)","tr":"ди"},{"ms":"juga","ru":"тоже","tr":"джуга"}],"q":[{"q":"Откуда Саша?","o":["Из Казани","Из Куала-Лумпура","Из Сабаха"],"a":0},{"q":"Кто такая Аишах?","o":["Подруга Саши, тоже студентка","Преподаватель","Секретарь"],"a":0},{"q":"Что значит «pelajar baru»?","o":["Новый студент","Хороший студент","Студент-иностранец"],"a":0}],"blocks":[{"h":"Анкета Саши","v":"m","lines":[{"ms":"Selamat pagi! Nama saya Sasha.","ru":"Доброе утро! Меня зовут Саша.","tr":"селамат паги! нама сая саша."},{"ms":"Saya dari Rusia, dari Kazan.","ru":"Я из России, из Казани.","tr":"сая дари русия, дари казань."},{"ms":"Saya pelajar hubungan antarabangsa.","ru":"Я учусь на международных отношениях.","tr":"сая пеладжар хубунган антарабангса."},{"ms":"Saya pelajar baru di Universiti Malaya.","ru":"Я новый студент Университета Малайя.","tr":"сая пеладжар бару ди университи малая."},{"ms":"Kawan saya Aisyah. Dia dari Kuala Lumpur.","ru":"Мою подругу зовут Аишах. Она из Куала-Лумпура.","tr":"каван сая аишах. дия дари куала лумпур."},{"ms":"Aisyah pelajar juga.","ru":"Аишах тоже студентка.","tr":"аишах пеладжар джуга."},{"ms":"Gembira berkenalan dengan anda. Jumpa lagi!","ru":"Рад(а) знакомству. До встречи!","tr":"гембира беркеналан денган анда. джумпа лаги!"}]}]},"writing":[{"kind":"chat","title":"Ответ в WhatsApp","img":"p_students","task":"Аишах написала вам после ориентации. Ответьте: поздоровайтесь, назовите имя, скажите, откуда вы и кто вы, попрощайтесь.","from":{"n":"Aisyah","v":"f","ms":"Hai! Saya Aisyah dari orientasi tadi. Siapa nama awak? Awak dari mana?","ru":"Привет! Я Аишах, с ориентации. Как тебя зовут? Ты откуда?","tr":"хай! сая аишах дари ориэнтаси тади. сияп
