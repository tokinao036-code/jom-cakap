здываю!","img":"p_lrt","task":"Вы опаздываете на лекцию на 10 минут. Напишите Аишах: извинитесь, скажите, на сколько опаздываете и где вы сейчас; спросите, во сколько начинается следующая пара.","need":[["Извинение",["maaf"]],["Опаздываю",["lewat"]],["Минуты",["minit"]],["Сейчас",["sekarang"]],["Вопрос о времени",["pukul berapa"]]],"hint":[{"ms":"Saya dalam Grab sekarang.","ru":"Я сейчас в Grab.","tr":"сая далам грэб секаранг."},{"ms":"Kelas seterusnya pukul berapa?","ru":"Во сколько следующая пара?","tr":"келас сетерусня пукул берапа?"}],"model":[{"ms":"Aisyah, maaf! Saya lewat sepuluh minit.","ru":"Аишах, прости! Опаздываю на десять минут.","tr":"аишах, мааф! сая лэват сепулух минит."},{"ms":"Saya dalam Grab sekarang.","ru":"Я сейчас в Grab.","tr":"сая далам грэб секаранг."},{"ms":"Kelas seterusnya pukul berapa?","ru":"Во сколько следующая пара?","tr":"келас сетерусня пукул берапа?"}]}]},{"id":"d7","week":1,"day":7,"img":"p_mamak_students","ms":"Di kedai mamak","title":"В мамаке: заказ и счёт","goal":"Заказать еду и напитки в мамаке, попросить поменьше сахара, взять с собой, попросить счёт и угостить друга.","can":["Сделать заказ: Saya nak …","Попросить kurang manis и air kosong","Ответить «здесь или с собой»","Попросить счёт и угостить"],"words":[{"ms":"nak","ru":"хотеть (разг.)","ex":"Saya nak teh tarik.","exRu":"Я хочу teh tarik.","use":"Разговорное от hendak. Нейтрально — mahu, официально — ingin: «Saya ingin mengucapkan terima kasih».","tr":"на'","exTr":"сая на' тэх тари'."},{"ms":"makan","ru":"есть; еда","ex":"Jom makan!","exRu":"Пошли поедим!","use":"makan tengah hari — обед, makan malam — ужин.","tr":"макан","exTr":"джом макан!"},{"ms":"minum","ru":"пить","ex":"Minum apa?","exRu":"Что будете пить?","use":"Первый вопрос официанта.","tr":"минум","exTr":"минум апа?"},{"ms":"teh tarik","ru":"«тянутый» чай с молоком","ex":"Satu teh tarik, kurang manis.","exRu":"Один teh tarik, поменьше сахара.","use":"Национальный напиток: чай со сгущёнкой, который «тянут», переливая из кружки в кружку для пены.","img":"teh_tarik","tr":"тэх тари'","exTr":"сату тэх тари', куранг манис."},{"ms":"kopi","ru":"кофе","ex":"Kopi O satu.","exRu":"Один чёрный кофе с сахаром.","use":"kopi — с молоком и сахаром, kopi O — чёрный с сахаром, kopi O kosong — чёрный без сахара.","tr":"копи","exTr":"копи о сату."},{"ms":"nasi lemak","ru":"рис на кокосовом молоке","ex":"Nasi lemak di sini sedap.","exRu":"Здесь вкусный nasi lemak.","use":"Неофициальное национальное блюдо: рис, острый самбал, анчоусы, арахис, яйцо. Часто едят на завтрак.","img":"nasi_lemak","tr":"наси лема'","exTr":"наси лема' ди сини седап."},{"ms":"roti canai","ru":"слоёная лепёшка с карри","ex":"Roti canai dua, kuah campur.","exRu":"Две roti canai, соус смешанный.","use":"Классика мамака. roti telur — с яйцом.","img":"roti_making","tr":"роти чанай","exTr":"роти чанай дуа, куах чампур."},{"ms":"air kosong","ru":"простая вода","ex":"Air kosong satu.","exRu":"Одну простую воду.","use":"Буквально «пустая вода». Иногда стоит 50 сен, иногда бесплатно.","tr":"аир косонг","exTr":"аир косонг сату."},{"ms":"kurang manis","ru":"поменьше сахара","ex":"Teh tarik kurang manis, ya.","exRu":"Teh tarik поменьше сахара, хорошо?","use":"Напитки в Малайзии очень сладкие — пригодится. Без сахара: «tanpa gula» или «kosong».","tr":"куранг манис","exTr":"тэх тари' куранг манис, я."},{"ms":"bungkus","ru":"с собой (упаковать)","ex":"Nasi lemak satu, bungkus.","exRu":"Один nasi lemak с собой.","use":"Нейтральное «на вынос». Разговорный синоним — tapau (сленг дня).","img":"nasi_bungkus","tr":"бунгкус","exTr":"наси лема' сату, бунгкус."},{"ms":"makan sini","ru":"здесь (поесть на месте)","ex":"Makan sini atau bungkus?","exRu":"Здесь или с собой?","use":"Стандартный вопрос официанта.","tr":"макан сини","exTr":"макан сини атау бунгкус?"},{"ms":"Berapa semua?","ru":"Сколько всего?","ex":"Boss, berapa semua?","exRu":"Сколько с нас всего?","use":"Попросить счёт. Разговорно также: «Kira!» — «Посчитайте!».","tr":"берапа семуа?","exTr":"бос, берапа семуа?"}],"rule":{"title":"Заказ: nak + что, число перед словом","ref":"g-polite","text":["Заказ строится просто: Saya nak + блюдо. Можно и без «saya nak»: «Satu teh tarik!».","В нейтральной речи число стоит перед существительным: dua roti canai. В мамаке часто говорят и наоборот — teh tarik satu. Это нормальная разговорная форма."],"ex":[{"ms":"Saya nak nasi lemak.","ru":"Мне nasi lemak.","tr":"сая на' наси лема'."},{"ms":"Dua roti canai dan satu kopi.","ru":"Две roti canai и один кофе.","tr":"дуа роти чанай дан сату копи."},{"ms":"Boleh saya dapat air kosong?","ru":"Можно мне простой воды?","tr":"болэх сая дапат аир косонг?"}],"mistake":"Говорить «Sila teh tarik» в значении «чай, пожалуйста». sila — это приглашение («прошу садиться»), а не просьба. В заказе «пожалуйста» вообще не нужно: вежливость передают тон и «terima kasih».","cmp":"Как в русском кафе: «Мне чай» — без глагола «дайте»."},"dialog":{"scene":"Вечер пятницы, мамак рядом с кампусом.","img":"p_mamak_friends","lines":[{"n":"Pelayan","v":"m2","ms":"Ya, boss, nak order apa?","ru":"Да, что заказываем?","tr":"я, бос, на' одер апа?"},{"n":"Aisyah","v":"f","ms":"Saya nak nasi lemak dan teh tarik kurang manis.","ru":"Мне nasi lemak и teh tarik поменьше сахара.","tr":"сая на' наси лема' дан тэх тари' куранг манис."},{"n":"Sasha","v":"m","ms":"Saya nak roti canai dua dan air kosong satu.","ru":"Мне две roti canai и одну воду.","tr":"сая на' роти чанай дуа дан аир косонг сату."},{"n":"Pelayan","v":"m2","ms":"Makan sini atau bungkus?","ru":"Здесь или с собой?","tr":"макан сини атау бунгкус?"},{"n":"Sasha","v":"m","ms":"Makan sini.","ru":"Здесь.","tr":"макан сини."},{"n":"Pelayan","v":"m2","ms":"Okey, sekejap ya.","ru":"Окей, минутку.","tr":"окей, секеджап я."},{"n":"Aisyah","v":"f","ms":"Sasha, roti canai di sini sedap!","ru":"Саша, здесь вкусные roti canai!","tr":"саша, роти чанай ди сини седап!"},{"n":"Sasha","v":"m","ms":"Ya, sedap! Boss, berapa semua?","ru":"Да, вкусно! Сколько с нас?","tr":"я, седап! бос, берапа семуа?"},{"n":"Pelayan","v":"m2","ms":"Semua dua belas ringgit.","ru":"Всего двенадцать ринггитов.","tr":"семуа дуа белас ринггит."},{"n":"Sasha","v":"m","ms":"Hari ini saya belanja, Aisyah.","ru":"Сегодня я угощаю, Аишах.","tr":"хари ини сая беланджа, аишах."},{"n":"Aisyah","v":"f","ms":"Wah, terima kasih! Lain kali saya pula.","ru":"Ого, спасибо! В следующий раз — я.","tr":"вах, терима касих! лаин кали сая пула."}]},"slang":[{"ms":"tapau","ru":"с собой, на вынос","ex":"Nasi lemak satu, tapau.","exRu":"Один nasi lemak на вынос.","ok":"Ларьки, мамаки, фудкорты. Слово пришло из кантонского — пример того, как смешиваются языки Малайзии.","no":"В ресторане отеля и в письменной речи — bungkus.","say":"tapau","tr":"тапау","exTr":"наси лема' сату, тапау."},{"ms":"boss","ru":"обращение к продавцу или официанту","ex":"Boss, teh tarik satu!","exRu":"Шеф, один teh tarik!","ok":"В мамаке и на рынке к мужчине любого возраста — дружелюбно, без иронии. К женщине — «kak» («сестрица»).","no":"В дорогом ресторане и к вашему настоящему начальнику — там Encik / Puan.","say":"boss","tr":"бос","exTr":"бос, тэх тари' сату!"}],"build":[{"ru":"Мне teh tarik поменьше сахара.","ms":"Saya nak teh tarik kurang manis.","extra":["minum","bungkus"],"tr":"сая на' тэх тари' куранг манис."},{"ru":"Здесь или с собой?","ms":"Makan sini atau bungkus?","extra":["minum","nak"],"tr":"макан сини атау бунгкус?"},{"ru":"Сколько всего?","ms":"Berapa semua?","extra":["apa","satu"],"tr":"берапа семуа?"}],"reply":[{"p":"Makan sini atau bungkus?","pRu":"Здесь или с собой?","o":["Bungkus, terima kasih.","Sama-sama.","Saya pelajar."],"a":0,"why":"Отвечаем на вопрос официанта.","pTr":"макан сини атау бунгкус?","oTr":["бунгкус, терима касих.","сама-сама.","сая пеладжар."]},{"p":"Minum apa?","pRu":"Что будете пить?","o":["Teh tarik satu.","Nasi lemak satu.","Makan sini."],"a":0,"why":"Спросили о напитке.","pTr":"минум апа?","oTr":["тэх тари' сату.","наси лема' сату.","макан сини."]}],"test":[{"q":"Как попросить поменьше сахара?","o":["kurang manis","tanpa makan","manis lagi"],"a":0,"why":"kurang — меньше, manis — сладкий."},{"q":"«Air kosong» — это…","o":["простая вода","пустая чашка","кокосовая вода"],"a":0,"why":"Буквально «пустая вода»."},{"q":"Официант: «Makan sini atau bungkus?» Вы хотите с собой:","o":["Bungkus.","Makan sini.","Minum."],"a":0,"why":"bungkus — упаковать."},{"q":"Нейтральное «хотеть» (не сленг и не книжное):","o":["nak","mahu","ingin"],"a":1,"why":"nak — разговорное, ingin — официальное."},{"q":"Можно ли сказать «Sila teh tarik» вместо «чай, пожалуйста»?","o":["Нет: sila — приглашение, а не просьба","Да, это вежливо","Да, но только вечером"],"a":0,"why":"В заказе sila не нужно."},{"q":"«Hari ini saya belanja» значит…","o":["Сегодня я угощаю","Сегодня я на диете","Сегодня платим пополам"],"a":0,"why":"belanja — угостить."}],"culture":"Мамак — индийско-мусульманские кафе, многие открыты круглосуточно, всё халяль. Ешьте и передавайте еду правой рукой. «Belanja» — угостить: в Малайзии угощают по очереди, и от первого угощения не отказываются.","story":"Вечер пятницы. Неделя позади: Саша угощает Аишах в мамаке у кампуса — спасибо за помощь.","reading":{"title":"Mamak kegemaran kami","kind":"Отзыв в блоге Саши","img":"p_mamak_students","words":110,"gloss":[{"ms":"kegemaran","ru":"любимый","tr":"кегемаран"},{"ms":"kedai","ru":"лавка, кафе","tr":"кедай"},{"ms":"selalu","ru":"всегда, часто","tr":"селалу"},{"ms":"suka","ru":"любить, нравиться","tr":"сука"},{"ms":"harga","ru":"цена","tr":"харга"},{"ms":"murah","ru":"дешёвый","tr":"мурах"},{"ms":"sahaja","ru":"только","tr":"сахаджа"},{"ms":"kalau","ru":"если","tr":"калау"},{"ms":"pekerja","ru":"работник","tr":"пекерджа"}],"q":[{"q":"Как долго открыт мамак?","o":["Круглосуточно","До полуночи","Только днём"],"a":0},{"q":"Сколько стоит teh tarik?","o":["2 ринггита","1,50 ринггита","12 ринггитов"],"a":0},{"q":"Что значит «boleh bungkus»?","o":["Можно взять с собой","Можно заплатить картой","Можно сесть здесь"],"a":0}],"blocks":[{"h":"Блог Саши","v":"m","lines":[{"ms":"Dekat kampus ada kedai mamak. Nama kedai itu Restoran Selera.","ru":"Рядом с кампусом есть мамак. Он называется «Ресторан Селера».","tr":"декат кампус ада кедай мама'. нама кедай иту ресторан селэра."},{"ms":"Kedai ini buka dua puluh empat jam.","ru":"Он открыт круглосуточно.","tr":"кедай ини бука дуа пулух эмпат джам."},{"ms":"Saya dan Aisyah selalu makan di sini selepas kelas.","ru":"Мы с Аишах часто едим здесь после занятий.","tr":"сая дан аишах селалу макан ди сини селепас келас."},{"ms":"Aisyah suka nasi lemak dan teh tarik kurang manis.","ru":"Аишах любит nasi lemak и teh tarik поменьше сахара.","tr":"аишах сука наси лема' дан тэх тари' куранг манис."},{"ms":"Saya suka roti canai dengan kuah kari.","ru":"А я люблю roti canai с соусом карри.","tr":"сая сука роти чанай денган куах кари."},{"ms":"Harga murah: roti canai satu ringgit lima puluh sen, teh tarik dua ringgit.","ru":"Цены низкие: roti canai — 1,50 ринггита, teh tarik — 2 ринггита.","tr":"харга мурах: роти чанай сату ринггит лима пулух сэн, тэх тари' дуа ринггит."},{"ms":"Malam ini saya belanja Aisyah. Semua dua belas ringgit sahaja!","ru":"Сегодня вечером я угощаю Аишах. Всего двенадцать ринггитов!","tr":"малам ини сая беланджа аишах. семуа дуа белас ринггит сахаджа!"},{"ms":"Kalau awak nak makan di bilik, boleh bungkus.","ru":"Если хочешь поесть в комнате, можно взять с собой.","tr":"калау ава' на' макан ди били', болэх бунгкус."},{"ms":"Pekerja di sini cakap bahasa Melayu, bahasa Tamil dan bahasa Inggeris.","ru":"Работники здесь говорят по-малайски, по-тамильски и по-английски.","tr":"пекерджа ди сини чакап бахаса мелаю, бахаса тамил дан бахаса инггерис."}]}]},"writing":[{"kind":"chat","title":"Приглашение в мамак","img":"p_mamak_group","task":"Пригласите Аишах и Мэй Линг на ужин в мамак: время, место, скажите, что угощаете. Пишите по-дружески (jom, nak).","need":[["jom",["jom"]],["Время",["pukul"]],["Место",["mamak","restoran"]],["Угощаю",["belanja"]]],"hint":[{"ms":"Jom makan malam ini!","ru":"Пошли поужинаем сегодня!","tr":"джом макан малам ини!"},{"ms":"Saya belanja.","ru":"Я угощаю.","tr":"сая беланджа."}],"model":[{"ms":"Aisyah, Mei Ling, jom makan malam ini!","ru":"Аишах, Мэй Линг, пошли сегодня ужинать!","tr":"аишах, мэй линг, джом макан малам ини!"},{"ms":"Kita jumpa di Restoran Selera pukul lapan.","ru":"Встречаемся в «Селере» в восемь.","tr":"кита джумпа ди ресторан селэра пукул лапан."},{"ms":"Hari ini saya belanja!","ru":"Сегодня я угощаю!","tr":"хари ини сая беланджа!"}]},{"kind":"review","title":"Отзыв на Google Maps","img":"p_tehtarik","task":"Напишите отзыв о мамаке (4–5 предложений): что заказали, вкусно ли, цены, работает ли круглосуточно, можно ли взять с собой.","need":[["Заказ",["roti","nasi","teh","kopi"]],["Вкус",["sedap"]],["Цена",["ringgit","harga","murah"]],["С собой / здесь",["bungkus","makan sini"]]],"hint":[{"ms":"Roti canai di sini sedap.","ru":"Roti canai здесь вкусные.","tr":"роти чанай ди сини седап."},{"ms":"Harga murah.","ru":"Цены низкие.","tr":"харга мурах."}],"model":[{"ms":"Restoran ini sangat bagus.","ru":"Очень хороший ресторан.","tr":"ресторан ини сангат багус."},{"ms":"Saya makan roti canai dan minum teh tarik kurang manis.","ru":"Я ел(а) roti canai и пил(а) teh tarik поменьше сахара.","tr":"сая макан роти чанай дан минум тэх тари' куранг манис."},{"ms":"Roti canai di sini sedap dan murah, satu ringgit lima puluh sen sahaja.","ru":"Roti canai вкусные и дешёвые, всего 1,50 ринггита.","tr":"роти чанай ди сини седап дан мурах, сату ринггит лима пулух сэн сахаджа."},{"ms":"Kedai ini buka dua puluh empat jam. Boleh bungkus juga.","ru":"Открыто круглосуточно. Можно и с собой.","tr":"кедай ини бука дуа пулух эмпат джам. болэх бунгкус джуга."}]}]},{"id":"d8","week":2,"day":8,"img":"p_cafe_laptop","ms":"Sudah, belum, akan","title":"Уже, ещё нет, будет","goal":"Говорить о том, что уже сделано, что в процессе и что будет, — без спряжений и времён.","can":["Сказать «уже сделал(а)» и «ещё нет»","Сказать, что делаете прямо сейчас","Сообщить о планах на завтра","Правильно отвечать «Belum», а не «Tidak»"],"words":[{"ms":"sudah","ru":"уже (сделано)","ex":"Saya sudah hantar emel.","exRu":"Я уже отправил(а) письмо.","use":"Действие завершено. В речи — dah (сленг дня), в официальном тексте также telah.","tr":"судах","exTr":"сая судах хантар эмэл."},{"ms":"belum","ru":"ещё не","ex":"Laporan belum siap.","exRu":"Отчёт ещё не готов.","use":"Пока нет, но будет. Ответ на вопрос с sudah: «Sudah?» — «Belum».","tr":"белум","exTr":"лапоран белум сияп."},{"ms":"sedang","ru":"сейчас, в процессе","ex":"Datuk sedang bermesyuarat.","exRu":"Датук сейчас на совещании.","use":"Действие идёт прямо сейчас. Типичный вежливый ответ секретаря.","tr":"седанг","exTr":"дату' седанг бермешуарат."},{"ms":"akan","ru":"будет, собирается","ex":"Delegasi akan tiba esok.","exRu":"Делегация прибудет завтра.","use":"Будущее, особенно в официальной речи. В разговоре часто опускают: «Esok saya pergi».","tr":"акан","exTr":"дэлэгаси акан тиба эсо'."},{"ms":"masih","ru":"всё ещё","ex":"Saya masih di pejabat.","exRu":"Я всё ещё в офисе.","tr":"масих","exTr":"сая масих ди педжабат."},{"ms":"baru","ru":"только что; новый","ex":"Saya baru sampai.","exRu":"Я только что пришёл (пришла).","use":"Перед глаголом — «только что», после существительного — «новый»: pelajar baru.","tr":"бару","exTr":"сая бару сампай."},{"ms":"pergi","ru":"идти, ехать (туда)","ex":"Saya pergi ke Putrajaya.","exRu":"Я еду в Путраджаю.","use":"Движение от говорящего. Пешком или на транспорте — неважно.","tr":"перги","exTr":"сая перги ке путраджая."},{"ms":"datang","ru":"приходить, приезжать (сюда)","ex":"Bila awak datang ke Malaysia?","exRu":"Когда ты приехал(а) в Малайзию?","use":"Движение к месту, где находится говорящий.","tr":"датанг","exTr":"била ава' датанг ке малайсия?"},{"ms":"buat","ru":"делать","ex":"Awak buat apa?","exRu":"Что делаешь?","use":"Разговорно-нейтрально. В официальном тексте — membuat, melakukan.","tr":"буат","exTr":"ава' буат апа?"},{"ms":"hantar","ru":"отправлять; отвозить","ex":"Tolong hantar laporan sebelum pukul lima.","exRu":"Пожалуйста, отправьте отчёт до пяти.","use":"И письмо, и человека: «Saya hantar awak ke stesen» — «Отвезу тебя на станцию». В Индонезии — kirim.","tr":"хантар","exTr":"толонг хантар лапоран себелум пукул лима."},{"ms":"laporan","ru":"отчёт, доклад","ex":"Laporan forum sudah siap.","exRu":"Отчёт о форуме готов.","use":"Любой отчёт. lapor — докладывать.","tr":"лапоран","exTr":"лапоран форум судах сияп."},{"ms":"nanti","ru":"потом, позже","ex":"Nanti saya hantar.","exRu":"Позже отправлю.","use":"Неопределённое «попозже». Если нужна точность — назовите время.","tr":"нанти","exTr":"нанти сая хантар."}],"rule":{"title":"Время без времён","ref":"g-aspect","text":["Глагол в малайском никогда не меняется: pergi — и «иду», и «ходил», и «пойду».","Время показывают слова-метки перед глаголом (sudah, belum, sedang, akan, masih) или слова времени (semalam, esok). Если и так ясно — метка не нужна."],"ex":[{"ms":"Saya sudah hantar laporan.","ru":"Я уже отправил(а) отчёт.","tr":"сая судах хантар лапоран."},{"ms":"Saya sedang buat laporan.","ru":"Я сейчас пишу отчёт.","tr":"сая седанг буат лапоран."},{"ms":"Saya akan pergi ke Putrajaya esok.","ru":"Завтра я поеду в Путраджаю.","tr":"сая акан перги ке путраджая эсо'."}],"mistake":"На вопрос «Sudah siap?» («Уже готово?») отвечать «Tidak». Это звучит как «нет и не будет». Правильно — «Belum» («ещё нет»).","cmp":"Русскому нужны «сделал / делаю / сделаю». Малайскому — одно слово плюс метка, как русские «уже», «ещё не», «буду»."},"dialog":{"scene":"Офис департамента. Мэй Линг спрашивает про отчёт о форуме АСЕАН.","img":"p_office","lines":[{"n":"Mei Ling","v":"f","ms":"Sasha, awak sudah hantar laporan forum?","ru":"Саша, ты уже отправил(а) отчёт о форуме?","tr":"саша, ава' судах хантар лапоран форум?"},{"n":"Sasha","v":"m","ms":"Belum. Saya sedang buat laporan itu sekarang.","ru":"Ещё нет. Я как раз сейчас его пишу.","tr":"белум. сая седанг буат лапоран иту секаранг."},{"n":"Mei Ling","v":"f","ms":"Okey. Datuk akan baca laporan itu esok pagi.","ru":"Окей. Датук будет читать его завтра утром.","tr":"окей. дату' акан бача лапоран иту эсо' паги."},{"n":"Sasha","v":"m","ms":"Esok pagi? Baik, saya akan hantar petang ini.","ru":"Завтра утром? Хорошо, отправлю сегодня до вечера.","tr":"эсо' паги? баи', сая акан хантар петанг ини."},{"n":"Mei Ling","v":"f","ms":"Awak masih di pejabat pukul enam?","ru":"Ты ещё будешь в офисе в шесть?","tr":"ава' масих ди педжабат пукул энам?"},{"n":"Sasha","v":"m","ms":"Ya, saya masih di sini. Laporan baru siap separuh.","ru":"Да, ещё буду здесь. Отчёт готов только наполовину.","tr":"я, сая масих ди сини. лапоран бару сияп сепарух."},{"n":"Mei Ling","v":"f","ms":"Tak apa. Nanti hantar kepada saya juga, ya.","ru":"Ничего. Потом отправь и мне тоже, хорошо?","tr":"та' апа. нанти хантар кепада сая джуга, я."},{"n":"Sasha","v":"m","ms":"Baik. Dah siap, saya terus hantar.","ru":"Хорошо. Как будет готово — сразу отправлю.","tr":"баи'. дах сияп, сая терус хантар."}]},"slang":[{"ms":"dah","ru":"уже (коротко от sudah)","ex":"Dah makan?","exRu":"Поел(а) уже?","ok":"Устная речь и чаты — даже с начальником в разговоре.","no":"Письменные отчёты и официальная речь — sudah или telah.","say":"dah","tr":"дах","exTr":"дах макан?"},{"ms":"OTW","ru":"в пути (on the way)","ex":"Saya OTW, sepuluh minit lagi.","exRu":"Я в пути, буду через десять минут.","ok":"Чаты с коллегами и друзьями.","no":"Датуку и в официальной переписке: «Saya dalam perjalanan» — «я в пути».","say":"OTW","tr":"о-ти-даблью","exTr":"сая о-ти-даблью, сепулух минит лаги."}],"build":[{"ru":"Отчёт ещё не готов.","ms":"Laporan belum siap.","extra":["sudah","tidak"],"tr":"лапоран белум сияп."},{"ru":"Я сейчас пишу отчёт.","ms":"Saya sedang buat laporan.","extra":["akan","sudah"],"tr":"сая седанг буат лапоран."},{"ru":"Делегация приедет завтра.","ms":"Delegasi akan datang esok.","extra":["semalam","sudah"],"tr":"дэлэгаси акан датанг эсо'."}],"reply":[{"p":"Laporan sudah siap?","pRu":"Отчёт уже готов?","o":["Belum, nanti petang saya hantar.","Tidak.","Sudah esok."],"a":0,"why":"«Belum» + когда будет — идеальный рабочий ответ.","pTr":"лапоран судах сияп?","oTr":["белум, нанти петанг сая хантар.","тида'.","судах эсо'."]},{"p":"Dah makan?","pRu":"Поел(а) уже?","o":["Belum. Jom makan!","Saya pelajar.","Pukul tiga."],"a":0,"why":"Это приветствие-забота: ответ «Dah» или «Belum».","pTr":"дах макан?","oTr":["белум. джом макан!","сая пеладжар.","пукул тига."]}],"test":[{"q":"Ответ «ещё нет» на «Sudah hantar?»:","o":["Tidak.","Belum.","Bukan."],"a":1,"why":"belum — ещё нет, но будет."},{"q":"«Saya sedang buat laporan» —","o":["Я сейчас пишу отчёт","Я написал(а) отчёт","Я напишу отчёт"],"a":0,"why":"sedang — в процессе."},{"q":"Как сказать «Я только что пришёл / пришла»?","o":["Saya baru sampai.","Saya sampai baru.","Saya akan sampai."],"a":0,"why":"baru перед глаголом — «только что»."},{"q":"Индонезийскому «kirim» (отправить) соответствует малайзийское…","o":["hantar","pergi","buat"],"a":0,"why":"hantar — отправить, отвезти."},{"q":"«Dah makan?» — это…","o":["Приветствие-забота","Приглашение в ресторан","Вопрос о диете"],"a":0,"why":"Так здороваются и проявляют заботу."},{"q":"В официальном отчёте вместо «dah» пишем…","o":["sudah / telah","belum","nak"],"a":0,"why":"dah — только разговорное."}],"culture":"«Dah makan?» («Уже поел(а)?») — это приветствие, а не приглашение на обед. Отвечают «Dah» или «Belum» и спрашивают в ответ: «Awak?». Так малайзийцы показывают заботу.","story":"Неделя 2. Датук Камал ждёт отчёт о форуме АСЕАН к утру. Мэй Линг торопит Сашу и обещает проверить малайский.","reading":{"title":"Laporan untuk Datuk","kind":"Письмо коллеги + дневник","img":"p_cafe_laptop","words":120,"gloss":[{"ms":"sebelum","ru":"до, перед","tr":"себелум"},{"ms":"dulu","ru":"сначала","tr":"дулу"},{"ms":"semak","ru":"проверять","tr":"сема'"},{"ms":"betulkan","ru":"исправлять","tr":"бетулкан"},{"ms":"penat","ru":"усталый","tr":"пенат"}],"q":[{"q":"Когда Датук прочитает отчёт?","o":["Завтра утром, до совещания","Сегодня вечером","На следующей неделе"],"a":0},{"q":"Что сделает Мэй Линг?","o":["Проверит и поправит язык","Напишет отчёт сама","Отправит его Датуку"],"a":0},{"q":"«Saya baru hantar» значит…","o":["Я только что отправил(а)","Я отправлю новое","Я ещё не отправил(а)"],"a":0}],"blocks":[{"h":"Письмо от Мэй Линг","v":"f","lines":[{"ms":"Sasha, Datuk Kamal sudah tanya tentang laporan Forum Belia ASEAN.","ru":"Саша, Датук Камал уже спрашивал про отчёт о Молодёжном форуме АСЕАН.","tr":"саша, дату' камал судах таня тентанг лапоран форум белия асиан."},{"ms":"Beliau akan baca laporan itu esok pagi, sebelum mesyuarat pukul sembilan.","ru":"Он прочитает его завтра утром, до совещания в девять.","tr":"белияу акан бача лапоран иту эсо' паги, себелум мешуарат пукул сембилан."},{"ms":"Awak sudah siap? Kalau belum, tidak apa.","ru":"У тебя готово? Если ещё нет, ничего страшного.","tr":"ава' судах сияп? калау белум, тида' апа."},{"ms":"Hantar kepada saya dulu sebelum pukul lima petang ini.","ru":"Сначала пришли мне, до пяти вечера.","tr":"хантар кепада сая дулу себелум пукул лима петанг ини."},{"ms":"Saya akan semak dan betulkan bahasa. Terima kasih, Mei Ling.","ru":"Я проверю и поправлю язык. Спасибо, Мэй Линг.","tr":"сая акан сема' дан бетулкан бахаса. терима касих, мэй линг."}]},{"h":"Дневник Саши, 18:00","v":"m","lines":[{"ms":"Saya masih di pejabat. Sekarang pukul enam petang.","ru":"Я всё ещё в офисе. Сейчас шесть вечера.","tr":"сая масих ди педжабат. секаранг пукул энам петанг."},{"ms":"Laporan sudah siap! Saya baru hantar kepada Mei Ling.","ru":"Отчёт готов! Я только что отправил(а) его Мэй Линг.","tr":"лапоран судах сияп! сая бару хантар кепада мэй линг."},{"ms":"Mei Ling sedang semak laporan itu sekarang.","ru":"Мэй Линг сейчас его проверяет.","tr":"мэй линг седанг сема' лапоран иту секаранг."},{"ms":"Saya penat, tetapi gembira.","ru":"Я устал(а), но доволен(льна).","tr":"сая пенат, тетапи гембира."},{"ms":"Nanti saya akan pergi makan dengan Aisyah.","ru":"Потом пойду поесть с Аишах.","tr":"нанти сая акан перги макан денган аишах."}]}]},"writing":[{"kind":"email","title":"Статус отчёта","img":"p_office","task":"Ответьте Мэй Линг: что уже сделано (sudah), что ещё нет (belum), что делаете сейчас (sedang) и когда отправите (akan).","need":[["sudah",["sudah"]],["belum",["belum"]],["sedang",["sedang"]],["akan",["akan"]],["Время отправки",["pukul","petang","nanti"]]],"hint":[{"ms":"Bahagian pertama sudah siap.","ru":"Первая часть готова.","tr":"бахагиян пертама судах сияп."},{"ms":"Kesimpulan belum siap.","ru":"Выводы ещё не готовы.","tr":"кесимпулан белум сияп."}],"model":[{"ms":"Mei Ling, terima kasih.","ru":"Мэй Линг, спасибо.","tr":"мэй линг, терима касих."},{"ms":"Bahagian pertama laporan sudah siap.","ru":"Первая часть отчёта готова.","tr":"бахагиян пертама лапоран судах сияп."},{"ms":"Kesimpulan belum siap. Saya sedang buat sekarang.","ru":"Выводы ещё не готовы — пишу прямо сейчас.","tr":"кесимпулан белум сияп. сая седанг буат секаранг."},{"ms":"Saya akan hantar sebelum pukul lima petang.","ru":"Отправлю до пяти вечера.","tr":"сая акан хантар себелум пукул лима петанг."},{"ms":"Sasha","ru":"Саша","tr":"саша"}]},{"kind":"diary","title":"Дневник: мой день","img":"p_desk_write","task":"Напишите 5 предложений о сегодняшнем дне: что уже сделали, что ещё нет, что делаете сейчас, что будете делать вечером, где всё ещё находитесь.","need":[["sudah",["sudah","dah"]],["belum",["belum"]],["sedang",["sedang"]],["akan",["akan"]],["masih",["masih"]]],"hint":[{"ms":"Saya sudah makan tengah hari.","ru":"Я уже пообедал(а).","tr":"сая судах макан тенгах хари."},{"ms":"Saya masih di universiti.","ru":"Я всё ещё в университете.","tr":"сая масих ди университи."}],"model":[{"ms":"Hari ini saya sudah pergi ke kuliah.","ru":"Сегодня я уже сходил(а) на лекцию.","tr":"хари ини сая судах перги ке кулиях."},{"ms":"Saya belum makan malam.","ru":"Я ещё не ужинал(а).","tr":"сая белум макан малам."},{"ms":"Sekarang saya sedang belajar bahasa Melayu.","ru":"Сейчас я учу малайский.","tr":"секаранг сая седанг беладжар бахаса мелаю."},{"ms":"Saya masih di perpustakaan.","ru":"Я всё ещё в библиотеке.","tr":"сая масих ди перпустакаан."},{"ms":"Nanti saya akan pergi ke mamak dengan Aisyah.","ru":"Потом пойду в мамак с Аишах.","tr":"нанти сая акан перги ке мама' денган аишах."}]}]},{"id":"d9","week":2,"day":9,"img":"p_lrt","ms":"Naik Grab ke Putrajaya","title":"По городу: Grab, LRT, дорога","goal":"Спросить дорогу, объяснить водителю маршрут, попросить остановиться, говорить «где / куда / откуда».","can":["Спросить «Где …?»","Объяснить: прямо, налево, направо, остановитесь здесь","Различать di, ke и dari","Поговорить с водителем Grab"],"words":[{"ms":"Di mana?","ru":"Где?","ex":"Stesen LRT di mana?","exRu":"Где станция LRT?","use":"Где находится. «Ke mana?» — куда? «Dari mana?» — откуда?","tr":"ди мана?","exTr":"стэсэн эл-ар-ти ди мана?"},{"ms":"ke","ru":"в, на (куда)","ex":"Saya nak pergi ke Wisma Putra.","exRu":"Мне нужно в Висма Путра.","use":"Направление: ke pejabat, ke KLIA.","tr":"ке","exTr":"сая на' перги ке висма путра."},{"ms":"naik","ru":"ехать на; подниматься","ex":"Saya naik LRT ke kampus.","exRu":"Я езжу в кампус на LRT.","use":"naik + транспорт: naik Grab, naik bas, naik kereta api (поезд). Также «подниматься»: naik ke tingkat lima.","tr":"наи'","exTr":"сая наи' эл-ар-ти ке кампус."},{"ms":"stesen","ru":"станция","ex":"Kita jumpa di stesen KL Sentral.","exRu":"Встретимся на станции KL Sentral.","use":"stesen LRT, stesen MRT, stesen bas.","img":"sentral_sign","tr":"стэсэн","exTr":"кита джумпа ди стэсэн кей-эл сентрал."},{"ms":"belok kiri","ru":"повернуть налево","ex":"Belok kiri di lampu isyarat.","exRu":"Поверните налево на светофоре.","use":"kiri — левый. lampu isyarat — светофор.","tr":"бело' кири","exTr":"бело' кири ди лампу ишарат."},{"ms":"belok kanan","ru":"повернуть направо","ex":"Lepas ini, belok kanan.","exRu":"После этого — направо.","use":"kanan — правый.","tr":"бело' канан","exTr":"лепас ини, бело' канан."},{"ms":"jalan terus","ru":"прямо","ex":"Jalan terus, kemudian belok kiri.","exRu":"Прямо, потом налево.","use":"jalan — идти, дорога; terus — прямо, сразу.","tr":"джалан терус","exTr":"джалан терус, кемудиян бело' кири."},{"ms":"berhenti","ru":"остановиться","ex":"Boleh berhenti di sini?","exRu":"Можно остановиться здесь?","use":"Остановить такси или автобус. Знак «Berhenti» — «Стоп».","tr":"берхенти","exTr":"болэх берхенти ди сини?"},{"ms":"di sini","ru":"здесь","ex":"Saya tunggu di sini.","exRu":"Я подожду здесь.","use":"di sana — там, di situ — вон там (рядом с собеседником).","tr":"ди сини","exTr":"сая тунггу ди сини."},{"ms":"dekat","ru":"близко; около","ex":"Hotel saya dekat KLCC.","exRu":"Мой отель рядом с KLCC.","use":"dekat stesen — рядом со станцией. В речи часто «kat» вместо «di».","tr":"декат","exTr":"хотел сая декат кей-эл-си-си."},{"ms":"jauh","ru":"далеко","ex":"Putrajaya jauh dari sini?","exRu":"Путраджая далеко отсюда?","use":"tak jauh — недалеко, jauh sangat — очень далеко.","tr":"джаух","exTr":"путраджая джаух дари сини?"},{"ms":"kereta","ru":"машина, автомобиль","ex":"Kereta Grab sudah sampai.","exRu":"Машина Grab уже приехала.","use":"Малайзийское. В Индонезии «mobil», а «kereta» там — поезд! В Малайзии поезд — kereta api.","tr":"керэта","exTr":"керэта грэб судах сампай."}],"rule":{"title":"di, ke, dari: где, куда, откуда","ref":"g-place","text":["Русское «в» в малайском — два слова. di — где (на месте): di pejabat — в офисе (нахожусь). ke — куда (движение): ke pejabat — в офис (иду).","dari — откуда: dari pejabat — из офиса. Все три пишутся отдельно от следующего слова."],"ex":[{"ms":"Saya di stesen LRT.","ru":"Я на станции LRT.","tr":"сая ди стэсэн эл-ар-ти."},{"ms":"Saya nak pergi ke Putrajaya.","ru":"Я хочу поехать в Путраджаю.","tr":"сая на' перги ке путраджая."},{"ms":"Dia datang dari KLIA.","ru":"Он(а) едет из аэропорта KLIA.","tr":"дия датанг дари кей-эл-ай-эй."}],"mistake":"«Saya pergi di pejabat» — ошибка: с движением нужно ke. Проверка: вопрос «где?» — di, «куда?» — ke, «откуда?» — dari.","cmp":"Как русские «в офисе / в офис / из офиса» — только вместо окончаний разные предлоги."},"dialog":{"scene":"Grab от станции до Висма Путра, Путраджая.","img":"p_grab","lines":[{"n":"Encik Ravi","v":"m2","ms":"Selamat petang. Sasha, ya? Nak pergi ke Wisma Putra?","ru":"Добрый день. Саша, да? Едем в Висма Путра?","tr":"селамат петанг. саша, я? на' перги ке висма путра?"},{"n":"Sasha","v":"m","ms":"Ya, betul. Jauh dari sini?","ru":"Да, верно. Это далеко отсюда?","tr":"я, бетул. джаух дари сини?"},{"n":"Encik Ravi","v":"m2","ms":"Tak jauh sangat. Empat puluh minit, kalau tak jem.","ru":"Не очень. Минут сорок, если без пробок.","tr":"та' джаух сангат. эмпат пулух минит, калау та' джэм."},{"n":"Sasha","v":"m","ms":"Okey. Saya ada mesyuarat pukul tiga.","ru":"Окей. У меня встреча в три.","tr":"окей. сая ада мешуарат пукул тига."},{"n":"Encik Ravi","v":"m2","ms":"Jangan risau, sempat.","ru":"Не волнуйтесь, успеем.","tr":"джанган рисау, семпат."},{"n":"Encik Ravi","v":"m2","ms":"Kita dah sampai Putrajaya. Bangunan yang mana?","ru":"Мы уже в Путраджае. Какое здание?","tr":"кита дах сампай путраджая. бангунан янг мана?"},{"n":"Sasha","v":"m","ms":"Wisma Putra. Jalan terus, kemudian belok kanan.","ru":"Висма Путра. Прямо, потом направо.","tr":"висма путра. джалан терус, кемудиян бело' канан."},{"n":"Encik Ravi","v":"m2","ms":"Belok kanan… okey. Di sini?","ru":"Направо… окей. Здесь?","tr":"бело' канан… окей. ди сини?"},{"n":"Sasha","v":"m","ms":"Ya. Boleh berhenti di sini, dekat pintu itu?","ru":"Да. Можно остановиться здесь, у той двери?","tr":"я. болэх берхенти ди сини, декат пинту иту?"},{"n":"Encik Ravi","v":"m2","ms":"Boleh. Terima kasih, semoga berjaya!","ru":"Конечно. Спасибо, удачи!","tr":"болэх. терима касих, семога берджая!"},{"n":"Sasha","v":"m","ms":"Terima kasih, bang!","ru":"Спасибо!","tr":"терима касих, банг!"}]},"slang":[{"ms":"jem","ru":"пробка","ex":"Jalan ke KLCC jem teruk!","exRu":"По дороге к KLCC жуткая пробка!","ok":"Везде в разговоре. От английского jam.","no":"В официальном тексте: «kesesakan lalu lintas».","say":"jem","tr":"джэм","exTr":"джалан ке кей-эл-си-си джэм теру'!"},{"ms":"bang / kak","ru":"к мужчине / женщине чуть старше","ex":"Bang, berhenti sini.","exRu":"Брат, остановите здесь.","ok":"Водитель, продавец, официант. От abang (старший брат) и kakak (старшая сестра).","no":"В офисе к руководителю и к официальным лицам — Encik / Puan.","say":"bang / kak","tr":"банг / ка'","exTr":"банг, берхенти сини."}],"build":[{"ru":"Я хочу поехать в Путраджаю.","ms":"Saya nak pergi ke Putrajaya.","extra":["di","dari"],"tr":"сая на' перги ке путраджая."},{"ru":"Можно остановиться здесь?","ms":"Boleh berhenti di sini?","extra":["ke","jauh"],"tr":"болэх берхенти ди сини?"},{"ru":"Где станция LRT?","ms":"Stesen LRT di mana?","extra":["ke","dari"],"tr":"стэсэн эл-ар-ти ди мана?"}],"reply":[{"p":"Nak pergi ke mana?","pRu":"Куда едем?","o":["Ke KL Sentral.","Di KL Sentral.","Dari KL Sentral."],"a":0,"why":"Вопрос «куда?» — ответ с ke.","pTr":"на' перги ке мана?","oTr":["ке кей-эл сентрал.","ди кей-эл сентрал.","дари кей-эл сентрал."]},{"p":"Berhenti di sini?","pRu":"Здесь остановить?","o":["Ya, boleh. Terima kasih!","Belok di sini.","Jauh."],"a":0,"why":"Подтвердить и поблагодарить.","pTr":"берхенти ди сини?","oTr":["я, болэх. терима касих!","бело' ди сини.","джаух."]}],"test":[{"q":"«Я в офисе»:","o":["Saya ke pejabat.","Saya di pejabat.","Saya dari pejabat."],"a":1,"why":"Где? — di."},{"q":"«Иду в офис»:","o":["Saya pergi di pejabat.","Saya pergi ke pejabat.","Saya pergi pejabat di."],"a":1,"why":"Куда? — ke."},{"q":"«Kereta» в Малайзии —","o":["автомобиль","поезд","автобус"],"a":0,"why":"В Индонезии kereta — поезд, машина — mobil."},{"q":"Как сказать водителю «прямо»?","o":["jalan terus","belok kiri","berhenti"],"a":0,"why":"terus — прямо."},{"q":"«Naik Grab» —","o":["ехать на Grab","вызвать полицию","выйти из машины"],"a":0,"why":"naik + транспорт."},{"q":"В официальном отчёте «пробка» —","o":["jem","kesesakan lalu lintas","bang"],"a":1,"why":"jem — разговорное."}],"culture":"Grab в Малайзии заменяет такси: цена известна заранее, чаевые не обязательны. Водители любят поговорить — это отличная практика малайского. Путраджая — административная столица с министерствами, Куала-Лумпур — столица и деловой центр, между ними около 40 минут.","story":"Встреча с Хафизом в Путраджае. Саша впервые едет туда сам(а): сначала поезд от KL Sentral, потом Grab до министерства.","reading":{"title":"Cara pergi ke Wisma Putra","kind":"Инструкция от Хафиза","img":"p_lrt_platform","words":125,"gloss":[{"ms":"perjalanan","ru":"поездка, дорога","tr":"перджаланан"},{"ms":"kira-kira","ru":"примерно","tr":"кира-кира"},{"ms":"sendiri","ru":"свой, сам","tr":"сендири"},{"ms":"tempat letak kereta","ru":"парковка","tr":"темпат лета' керэта"},{"ms":"pelawat","ru":"посетитель","tr":"пелават"},{"ms":"bangunan","ru":"здание","tr":"бангунан"},{"ms":"pemeriksaan keselamatan","ru":"проверка безопасности","tr":"пемериксаан кеселаматан"},{"ms":"bawa","ru":"брать с собой","tr":"бава"}],"q":[{"q":"Сколько едет KLIA Transit до Путраджаи?","o":["Около 20 минут","Около 40 минут","15 минут"],"a":0},{"q":"Где парковка для посетителей?","o":["Слева от здания","Справа от здания","У станции"],"a":0},{"q":"Зачем приезжать на 15 минут раньше?","o":["Проверка безопасности","Обед","Встреча с Датуком"],"a":0}],"blocks":[{"h":"Письмо Хафиза: как добраться","v":"m2","lines":[{"ms":"Dari KL Sentral, awak boleh naik KLIA Transit ke stesen Putrajaya.","ru":"От KL Sentral можно доехать на KLIA Transit до станции Putrajaya.","tr":"дари кей-эл сентрал, ава' болэх наи' кей-эл-ай-эй трансит ке стэсэн путраджая."},{"ms":"Perjalanan kira-kira dua puluh minit.","ru":"Поездка занимает около двадцати минут.","tr":"перджаланан кира-кира дуа пулух минит."},{"ms":"Dari stesen Putrajaya, naik Grab atau bas ke Wisma Putra.","ru":"От станции Putrajaya — на Grab или автобусе до Висма Путра.","tr":"дари стэсэн путраджая, наи' грэб атау бас ке висма путра."},{"ms":"Wisma Putra tidak jauh dari stesen, kira-kira lima belas minit dengan kereta.","ru":"Висма Путра недалеко от станции — минут пятнадцать на машине.","tr":"висма путра тида' джаух дари стэсэн, кира-кира лима белас минит денган керэта."},{"ms":"Kalau naik kereta sendiri, jalan terus, kemudian belok kanan.","ru":"Если на своей машине — прямо, потом направо.","tr":"калау наи' керэта сендири, джалан терус, кемудиян бело' канан."},{"ms":"Tempat letak kereta pelawat ada di sebelah kiri bangunan.","ru":"Парковка для посетителей — слева от здания.","tr":"темпат лета' керэта пелават ада ди себелах кири бангунан."},{"ms":"Sila datang lima belas minit awal untuk pemeriksaan keselamatan.","ru":"Приезжайте на пятнадцать минут раньше: проверка безопасности.","tr":"сила датанг лима белас минит авал унту' пемериксаан кеселаматан."},{"ms":"Bawa pasport atau kad pelajar.","ru":"Возьмите паспорт или студенческий.","tr":"бава паспорт атау кад пеладжар."},{"ms":"Kita jumpa di lobi pukul tiga petang. Hafiz.","ru":"Встречаемся в лобби в три часа дня. Хафиз.","tr":"кита джумпа ди лоби пукул тига петанг. хафиз."}]}]},"writing":[{"kind":"chat","title":"Сообщение водителю Grab","img":"p_grab","task":"Водитель Grab пишет, что приехал. Напишите, где вы стоите (di…), во что одеты и попросите подождать минуту. Без сленга, вежливо.","from":{"n":"Encik Ravi","v":"m2","ms":"Saya dah sampai di stesen Putrajaya. Awak di mana?","ru":"Я уже у станции Putrajaya. Вы где?","tr":"сая дах сампай ди стэсэн путраджая. ава' ди мана?"},"need":[["Где вы (di)",["di "]],["Подождать",["tunggu"]],["Вежливость",["terima kasih","maaf","boleh"]]],"hint":[{"ms":"Saya di pintu utama.","ru":"Я у главного входа.","tr":"сая ди пинту утама."},{"ms":"Saya pakai baju biru.","ru":"Я в синей рубашке.","tr":"сая пакай баджу биру."},{"ms":"Boleh tunggu sebentar?","ru":"Можете подождать минутку?","tr":"болэх тунггу себентар?"}],"model":[{"ms":"Saya di pintu utama stesen, dekat kedai kopi.","ru":"Я у главного входа станции, возле кофейни.","tr":"сая ди пинту утама стэсэн, декат кедай копи."},{"ms":"Saya pakai baju biru.","ru":"Я в синей одежде.","tr":"сая пакай баджу биру."},{"ms":"Boleh tunggu satu minit? Terima kasih!","ru":"Подождёте минуту? Спасибо!","tr":"болэх тунггу сату минит? терима касих!"}]},{"kind":"chat","title":"Как доехать до кампуса","img":"p_lrt","task":"Друг из России прилетел и спрашивает, как добраться из KL Sentral до Universiti Malaya. Объясните маршрут: на чём ехать (naik), где выйти (berhenti), куда идти (jalan terus, belok).","need":[["naik",["naik"]],["ke / dari",["ke ","dari"]],["berhenti",["berhenti","turun"]],["Направление",["belok","jalan terus"]]],"hint":[{"ms":"Naik LRT ke stesen Universiti.","ru":"Садись на LRT до станции Universiti.","tr":"наи' эл-ар-ти ке стэсэн университи."},{"ms":"Dari sana naik Grab, kira-kira sepuluh minit.","ru":"Оттуда на Grab, минут десять.","tr":"дари сана наи' грэб, кира-кира сепулух минит."}],"model":[{"ms":"Dari KL Sentral, naik LRT ke stesen Universiti.","ru":"От KL Sentral садись на LRT до станции Universiti.","tr":"дари кей-эл сентрал, наи' эл-ар-ти ке стэсэн университи."},{"ms":"Berhenti di stesen Universiti.","ru":"Выходи на станции Universiti.","tr":"берхенти ди стэсэн университи."},{"ms":"Dari stesen, naik Grab ke Universiti Malaya, kira-kira sepuluh minit.","ru":"От станции на Grab до Университета Малайя, минут десять.","tr":"дари стэсэн, наи' грэб ке университи малая, кира-кира сепулух минит."},{"ms":"Di pintu utama, jalan terus, kemudian belok kiri ke Fakulti Sastera.","ru":"У главного входа прямо, потом налево к гуманитарному факультету.","tr":"ди пинту утама, джалан терус, кемудиян бело' кири ке факулти састера."}]}]},{"id":"d10","week":2,"day":10,"img":"p_lecture","ms":"Di universiti","title":"В универс лэх сая дуду' ди сини?"}],"mistake":"«Sila beri saya fail itu» — неуклюже: sila приглашает, а не просит. Правильно: «Tolong beri saya fail itu» или ещё мягче: «Boleh beri saya fail itu?».","cmp":"Как разница между «Прошу, садитесь» и «Будьте добры, передайте» — в малайском это разные слова."},"dialog":{"scene":"Ресепшен департамента протокола МИД, Путраджая.","img":"perdana","lines":[{"n":"Cik Nurul","v":"f","ms":"Selamat pagi. Boleh saya bantu?","ru":"Доброе утро. Чем могу помочь?","tr":"селамат паги. болэх сая банту?"},{"n":"Sasha","v":"m","ms":"Selamat pagi. Maaf mengganggu. Saya ada temu janji dengan Encik Hafiz pukul sepuluh.","ru":"Доброе утро. Извините за беспокойство. У меня встреча с господином Хафизом в десять.","tr":"селамат паги. мааф менгганггу. сая ада тему джанджи денган энчи' хафиз пукул сепулух."},{"n":"Cik Nurul","v":"f","ms":"Baik. Sila isi borang ini dan tunggu sebentar.","ru":"Хорошо. Заполните, пожалуйста, этот бланк и подождите минутку.","tr":"баи'. сила иси боранг ини дан тунггу себентар."},{"n":"Sasha","v":"m","ms":"Boleh saya pinjam pen?","ru":"Можно одолжить ручку?","tr":"болэх сая пинджам пэн?"},{"n":"Cik Nurul","v":"f","ms":"Boleh. Jemput duduk di sana.","ru":"Конечно. Присаживайтесь вон там.","tr":"болэх. джемпут дуду' ди сана."},{"n":"Cik Nurul","v":"f","ms":"Encik Hafiz minta maaf, beliau lewat sepuluh minit.","ru":"Господин Хафиз просит прощения, он задерживается на десять минут.","tr":"энчи' хафиз минта мааф, белияу лэват сепулух минит."},{"n":"Sasha","v":"m","ms":"Tidak mengapa. Saya tunggu.","ru":"Ничего страшного. Я подожду.","tr":"тида' менгапа. сая тунггу."},{"n":"Cik Nurul","v":"f","ms":"Terima kasih atas kesabaran. Jemput minum dulu.","ru":"Спасибо за терпение. Угощайтесь пока чаем.","tr":"терима касих атас кесабаран. джемпут минум дулу."},{"n":"Sasha","v":"m","ms":"Terima kasih banyak.","ru":"Большое спасибо.","tr":"терима касих баня'."}]},"slang":[{"ms":"takpe","ru":"ничего, всё нормально","ex":"Takpe, saya faham.","exRu":" "a":1,"why":"takpe — разговорное."},{"q":"Как начать разговор с занятым сотрудником?","o":["Maaf mengganggu…","Weh…","Boss…"],"a":0,"why":"«Извините за беспокойство…»."}],"culture":"Малайзийцы стараются не говорить прямое «нет». «Insya-Allah» на приглашение может значить и «приду», и вежливое «вряд ли»; «Nanti saya fikirkan» («я подумаю») — часто мягкий отказ. Если важно, уточните мягко: «Jadi, kita jumpa hari Selasa pukul tiga, ya?» — «Значит, встречаемся во вторник в три, да?»","story":"Снова в Путраджае, теперь в департаменте протокола. Хафиз задерживается, и Саша учится ждать и просить по-малайзийски вежливо.","reading":{"title":"Menunggu di kaunter","kind":"Табличка + дневник","img":"perdana","words":135,"gloss":[{"ms":"borang pelawat","ru":"бланк посетителя","tr":"боранг пелават"},{"ms":"tunjukkan","ru":"показать, предъявить","tr":"тунджуккан"},{"ms":"kad pengenalan","ru":"удостоверение личности","tr":"кад пенгеналан"},{"ms":"ruang menunggu","ru":"зона ожидания","tr":"руанг менунггу"},{"ms":"jangan","ru":"не (запрет)","tr":"джанган"},{"ms":"guna","ru":"пользоваться","tr":"гуна"},{"ms":"jarang","ru":"редко","tr":"джаранг"},{"ms":"maksud sebenar","ru":"настоящий смысл","tr":"максуд себенар"}],"q":[{"q":"Что нельзя делать в переговорной?","o":["Пользоваться телефоном","Пить чай","Заполнять бланк"],"a":0},{"q":"Сколько ждал(а) Саша?","o":["20 минут","10 минут","Час"],"a":0},{"q":"Что может значить «Nanti saya fikirkan»?","o":["Вежливый, мягкий отказ","Точное «да»","«Я опоздаю»"],"a":0}],"blocks":[{"h":"Табличка у ресепшена","v":"f","lines":[{"ms":"Selamat datang ke Bahagian Protokol.","ru":"Добро пожаловать в департамент протокола.","tr":"селамат датанг ке бахагиян протокол."},{"ms":"Sila isi borang pelawat dan tunjukkan kad pengenalan.","ru":"Заполните, пожалуйста, бланк посетителя и предъявите удостоверение.","tr":"сила иси боранг пелават дан тунджуккан кад пенгеналан."},{"ms":"Sila tunggu di ruang menunggu. Pegawai akan panggil anda.","ru":"Ожидайте в зоне ожидания. Сотрудник вас пригласит.","tr":"сила тунггу ди руанг менунггу. пегавай акан панггил анда."},{"ms":"Jangan guna telefon bimbit di bilik mesyuarat.","ru":"Не пользуйтесь телефоном в переговорной.","tr":"джанган гуна тэлэфон бимбит ди били' мешуарат."},{"ms":"Terima kasih atas kerjasama anda.","ru":"Спасибо за содействие.","tr":"терима касих атас керджасама анда."}]},{"h":"Дневник Саши","v":"m","lines":[{"ms":"Hari ini saya tunggu Encik Hafiz dua puluh minit.","ru":"Сегодня я ждал(а) господина Хафиза двадцать минут.","tr":"хари ини сая тунггу энчи' хафиз дуа пулух минит."},{"ms":"Cik Nurul minta maaf banyak kali dan jemput saya minum teh.","ru":"Нурул много раз извинялась и предложила мне чаю.","tr":"чи' нурул минта мааф баня' кали дан джемпут сая минум тэх."},{"ms":"Saya cakap: «Tidak mengapa.» Saya faham, Encik Hafiz sangat sibuk.","ru":"Я сказал(а): «Ничего страшного». Понимаю, господин Хафиз очень занят.","tr":"сая чакап: «тида' менгапа.» сая фахам, энчи' хафиз сангат сибу'."},{"ms":"Di Malaysia, orang jarang cakap «tidak» terus.","ru":"В Малайзии редко говорят «нет» прямо.","tr":"ди малайсия, оранг джаранг чакап «тида'» терус."},{"ms":"Mereka cakap «Insya-Allah» atau «Nanti saya fikirkan».","ru":"Говорят «Иншааллах» или «Я подумаю».","tr":"мерека чакап «инша-аллах» атау «нанти сая фикиркан»."},{"ms":"Saya mesti belajar dengar maksud sebenar.","ru":"Мне нужно научиться слышать настоящий смысл.","tr":"сая мести беладжар денгар максуд себенар."}]}]},"writing":[{"kind":"chat","title":"Перенос встречи","img":"p_putrajaya","task":"Поезд задерживается. Вежливо напишите Хафизу: извинитесь за беспокойство, объясните причину, попросите перенести встречу на 11:00.","need":[["Извинение",["maaf"]],["Причина",["lewat","tren","kereta api"]],["Просьба",["boleh","minta","mohon"]],["Новое время",["pukul sebelas"]]],"hint":[{"ms":"Maaf mengganggu, Encik Hafiz.","ru":"Извините за беспокойство, господин Хафиз.","tr":"мааф менгганггу, энчи' хафиз."},{"ms":"Kereta api lewat.","ru" ,"ru":"работать","ex":"Saya bekerja di Kuala Lumpur.","exRu":"Я работаю в Куала-Лумпуре.","use":"Нейтрально-официально. В разговоре часто просто kerja: «Awak kerja di mana?».","tr":"бекерджа","exTr":"сая бекерджа ди куала лумпур."},{"ms":"syarikat","ru":"компания, фирма","ex":"Syarikat kami dari Rusia.","exRu":"Наша компания из России.","use":"Любая фирма. «Sdn. Bhd.» в названии — аналог ООО.","ar":"syarikat ← араб. شركة; тат. ширкәт","tr":"шарикат","exTr":"шарикат ками дари русия."},{"ms":"kerajaan","ru":"правительство; государственный","ex":"Dia pegawai kerajaan.","exRu":"Он(а) госслужащий.","use":"От raja — правитель. Малайзийское; в Индонезии правительство — pemerintah.","tr":"кераджаан","exTr":"дия пегавай кераджаан."},{"ms":"swasta","ru":"частный (сектор)","ex":"Saya bekerja di sektor swasta.","exRu":"Я работаю в частном секторе.","use":"kerajaan и swasta — госсектор и частный.","tr":"сваста","exTr":"сая бекерджа ди сэктор сваста."},{"ms":"kementerian","ru":"министерство","ex":"Kementerian Luar Negeri di Putrajaya.","exRu":"Министерство иностранных дел — в Путраджае.","use":"Kementerian Luar Negeri (KLN) — МИД; его здание и неофициальное имя — Wisma Putra.","tr":"кементэриян","exTr":"кементэриян луар негери ди путраджая."},{"ms":"jawatan","ru":"должность","ex":"Apa jawatan encik?","exRu":"Какая у вас должность?","use":"Вопрос при знакомстве на форуме — нормален.","tr":"джаватан","exTr":"апа джаватан энчи'?"},{"ms":"pengurus","ru":"менеджер, управляющий","ex":"Beliau pengurus besar syarikat itu.","exRu":"Он(а) генеральный директор той компании.","use":"pengurus besar — генеральный директор. В Индонезии — manajer.","tr":"пенгурус","exTr":"белияу пенгурус бесар шарикат иту."},{"ms":"pegawai","ru":"служащий, должностное лицо","ex":"Pegawai protokol akan sambut kita.","exRu":"Нас встретит сотрудник протокола.","use":"Особенно в госсекторе: Pegawai Tadbir dan Diplomatik (PTD) — дипломатическая и административная служба.","tr":"пегавай","exTr":"пегавай протокол акан самбут кита."},{"ms":"setiausaha","ru":"секретарь","ex":"Setiausaha Datuk akan telefon awak.","exRu":"Секретарь Датука вам позвонит.","use":"И секретарь, и высокий пост: Ketua Setiausaha — генеральный секретарь министерства. В Индонезии — sekretaris.","tr":"сетияусаха","exTr":"сетияусаха дату' акан тэлэфон ава'."},{"ms":"bahagian","ru":"отдел, департамент","ex":"Saya di Bahagian Eropah.","exRu":"Я в Европейском департаменте.","use":"Структура министерства: Bahagian → Unit → Seksyen.","tr":"бахагиян","exTr":"сая ди бахагиян эропах."},{"ms":"bertanggungjawab","ru":"отвечать (за)","ex":"Saya bertanggungjawab atas kerjasama dengan ASEAN.","exRu":"Я отвечаю за сотрудничество с АСЕАН.","use":"bertanggungjawab atas + что-то. tanggungjawab — ответственность.","tr":"бертанггунгджаваб","exTr":"сая бертанггунгджаваб атас керджасама денган асиан."},{"ms":"berasal dari","ru":"быть родом из","ex":"Saya berasal dari Kazan.","exRu":"Я родом из Казани.","use":"Чуть официальнее, чем просто «dari». Хорошо звучит при знакомстве на форуме.","tr":"берасал дари","exTr":"сая берасал дари казань."}],"rule":{"title":"Приставка ber-: из слова — действие","ref":"g-ber","text":["Приставка ber- превращает слово в действие или состояние «иметь / делать это»: kerja (работа) → bekerja (работать), asal (происхождение) → berasal (быть родом).","Перед словом, где в первом слоге есть r, ber- теряет r: ber + kerja = bekerja, ber + ajar = belajar. Глаголы с ber- обычно не требуют дополнения."],"ex":[{"ms":"Saya bekerja di kementerian.","ru":"Я работаю в министерстве.","tr":"сая бекерджа ди кементэриян."},{"ms":"Kami bermesyuarat setiap Isnin.","ru":"У нас совещание каждый понедельник.","tr":"ками бермешуарат сетияп иснин."},{"ms":"Mereka berasal dari Sabah.","ru":"Они родом с Сабаха.","tr":"мерека берасал дари сабах."}],"mistake":"В разговоре можно «Saya kerja di…», но на интервью, в резюме и в речи — bekerja. Обратная ошибка — добавлять ber- к любому глаголу: «berpergi» не существует, только pergi.","cmp":"Похоже на русское «работа → работать»: от существительного делаем глагол. В малайском это делает приставка ber-."},"dialog":{"scene":"Нетворкинг на бизнес-форуме, Конгресс-центр Куала-Лумпура.","img":"p_seminar","lines":[{"n":"Puan Lee","v":"f","ms":"Selamat petang. Saya Lee, pengurus syarikat logistik di Port Klang.","ru":"Добрый день. Я Ли, менеджер логистической компании в Порт-Кланге.","tr":"селамат петанг. сая ли, пенгурус шарикат логисти' ди порт кланг."},{"n":"Sasha","v":"m","ms":"Selamat petang, Puan Lee. Saya Sasha, pelatih di Bahagian Eropah, Kementerian Luar Negeri.","ru":"Добрый день, госпожа Ли. Я Саша, стажёр Европейского департамента МИД.","tr":"селамат петанг, пуан ли. сая саша, пелатих ди бахагиян эропах, кементэриян луар негери."},{"n":"Puan Lee","v":"f","ms":"Menarik! Awak berasal dari mana?","ru":"Интересно! А вы откуда родом?","tr":"менари'! ава' берасал дари мана?"},{"n":"Sasha","v":"m","ms":"Saya berasal dari Kazan, Rusia. Puan bekerja di sektor swasta?","ru":"Я родом из Казани, Россия. Вы работаете в частном секторе?","tr":"сая берасал дари казань, русия. пуан бекерджа ди сэктор сваста?"},{"n":"Puan Lee","v":"f","ms":"Ya. Tetapi syarikat kami banyak bekerjasama dengan kerajaan.","ru":"Да. Но наша компания много сотрудничает с правительством.","tr":"я. тетапи шарикат ками баня' бекерджасама денган кераджаан."},{"n":"Sasha","v":"m","ms":"Puan bertanggungjawab atas apa?","ru":"А за что вы отвечаете?","tr":"пуан бертанггунгджаваб атас апа?"},{"n":"Puan Lee","v":"f","ms":"Saya bertanggungjawab atas pasaran Eropah dan Rusia. Ini kad nama saya.","ru":"Я отвечаю за рынки Европы и России. Вот моя визитка.","tr":"сая бертанггунгджаваб атас пасаран эропах дан русия. ини кад нама сая."},{"n":"Sasha","v":"m","ms":"Terima kasih. Boleh kita berhubung lagi?","ru":"Спасибо. Будем на связи?","tr":"терима касих. болэх кита берхубунг лаги?"},{"n":"Puan Lee","v":"f","ms":"Sudah tentu. WhatsApp saya bila-bila masa.","ru":"Конечно. Пишите в WhatsApp в любое время.","tr":"судах тенту. уотсап сая била-била маса."}]},"slang":[{"ms":"makan gaji","ru":"работать по найму","ex":"Saya makan gaji je, bukan bos.","exRu":"Я просто наёмный работник, не начальник.","ok":"Шутливо с друзьями. Буквально «есть зарплату».","no":"В резюме и на собеседовании: «bekerja sebagai…» — «работаю в должности…».","say":"makan gaji","tr":"макан гаджи","exTr":"сая макан гаджи дже, букан бос."},{"ms":"bos","ru":"начальник, шеф","ex":"Bos saya cuti hari ini.","exRu":"Мой шеф сегодня в отпуске.","ok":"Разговор с коллегами.","no":"При самом начальнике и в письмах: Ketua, Pengarah или Encik / Puan + имя.","say":"bos","tr":"бос","exTr":"бос сая чути хари ини."}],"build":[{"ru":"Я работаю в министерстве.","ms":"Saya bekerja di kementerian.","extra":["kerja","ke"],"tr":"сая бекерджа ди кементэриян."},{"ru":"Я родом из Казани.","ms":"Saya berasal dari Kazan.","extra":["di","ke"],"tr":"сая берасал дари казань."},{"ru":"Какая у вас должность?","ms":"Apa jawatan encik?","extra":["siapa","pengurus"],"tr":"апа джаватан энчи'?"}],"reply":[{"p":"Awak bekerja di mana?","pRu":"Где вы работаете?","o":["Saya bekerja di sebuah syarikat swasta.","Saya berasal dari Rusia.","Pukul sembilan."],"a":0,"why":"Спросили «где работаете» — называем место. sebuah — «одна» (счётное слово).","pTr":"ава' бекерджа ди мана?","oTr":["сая бекерджа ди себуах шарикат сваста.","сая берасал дари русия.","пукул сембилан."]},{"p":"Ini kad nama saya.","pRu":"Вот моя визитка.","o":["Terima kasih, Puan. Boleh kita berhubung lagi?","Saya bos.","Takpe."],"a":0,"why":"Поблагодарить и предложить остаться на связи.","pTr":"ини кад нама сая.","oTr":["терима касих, пуан. болэх кита берхубунг лаги?","сая бос.","та'пе."]}],"test":[{"q":"«Компания» (из арабского شركة):","o":["syarikat","syukur","sekolah"],"a":0,"why":"syarikat ← شركة."},{"q":"«Правительство» по-малайзийски:","o":["pemerintah","kerajaan","raja"],"a":1,"why":"pemerintah — индонезийское."},{"q":"«Bekerja» — это ber- + …","o":["kerja","bekal","erj . Agak panjang, tetapi selesa.","ru":"Хорошо, спасибо. Долгий, но комфортный.","tr":"баи', терима касих. ага' панджанг, тетапи селэса."},{"n":"Puan Zarina","v":"f","ms":"Bagi pihak kementerian, kami berbesar hati menyambut delegasi tuan-tuan.","ru":"От имени министерства для нас большая честь принимать вашу делегацию.","tr":"баги пиха' кементэриян, ками бербесар хати менямбут дэлэгаси туан-туан."},{"n":"Puan Zarina","v":"f","ms":"Ini Encik Hafiz. Beliau mengurus lawatan rasmi ini.","ru":"Это господин Хафиз. Он отвечает за организацию официального визита.","tr":"ини энчи' хафиз. белияу менгурус лаватан расми ини."},{"n":"Encik Hafiz","v":"m2","ms":"Selamat datang. Esok pagi ada kunjungan hormat, dan malam esok jamuan makan malam.","ru":"Добро пожаловать. Завтра утром — визит вежливости, а вечером — официальный ужин.","tr":"селамат датанг. эсо' паги ада кунджунган хормат, дан малам эсо' джамуан макан малам."},{"n":"Sasha","v":"m","ms":"Terima kasih. Delegasi kami sangat menghargai kerjasama ini.","ru":"Спасибо. Наша делегация очень ценит это сотрудничество.","tr":"терима касих. дэлэгаси ками сангат менгхаргай керджасама ини."},{"n":"Encik Hafiz","v":"m2","ms":"Kami juga. Sila ikut saya, kereta sudah menunggu.","ru":"Мы тоже. Прошу за мной, машина ждёт.","tr":"ками джуга. сила икут сая, керэта судах менунггу."}]},"slang":[{"ms":"alamak","ru":"ой! вот чёрт!","ex":"Alamak, saya lupa fail!","exRu":"Ой, я забыл(а) папку!","ok":"Лёгкая досада среди коллег и друзей.","no":"При делегации и старших — сдержанно: «Maaf, sebentar».","say":"alamak","tr":"алама'","exTr":"алама', сая лупа фаил!"},{"ms":"best","ru":"классно, супер (Manglish)","ex":"Jamuan semalam memang best!","exRu":"Вчерашний ужин был просто супер!","ok":"С друзьями и коллегами.","no":"В официальном отзыве: «sangat baik», «amat berjaya» (очень успешный).","say":"best","tr":"бэст","exTr":"джамуан семалам меманг бэст!"}],"build":[{"ru":"Добро пожаловать в Малайзию.","ms":"Selamat datang ke Malaysia.","extra":["di","dari"],"tr":"селамат датанг ке малайсия."},{"ru":"Для нас большая честь.","ms":"Kami berbesar hati.","extra":["kita","besar"],"tr":"ками бербесар хати."},{"ru":"Пожалуйста, следуйте за мной.","ms":"Sila ikut saya.","extra":["tolong","jom"],"tr":"сила икут сая."}],"reply":[{"p":"Bagaimana penerbangan tuan?","pRu":"Как прошёл ваш перелёт?","o":["Baik, terima kasih. Agak panjang tetapi selesa.","Best gila!","Alamak."],"a":0,"why":"Официально и вежливо.","pTr":"багаимана пенербанган туан?","oTr":["баи', терима касих. ага' панджанг тетапи селэса.","бэст гила!","алама'."]},{"p":"Selamat datang ke Malaysia!","pRu":"Добро пожаловать в Малайзию!","o":["Terima kasih. Kami berbesar hati berada di sini.","Sama-sama.","Jom!"],"a":0,"why":"«Спасибо. Для нас честь быть здесь». (berada — находиться)","pTr":"селамат датанг ке малайсия!","oTr":["терима касих. ками бербесар хати берада ди сини.","сама-сама.","джом!"]}],"test":[{"q":"Малайзийская форма приветствия:","o":["Selamat datang di Malaysia","Selamat datang ke Malaysia","Selamat datang dari Malaysia"],"a":1,"why":"В Малайзии — ke; di — индонезийский вариант."},{"q":"«Kunjungan hormat» —","o":["визит вежливости","официальный ужин","частный визит"],"a":0,"why":"Courtesy call."},{"q":"Официальная пара для «nak»:","o":["ingin / hendak","mahu lah","jom"],"a":0,"why":"nak — разговорное."},{"q":"«Hubungan dua hala» —","o":["двусторонние отношения","две стороны дороги","двойное гражданство"],"a":0,"why":"dua hala — в две стороны."},{"q":"«Гость» по-малайзийски:","o":["tamu","tetamu","tamuan"],"a":1,"why":"tamu — индонезийское."},{"q":"Как при делегации сказать, что машина подана?","o":["Kereta dah sampai, jom!","Kereta sudah sampai. Sila ikut saya.","Alamak, kereta!"],"a":1,"why":"Официальный регистр."}],"culture":"В официальной речи сначала приветствуют гостей по старшинству: «Yang Berbahagia Datuk…, tuan-tuan dan puan-puan yang dihormati». На официальном ужине перед едой может быть короткая молитва (doa) — дождитесь её окончания. Алкоголь на мероприятиях госструктур обычно не подают.","story":"Главный день: российская делегация прилетает в KLIA. Саша — офицер связи между делегацией и министерством. Всё на официальном регистре.","reading":{"title":"Program lawatan rasmi","kind":"Программа визита + новость","img":"p_klia","words":145,"gloss":[{"ms":"tiba","ru":"прибывать","tr":"тиба"},{"ms":"perbincangan","ru":"переговоры, обсуждение","tr":"пербинчанган"},{"ms":"pendidikan","ru":"образование","tr":"пендидикан"},{"ms":"pelancongan","ru":"туризм","tr":"пеланчонган"},{"ms":"kedua","ru":"второй","tr":"кедуа"},{"ms":"mengukuhkan","ru":"укреплять","tr":"менгукухкан"},{"ms":"bersetuju","ru":"соглашаться","tr":"берсетуджу"},{"ms":"bidang","ru":"область, сфера","tr":"биданг"},{"ms":"mesra","ru":"тёплый, дружелюбный","tr":"месра"}],"q":[{"q":"Во сколько прилетает делегация?","o":["В 7 утра","В 10 утра","В 2 часа дня"],"a":0},{"q":"Что запланировано на 14:00?","o":["Переговоры об образовании и туризме","Визит вежливости","Ужин"],"a":0},{"q":"В какой сфере стороны расширят сотрудничество?","o":["Образование","Оборона","Энергетика"],"a":0}],"blocks":[{"h":"Программа визита","v":"f","lines":[{"ms":"Program Lawatan Rasmi Delegasi Persekutuan Rusia ke Malaysia.","ru":"Программа официального визита делегации Российской Федерации в Малайзию.","tr":"програм лаватан расми дэлэгаси персекутуан русия ке малайсия."},{"ms":"Hari pertama: delegasi tiba di KLIA pada pukul tujuh pagi.","ru":"День первый: делегация прибывает в KLIA в 7:00.","tr":"хари пертама: дэлэгаси тиба ди кей-эл-ай-эй пада пукул туджух паги."},{"ms":"Pegawai protokol akan menyambut delegasi di ruang VIP.","ru":"Сотрудники протокола встречают делегацию в VIP-зале.","tr":"пегавай протокол акан менямбут дэлэгаси ди руанг ви-ай-пи."},{"ms":"Pukul sepuluh pagi: kunjungan hormat kepada Ketua Setiausaha Kementerian Luar Negeri.","ru":"10:00 — визит вежливости к генеральному секретарю МИД.","tr":"пукул сепулух паги: кунджунган хормат кепада кетуа сетияусаха кементэриян луар негери."},{"ms":"Pukul dua petang: perbincangan tentang kerjasama pendidikan dan pelancongan.","ru":"14:00 — переговоры о сотрудничестве в образовании и туризме.","tr":"пукул дуа петанг: пербинчанган тентанг керджасама пендидикан дан пеланчонган."},{"ms":"Pukul lapan malam: jamuan makan malam rasmi di Putrajaya.","ru":"20:00 — официальный ужин в Путраджае.","tr":"пукул лапан малам: джамуан макан малам расми ди путраджая."},{"ms":"Hari kedua: lawatan ke Universiti Malaya dan pertemuan dengan pelajar.","ru":"День второй: посещение Университета Малайя и встреча со студентами.","tr":"хари кедуа: лаватан ке университи малая дан пертемуан денган пеладжар."}]},{"h":"Новость дня","v":"m2","lines":[{"ms":"Malaysia dan Rusia mengukuhkan hubungan dua hala.","ru":"Малайзия и Россия укрепляют двусторонние отношения.","tr":"малайсия дан русия менгукухкан хубунган дуа хала."},{"ms":"Kedua-dua pihak bersetuju untuk meningkatkan kerjasama dalam bidang pendidikan.","ru":"Стороны договорились расширить сотрудничество в сфере образования.","tr":"кедуа-дуа пиха' берсетуджу унту' менингкаткан керджасама далам биданг пендидикан."},{"ms":"Ketua delegasi Rusia berkata, mereka berbesar hati dengan sambutan yang mesra.","ru":"Глава российской делегации сказал, что они тронуты тёплым приёмом.","tr":"кетуа дэлэгаси русия берката, мерека бербесар хати денган самбутан янг месра."}]}]},"writing":[{"kind":"speech","title":"Приветственное слово","img":"p_flag_table","task":"Подготовьте короткое приветствие (4 предложения), которое вы скажете малайзийским коллегам от имени российской делегации: благодарность, «для нас честь», сотрудничество, двусторонние отношения. Только официальный регистр.","need":[["От имени",["bagi pihak"]],["«Для нас честь»",["berbesar hati"]],["Сотрудничество",["kerjasama"]],["Отношения",["hubungan dua hala"]]],"hint":[{"ms":"Bagi pihak delegasi Rusia, …","ru":"От имени российской делегации…","tr":"баги пиха' дэлэгаси русия, …"},{"ms":"Kami ingin mengucapkan terima kasih atas sambutan yang mesra.","ru":"Хотим поблагодарить за тёплый приём.","tr":"ками ингин менгучапкан терима касих атас самбутан янг месра."}],"model":[{"ms":"Tuan-tuan dan puan-puan,","ru":"Дамы и господа!","tr":"туан-туан дан пуан-пуан,"},{"ms":"Bagi pihak delegasi Rusia, kami ingin mengucapkan terima kasih atas sambutan yang mesra.","ru":"От имени российской делегации благодарим за тёплый приём.","tr":"баги пиха' дэлэгаси русия, ками ингин менгучапкан терима касих атас самбутан янг месра."},{"ms":"Kami berbesar hati berada di Malaysia.","ru":"Для нас большая честь быть в Малайзии.","tr":"ками бербесар хати берада ди малайсия."},{"ms":"Kami berharap kerjasama kita dalam bidang pendidikan akan bertambah kukuh.","ru":"Надеемся, что наше сотрудничество в сфере образования станет ещё крепче.","tr":"ками берхарап керджасама кита далам биданг пендидикан акан бертамбах кукух."},{"ms":"Hubungan dua hala Malaysia dan Rusia sangat penting bagi kami. Terima kasih.","ru":"Двусторонние отношения Малайзии и России очень важны для нас. Спасибо.","tr":"хубунган дуа хала малайсия дан русия сангат пентинг баги ками. терима касих."}]},{"kind":"chat","title":"Сообщение в протокол","img":"p_klia_hall","task":"Напишите Зарине (протокол): делегация уже в отеле, спросите время официального ужина и нужно ли быть в официальной одежде. Нейтрально-официально, без nak, dah, tak.","need":[["Делегация прибыла",["sudah tiba","sudah sampai"]],["Вопрос о времени",["pukul berapa"]],["Ужин",["jamuan"]],["Вежливость",["terima kasih","puan"]]],"hint":[{"ms":"Adakah delegasi perlu memakai pakaian rasmi?","ru":"Нужна ли делегации официальная одежда?","tr":"адаках дэлэгаси перлу мемакай пакаиян расми?"}],"model":[{"ms":"Puan Zarina, delegasi Rusia sudah tiba di hotel.","ru":"Госпожа Зарина, российская делегация уже в отеле.","tr":"пуан зарина, дэлэгаси русия судах тиба ди хотел."},{"ms":"Jamuan makan malam bermula pukul berapa?","ru":"Во сколько начинается официальный ужин?","tr":"джамуан макан малам бермула пукул берапа?"},{"ms":"Adakah delegasi perlu memakai pakaian rasmi?","ru":"Нужна ли делегации официальная одежда?","tr":"адаках дэлэгаси перлу мемакай пакаиян расми?"},{"ms":"Terima kasih, Puan.","ru":"Спасибо.","tr":"терима касих, пуан."}]}]},{"id":"d14","week":2,"day":14,"img":"p_desk_write","ms":"Emel rasmi","title":"Официальное письмо","goal":"Понимать и писать короткое официальное письмо по малайзийскому образцу, подтверждать встречу по телефону.","can":["Знать схему письма: обращение → PERKARA → текст → подпись","Использовать формулы: Dengan hormatnya, Sukacita dimaklumkan, Sekian, terima kasih","Вежливо попросить ответ (mohon maklum balas)","Различать формальный и чат-стиль"],"words":[{"ms":"Tuan/Puan","say":"Tuan, Puan","ru":"Уважаемый(ая) (обращение в письме)","ex":"Tuan, saya merujuk kepada emel tuan.","exRu":"Уважаемый господин, ссылаюсь на ваше письмо.","use":"Адресат неизвестен — «Tuan/Puan». Известен — «Datuk», «Puan Salmah». Никогда не «Sayang Tuan»: sayang — «дорогой» в романтическом смысле!","tr":"туан, пуан","exTr":"туан, сая меруджу' кепада эмэл туан."},{"ms":"PERKARA","say":"Perkara","ru":"Тема, предмет (письма)","ex":"PERKARA: LAWATAN DELEGASI RUSIA","say_ex":"Perkara: Lawatan delegasi Rusia.","exRu":"ТЕМА: ВИЗИТ РОССИЙСКОЙ ДЕЛЕГАЦИИ","use":"Заголовок письма — заглавными, жирным. В e-mail то же самое пишут в теме.","tr":"перкара","exTr":"перкара: лаватан дэлэгаси русия."},{"ms":"Dengan hormatnya","ru":"С уважением (вступление)","ex":"Dengan hormatnya, saya merujuk kepada perkara di atas.","exRu":"С уважением, ссылаюсь на вышеуказанный вопрос.","use":"Первая строка официального письма. Не путать с подписью в конце.","ar":"hormat ← араб. حرمة «уважение»","tr":"денган хорматня","exTr":"денган хорматня, сая меруджу' кепада перкара ди атас."},{"ms":"merujuk kepada","ru":"ссылаясь на","ex":"Merujuk kepada perbualan telefon semalam.","exRu":"Ссылаясь на вчерашний телефонный разговор.","use":"Вторая фраза почти любого официального письма.","tr":"меруджу' кепада","exTr":"меруджу' кепада пербуалан тэлэфон семалам."},{"ms":"Sukacita dimaklumkan","ru":"Рады сообщить","ex":"Sukacita dimaklumkan bahawa mesyuarat akan diadakan pada hari Selasa.","exRu":"Рады сообщить, что совещание состоится во вторник.","use":"Формула хорошей новости. di- — пассив (неделя 9): «сообщается».","ar":"maklum ← араб. معلوم «известный»","tr":"сукачита дима'лумкан","exTr":"сукачита дима'лумкан бахава мешуарат акан диядакан пада хари селаса."},{"ms":"untuk makluman","ru":"для сведения","ex":"Untuk makluman tuan, jadual lawatan dilampirkan.","exRu":"К вашему сведению: график визита прилагается.","use":"Официальное FYI.","tr":"унту' ма'луман","exTr":"унту' ма'луман туан, джадуал лаватан дилампиркан."},{"ms":"mohon","ru":"просить (официально)","ex":"Saya mohon maklum balas sebelum hari Jumaat.","exRu":"Прошу ответить до пятницы.","use":"Официальная форма minta. «Mohon maaf» — приносим извинения.","tr":"мохон","exTr":"сая мохон ма'лум балас себелум хари джума'ат."},{"ms":"maklum balas","ru":"ответ, обратная связь","ex":"Terima kasih atas maklum balas tuan.","exRu":"Благодарим за ваш ответ.","tr":"ма'лум балас","exTr":"терима касих атас ма'лум балас туан."},{"ms":"lampiran","ru":"приложение (к письму)","ex":"Sila rujuk lampiran.","exRu":"Пожалуйста, см. приложение.","use":"dilampirkan — прилагается.","tr":"лампиран","exTr":"сила руджу' лампиран."},{"ms":"Kerjasama tuan amatlah dihargai","ru":"Будем признательны за содействие","ex":"Kerjasama Datuk dalam hal ini amatlah dihargai.","exRu":"Будем признательны за ваше содействие в этом вопросе, Датук.","use":"Предпоследняя строка письма с просьбой.","tr":"керджасама туан аматлах дихаргай","exTr":"керджасама дату' далам хал ини аматлах дихаргай."},{"ms":"Sekian, terima kasih","ru":"На этом всё, спасибо","ex":"Sekian untuk makluman. Terima kasih.","exRu":"Сообщаем для сведения. Спасибо.","use":"Классическая концовка: sekian — «на этом всё».","tr":"секиян, терима касих","exTr":"секиян унту' ма'луман. терима касих."},{"ms":"Yang benar","ru":"Искренне ваш(а)","ex":"Yang benar, Sasha, Pegawai Penghubung.","exRu":"Искренне ваш(а), Саша, офицер связи.","use":"Перед подписью. В госписьмах также «Saya yang menjalankan amanah» — «исполняющий доверенное».","tr":"янг бенар","exTr":"янг бенар, саша, пегавай пенгхубунг."}],"rule":{"title":"Схема официального письма","ref":"g-letter","text":["Официальное письмо в Малайзии строится по жёсткой схеме: обращение → PERKARA (тема) → «Dengan hormatnya, saya merujuk kepada…» → пронумерованные абзацы → «Sekian, terima kasih» → «Yang benar» и подпись.","Никаких tak, nak, awak — только полные официальные формы. Слова на di- (dimaklumkan, dilampirkan) — пассив: «сообщается», «прилагается»."],"ex":[{"ms":"Dengan hormatnya, saya merujuk kepada perkara di atas.","ru":"С уважением, ссылаюсь на вышеуказанный вопрос.","tr":"денган хорматня, сая меруджу' кепада перкара ди атас."},{"ms":"Sukacita dimaklumkan bahawa delegasi akan tiba pada hari Isnin.","ru":"Рады сообщить, что делегация прибудет в понедельник.","tr":"сукачита дима'лумкан бахава дэлэгаси акан тиба пада хари иснин."},{"ms":"Sekian, terima kasih.","ru":"На этом всё, спасибо.","tr":"секиян, терима касих."}],"mistake":"Переводить «Dear Sir» как «Sayang Tuan» или «Tuan yang dikasihi» — получается любовное письмо. Обращение — просто «Tuan/Puan,» или «Datuk,».","cmp":"Похоже на русский деловой стиль: «Уважаемый…», «Тема:», «В ответ на Ваше письмо…», «С уважением». Схема почти та же.","letter":[{"ms":"Puan Salmah,","ru":"Уважаемая госпожа Салмах!","tr":"пуан салмах,"},{"ms":"PERKARA: LAWATAN DELEGASI RUSIA KE WISMA PUTRA","say":"Perkara: lawatan delegasi Rusia ke Wisma Putra.","ru":"ТЕМА: ВИЗИТ РОССИЙСКОЙ ДЕЛЕГАЦИИ В МИД","b":true,"tr":"перкара: лаватан дэлэгаси русия ке висма путра."},{"ms":"Dengan hormatnya, saya merujuk kepada perkara di atas dan perbualan telefon kita semalam.","ru":"С уважением, ссылаюсь на вышеуказанный вопрос и наш вчерашний телефонный разговор.","tr":"денган хорматня, сая меруджу' кепада перкара ди атас дан пербуалан тэлэфон кита семалам."},{"n":"2.","ms":"Sukacita dimaklumkan bahawa delegasi Rusia bersetuju dengan jadual lawatan pada hari Selasa, pukul sepuluh pagi.","ru":"Рады сообщить, что российская делегация согласна с графиком визита во вторник в 10:00.","tr":"сукачита дима'лумкан бахава дэлэгаси русия берсетуджу денган джадуал лаватан пада хари селаса, пукул сепулух паги."},{"n":"3.","ms":"Bersama-sama ini dilampirkan senarai nama ahli delegasi untuk makluman Puan.","ru":"К письму для вашего сведения прилагается список членов делегации.","tr":"берсама-сама ини дилампиркан сенарай нама ахли дэлэгаси унту' ма'луман пуан."},{"n":"4.","ms":"Saya mohon maklum balas Puan sebelum hari Jumaat. Kerjasama Puan amatlah dihargai.","ru":"Прошу вас ответить до пятницы. Будем признательны за содействие.","tr":"сая мохон ма'лум балас пуан себелум хари джума'ат. керджасама пуан аматлах дихаргай."},{"ms":"Sekian, terima kasih.","ru":"На этом всё, спасибо.","tr":"секиян, терима касих."},{"ms":"Yang benar,","ru":"Искренне ваш(а),","tr":"янг бенар,"},{"ms":"Sasha","ru":"Саша","sig":true,"tr":"саша"},{"ms":"Pegawai Penghubung, Delegasi Rusia","ru":"Офицер связи российской делегации","sig":true,"tr":"пегавай пенгхубунг, дэлэгаси русия"}]},"dialog":{"scene":"Звонок в секретариат МИД: подтвердить координационное совещание.","img":"p_flag_table","lines":[{"n":"Sasha","v":"m","ms":"Assalamualaikum, Puan Salmah. Saya Sasha dari delegasi Rusia.","ru":"Ассаламу алейкум, госпожа Салмах. Это Саша из российской делегации.","tr":"ассаламу'алаикум, пуан салмах. сая саша дари дэлэгаси русия."},{"n":"Puan Salmah","v":"f","ms":"Waalaikumussalam. Ya, Sasha, boleh saya bantu?","ru":"Ва алейкум ассалам. Да, Саша, чем могу помочь?","tr":"ва'алаикумуссалам. я, саша, болэх сая банту?"},{"n":"Sasha","v":"m","ms":"Saya merujuk kepada emel Puan semalam tentang lawatan delegasi.","ru":"Я по поводу вашего вчерашнего письма о визите делегации.","tr":"сая меруджу' кепада эмэл пуан семалам тентанг лаватан дэлэгаси."},{"n":"Puan Salmah","v":"f","ms":"Ya. Awak sudah terima lampiran jadual lawatan?","ru":"Да. Вы получили приложение с графиком визита?","tr":"я. ава' судах терима лампиран джадуал лаватан?"},{"n":"Sasha","v":"m","ms":"Sudah, terima kasih. Saya mohon pengesahan: mesyuarat pada hari Selasa, pukul sepuluh pagi?","ru":"Да, спасибо. Прошу подтвердить: встреча во вторник в десять утра?","tr":"судах, терима касих. сая мохон пенгесахан: мешуарат пада хари селаса, пукул сепулух паги?"},{"n":"Puan Salmah","v":"f","ms":"Betul. Sukacita dimaklumkan juga, Datuk Kamal akan hadir.","ru":"Верно. Также рады сообщить, что будет присутствовать Датук Камал.","tr":"бетул. сукачита дима'лумкан джуга, дату' камал акан хадир."},{"n":"Sasha","v":"m","ms":"Baik. Saya akan hantar maklum balas bertulis hari ini.","ru":"Хорошо. Сегодня отправлю письменный ответ.","tr":"баи'. сая акан хантар ма'лум балас бертулис хари ини."},{"n":"Puan Salmah","v":"f","ms":"Terima kasih. Kerjasama awak amatlah dihargai.","ru":"Спасибо. Мы признательны за содействие.","tr":"терима касих. керджасама ава' аматлах дихаргай."},{"n":"Sasha","v":"m","ms":"Sama-sama, Puan. Selamat petang.","ru":"Не за что. Всего доброго.","tr":"сама-сама, пуан. селамат петанг."}]},"slang":[{"ms":"noted","ru":"принято (офисный Manglish)","ex":"Noted, terima kasih.","exRu":"Принято, спасибо.","ok":"Короткий ответ коллеге в WhatsApp.","no":"Датуку или в письме: «Baik, terima kasih atas makluman».","say":"noted","tr":"ноутед","exTr":"ноутед, терима касих."},{"ms":"PM","ru":"написать в личку","ex":"Nanti PM saya nombor dia.","exRu":"Скинь мне потом в личку его номер.","ok":"Рабочие и дружеские чаты.","no":"Официальная переписка.","say":"PM","tr":"пи-эм","exTr":"нанти пи-эм сая номбор дия."}],"build":[{"ru":"Прошу ответить.","ms":"Saya mohon maklum balas.","extra":["minta","tolong"],"tr":"сая мохон ма'лум балас."},{"ru":"На этом всё, спасибо.","ms":"Sekian, terima kasih.","extra":["sama-s
