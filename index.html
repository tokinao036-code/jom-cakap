товка к визиту делегации почти завершена.","use":"sedia — готовый; persediaan — подготовка.","tr":"перседияан","exTr":"перседияан унту' лаватан дэлэгаси хампир сияп."},{"ms":"pada pendapat saya","ru":"по моему мнению","ex":"Pada pendapat saya, kita perlu dua penterjemah.","exRu":"По-моему, нам нужны два переводчика.","use":"Разговорно — «saya rasa…» (я думаю).","tr":"пада пендапат сая","exTr":"пада пендапат сая, кита перлу дуа пентерджемах."},{"ms":"saya setuju","ru":"я согласен (согласна)","ex":"Saya setuju dengan cadangan Cik Mei Ling.","exRu":"Я согласен (согласна) с предложением Мэй Линг.","tr":"сая сетуджу","exTr":"сая сетуджу денган чаданган чи' мэй линг."},{"ms":"saya kurang setuju","ru":"я не совсем согласен","ex":"Maaf, saya kurang setuju kerana masa tidak cukup.","exRu":"Простите, я не совсем согласен (согласна): времени не хватает.","use":"Мягкое «нет»: kurang — «недостаточно». Прямое «tidak setuju» звучит резко.","tr":"сая куранг сетуджу","exTr":"мааф, сая куранг сетуджу керана маса тида' чукуп."},{"ms":"cadangan","ru":"предложение","ex":"Ada cadangan lain?","exRu":"Есть другие предложения?","tr":"чаданган","exTr":"ада чаданган лаин?"},{"ms":"masalah","ru":"проблема","ex":"Masalahnya, hotel penuh.","exRu":"Проблема в том, что отель заполнен.","ar":"مسألة mas'ala — вопрос, задача","tr":"масалах","exTr":"масалахня, хотел пенух."},{"ms":"penyelesaian","ru":"решение (проблемы)","ex":"Kita perlu cari penyelesaian.","exRu":"Нам нужно найти решение.","use":"selesai — завершён; penyelesaian — решение проблемы.","tr":"пеньелесаиян","exTr":"кита перлу чари пеньелесаиян."},{"ms":"keputusan","ru":"решение (принятое); результат","ex":"Keputusan mesyuarat: kita guna Hotel Putra.","exRu":"Решение совещания: используем отель «Путра».","use":"Ещё «результаты»: keputusan peperiksaan — результаты экзамена.","tr":"кепутусан","exTr":"кепутусан мешуарат: кита гуна хотел путра."},{"ms":"tarikh akhir","ru":"крайний срок","ex":"Tarikh akhir hari Jumaat.","exRu":"Крайний срок — пятница.","tr":"тарих ахир","exTr":"тарих ахир хари джума'ат."},{"ms":"minit mesyuarat","ru":"протокол совещания","ex":"Sasha, tolong sediakan minit mesyuarat.","exRu":"Саша, подготовьте, пожалуйста, протокол.","tr":"минит мешуарат","exTr":"саша, толонг седиякан минит мешуарат."},{"ms":"membincangkan","ru":"обсуждать (что-то)","ex":"Hari ini kita membincangkan jadual lawatan.","exRu":"Сегодня обсуждаем программу визита.","use":"bincang — обсуждать; mem-…-kan — «обсуждать что-то» официально.","tr":"мембинчангкан","exTr":"хари ини кита мембинчангкан джадуал лаватан."}],"rule":{"title":"Вежливое мнение и несогласие","ref":"g-register","text":["Мнение вводим формулой: Pada pendapat saya, … / Saya rasa, … Согласие: Saya setuju dengan … Мягкое несогласие: Saya kurang setuju kerana …","Возражение смягчают извинением и похвалой: «Cadangan yang baik, tetapi…» — «Хорошее предложение, но…»."],"ex":[{"ms":"Pada pendapat saya, mesyuarat ini penting.","ru":"По-моему, это совещание важное.","tr":"пада пендапат сая, мешуарат ини пентинг."},{"ms":"Saya setuju dengan Datuk.","ru":"Я согласен (согласна) с Датуком.","tr":"сая сетуджу денган дату'."},{"ms":"Cadangan yang baik, tetapi saya kurang setuju kerana kosnya tinggi.","ru":"Хорошее предложение, но я не совсем согласен (согласна): дорого.","tr":"чаданган янг баи', тетапи сая куранг сетуджу керана косня тингги."}],"mistake":"Говорить старшему «Tidak, itu salah!» («Нет, это неправильно!»). Так на совещании не возражают: скажите «Maaf, saya kurang setuju…».","cmp":"Как русское «позвольте не согласиться» вместо «нет»: малайская культура ценит мягкость, особенно со старшими."},"dialog":{"scene":"Подготовительное совещание перед визитом. Ведёт Датук Камал.","img":"p_meeting","lines":[{"n":"Datuk Kamal","v":"m2","ms":"Hari ini kita membincangkan persediaan lawatan. Perkara pertama: hotel.","ru":"Сегодня обсуждаем подготовку визита. Первый пункт: гостиница.","tr":"хари ини кита мембинчангкан перседияан лаватан. перкара пертама: хотел."},{"  лапоран эй-эс-эй-пи."}],"build":[{"ru":"По-моему, нам нужны два переводчика.","ms":"Pada pendapat saya, kita perlu dua penterjemah.","extra":["setuju","kami"],"tr":"пада пендапат сая, кита перлу дуа пентерджемах."},{"ru":"Я согласен с Датуком.","ms":"Saya setuju dengan Datuk.","extra":["kurang","untuk"],"tr":"сая сетуджу денган дату'."},{"ru":"Крайний срок — пятница.","ms":"Tarikh akhir hari Jumaat.","extra":["keputusan","Isnin"],"tr":"тарих ахир хари джума'ат."}],"reply":[{"p":"Apa pendapat awak, Sasha?","pRu":"Каково ваше мнение, Саша?","o":["Pada pendapat saya, kita perlu lebih masa.","Pendapat saya Sasha.","Settle tak?"],"a":0,"why":"Высказать мнение формулой.","pTr":"апа пендапат ава', саша?","oTr":["пада пендапат сая, кита перлу лебэх маса.","пендапат сая саша.","сетел та'?"]},{"p":"Kita batalkan lawatan ke Melaka.","pRu":"Отменим поездку в Мелаку.","o":["Maaf, saya kurang setuju kerana delegasi berminat.","Tidak! Itu salah!","Tarikh akhir."],"a":0,"why":"Мягкое несогласие с причиной.","pTr":"кита баталкан лаватан ке мелака.","oTr":["мааф, сая куранг сетуджу керана дэлэгаси берминат.","тида'! иту салах!","тарих ахир."]}],"test":[{"q":"Мягкое «я не согласен»:","o":["Saya kurang setuju.","Saya tidak mahu!","Itu salah!"],"a":0,"why":"kurang setuju — вежливо."},{"q":"«Pada pendapat saya» —","o":["по моему мнению","на моём месте","по моему плану"],"a":0,"why":"pendapat — мнение."},{"q":"«Tarikh akhir» —","o":["крайний срок","последний день недели","конец года"],"a":0,"why":"Дедлайн."},{"q":"«Keputusan» на совещании —","o":["принятое решение","проблема","повестка"],"a":0,"why":"Также «результаты»."},{"q":"«Minit mesyuarat» —","o":["протокол совещания","минута тишины","время совещания"],"a":0,"why":"Запись решений."},{"q":"Как смягчить возражение?","o":["«Cadangan yang baik, tetapi…»","«Tidak!»","Промолчать и уйти"],"a":0,"why":"Сначала похвалить."}],"culture":"Малайзийские совещания строятся на muafakat — согласии. Младшие обычно говорят после старших, а прямой отказ считается невежливым: его прячут за «insya-Allah» или «kita tengok dulu» («посмотрим»). Решение часто принимает самый старший, а протокол (minit mesyuarat) рассылают всем до конца дня.","story":"Подготовительное совещание перед визитом: не хватает номеров в отеле, нужен второй переводчик, а программа визита ещё не утверждена. Саша впервые высказывает мнение при Датуке — и учится не соглашаться вежливо.","reading":{"title":"Minit mesyuarat","kind":"Протокол совещания","img":"p_boardroom","words":120,"gloss":[{"ms":"pengerusi","ru":"председатель","tr":"пенгеруси"},{"ms":"hadir","ru":"присутствовали","tr":"хадир"},{"ms":"mencadangkan","ru":"предлагать","tr":"менчадангкан"},{"ms":"dipendekkan","ru":"сокращается","tr":"дипендеккан"},{"ms":"bersurai","ru":"расходиться, закрыться (о собрании)","tr":"берсурай"}],"q":[{"q":"Кто предложил двух переводчиков?","o":["Мэй Линг","Саша","Датук Камал"],"a":0},{"q":"Почему Хаким против поездки в Мелаку на весь день?","o":["Не хватает времени","Дорого","Плохая погода"],"a":0},{"q":"Какое решение по Мелаке?","o":["Сократить до полудня","Отменить","Продлить на два дня"],"a":0}],"blocks":[{"h":"Протокол, подготовил(а) Саша","v":"m","lines":[{"ms":"MINIT MESYUARAT PERSEDIAAN LAWATAN DELEGASI RUSIA","ru":"ПРОТОКОЛ ПОДГОТОВИТЕЛЬНОГО СОВЕЩАНИЯ ПО ВИЗИТУ РОССИЙСКОЙ ДЕЛЕГАЦИИ","tr":"минит мешуарат перседияан лаватан дэлэгаси русия"},{"ms":"Tarikh: 4 November. Pengerusi: Datuk Kamal.","ru":"Дата: 4 ноября. Председатель: Датук Камал.","tr":"тарих: 4 новембер. пенгеруси: дату' камал."},{"ms":"Hadir: Cik Mei Ling, Encik Hakim, Sasha.","ru":"Присутствовали: Мэй Линг, господин Хаким, Саша.","tr":"хадир: чи' мэй линг, энчи' хаким, саша."},{"ms":"Perkara 1: Hotel. Masalahnya, Hotel Putra hanya ada sepuluh bilik.","ru":"Пункт 1: Гостиница. Проблема: в отеле «Путра» всего десять номеров.","tr":"перкара 1: хотел. масалахня, хотел путра ханя ада сепулух били'."},{"ms":"Keputusan: Sasha akan hubungi hotel tentang bangunan baru. Tarikh akhir: Rabu.","ru" кин эрат."}],"model":[{"ms":"Yang Berbahagia Datuk Kamal,","ru":"Уважаемый Датук Камал,","tr":"янг бербахагия дату' камал,"},{"ms":"Terima kasih atas jamuan makan malam yang indah.","ru":"Благодарим за прекрасный ужин.","tr":"терима касих атас джамуан макан малам янг индах."},{"ms":"Kami amat menghargai hidangan tradisional dan persembahan zapin.","ru":"Мы высоко ценим традиционные блюда и танец заппин.","tr":"ками амат менгхаргай хиданган традисионал дан персембахан запин."},{"ms":"Semoga kerjasama Malaysia dan Rusia semakin erat.","ru":"Пусть сотрудничество Малайзии и России крепнет.","tr":"семога керджасама малайсия дан русия семакин эрат."},{"ms":"Sekian, terima kasih.","ru":"С уважением.","tr":"секиян, терима касих."}]},{"kind":"speech","title":"Тост-благодарность за столом","img":"m_rendang","task":"Вам предложили сказать пару слов за ужином. Напишите речь из 3–4 предложений: обращение, комплимент блюдам, благодарность хозяевам, пожелание.","need":[["Обращение к присутствующим",["tuan-tuan","puan-puan","datuk"]],["Комплимент",["sungguh","sedap","indah"]],["Благодарность",["terima kasih"]],["Пожелание",["semoga"]]],"hint":[{"ms":"Tuan-tuan dan puan-puan,","ru":"Дамы и господа,","tr":"туан-туан дан пуан-пуан,"},{"ms":"Sungguh sedap hidangan malam ini.","ru":"Поистине вкусный сегодня ужин.","tr":"сунггух седап хиданган малам ини."}],"model":[{"ms":"Datuk, tuan-tuan dan puan-puan,","ru":"Датук, дамы и господа,","tr":"дату', туан-туан дан пуан-пуан,"},{"ms":"Sungguh sedap hidangan malam ini.","ru":"Поистине вкусный сегодня ужин.","tr":"сунггух седап хиданган малам ини."},{"ms":"Terima kasih atas layanan yang mesra.","ru":"Спасибо за тёплый приём.","tr":"терима касих атас лаянан янг месра."},{"ms":"Semoga persahabatan kita kekal selamanya.","ru":"Пусть наша дружба будет вечной.","tr":"семога персахабатан кита кекал селаманя."}]}],"n":30,"schema":{"pat":["x","o","d"],"rows":[[["x","Terima kasih atas","спасибо за"],["o","layanan","приём"],["x","yang","который"],["d","baik","хороший"]],[["x","Sungguh","поистине"],["d","sedap","вкусный"],["o","rendang ini","этот ренданг"]]],"note":"Официально: terima kasih atas…, kami amat menghargai…, комплимент — sungguh + слово."}},{"id":"d14","week":3,"day":14,"img":"p_desk_write","meme":["m_tahu"],"ms":"Emel rasmi","title":"Официальное письмо","goal":"Понимать и писать короткое официальное письмо по малайзийскому образцу, подтверждать встречу по телефону.","can":["Знать схему письма: обращение → PERKARA → текст → подпись","Использовать формулы: Dengan hormatnya, Sukacita dimaklumkan, Sekian, terima kasih","Вежливо попросить ответ (mohon maklum balas)","Различать формальный и чат-стиль"],"words":[{"ms":"Tuan/Puan","say":"Tuan, Puan","ru":"Уважаемый(ая) (обращение в письме)","ex":"Tuan, saya merujuk kepada emel tuan.","exRu":"Уважаемый господин, ссылаюсь на ваше письмо.","use":"Адресат неизвестен — «Tuan/Puan». Известен — «Datuk», «Puan Salmah». Никогда не «Sayang Tuan»: sayang — «дорогой» в романтическом смысле!","tr":"туан, пуан","exTr":"туан, сая меруджу' кепада эмэл туан."},{"ms":"PERKARA","say":"Perkara","ru":"Тема, предмет (письма)","ex":"PERKARA: LAWATAN DELEGASI RUSIA","say_ex":"Perkara: Lawatan delegasi Rusia.","exRu":"ТЕМА: ВИЗИТ РОССИЙСКОЙ ДЕЛЕГАЦИИ","use":"Заголовок письма — заглавными, жирным. В e-mail то же самое пишут в теме.","tr":"перкара","exTr":"перкара: лаватан дэлэгаси русия."},{"ms":"Dengan hormatnya","ru":"С уважением (вступление)","ex":"Dengan hormatnya, saya merujuk kepada perkara di atas.","exRu":"С уважением, ссылаюсь на вышеуказанный вопрос.","use":"Первая строка официального письма. Не путать с подписью в конце.","ar":"hormat ← араб. حرمة «уважение»","tr":"денган хорматня","exTr":"денган хорматня, сая меруджу' кепада перкара ди атас."},{"ms":"merujuk kepada","ru":"ссылаясь на","ex":"Merujuk kepada perbualan telefon semalam.","exRu":"Ссылаясь на вчерашний телефонный разговор.","use":"Вторая фраза почти любого официального письма.","tr":"меруджу' кепада","exTr":"меруджу' кепада пербуалан тэлэфон семалам."},{"ms":"Sukacita dimaklumkan","ru":"Рады сообщить","ex":"Sukacita dimaklumkan bahawa mesyuarat akan diadakan pada hari Selasa.","exRu":"Рады сообщить, что совещание состоится во вторник.","use":"Формула хорошей новости. di- — пассив (неделя 9): «сообщается».","ar":"maklum ← араб. معلوم «известный»","tr":"сукачита дима'лумкан","exTr":"сукачита дима'лумкан бахава мешуарат акан диядакан пада хари селаса."},{"ms":"untuk makluman","ru":"для сведения","ex":"Untuk makluman tuan, jadual lawatan dilampirkan.","exRu":"К вашему сведению: график визита прилагается.","use":"Официальное FYI.","tr":"унту' ма'луман","exTr":"унту' ма'луман туан, джадуал лаватан дилампиркан."},{"ms":"mohon","ru":"просить (официально)","ex":"Saya mohon maklum balas sebelum hari Jumaat.","exRu":"Прошу ответить до пятницы.","use":"Официальная форма minta. «Mohon maaf» — приносим извинения.","tr":"мохон","exTr":"сая мохон ма'лум балас себелум хари джума'ат."},{"ms":"maklum balas","ru":"ответ, обратная связь","ex":"Terima kasih atas maklum balas tuan.","exRu":"Благодарим за ваш ответ.","tr":"ма'лум балас","exTr":"терима касих атас ма'лум балас туан."},{"ms":"lampiran","ru":"приложение (к письму)","ex":"Sila rujuk lampiran.","exRu":"Пожалуйста, см. приложение.","use":"dilampirkan — прилагается.","tr":"лампиран","exTr":"сила руджу' лампиран."},{"ms":"Kerjasama tuan amatlah dihargai","ru":"Будем признательны за содействие","ex":"Kerjasama Datuk dalam hal ini amatlah dihargai.","exRu":"Будем признательны за ваше содействие в этом вопросе, Датук.","use":"Предпоследняя строка письма с просьбой.","tr":"керджасама туан аматлах дихаргай","exTr":"керджасама дату' далам хал ини аматлах дихаргай."},{"ms":"Sekian, terima kasih","ru":"На этом всё, спасибо","ex":"Sekian untuk makluman. Terima kasih.","exRu":"Сообщаем для сведения. Спасибо.","use":"Классическая концовка: sekian — «на этом всё».","tr":"секиян, терима касих","exTr":"секиян унту' ма'луман. терима касих."},{"ms":"Yang benar","ru":"Искренне ваш(а)","ex":"Yang benar, Sasha, Pegawai Penghubung.","exRu":"Искренне ваш(а), Саша, офицер связи.","use":"Перед подписью. В госписьмах также «Saya yang menjalankan amanah» — «исполняющий доверенное».","tr":"янг бенар","exTr":"янг бенар, саша, пегавай пенгхубунг."}],"rule":{"title":"Схема официального письма","ref":"g-letter","text":["Официальное письмо в Малайзии строится по жёсткой схеме: обращение → PERKARA (тема) → «Dengan hormatnya, saya merujuk kepada…» → пронумерованные абзацы → «Sekian, terima kasih» → «Yang benar» и подпись.","Никаких tak, nak, awak — только полные официальные формы. Слова на di- (dimaklumkan, dilampirkan) — пассив: «сообщается», «прилагается»."],"ex":[{"ms":"Dengan hormatnya, saya merujuk kepada perkara di atas.","ru":"С уважением, ссылаюсь на вышеуказанный вопрос.","tr":"денган хорматня, сая меруджу' кепада перкара ди атас."},{"ms":"Sukacita dimaklumkan bahawa delegasi akan tiba pada hari Isnin.","ru":"Рады сообщить, что делегация прибудет в понедельник.","tr":"сукачита дима'лумкан бахава дэлэгаси акан тиба пада хари иснин."},{"ms":"Sekian, terima kasih.","ru":"На этом всё, спасибо.","tr":"секиян, терима касих."}],"mistake":"Переводить «Dear Sir» как «Sayang Tuan» или «Tuan yang dikasihi» — получается любовное письмо. Обращение — просто «Tuan/Puan,» или «Datuk,».","cmp":"Похоже на русский деловой стиль: «Уважаемый…», «Тема:», «В ответ на Ваше письмо…», «С уважением». Схема почти та же.","letter":[{"ms":"Puan Salmah,","ru":"Уважаемая госпожа Салмах!","tr":"пуан салмах,"},{"ms":"PERKARA: LAWATAN DELEGASI RUSIA KE WISMA PUTRA","say":"Perkara: lawatan delegasi Rusia ke Wisma Putra.","ru":"ТЕМА: ВИЗИТ РОССИЙСКОЙ ДЕЛЕГАЦИИ В МИД","b":true,"tr":"перкара: лаватан дэлэгаси русия ке висма путра."},{"ms":"Dengan hormatnya, saya merujuk kepada perkara di atas dan perbualan telefon kita semalam.","ru":"С уважением, ссылаюсь на вышеуказанный вопрос и наш вчерашний телефонный разговор.","tr":"денган хорматня, сая меруджу' кепада перкара ди атас дан пербуалан тэлэфон кита семалам."},{"n":"2.","ms":"Sukacita dimaklumkan bahawa delegasi Rusia bersetuju dengan jadual lawatan pada hari Selasa, pukul sepuluh pagi.","ru":"Рады сообщить, что российская делегация согласна с графиком визита во вторник в 10:00.","tr":"сукачита дима'лумкан бахава дэлэгаси русия берсетуджу денган джадуал лаватан пада хари селаса, пукул сепулух паги."},{"n":"3.","ms":"Bersama-sama ini dilampirkan senarai nama ahli delegasi untuk makluman Puan.","ru":"К письму для вашего сведения прилагается список членов делегации.","tr":"берсама-сама ини дилампиркан сенарай нама ахли дэлэгаси унту' ма'луман пуан."},{"n":"4.","ms":"Saya mohon maklum balas Puan sebelum hari Jumaat. Kerjasama Puan amatlah dihargai.","ru":"Прошу вас ответить до пятницы. Будем признательны за содействие.","tr":"сая мохон ма'лум балас пуан себелум хари джума'ат. керджасама пуан аматлах дихаргай."},{"ms":"Sekian, terima kasih.","ru":"На этом всё, спасибо.","tr":"секиян, терима касих."},{"ms":"Yang benar,","ru":"Искренне ваш(а),","tr":"янг бенар,"},{"ms":"Sasha","ru":"Саша","sig":true,"tr":"саша"},{"ms":"Pegawai Penghubung, Delegasi Rusia","ru":"Офицер связи российской делегации","sig":true,"tr":"пегавай пенгхубунг, дэлэгаси русия"}]},"dialog":{"scene":"Звонок в секретариат МИД: подтвердить координационное совещание.","img":"p_flag_table","lines":[{"n":"Sasha","v":"m","ms":"Assalamualaikum, Puan Salmah. Saya Sasha dari delegasi Rusia.","ru":"Ассаламу алейкум, госпожа Салмах. Это Саша из российской делегации.","tr":"ассаламу'алаикум, пуан салмах. сая саша дари дэлэгаси русия."},{"n":"Puan Salmah","v":"f","ms":"Waalaikumussalam. Ya, Sasha, boleh saya bantu?","ru":"Ва алейкум ассалам. Да, Саша, чем могу помочь?","tr":"ва'алаикумуссалам. я, саша, болэх сая банту?"},{"n":"Sasha","v":"m","ms":"Saya merujuk kepada emel Puan semalam tentang lawatan delegasi.","ru":"Я по поводу вашего вчерашнего письма о визите делегации.","tr":"сая меруджу' кепада эмэл пуан семалам тентанг лаватан дэлэгаси."},{"n":"Puan Salmah","v":"f","ms":"Ya. Awak sudah terima lampiran jadual lawatan?","ru":"Да. Вы получили приложение с графиком визита?","tr":"я. ава' судах терима лампиран джадуал лаватан?"},{"n":"Sasha","v":"m","ms":"Sudah, terima kasih. Saya mohon pengesahan: mesyuarat pada hari Selasa, pukul sepuluh pagi?","ru":"Да, спасибо. Прошу подтвердить: встреча во вторник в десять утра?","tr":"судах, терима касих. сая мохон пенгесахан: мешуарат пада хари селаса, пукул сепулух паги?"},{"n":"Puan Salmah","v":"f","ms":"Betul. Sukacita dimaklumkan juga, Datuk Kamal akan hadir.","ru":"Верно. Также рады сообщить, что будет присутствовать Датук Камал.","tr":"бетул. сукачита дима'лумкан джуга, дату' камал акан хадир."},{"n":"Sasha","v":"m","ms":"Baik. Saya akan hantar maklum balas bertulis hari ini.","ru":"Хорошо. Сегодня отправлю письменный ответ.","tr":"баи'. сая акан хантар ма'лум балас бертулис хари ини."},{"n":"Puan Salmah","v":"f","ms":"Terima kasih. Kerjasama awak amatlah dihargai.","ru":"Спасибо. Мы признательны за содействие.","tr":"терима касих. керджасама ава' аматлах дихаргай."},{"n":"Sasha","v":"m","ms":"Sama-sama, Puan. Selamat petang.","ru":"Не за что. Всего доброго.","tr":"сама-сама, пуан. селамат петанг."}]},"slang":[{"ms":"noted","ru":"принято (офисный Manglish)","ex":"Noted, terima kasih.","exRu":"Принято, спасибо.","ok":"Короткий ответ коллеге в WhatsApp.","no":"Датуку или в письме: «Baik, terima kasih atas makluman».","say":"noted","tr":"ноутед","exTr":"ноутед, терима касих."},{"ms":"PM","ru":"написать в личку","ex":"Nanti PM saya nombor dia.","exRu":"Скинь мне потом в личку его номер.","ok":"Рабочие и дружеские чаты.","no":"Официальная переписка.","say":"PM","tr":"пи-эм","exTr":"нанти пи-эм сая номбор дия."}],"build":[{"ru":"Прошу ответить.","ms":"Saya mohon maklum balas.","extra":["minta","tolong"],"tr":"сая мохон ма'лум балас."},{"ru":"На этом всё, спасибо.","ms":"Sekian, terima kasih.","extra":["sama-sama","jumpa"],"tr":"секиян, терима ения."}},{"id":"g-ber","title":"Приставка ber-","short":"kerja → bekerja, asal → berasal","lesson":"d12","text":["ber- делает из слова глагол со смыслом «иметь / делать / находиться в состоянии»: kerja → bekerja (работать), mesyuarat → bermesyuarat (проводить совещание).","Перед словами, где в первом слоге есть r, получается be-: bekerja. Исключение, которое надо запомнить: ber + ajar = belajar."],"term":"Приставка — частица в начале слова, меняющая его смысл (как русское «по-» в «работать — поработать»).","table":{"head":["Корень","С ber-","Значение"],"rows":[["kerja (работа)","bekerja","работать"],["asal (происхождение)","berasal","быть родом"],["mesyuarat (совещание)","bermesyuarat","совещаться"],["tanggungjawab (ответственность)","bertanggungjawab","отвечать за"],["cakap (говорить)","bercakap","разговаривать"],["ajar (учить)","belajar","учиться"]]},"ex":[{"ms":"Saya bekerja di kementerian.","ru":"Я работаю в министерстве.","tr":"сая бекерджа ди кементэриян."},{"ms":"Kami bermesyuarat setiap Isnin.","ru":"У нас совещание каждый понедельник.","tr":"ками бермешуарат сетияп иснин."},{"ms":"Mereka berasal dari Sabah.","ru":"Они родом с Сабаха.","tr":"мерека берасал дари сабах."}],"cmp":"Похоже на русское образование глаголов от существительных: «работа → работать», «совет → совещаться».","schema":{"pat":["s","v","l"],"rows":[[["s","Saya","я"],["v","bekerja","работаю"],["l","di Wisma Putra","в Висма Путра"]],[["s","Dia","она"],["v","berasal","родом"],["l","dari Sabah","из Сабаха"]]],"note":"ber- + слово = действие или состояние: kerja → bekerja, asal → berasal."}},{"id":"g-register","title":"Разговорный и официальный регистр","short":"tak / tidak, nak / ingin, dah / sudah","lesson":"d13","text":["В Малайзии разговорный и официальный малайский заметно различаются. Ошибка регистра звучит так же странно, как «чё как, господин министр?»","Правило: с друзьями — разговорные формы; на работе в разговоре — нейтральные; в письмах, речах и с делегациями — официальные."],"term":  Малайзия","sub":"Традиция + современная аранжировка","text":"Поп-песни с мелодиями асли, джогета и запина и традиционными инструментами. Визитная карточка — «Cindai» Сити Нурхализы.","songs":[{"ms":"Cindai","ru":"Сити Нурхализа","tr":"чиндай"}],"img":null,"tr":"ирама малайсия","say":[]},{"ms":"Pop yeh-yeh","genre":"Гитарный поп 60-х","ru":"Поп йе-йе","sub":"1965–1971","text":"Малайские гитарные группы (kugiran) под влиянием Beatles; название — от припева «yeah, yeah». Звезда эпохи — A. Ramlie с песней «Oh Fatimah». Сегодня жанр возродила группа MASDO.","songs":[{"ms":"Oh Fatimah","ru":"A. Ramlie, 1960-е","tr":"ох фатимах"}],"yt":"A Ramlie Oh Fatimah","img":null,"tr":"поп йех-йех","say":[]},{"ms":"Rock kapak","genre":"Мелодичный хард-рок","ru":"Рок капак — «рок с топориком»","sub":"Конец 80-х — 90-е","text":"Длинные волосы, кожаные куртки, мощный вокал и баллады о любви. Группы Search, Wings, XPDC, May; королева жанра — Ella. Название придумала пресса — с лёгкой иронией.","img":null,"tr":"роч' капа'","say":[],"songs":[]},{"ms":"Balada","genre":"Баллада","ru":"Баллада","sub":"Самый любимый жанр конкурсов","text":"Медленные песни о любви и разлуке с кульминацией в конце. Большинство победителей Anugerah Juara Lagu — баллады.","img":null,"tr":"балада","say":[],"songs":[]},{"ms":"Nasyid","genre":"Исламская песня","ru":"Нашид","sub":"Голоса и ударные","text":"Песни о вере и нравственности, часто а капелла с ударными. Бум 90-х начался с альбома Raihan «Puji-Pujian».","img":null,"tr":"нашид","say":[],"songs":[]},{"ms":"Dangdut","genre":"Танцевальная поп-музыка","ru":"Дангдут","sub":"Из Индонезии, популярен в Малайзии","text":"Ритмичная музыка с барабаном gendang и индийскими и арабскими мотивами. Индонезийский по происхождению, но в 2000–2010-х пережил в Малайзии бурное возрождение.","img":null,"tr":"дангдут","say":[],"songs":[]},{"ms":"Rap Melayu","genre":"Хип-хоп","ru":"Малайский рэп","sub":"С конца 90-х","text":"От Too Phat до Joe Flizzow и нового поколения. Отличительная черта — смесь малайского, английского и сленга в одной строке.","img":null,"tr":"рап мелаю","say":[],"songs":[]},{"ms":"Indie","genre":"Инди-рок, инди-поп","ru":"Инди","sub":"2000-е — сейчас","text":"Независимые группы с гитарным звуком: Hujan (с 2005 года), Bunkface и другие; сегодня — независимые артисты вроде Mimifly, которые побеждают крупные лейблы.","songs":[{"ms":"Pagi Yang Gelap","ru":"Hujan — «Тёмное утро»","tr":"паги янг гелап"},{"ms":"Situasi","ru":"Bunkface — «Ситуация»","tr":"ситуаси"}],"yt":"Hujan Pagi Yang Gelap","img":null,"tr":"индиэ","say":[]},{"ms":"Lagu raya","genre":"Праздничная песня","ru":"Праздничные песни","sub":"Звучат весь месяц Шавваль","text":"Отдельный «жанр» по сути: каждый год выходят новые песни к Хари Рае, но больше всего любят старые — Saloma, Sudirman, P. Ramlee, M. Nasir.","songs":[{"ms":"Satu Hari Di Hari Raya","ru":"М. Насир","tr":"сату хари ди хари рая"},{"ms":"Dendang Perantau","ru":"П. Рамли","tr":"денданг перантау"}],"img":null,"tr":"лагу рая","say":[]}]}]},{"id":"era","ms":"Zaman muzik","title":"Эпохи музыки","img":"h_stadium","intro":"Эпохальная музыка — от театра бангсаван до TikTok. Если знать, какая песня из какого времени, легко поддержать разговор с людьми любого возраста.","groups":[{"h":"От бангсавана до наших дней","items":[{"ms":"Zaman bangsawan dan keroncong","genre":"Кронконг, музыка театра","ru":"1930–1940-е: театр и кронконг","sub":"Эпоха граммофона","text":"Передвижной театр бангсаван смешивал малайские сюжеты с западными мелодиями. На пластинках — кронконг и ранний малайский поп; одна из первых записей — «Tudung Periok» певицы Момо Латифф.","songs":[{"ms":"Tudung Periok","ru":"«Крышка от котла» — Момо Латифф","tr":"тудунг перио'"}],"img":null,"tr":"заман бангсаван дан керончонг","say":[]},{"ms":"Zaman keemasan filem Melayu","genre":"Песни кино","ru":"1950–1960-е: золотой век кино","sub":"П. Рамли и студия на Джалан Ампас","text":"Малайские фильмы снимали в Сингапуре, и песни из них знала вся страна. Главные голоса — П. Рамли и Салома. Эти песни до сих пор звучат в рекламе и на праздниках.","songs":[{"ms":"Getaran Jiwa","ru":"П. Рамли","tr":"гетаран джива"},{"ms":"Selamat Hari Raya","ru":"Салома","tr":"селамат хари рая"}],"img":null,"tr":"заман кеэмасан филем мелаю","say":[]},{"ms":"Zaman pop yeh-yeh","genre":"Pop yeh-yeh","ru":"1965–1971: гитарные группы","sub":"Влияние Beatles","text":"Молодёжь собирала группы-kugiran с электрогитарами. «Oh Fatimah» A. Ramlie — гимн эпохи. Многие старшие малайзийцы помнят эти песни с танцплощадок.","songs":[{"ms":"Oh Fatimah","ru":"A. Ramlie","tr":"ох фатимах"}],"img":null,"tr":"заман поп йех-йех","say":[]},{"ms":"Zaman Sudirman dan Alleycats","genre":"Поп, блюз, рок","ru":"1970–1980-е: поп и телевидение","sub":"Начало AJL (1986)","text":"Эпоха больших звёзд телевидения: Судирман, Шарифа Айни, Alleycats, Шейла Маджид с альбомом «Dimensi Baru» (1985). В 1986 году прошёл первый Anugerah Juara Lagu — победила «Sekadar Di Pinggiran» Франциски Питер.","songs":[{"ms":"Balik Kampung","ru":"Судирман","tr":"бали' кампунг"},{"ms":"Sekadar Di Pinggiran","ru":"Франциска Питер","tr":"секадар ди пинггиран"}],"img":null,"tr":"заман судирман дан аллейчатс","say":[]},{"ms":"Zaman rock kapak","genre":"Rock kapak","ru":"Конец 1980-х — 1990-е: рок","sub":"Search, Wings, Ella","text":"Самая громкая эпоха: стадионные концерты, кассеты, баллады о любви. «Isabella» Search и «Pengemis Cinta» Эллы знают все, кому сейчас за 40.","songs":[{"ms":"Isabella","ru":"Search","tr":"исабелла"},{"ms":"Pengemis Cinta","ru":"Ella","tr":"пенгемис чинта"}],"img":null,"tr":"заман роч' капа'","say":[]},{"ms":"Zaman nasyid dan irama Malaysia","genre":"Нашид, irama Malaysia, world music","ru":"1990-е: поиск своего звука","sub":"Raihan, Сити Нурхализа, Зайналабидин","text":"Малайзия ищет собственное звучание: нашид-группа Raihan ставит рекорд продаж, Сити Нурхализа соединяет поп и традицию, Зайналабидин — world music. Параллельно рождается малайзийский хип-хоп.","songs":[{"ms":"Puji-Pujian","ru":"Raihan","tr":"пуджи-пуджиян"},{"ms":"Hijau","ru":"Zainalabidin","tr":"хиджау"}],"img":null,"tr":"заман нашид дан ирама малайсия","say":[]},{"ms":"Zaman realiti TV dan hip-hop","genre":"Поп, хип-хоп","ru":"2000-е: реалити-шоу и рэп","sub":"Akademi Fantasia, Too Phat","text":"Телешоу «Akademi Fantasia» делает звёзд за один сезон (Мави, Аизат), Too Phat выводит малайзийский рэп в Азию, Файзал Тахир поёт «Gemuruh», Юна начинает карьеру в интернете.","songs":[{"ms":"Gemuruh","ru":"Файзал Тахир","tr":"гемурух"}],"img":null,"tr":"заман реалити тв дан хип-хоп","say":[]},{"ms":"Zaman YouTube dan indie","genre":"Инди, поп, хип-хоп","ru":"2010-е: YouTube и инди","sub":"Hujan, Bunkface, Joe Flizzow","text":"Артисты прорываются через YouTube, инди-группы собирают фестивали, «Apa Khabar» Joe Flizzow и SonaOne получает премии, «Hati Kering» Хаэля Хусаини выигрывает AJL.","songs":[{"ms":"Apa Khabar","ru":"Joe Flizzow и SonaOne","tr":"апа хабар"},{"ms":"Hati Kering","ru":"Хаэль Хусаини","tr":"хати керинг"}],"img":null,"tr":"заман йоутубе дан индиэ","say":[]},{"ms":"Zaman TikTok","genre":"Поп, инди, этно-поп","ru":"2020-е: эпоха TikTok","sub":"Сейчас","text":"Хиты рождаются из 15-секундных видео: Putera Bobo, Mimifly, ретро-волна MASDO. Растёт интерес к языкам Борнео (Ryenald Guntabid, Mawat), а AJL40 выигрывает группа K.O.I.","songs":[{"ms":"Tiwikarma","ru":"K.O.I","tr":"тивикарма"},{"ms":"Serumpun","ru":"Mimifly","tr":"серумпун"}],"img":null,"tr":"заман тикток","say":[]}]}]},{"id":"makanan","ms":"Makanan","title":"Еда","img":"nasi_lemak","intro":"Еда — главная тема разговоров в Малайзии. Вопрос «Dah makan?» заменяет «как дела?», а спор о лучшем nasi lemak может длиться часами. Вот что надо попробовать и как об этом говорить.","groups":[{"h":"Национальная классика","items":[{"ms":"Nasi lemak","ru":"Наси лемак","sub":"Неофициальное национальное блюдо","img":"nasi_lemak","text":"Рис на кокосовом молоке с листом пандана, острым самбалом, жареными анчоусами (ikan bilis), арахисом и яйцом. Едят на завтрак, часто «bungkus» — завёрнутым в банановый лист.","say":[{"ms":"Nasi lemak bungkus satu, sambal lebih.","ru":"Один наси лемак с собой, побольше самбала.","tr":"наси лема' бунгкус сату, самбал лебэх."}],"tr":"наси лема'","songs":[]},{"ms":"Roti canai","ru":"Роти чанай","sub":"Звезда мамака","img":"roti_making","text":"Тонкая слоёная лепёшка, которую повар раскручивает в воздухе. Макают в карри или дал. «Roti canai banjir» — «затопленная» лепёшка, залитая соусом.","say":[{"ms":"Roti canai banjir satu!","ru":"Одну роти чанай, залить соусом!","tr":"роти чанай банджир сату!"}],"tr":"роти чанай","songs":[]},{"ms":"Satay","ru":"Сатай","sub":"Шашлычки с арахисовым соусом","img":"c_satay","text":"Маленькие шашлычки из курицы или говядины с арахисовым соусом (kuah kacang), огурцом и рисовыми кубиками ketupat. Самый известный — из городка Каджанг.","say":[{"ms":"Sate ayam sepuluh cucuk.","ru":"Десять шпажек куриного сатая.","tr":"сатэ аям сепулух чучу'."}],"tr":"сатай","songs":[]},{"ms":"Rendang","ru":"Ренданг","sub":"Праздничное мясо в специях","img":"c_rendang","text":"Говядина, часами тушённая в кокосовом молоке и специях до тёмной корочки. Обязательное блюдо на Хари Раю. Когда в британском кулинарном шоу назвали ренданг «недостаточно хрустящим», возмущалась вся страна.","say":[{"ms":"Rendang tok dari Perak paling sedap.","ru":"Ренданг ток из Перака — самый вкусный.","tr":"ренданг то' дари пера' палинг седап."}],"tr":"ренданг","songs":[]},{"ms":"Teh tarik","ru":"Те тарик","sub":"Национальный напиток","img":"p_tehtarik","text":"Чай со сгущённым молоком, который «тянут», переливая с высоты для пены. Есть даже соревнования мастеров teh tarik.","say":[{"ms":"Teh tarik kurang manis satu.","ru":"Один те тарик, поменьше сахара.","tr":"тэх тари' куранг манис сату."}],"tr":"тэх тари'","songs":[]}]},{"h":"Вкусы штатов","items":[{"ms":"Laksa","ru":"Лакса","sub":"Суп с лапшой: у каждого штата свой","img":"c_laksa","text":"Asam laksa из Пенанга — кислый рыбный суп с тамариндом; laksa Sarawak — с креветками и кокосовым молоком; curry laksa — с карри. Спросить «Laksa mana paling sedap?» — начать долгий спор.","say":[{"ms":"Laksa mana paling sedap?","ru":"Какая лакса самая вкусная?","tr":"лакса мана палинг седап?"}],"tr":"лакса","songs":[]},{"ms":"Char kway teow","ru":"Чар квей теу","sub":"Жареная лапша, Пенанг","img":"c_ckt","text":"Широкая рисовая лапша на сильном огне с креветками и ростками. Китайско-малайзийская классика. Важно: традиционная версия часто готовится на свином жире — мусульмане ищут табличку «halal».","say":[{"ms":"Kedai ini halal?","ru":"Это заведение халяльное?","tr":"кедай ини халал?"}],"tr":"чхар квай теов","songs":[]},{"ms":"Nasi kandar","ru":"Наси кандар","sub":"Рис и карри, Пенанг","img":"c_kandar","text":"Тамильско-мусульманская традиция: рис и десятки карри на выбор. Просите «kuah campur» — смешать несколько соусов поверх риса.","say":[{"ms":"Kuah campur, ya.","ru":"Соусы смешать, пожалуйста.","tr":"куах чампур, я."}],"tr":"наси кандар","songs":[]},{"ms":"Nasi kerabu","ru":"Наси керабу","sub":"Голубой рис, Келантан","img":"c_kerabu","text":"Рис окрашен в голубой цвет цветами клитории (bunga telang), подаётся с зеленью, кокосом и рыбой. Визитная карточка северо-восточных штатов.","say":[{"ms":"Nasi ini biru kerana bunga telang.","ru":"Этот рис синий из-за цветов клитории.","tr":"наси ини биру керана бунга теланг."}],"tr":"наси керабу","songs":[]},{"ms":"Ayam percik","ru":"Аям перчик","sub":"Курица в кокосовом соусе на гриле, Келантан","img":"c_percik","text":"Курицу поливают пряным кокосовым соусом и жарят на углях. Особенно популярна в Рамадан на базарах.","say":[{"ms":"Ayam percik ini pedas sikit.","ru":"Этот аям перчик немного острый.","tr":"аям перчи' ини педас сикит."}],"tr":"аям перчи'","songs":[]},{"ms":"Keropok lekor","ru":"Кропок лекор","sub":"Рыбные палочки, Тренгану","img":"c_lekor","text":"Жареные палочки из рыбы и саго, с соусом чили. Лучший перекус у моря на восточном побережье.","say":[{"ms":"Keropok lekor dua ringgit.","ru":"Кропок лекор на два ринггита.","tr":"керопо' лекор дуа ринггит."}],"tr":"керопо' лекор","songs":[]}]},{"h":"Мамак, улица, десерты","items":[{"ms":"Mee goreng mamak","ru":"Ми горенг мамак","sub":"Жареная лапша по-индийски","img":"c_meegoreng","text":"Жёлтая лапша с яйцом, тофу и острым соусом. Еда «после футбола в полночь».","say":[{"ms":"Mee goreng mamak, tak nak pedas.","ru":"Ми горенг мамак, не острое.","tr":"меэ горенг мама', та' на' педас."}],"tr":"меэ горенг мама'","songs":[]},{"ms":"Roti John","ru":"Роти Джон","sub":"Омлет-сэндвич","img":"c_rotijohn","text":"Длинный багет, обжаренный с яйцом, луком и фаршем. По легенде назван в честь англичанина «Джона». Хит вечерних рынков.","say":[{"ms":"Roti John daging satu.","ru":"Один роти Джон с говядиной.","tr":"роти джохн дагинг сату."}],"tr":"роти джохн","songs":[]},{"ms":"Cendol","ru":"Чендол","sub":"Холодный десерт","img":"c_cendol","text":"Зелёные рисовые «червячки», колотый лёд, кокосовое молоко и пальмовый сахар gula Melaka. Спасение в жару.","say":[{"ms":"Cendol satu, gula Melaka lebih.","ru":"Один чендол, побольше пальмового сахара.","tr":"чендол сату, гула мелака лебэх."}],"tr":"чендол","songs":[]},{"ms":"Kuih-muih","ru":"Куих","sub":"Малайские сладости","img":"c_kuih","text":"Яркие маленькие пирожные из рисовой муки, кокоса и пандана: kuih lapis (слоёный), onde-onde (шарики с жидким сахаром внутри), seri muka. Их приносят на встречи и к чаю в офис.","say":[{"ms":"Jemput makan kuih.","ru":"Угощайтесь сладостями.","tr":"джемпут макан куих."}],"tr":"куих-муих","songs":[]},{"ms":"Durian","ru":"Дуриан","sub":"«Король фруктов»","img":"c_durian","text":"Фрукт с сильнейшим запахом: его запрещено вносить в отели и общественный транспорт. Сорт Musang King считается лучшим. Предложение попробовать дуриан — знак дружбы; честно скажите, понравился ли.","say":[{"ms":"Saya nak cuba durian!","ru":"Хочу попробовать дуриан!","tr":"сая на' чуба дуриян!"}],"tr":"дуриян","songs":[]}]}]},{"id":"perayaan","ms":"Perayaan","title":"Праздники","img":"f_duitraya","intro":"В Малайзии отмечают праздники всех народов, и на каждый принято поздравлять соседей и коллег. Главное слово — «rumah terbuka», «открытый дом»: в праздник хозяева принимают всех гостей, даже незнакомых.","groups":[{"h":"Мусульманские праздники","items":[{"ms":"Hari Raya Aidilfitri","ru":"Ураза-байрам (Хари Рая)","sub":"Главный праздник года","img":"p_raya","text":"После месяца поста все едут домой — «balik kampung», дороги стоят в пробках. Утром просят друг у друга прощения, дети получают «duit raya» (деньги в зелёных конвертах), на столе ketupat, lemang и rendang. Праздник длится целый месяц открытых домов.","say":[{"ms":"Selamat Hari Raya Aidilfitri, maaf zahir dan batin.","ru":"С праздником Ураза-байрам! Прости меня за всё — и явное, и тайное.","tr":"селамат хари рая аидилфитри, мааф захир дан батин."},{"ms":"Jemput datang ke rumah terbuka kami.","ru":"Приходите к нам на «открытый дом».","tr":"джемпут датанг ке румах тербука ками."}],"tr":"хари рая аидилфитри","songs":[]},{"ms":"Bulan Ramadan","ru":"Рамадан","sub":"Месяц поста","img":"c_ketupat","text":"Днём мусульмане не едят и не пьют; вечером открываются «bazar Ramadan» с сотнями лотков еды. Есть при постящихся коллегах не запрещено, но вежливо делать это незаметно. Ифтар называется «berbuka puasa».","say":[{"ms":"Selamat berpuasa!","ru":"Лёгкого поста!","tr":"селамат берпуаса!"},{"ms":"Jom berbuka puasa bersama.","ru":"Давайте вместе разговеемся.","tr":"джом бербука пуаса берсама."}],"tr":"булан рамадан","songs":[]},{"ms":"Hari Raya Aidiladha","ru":"Курбан-байрам (Хари Рая Хаджи)","sub":"Праздник жертвоприношения","text":"Проводят «korban» — жертвоприношение, мясо раздают родным и бедным. Празднуют скромнее, чем Хари Раю Айдильфитри.","say":[{"ms":"Salam Aidiladha.","ru":"С Курбан-байрамом.","tr":"салам аидиладха."}],"img":null,"tr":"хари рая аидиладха","songs":[]}]},{"h":"Праздники других народов","items":[{"ms":"Tahun Baru Cina","ru":"Китайский Новый год","sub":"Январь–февраль","img":"c_yeesang","text":"Красные фонари, «ang pow» (деньги в красных конвертах) и «yee sang» — салат, который все вместе подбрасывают палочками как можно выше, загадывая удачу. Это малайзийско-сингапурская традиция. По-китайски поздравляют «Gong Xi Fa Cai».","say":[{"ms":"Selamat Tahun Baru Cina!","ru":"С Китайским Новым годом!","tr":"селамат тахун бару чина!"}],"tr":"тахун бару чина","songs":[]},{"ms":"Deepavali","ru":"Дипавали","sub":"Индуистский праздник огней · октябрь–ноябрь","img":"c_kolam","text":"Дома украшают масляными лампами и узорами «kolam» из цветного риса, угощают сладостями и murukku. Индийские семьи тоже устраивают открытые дома.","say":[{"ms":"Selamat Hari Deepavali!","ru":"С праздником Дипавали!","tr":"селамат хари деэпавали!"}],"tr":"деэпавали","songs":[]},{"ms":"Thaipusam","ru":"Тайпусам","sub":"Паломничество к пещерам Бату","img":"c_batucaves","text":"Сотни тысяч тамилов-индуистов поднимаются по 272 ступеням храма в пещерах Бату с подношениями «kavadi». Одно из самых впечатляющих зрелищ страны.","say":[{"ms":"Kita pergi ke Batu Caves untuk melihat Thaipusam.","ru":"Поедем в пещеры Бату посмотреть Тайпусам.","tr":"кита перги ке бату чавес унту' мелихат тхаипусам."}],"tr":"тхаипусам","songs":[]},{"ms":"Hari Gawai","ru":"Гавай — праздник урожая","sub":"Саравак · 1 июня","img":"c_gawai","text":"Праздник даяков Саравака (ибанов, бидаюхов и других): длинные дома, рисовое вино tuak, танцы. Поздравление на ибанском: «Gayu guru, gerai nyamai» — «долгой жизни, здоровья и благополучия».","say":[{"ms":"Selamat Hari Gawai! Gayu guru, gerai nyamai.","ru":"С праздником Гавай! Долгих лет, здоровья и благополучия.","tr":"селамат хари гавай! гаю гуру, герай нямай."}],"tr":"хари гавай","songs":[]},{"ms":"Pesta Kaamatan","ru":"Кааматан — праздник урожая","sub":"Сабах · май","img":"c_kaamatan","text":"Праздник кадазан-дусунов Сабаха в честь духа риса. Главное событие — конкурс Unduk Ngadau. Поздравляют на кадазан-дусун: «Kotobian Tadau Tagazo Do Kaamatan».","say":[{"ms":"Kotobian Tadau Tagazo Do Kaamatan!","ru":"С праздником Кааматан! (на кадазан-дусун)","tr":"котобиян тадау тагазо до кааматан!"}],"tr":"песта кааматан","songs":[]}]},{"h":"Национальные даты","items":[{"ms":"Hari Merdeka","ru":"День независимости · 31 августа","sub":"1957 год","img":"p_flag_students","text":"31 августа 1957 года Тунку Абдул Рахман на стадионе Мердека семь раз провозгласил «Merdeka!» — «Свобода!». Сейчас это парад, флаги на каждой машине и песни по радио весь август.","say":[{"ms":"Selamat Hari Merdeka!","ru":"С Днём независимости!","tr":"селамат хари мердека!"},{"ms":"Merdeka! Merdeka! Merdeka!","ru":"Свобода! Свобода! Свобода!","tr":"мердека! мердека! мердека!"}],"tr":"хари мердека","songs":[]},{"ms":"Hari Malaysia","ru":"День Малайзии · 16 сентября","sub":"1963 год","text":"В этот день 1963 года Малайя, Сабах, Саравак и Сингапур объединились в Малайзию (Сингапур вышел в 1965-м). Для жителей Сабаха и Саравака эта дата особенно важна.","say":[{"ms":"Selamat Hari Malaysia!","ru":"С Днём Малайзии!","tr":"селамат хари малайсия!"}],"img":null,"tr":"хари малайсия","songs":[]}]}]},{"id":"adat","ms":"Adat dan budi bahasa","title":"Этикет и обычаи","img":"f_salam","intro":"«Budi bahasa» — вежливость и воспитанность — малайцы ценят выше всего. Эти правила помогут не обидеть хозяев и коллег, даже если вы ещё плохо говорите.","groups":[{"h":"В гостях и на улице","items":[{"ms":"Buka kasut","ru":"Снимать обувь","sub":"Дома, в мечети, иногда в офисе","text":"Перед входом в дом обувь оставляют у двери. Если у входа в офис стоят туфли — снимите и свои.","say":[{"ms":"Boleh saya masuk?","ru":"Можно войти?","tr":"болэх сая масу'?"},{"ms":"Jemput masuk.","ru":"Проходите, пожалуйста.","tr":"джемпут масу'."}],"img":null,"tr":"бука касут","songs":[]},{"ms":"Tangan kanan","ru":"Правая рука","sub":"Еда, деньги, документы","text":"Всё передают и берут правой рукой (или двумя). Левая считается нечистой. Едят тоже правой — даже когда едят руками.","say":[{"ms":"Terima kasih.","ru":"Спасибо.","tr":"терима касих."}],"img":null,"tr":"танган канан","songs":[]},{"ms":"Tunjuk dengan ibu jari","ru":"Показывать большим пальцем","sub":"Не указательным!","text":"Указывать на человека или предмет указательным пальцем грубо. Малайцы показывают большим пальцем правой руки, сжав остальные.","say":[{"ms":"Pejabat itu di sana.","ru":"Офис вон там.","tr":"педжабат иту ди сана."}],"img":null,"tr":"тунджу' денган ибу джари","songs":[]},{"ms":"Tumpang lalu","ru":"«Позвольте пройти»","sub":"Проходя мимо сидящих","text":"Если проходите перед людьми, слегка наклонитесь, вытяните правую руку вниз и скажите «tumpang lalu». Это очень ценят старшие.","say":[{"ms":"Tumpang lalu, ya.","ru":"Позвольте пройти.","tr":"тумпанг лалу, я."}],"img":null,"tr":"тумпанг лалу","songs":[]},{"ms":"Jangan sentuh kepala","ru":"Не трогать голову","sub":"Голова — самая уважаемая часть тела","text":"Даже детей не гладят по голове. Ноги, наоборот, «низкая» часть тела: не направляйте ступни на людей, сидя на полу.","say":[{"ms":"Maaf, saya tidak tahu.","ru":"Извините, я не знал(а).","tr":"мааф, сая тида' таху."}],"img":null,"tr":"джанган сентух кепала","songs":[]},{"ms":"Minta diri","ru":"Вежливо уйти","sub":"Прощание в гостях","text":"Уходя, не исчезают молча: говорят «minta diri dulu» — «позвольте откланяться» и благодарят хозяев.","say":[{"ms":"Saya minta diri dulu. Terima kasih atas jemputan.","ru":"Позвольте откланяться. Спасибо за приглашение.","tr":"сая минта дири дулу. терима касих атас джемпутан."}],"img":null,"tr":"минта дири","songs":[]}]},{"h":"Ценности","items":[{"ms":"Gotong-royong","ru":"Готонг-ройонг — общий труд","sub":"Помощь всей деревней","text":"Соседи вместе готовят свадьбу, чистят мечеть, строят дом. Слово используют и в офисе: «Kita gotong-royong siapkan laporan ini» — «давайте все вместе доделаем отчёт».","say":[{"ms":"Jom gotong-royong!","ru":"Давайте все вместе!","tr":"джом готонг-ройонг!"}],"img":null,"tr":"готонг-ройонг","songs":[]},{"ms":"Kenduri","ru":"Кендури — угощение для общины","sub":"Свадьбы, рождения, поминки","text":"Большое угощение, на которое зовут родных, соседей и коллег. Приглашение на kenduri — знак доверия; дарят конверт с деньгами.","say":[{"ms":"Terima kasih atas jemputan ke kenduri.","ru":"Спасибо за приглашение на угощение.","tr":"терима касих атас джемпутан ке кендури."}],"img":null,"tr":"кендури","songs":[]},{"ms":"Malu","ru":"Малу — стыд и скромность","sub":"Сохранить лицо","text":"Не критикуйте человека при всех и не спорьте громко: это заставит его «hilang muka» — потерять лицо. Замечания делают наедине и мягко.","say":[{"ms":"Boleh kita bincang sekejap?","ru":"Можно ненадолго поговорить?","tr":"болэх кита бинчанг секеджап?"}],"img":null,"tr":"малу","songs":[]},{"ms":"Hormat orang tua","ru":"Уважение к старшим","sub":"Pak Cik, Mak Cik","text":"К незнакомым старшим обращаются «Pak Cik» (дядя) и «Mak Cik» (тётя), при встрече целуют или прикладывают ко лбу их руку (salam cium tangan).","say":[{"ms":"Apa khabar, Pak Cik?","ru":"Как поживаете, дядя?","tr":"апа хабар, па' чи'?"}],"img":null,"tr":"хормат оранг туа","songs":[]}]},{"h":"Свадьба, дом и одежда","items":[{"ms":"Majlis perkahwinan Melayu","ru":"Малайская свадьба","sub":"Kenduri kahwin","text":"Сначала религиозный обряд akad nikah, потом праздник: жениха встречают компангом и силатом, молодые сидят на троне (bersanding) как «король и королева на один день» (raja sehari). Гостям дарят сувенир bunga telur — раньше это было яйцо в цветке.","say":[{"ms":"Selamat pengantin baru!","ru":"Поздравляем молодожёнов!","tr":"селамат пенгантин бару!"},{"ms":"Raja sehari.","ru":"Король на один день.","tr":"раджа сехари."}],"img":null,"tr":"маджлис перкахвинан мелаю","songs":[]},{"ms":"Malam berinai","ru":"Ночь хны","sub":"Перед свадьбой","text":"Невесте (а иногда и жениху) расписывают руки хной. Как и в арабском мире, хна — знак праздника и благословения.","img":null,"tr":"малам беринай","say":[],"songs":[]},{"ms":"Rumah kampung","ru":"Деревенский дом на сваях","sub":"Традиционная архитектура","text":"Деревянный дом на сваях спасает от наводнений и зверей, под ним прохладно. Крыши разных штатов отличаются формой; в Негери-Сембилан — изогнутые «рога» минангкабау.","img":null,"tr":"румах кампунг","say":[],"songs":[]},{"ms":"Baju Melayu dan songkok","ru":"Баджу мелаю и сонгкок","sub":"Мужской костюм","text":"Рубашка с брюками из одной ткани, юбка-sampin из сонгкета и чёрная шапочка songkok. Воротник «cekak musang» — стоячий, «teluk belanga» — круглый, характерный для Джохора. Надевают по пятницам и в праздники.","say":[{"ms":"Dia pakai baju Melayu dan songkok pada hari Jumaat.","ru":"По пятницам он надевает баджу мелаю и сонгкок.","tr":"дия пакай баджу мелаю дан сонгко' пада хари джума'ат."}],"img":null,"tr":"баджу мелаю дан сонгко'","songs":[]},{"ms":"Baju kurung dan baju kebaya","ru":"Баджу курунг и кебая","sub":"Женский костюм","text":"Baju kurung — свободная длинная блуза с юбкой, повседневная одежда в школах и офисах. Kebaya — приталенная блуза, особенно у перанаканок Мелаки и Пенанга.","img":null,"tr":"баджу курунг дан баджу кебая","say":[],"songs":[]},{"ms":"Kain pelekat dan batik","ru":"Саронг в клетку и батик","sub":"Домашняя одежда","text":"Клетчатый саронг kain pelekat мужчины носят дома и в мечеть, батиковый саронг — женщины. Название пелекат, по одной версии, — от индийского города Пуликат.","img":null,"tr":"каин пелекат дан бати'","say":[],"songs":[]}]}]},{"id":"seni","ms":"Seni dan permainan","title":"Искусство и игры","img":"c_wau","intro":"Традиционные искусства Малайзии — гордость страны; несколько из них внесены в список нематериального наследия ЮНЕСКО. О них часто говорят на официальных приёмах.","groups":[{"h":"Наследие","items":[{"ms":"Silat","ru":"Силат","sub":"Боевое искусство · ЮНЕСКО (2019)","img":"c_silat","text":"Малайское боевое искусство и одновременно танец. На свадьбах жениха встречают выступлением силата (silat pengantin).","say":[{"ms":"Silat ialah seni mempertahankan diri Melayu.","ru":"Силат — малайское искусство самозащиты.","tr":"силат иялах сени мемпертаханкан дири мелаю."}],"tr":"силат","songs":[]},{"ms":"Pantun","ru":"Пантун","sub":"Поэтическое четверостишие · ЮНЕСКО (2020)","text":"Четыре строки: первые две — образ природы, вторые две — смысл, рифма abab. Пантуном начинают и заканчивают речи — даже министры. Ниже классический народный пантун о добрых делах.","say":[{"ms":"Pulau Pandan jauh ke tengah,","ru":"Остров Пандан далеко в море,","tr":"пулау пандан джаух ке тенгах,"},{"ms":"Gunung Daik bercabang tiga;","ru":"Гора Даик о трёх вершинах;","tr":"гунунг даи' берчабанг тига;"},{"ms":"Hancur badan dikandung tanah,","ru":"Истлеет тело в земле,","tr":"ханчур бадан дикандунг танах,"},{"ms":"Budi yang baik dikenang juga.","ru":"А добрые дела будут помнить.","tr":"буди янг баи' дикенанг джуга."}],"img":null,"tr":"пантун","songs":[]},{"ms":"Songket","ru":"Сонгкет","sub":"Ткань с золотой нитью · ЮНЕСКО (2021)","img":"c_songket","text":"Парча, в которую вплетают золотые или серебряные нити. Из неё шьют свадебные и королевские наряды; лучшие мастера — в Тренгану и Келантане.","say":[{"ms":"Kain songket ini sangat cantik.","ru":"Эта ткань сонгкет очень красивая.","tr":"каин сонгкет ини сангат чанти'."}],"tr":"сонгкет","songs":[]},{"ms":"Batik Malaysia","ru":"Малайзийский батик","sub":"Рисунок воском на ткани","text":"В отличие от индонезийского, малайзийский батик — крупные яркие цветы и листья, рисованные кистью; людей и животных обычно не изображают. Госслужащие носят батик по четвергам.","say":[{"ms":"Saya pakai baju batik hari ini.","ru":"Сегодня я в батике.","tr":"сая пакай баджу бати' хари ини."}],"img":null,"tr":"бати' малайсия","songs":[]},{"ms":"Mak Yong","ru":"Мак Йонг","sub":"Танцевальная драма · ЮНЕСКО (2005)","text":"Древний театр Келантана: музыка, танец, импровизация, главную мужскую роль играет женщина.","img":null,"tr":"ма' йонг","say":[],"songs":[]},{"ms":"Wayang kulit","ru":"Ваянг кулит — театр теней","sub":"Келантан","img":"c_wayang","text":"Один мастер (tok dalang) ведёт всех кукол из кожи и озвучивает героев под оркестр. Сюжеты — из эпоса «Рамаяна» в малайской версии.","say":[{"ms":"Tok dalang menggerakkan semua patung.","ru":"Ток даланг управляет всеми куклами.","tr":"то' даланг менггераккан семуа патунг."}],"tr":"ваянг кулит","songs":[]},{"ms":"Zapin","ru":"Запин","sub":"Танец арабского происхождения, Джохор","img":"c_zapin","text":"Пришёл с арабскими купцами — тут пригодится ваш арабский. Танцуют под уд (gambus) и барабаны marwas.","tr":"запин","say":[],"songs":[]},{"ms":"Keris","ru":"Крис","sub":"Кинжал с волнистым клинком","img":"c_keris","text":"Священное оружие и символ малайского достоинства; часть королевских регалий и свадебного наряда жениха.","tr":"керис","say":[],"songs":[]}]},{"h":"Народные игры","items":[{"ms":"Wau","ru":"Вау — воздушный змей","sub":"Келантан","img":"c_wau","text":"Огромные расписные змеи; самый известный — «wau bulan» с полумесяцем. Силуэт вау — на логотипе Malaysia Airlines.","say":[{"ms":"Wau bulan terbang tinggi.","ru":"Вау булан летит высоко.","tr":"вау булан тербанг тингги."}],"tr":"вау","songs":[]},{"ms":"Sepak takraw","ru":"Сепак такрау","sub":"Волейбол ногами","img":"c_takraw","text":"Плетёный мяч бьют ногами, коленями и головой через сетку. Акробатика, от которой захватывает дух; популярна в школах и деревнях.","tr":"сепа' такрав","say":[],"songs":[]},{"ms":"Congkak","ru":"Конгкак","sub":"Игра с ракушками","img":"c_congkak","text":"Деревянная доска с лунками, в которые раскладывают ракушки или камешки. В неё играют бабушки с внуками на Хари Раю.","tr":"чонгка'","say":[],"songs":[]},{"ms":"Gasing","ru":"Гасинг — волчок","sub":"Восточное побережье","text":"Тяжёлые деревянные волчки могут вращаться больше часа; в Келантане и Тренгану проводят турниры.","img":null,"tr":"гасинг","say":[],"songs":[]}]}]},{"id":"cerita","ms":"Cerita rakyat","title":"Легенды и фольклор","img":"c_melaka","intro":"Эти истории малайзийцы знают с детства: по ним снимают фильмы и мультфильмы, на них ссылаются в речах и шутках.","groups":[{"h":"Герои Мелаки","items":[{"ms":"Hang Tuah","ru":"Ханг Туах","sub":"Адмирал султаната Мелака, XV век","img":"c_melaka","text":"Легендарный воин, символ верности султану. Ему приписывают слова «Takkan Melayu hilang di dunia» — «Не исчезнут малайцы на земле». Эту фразу часто цитируют политики.","say":[{"ms":"Takkan Melayu hilang di dunia.","ru":"Не исчезнут малайцы на земле.","tr":"та'кан мелаю хиланг ди дуния."}],"tr":"ханг туах","songs":[]},{"ms":"Hang Jebat","ru":"Ханг Джебат","sub":"Друг, восставший ради справедливости","text":"Когда султан несправедливо приговорил Ханг Туаха, его друг Джебат восстал — и Туах сам убил его по приказу. Спор «кто прав — верный Туах или справедливый Джебат?» идёт веками и учит дискутировать.","say":[{"ms":"Raja adil raja disembah, raja zalim raja disanggah.","ru":"Справедливому правителю кланяются, тирану — противостоят.","tr":"раджа адил раджа дисембах, раджа залим раджа дисанггах."}],"img":null,"tr":"ханг джебат","songs":[]},{"ms":"Parameswara dan pokok Melaka","ru":"Основание Мелаки","sub":"Около 1400 года","text":"Принц Парамешвара отдыхал под деревом, когда крошечный олень-мышь (pelanduk) ударом отбросил его охотничью собаку. Увидев смелость слабого, принц основал здесь город и назвал его по имени дерева — Melaka.","say":[{"ms":"Pelanduk itu menendang anjing.","ru":"Олень-мышь лягнул собаку.","tr":"пеланду' иту мененданг анджинг."}],"img":null,"tr":"парамесвара дан поко' мелака","songs":[]},{"ms":"Puteri Gunung Ledang","ru":"Принцесса горы Леданг","sub":"Легенда Джохора","img":"c_ledang","text":"Султан Мелаки сватается к волшебной принцессе. Она требует невозможного: мост из золота, семь подносов комариных сердец и чашу крови его сына. Султан отступает — история о пределах власти.","say":[{"ms":"Tujuh dulang hati nyamuk.","ru":"Семь подносов комариных сердец.","tr":"туджух дуланг хати няму'."}],"tr":"путери гунунг леданг","songs":[]}]},{"h":"Сказки и легенды","items":[{"ms":"Sang Kancil","ru":"Санг Канчил — хитрый олень-мышь","sub":"Любимый герой детских сказок","text":"Маленький, но умный: например, «пересчитывает» крокодилов и по их спинам перебегает реку. Слово «kancil» — синоним хитреца; так же называлась популярная малолитражка Perodua.","say":[{"ms":"Sang Kancil yang cerdik.","ru":"Хитроумный Санг Канчил.","tr":"санг канчил янг черди'."}],"img":null,"tr":"санг канчил","songs":[]},{"ms":"Mahsuri","ru":"Махсури","sub":"Легенда Лангкави","img":"c_langkawi","text":"Невинную девушку казнили по ложному обвинению; из раны потекла белая кровь — знак невиновности. Умирая, она прокляла остров на семь поколений. Её гробница — популярное место на Лангкави.","say":[{"ms":"Darah Mahsuri berwarna putih.","ru":"Кровь Махсури была белой.","tr":"дарах махсури берварна путих."}],"tr":"махсури","songs":[]},{"ms":"Badang","ru":"Баданг — силач","sub":"Легенда о силе","text":"Бедный рыбак поймал духа, и тот наградил его невероятной силой. Баданг поднимал камни, которые не могли сдвинуть сотни людей.","img":null,"tr":"баданг","say":[],"songs":[]},{"ms":"Si Tanggang","ru":"Си Танггант — неблагодарный сын","sub":"Нравоучительная легенда","text":"Разбогатевший сын отрёкся от бедной матери — и превратился в камень вместе с кораблём. «Anak derhaka» — «непочтительный ребёнок» — сильное обвинение до сих пор.","say":[{"ms":"Jangan jadi anak derhaka.","ru":"Не будь неблагодарным ребёнком.","tr":"джанган джади ана' дерхака."}],"img":null,"tr":"си тангганг","songs":[]},{"ms":"Pontianak dan hantu-hantu","ru":"Понтианак и другие духи","sub":"Малайские «ужастики»","text":"Pontianak — призрак женщины в белом, orang minyak — «масляный человек», toyol — дух-воришка. Фильмы ужасов про них собирают полные залы; шутить о них — обычное дело среди молодёжи.","say":[{"ms":"Awak percaya pontianak?","ru":"Ты веришь в понтианака?","tr":"ава' перчая понтияна'?"}],"img":null,"tr":"понтияна' дан ханту-ханту","songs":[]}]},{"h":"Легенды разных штатов","items":[{"ms":"Hang Li Po","ru":"Ханг Ли По — китайская принцесса","sub":"Мелака, XV век","text":"По «Малайским анналам», принцессу из Китая выдали за султана Мелаки, и её свита поселилась на холме Букит Чина. Колодец Ханг Ли По в Мелаке показывают туристам — символ давних связей с Китаем.","say":[{"ms":"Perigi Hang Li Po di Bukit Cina.","ru":"Колодец Ханг Ли По на холме Букит Чина.","tr":"периги ханг ли по ди букит чина."}],"img":null,"tr":"ханг ли по","songs":[]},{"ms":"Puteri Saadong","ru":"Принцесса Саадонг","sub":"Келантан","text":"Легендарная правительница Келантана, пожертвовавшая собой ради мужа и народа. Её имя носят улицы и сериалы; символ женской силы в малайской истории.","img":null,"tr":"путери саадонг","say":[],"songs":[]},{"ms":"Batu Belah Batu Bertangkup","ru":"«Раскрывающийся камень»","sub":"Сказка о матери и детях","text":"Обиженная детьми мать уходит к волшебному камню, который её поглощает. Грустная сказка, которую рассказывают детям о почтении к родителям.","say":[{"ms":"Batu belah, batu bertangkup, telanlah aku.","ru":"Камень-скала, раскройся, поглоти меня.","tr":"бату белах, бату бертангкуп, теланлах аку."}],"img":null,"tr":"бату белах бату бертангкуп","songs":[]},{"ms":"Naga Tasik Chini","ru":"Дракон озера Чини","sub":"Паханг","text":"По преданию, в озере Чини живёт дракон и скрыт затонувший древний город. Местные жители народа джакун рассказывают о нём гостям.","say":[{"ms":"Ada naga di Tasik Chini?","ru":"В озере Чини живёт дракон?","tr":"ада нага ди таси' чхини?"}],"img":null,"tr":"нага таси' чхини","songs":[]},{"ms":"Bujang Senang","ru":"Буджанг Сенанг — гигантский крокодил","sub":"Саравак","text":"Огромный крокодил с белой полосой на спине, наводивший страх на реку Батанг Лупар в 1980–90-х. Полулегенда-полуправда: о нём сняли фильм и пишут до сих пор.","img":null,"tr":"буджанг сенанг","say":[],"songs":[]},{"ms":"Mat Kilau","ru":"Мат Килау","sub":"Паханг · реальный герой","text":"Воин, восставший против британцев в 1890-х; позже десятилетиями жил под чужим именем. Фильм о нём (2022) стал одним из самых кассовых малайских фильмов.","say":[{"ms":"Mat Kilau pahlawan Pahang.","ru":"Мат Килау — герой Паханга.","tr":"мат килау пахлаван паханг."}],"img":null,"tr":"мат килау","songs":[]}]}]},{"id":"sejarah","ms":"Sejarah","title":"История","img":"h_straits","intro":"Короткая история Малайзии в 17 событиях — то, что каждый малайзиец проходил в школе по предмету «Sejarah». Даты пригодятся на переговорах и приёмах.","groups":[{"h":"Древность и султанаты","items":[{"ms":"Lembah Bujang","ru":"Долина Буджанг, Кедах","sub":"Примерно II–XIV века","text":"Древнейший археологический комплекс страны: индуистско-буддийские храмы и порт, торговавший с Индией и Китаем. Доказательство, что Малайский полуостров был перекрёстком торговли задолго до Мелаки.","img":null,"tr":"лембах буджанг","say":[],"songs":[]},{"ms":"Kesultanan Melayu Melaka","ru":"Султанат Мелака","sub":"Около 1400–1511","img":"h_melaka","text":"Основан принцем Парамешварой; стал главным портом пролива и центром распространения ислама в регионе. Отсюда — малайский как язык торговли всего архипелага, придворный этикет и образ «золотого века».","say":[{"ms":"Melaka pernah menjadi pusat perdagangan dunia.","ru":"Мелака когда-то была центром мировой торговли.","tr":"мелака пернах менджади пусат пердаганган дуния."}],"tr":"кесултанан мелаю мелака","songs":[]},{"ms":"Portugis menawan Melaka","ru":"Португальцы захватывают Мелаку","sub":"1511","text":"Флот Афонсу де Албукерки взял Мелаку. Последний султан ушёл на юг — от его потомков ведут род султанаты Джохора и Перака. Португальцы оставили крепость A Famosa и слова, которые вы уже встречали: almari (шкаф, от armário), garpu (вилка, от garfo), sekolah (школа, от escola), bendera (флаг, от bandeira).","say":[{"ms":"Almari, garpu, sekolah dan bendera berasal daripada bahasa Portugis.","ru":"Almari, garpu, sekolah и bendera пришли из португальского.","tr":"алмари, гарпу, секолах дан бендера берасал дарипада бахаса португис."}],"img":"c_melaka","tr":"португис менаван мелака","songs":[]},{"ms":"Belanda di Melaka","ru":"Голландцы в Мелаке","sub":"1641","text":"Голландская Ост-Индская компания отбила Мелаку у португальцев. От голландцев осталось красное здание Stadthuys — символ Мелаки сегодня.","img":null,"tr":"беланда ди мелака","say":[],"songs":[]}]},{"h":"Британская эпоха и война","items":[{"ms":"British di Pulau Pinang","ru":"Британцы на Пенанге","sub":"1786","text":"Фрэнсис Лайт основал британское поселение на Пенанге. Затем появились Стрейтс-Сетлментс (Пенанг, Мелака, Сингапур) и британские «резиденты» при султанах. Британцы ввезли рабочих из Китая и Индии — так сложилось многонациональное общество.","img":"h_bangunan","tr":"бритисх ди пулау пинанг","say":[],"songs":[]},{"ms":"Pendudukan Jepun","ru":"Японская оккупация","sub":"1941–1945","text":"Японская армия заняла Малайю и Сингапур за несколько недель. Оккупация стала тяжёлым временем и разбудила национальное движение: стало ясно, что колониальная власть не всесильна.","img":"h_map1942","tr":"пендудукан джепун","say":[],"songs":[]},{"ms":"Malayan Union dan UMNO","ru":"Малайский союз и рождение UMNO","sub":"1946","text":"Британский план лишить султанов власти вызвал массовые протесты малайцев; так родилась партия UMNO. План отменили, в 1948 году создали Федерацию Малайя.","img":"h_rulers","tr":"малаян унион дан умно","say":[],"songs":[]},{"ms":"Darurat","ru":"Чрезвычайное положение","sub":"1948–1960","text":"Двенадцатилетняя борьба с коммунистическими партизанами в джунглях. В это время людей переселяли в «новые деревни», а власти готовили страну к независимости.","img":"h_oldkl","tr":"дарурат","say":[],"songs":[]}]},{"h":"Независимая Малайзия","items":[{"ms":"Merdeka 1957","ru":"Независимость","sub":"31 августа 1957","img":"h_tunku","text":"Тунку Абдул Рахман провозгласил независимость Федерации Малайя на стадионе Мердека. Первый король — Туанку Абдул Рахман из Негери-Сембилан.","say":[{"ms":"Merdeka! Merdeka! Merdeka!","ru":"Свобода! Свобода! Свобода!","tr":"мердека! мердека! мердека!"}],"tr":"мердека 1957","songs":[]},{"ms":"Penubuhan Malaysia","ru":"Создание Малайзии","sub":"16 сентября 1963","text":"Малайя, Сабах, Саравак и Сингапур объединились. Индонезия ответила «конфронтацией» (Konfrontasi, 1963–1966).","img":"h_poster","tr":"пенубухан малайсия","say":[],"songs":[]},{"ms":"Singapura keluar","ru":"Выход Сингапура","sub":"9 августа 1965","text":"Из-за политических разногласий Сингапур стал отдельным государством. Две страны остаются ближайшими соседями и партнёрами.","img":null,"tr":"сингапура келуар","say":[],"songs":[]},{"ms":"ASEAN 1967","ru":"Создание АСЕАН","sub":"8 августа 1967","text":"Малайзия — одна из пяти стран-основательниц АСЕАН (Бангкокская декларация). Для вас, международника, это ключевая дата.","say":[{"ms":"Malaysia ialah salah satu negara pengasas ASEAN.","ru":"Малайзия — одна из стран-основательниц АСЕАН.","tr":"малайсия иялах салах сату негара пенгасас асиан."}],"img":null,"tr":"асиан 1967","songs":[]},{"ms":"13 Mei 1969 dan Rukun Negara","ru":"13 мая 1969 и Рукун Негара","sub":"1969–1971","text":"Межэтнические столкновения после выборов потрясли страну. Ответом стали Рукун Негара (1970) и Новая экономическая политика (1971) — курс на сокращение неравенства между народами. Тема чувствительная: о ней говорят осторожно.","img":null,"tr":"13 мэй 1969 дан рукун негара","say":[],"songs":[]},{"ms":"Wawasan 2020 dan Menara Petronas","ru":"«Видение 2020» и башни Петронас","sub":"1991–1998","img":"petronas","text":"Махатхир Мохамад объявил цель — стать развитой страной к 2020 году. Символы эпохи: башни Петронас (1998, тогда самые высокие в мире), Путраджая, аэропорт KLIA, национальный автомобиль Proton.","tr":"вавасан 2020 дан менара петронас","say":[],"songs":[]},{"ms":"Krisis kewangan Asia","ru":"Азиатский финансовый кризис","sub":"1997–1998","text":"Малайзия отказалась от программы МВФ и привязала ринггит к доллару — решение, которое до сих пор обсуждают экономисты.","img":null,"tr":"крисис кеванган асия","say":[],"songs":[]},{"ms":"Pertukaran kerajaan 2018","ru":"Первая смена власти","sub":"2018","text":"Впервые с 1957 года коалиция Barisan Nasional проиграла выборы; премьером снова стал 92-летний Махатхир. С тех пор политика страны стала более конкурентной.","img":null,"tr":"пертукаран кераджаан 2018","say":[],"songs":[]},{"ms":"Malaysia hari ini","ru":"Малайзия сегодня","sub":"2020-е","text":"С ноября 2022 года премьер-министр — Анвар Ибрахим, правительство национального единства. В 2025 году Малайзия председательствовала в АСЕАН; саммит прошёл в Куала-Лумпуре.","say":[{"ms":"Malaysia menjadi Pengerusi ASEAN pada tahun 2025.","ru":"В 2025 году Малайзия председательствовала в АСЕАН.","tr":"малайсия менджади пенгеруси асиан пада тахун 2025."}],"img":"x_klcc_night","tr":"малайсия хари ини","songs":[]}]}]},{"id":"peribahasa","ms":"Peribahasa","title":"Пословицы","img":"c_songket","intro":"Peribahasa — пословицы — украшают речь, особенно официальную. Уместная пословица в выступлении сразу показывает уважение к малайской культуре.","groups":[{"h":"Для речей и переговоров","items":[{"ms":"Di mana bumi dipijak, di situ langit dijunjung","ru":"«Где ступаешь по земле, там чтишь небо»","sub":"≈ «В чужой монастырь со своим уставом не ходят»","text":"Уважай обычаи той страны, где находишься. Идеальна для иностранца в речи: показывает, что вы уважаете Малайзию.","say":[{"ms":"Di mana bumi dipijak, di situ langit dijunjung.","ru":"Где ступаешь по земле, там чтишь небо.","tr":"ди мана буми дипиджа', ди ситу лангит диджунджунг."}],"img":null,"tr":"ди мана буми дипиджа', ди ситу лангит диджунджунг","songs":[]},{"ms":"Bersatu teguh, bercerai roboh","ru":"«Вместе — крепко, порознь — рухнем»","sub":"О единстве","text":"Любимая пословица речей об АСЕАН и сотрудничестве.","say":[{"ms":"Bersatu teguh, bercerai roboh.","ru":"Вместе мы сильны, порознь падём.","tr":"берсату тегух, берчерай робох."}],"img":null,"tr":"берсату тегух, берчерай робох","songs":[]},{"ms":"Berat sama dipikul, ringan sama dijinjing","ru":"«Тяжёлое несём вместе, лёгкое тоже вместе»","sub":"О партнёрстве","text":"И трудности, и успехи делим поровну. Хорошо звучит в конце переговоров.","say":[{"ms":"Berat sama dipikul, ringan sama dijinjing.","ru":"Тяжёлое несём вместе, и лёгкое вместе.","tr":"берат сама дипикул, ринган сама диджинджинг."}],"img":null,"tr":"берат сама дипикул, ринган сама диджинджинг","songs":[]},{"ms":"Bagai aur dengan tebing","ru":"«Как бамбук и речной берег»","sub":"О взаимной поддержке","text":"Бамбук держит берег, берег держит бамбук. Так говорят о добрых соседях — и о дружбе стран.","say":[{"ms":"Hubungan kita bagai aur dengan tebing.","ru":"Наши отношения — как бамбук и берег.","tr":"хубунган кита багай аур денган тебинг."}],"img":null,"tr":"багай аур денган тебинг","songs":[]},{"ms":"Sedikit-sedikit, lama-lama jadi bukit","ru":"«Понемногу — и получится холм»","sub":"≈ «По капле — море»","text":"Про ежедневные небольшие усилия — ровно про изучение языка.","say":[{"ms":"Sedikit-sedikit, lama-lama jadi bukit.","ru":"Понемногу — и выйдет холм.","tr":"седикит-седикит, лама-лама джади букит."}],"img":null,"tr":"седикит-седикит, лама-лама джади букит","songs":[]}]},{"h":"Для жизни","items":[{"ms":"Malu bertanya sesat jalan","ru":"«Стыдишься спросить — заблудишься»","sub":"Спрашивайте!","text":"Не бойтесь переспрашивать — эту пословицу вам скажут с улыбкой, если вы смущаетесь.","say":[{"ms":"Malu bertanya sesat jalan.","ru":"Стыдишься спросить — заблудишься.","tr":"малу бертаня сесат джалан."}],"img":null,"tr":"малу бертаня сесат джалан","songs":[]},{"ms":"Seperti katak di bawah tempurung","ru":"«Как лягушка под кокосовой скорлупой»","sub":"О узком кругозоре","text":"Человек, который ничего не видел, кроме своего угла. Повод путешествовать и учить языки.","say":[{"ms":"Jangan jadi katak di bawah tempurung.","ru":"Не будь лягушкой под скорлупой.","tr":"джанган джади ката' ди бавах темпурунг."}],"img":null,"tr":"сеперти ката' ди бавах темпурунг","songs":[]},{"ms":"Ada udang di sebalik batu","ru":"«За камнем прячется креветка»","sub":"≈ «Тут что-то нечисто»","text":"Скрытый мотив. Так говорят, когда предложение кажется слишком щедрым.","say":[{"ms":"Saya rasa ada udang di sebalik batu.","ru":"Мне кажется, тут есть подвох.","tr":"сая раса ада уданг ди себали' бату."}],"img":null,"tr":"ада уданг ди себали' бату","songs":[]},{"ms":"Bagai pinang dibelah dua","ru":"«Как разрезанный пополам орех арека»","sub":"Идеальная пара","text":"Говорят о молодожёнах, которые идеально подходят друг другу. Без этой фразы не обходится ни одна свадьба.","say":[{"ms":"Pengantin ini bagai pinang dibelah dua.","ru":"Молодые — как две половинки ореха.","tr":"пенгантин ини багай пинанг дибелах дуа."}],"img":null,"tr":"багай пинанг дибелах дуа","songs":[]},{"ms":"Hujan emas di negeri orang, hujan batu di negeri sendiri","ru":"«В чужой стране — золотой дождь, дома — каменный»","sub":"≈ «В гостях хорошо, а дома лучше»","text":"Продолжение: «…lebih baik di negeri sendiri» — «а всё же лучше дома».","say":[{"ms":"Hujan emas di negeri orang, hujan batu di negeri sendiri, lebih baik di negeri sendiri.","ru":"В чужой стране золотой дождь, дома каменный, — а дома всё же лучше.","tr":"худжан эмас ди негери оранг, худжан бату ди негери сендири, лебэх баи' ди негери сендири."}],"img":null,"tr":"худжан эмас ди негери оранг, худжан бату ди негери сендири","songs":[]},{"ms":"Harimau mati meninggalkan belang","ru":"«Тигр умирает — остаются полосы»","sub":"О добром имени","text":"Полная форма: «…manusia mati meninggalkan nama» — «человек умирает — остаётся имя».","say":[{"ms":"Harimau mati meninggalkan belang, manusia mati meninggalkan nama.","ru":"Тигр умирает — остаются полосы, человек умирает — остаётся имя.","tr":"харимау мати менинггалкан беланг, манусия мати менинггалкан нама."}],"img":null,"tr":"харимау мати менинггалкан беланг","songs":[]}]},{"h":"О согласии, труде и характере","items":[{"ms":"Bulat air kerana pembetung, bulat manusia kerana muafakat","ru":"«Вода собирается в трубе, люди — в согласии»","sub":"О консенсусе","text":"Сила — в согласии и совещании (muafakat — из арабского «موافقة»). Идеально для речей о многосторонних переговорах.","say":[{"ms":"Bulat air kerana pembetung, bulat manusia kerana muafakat.","ru":"Вода едина в трубе, люди едины в согласии.","tr":"булат аир керана пембетунг, булат манусия керана муафакат."}],"img":null,"tr":"булат аир керана пембетунг, булат манусия керана муафакат","songs":[]},{"ms":"Tak kenal maka tak cinta","ru":"«Не узнаешь — не полюбишь»","sub":"Для знакомства и культурных программ","text":"Любимая фраза для начала презентаций о своей стране или для приглашения на культурное мероприятие.","say":[{"ms":"Tak kenal maka tak cinta.","ru":"Не узнаешь — не полюбишь.","tr":"та' кенал мака та' чинта."}],"img":null,"tr":"та' кенал мака та' чинта","songs":[]},{"ms":"Jauh perjalanan, luas pandangan","ru":"«Дальше путь — шире взгляд»","sub":"О путешествиях и учёбе","text":"Тот, кто много путешествует, больше понимает. Хорошо подходит иностранному студенту.","say":[{"ms":"Jauh perjalanan, luas pandangan.","ru":"Дальше путь — шире кругозор.","tr":"джаух перджаланан, луас панданган."}],"img":null,"tr":"джаух перджаланан, луас панданган","songs":[]},{"ms":"Hendak seribu daya, tak hendak seribu dalih","ru":"«Захочешь — найдёшь тысячу способов, не захочешь — тысячу отговорок»","sub":"≈ «Кто хочет — ищет возможности»","text":"Про мотивацию: в учёбе и на работе.","say":[{"ms":"Hendak seribu daya, tak hendak seribu dalih.","ru":"Захочешь — тысяча способов, не захочешь — тысяча отговорок.","tr":"хенда' серибу дая, та' хенда' серибу далих."}],"img":null,"tr":"хенда' серибу дая, та' хенда' серибу далих","songs":[]},{"ms":"Yang bulat tidak datang bergolek, yang pipih tidak datang melayang","ru":"«Круглое само не прикатится, плоское само не прилетит»","sub":"≈ «Без труда не вытащишь и рыбку из пруда»","text":"Ничего не даётся без усилий.","say":[{"ms":"Yang bulat tidak datang bergolek, yang pipih tidak datang melayang.","ru":"Круглое не прикатится, плоское не прилетит само.","tr":"янг булат тида' датанг берголе', янг пипих тида' датанг мелаянг."}],"img":null,"tr":"янг булат тида' датанг берголе', янг пипих тида' датанг мелаянг","songs":[]},{"ms":"Alah bisa tegal biasa","ru":"«Яд теряет силу от привычки»","sub":"≈ «Повторение — мать учения»","text":"Трудное становится лёгким, если делать это каждый день. Девиз ваших карточек.","say":[{"ms":"Alah bisa tegal biasa.","ru":"Привычка побеждает трудность.","tr":"алах биса тегал бияса."}],"img":null,"tr":"алах биса тегал бияса","songs":[]},{"ms":"Air tenang jangan disangka tiada buaya","ru":"«В тихой воде не думай, что нет крокодила»","sub":"≈ «В тихом омуте черти водятся»","text":"Спокойный человек или ситуация могут скрывать опасность.","say":[{"ms":"Air tenang jangan disangka tiada buaya.","ru":"В тихой воде тоже бывают крокодилы.","tr":"аир тенанг джанган дисангка тияда буая."}],"img":null,"tr":"аир тенанг джанган дисангка тияда буая","songs":[]},{"ms":"Kalau tiada angin, masakan pokok bergoyang","ru":"«Без ветра дерево не качается»","sub":"≈ «Нет дыма без огня»","text":"У слухов всегда есть причина.","say":[{"ms":"Kalau tiada angin, masakan pokok bergoyang.","ru":"Без ветра и дерево не качается.","tr":"калау тияда ангин, масакан поко' бергоянг."}],"img":null,"tr":"калау тияда ангин, масакан поко' бергоянг","songs":[]},{"ms":"Bagai kacang lupakan kulit","ru":"«Как арахис, забывший скорлупу»","sub":"О неблагодарности","text":"Человек, забывший тех, кто ему помог. Строгая оценка — используйте осторожно.","say":[{"ms":"Jangan jadi seperti kacang lupakan kulit.","ru":"Не будь арахисом, забывшим скорлупу.","tr":"джанган джади сеперти качанг лупакан кулит."}],"img":null,"tr":"багай качанг лупакан кулит","songs":[]},{"ms":"Tak lapuk dek hujan, tak lekang dek panas","ru":"«Не гниёт от дождя, не трескается от жары»","sub":"О ральные территории: Куала-Лумпур, Путраджая, Лабуан.","say":[{"ms":"Malaysia mempunyai tiga belas negeri.","ru":"В Малайзии тринадцать штатов.","tr":"малайсия мемпуняй тига белас негери."}],"img":null,"tr":"13 негери, 3 вилаях","songs":[]},{"ms":"Bahasa Jiwa Bangsa","ru":"«Язык — душа нации»","sub":"Девиз малайского языка","text":"Лозунг, который вы увидите на зданиях Dewan Bahasa dan Pustaka. А «Malaysia Boleh!» — «Малайзия может!» — кричат болельщики на матчах.","say":[{"ms":"Bahasa Jiwa Bangsa.","ru":"Язык — душа нации.","tr":"бахаса джива бангса."},{"ms":"Malaysia Boleh!","ru":"Малайзия может!","tr":"малайсия болэх!"}],"img":null,"tr":"бахаса джива бангса","songs":[]}]}]},{"id":"tokoh","ms":"Tokoh","title":"Известные люди","img":"h_tunku","intro":"Имена, которые всплывают в разговорах, новостях и учебниках. Знать их — значит понимать отсылки.","groups":[{"h":"История и политика","items":[{"ms":"Tunku Abdul Rahman","ru":"Тунку Абдул Рахман","sub":"«Bapa Kemerdekaan» — отец независимости","text":"Первый премьер-министр (1957–1970). Провозгласил независимость на стадионе Мердека.","img":null,"tr":"тунку абдул рахман","say":[],"songs":[]},{"ms":"Tun Dr. Mahathir Mohamad","ru":"Махатхир Мохамад","sub":"Премьер-министр 1981–2003 и 2018–2020","text":"При нём построили башни Петронас, Путраджаю и KLIA. Самый известный малайзийский политик за рубежом.","img":null,"tr":"тун доктор махатхир мохамад","say":[],"songs":[]},{"ms":"Za'ba","ru":"Заба (Зайнал Абидин Ахмад)","sub":"Отец малайской грамматики","text":"Лингвист, создавший нормы современного малайского языка и правописания. Важен для вас как для изучающего язык.","img":null,"tr":"за'ба","say":[],"songs":[]},{"ms":"Usman Awang","ru":"Усман Аванг","sub":"Национальный поэт (Sasterawan Negara)","text":"Его стихи о человечности и единстве народов Малайзии учат в школах.","img":null,"tr":"усман аванг","say":[],"songs":[]}]},{"h":"Спорт, кино, мода","items":[{"ms":"Datuk Lee Chong Wei","ru":"Ли Чонг Вей","sub":"Бадминтон · т /* ---------------- audio: packed neural clips, system voice as fallback ---------------- */
const spk = s => {
  s = String(s).replace(/…/g, ' ').replace(/\(глагол\)/g, '');
  if (s.toUpperCase() === s && /[A-Z]{5}/.test(s)) s = s[0] + s.slice(1).toLowerCase(); // same rule as speakable() in build.py
  return s.replace(/\s*\/\s*/g, ', ').replace(/\s+/g, ' ').trim().replace(/^[ ,]+|[ ,]+$/g, '');
};
const AU = { el: new Audio(), packs: {}, urls: {}, cur: null, btn: null };
AU.el.preload = 'auto';
function packBuf(i) {
  if (!AU.packs[i]) AU.packs[i] = fetch(`audio/${D.audio.packs[i]}.bin`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).catch(e => { delete AU.packs[i]; throw e; });
  return AU.packs[i];
}
async function clipUrl(v, text) {
  const key = `${v}|${spk(text)}`;
  if (AU.urls[key]) return AU.urls[key];
  const c = D.audio && D.audio.clips[key];
  if (!c) return null;
  try {
    const buf = await packBuf(c[0]);
    return (AU.urls[key] = URL.createObjectURL(new Blob([buf.slice(c[1], c[1] + c[2])], { type: 'audio/mpeg' })));
  } catch (e) { return null; }
}
function stopAudio() {
  try { AU.el.pause(); } catch (e) { /* ignore */ }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (AU.cur) { const r = AU.cur; AU.cur = null; r(); }
  $$('.playing').forEach(b => b.classList.remove('playing'));
}
let msVoice;
function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /ms[-_]MY/i.test(v.lang)) || vs.find(v => /^ms/i.test(v.lang)) || null;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { msVoice = pickVoice(); };
/** Play a Malay line; resolves when it ends (or is stopped). */
async function play(text, v = 'f', rate = 1, btn = null) {
  stopAudio();
  if (btn) btn.classList.add('playing');
  const url = await clipUrl(v, text);
  return new Promise(resolve => {
    const done = () => { if (AU.cur === resolve) AU.cur = null; if (btn) btn.classList.remove('playing'); resolve(); };
    AU.cur = done;
    if (url) {
      const el = AU.el;
      el.src = url; el.defaultPlaybackRate = rate; el.playbackRate = rate;
      el.preservesPitch = true; el.webkitPreservesPitch = true;
      el.onended = done; el.onerror = done;
      el.onloadedmetadata = () => { el.playbackRate = rate; };
      el.play().catch(done);
    } else if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(spk(text));
      msVoice = msVoice || pickVoice();
      if (msVoice) u.voice = msVoice;
      u.lang = 'ms-MY'; u.rate = 0.92 * rate;
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } else done();
  });
}

const ITEMS = {};
for (const L of LESSONS) {
  L.words.forEach((w, i) => { ITEMS[`${L.id}.w${i}`] = { ...w, lesson: L.id, kind: 'w' }; });
  L.slang.forEach((s, i) => { ITEMS[`${L.id}.s${i}`] = { ms: s.ms, say: s.say, tr: s.tr, ru: s.ru, ex: s.ex, exTr: s.exTr, exRu: s.exRu, use: `Можно: ${s.ok} Нельзя: ${s.no}`, lesson: L.id, kind: 's' }; });
}
function addLessonCards(L) {
  const t = dayNum(); let n = 0;
  for (const id of Object.keys(ITEMS)) if (ITEMS[id].lesson === L.id && !S.srs[`${id}|f`]) { S.srs[`${id}|f`] = { due: t, ivl: 0, ef: 2.5, reps: 0, lapses: 0, n: 1 }; n++; }

}
function newLeft() { if (S.newLog.d !== today()) S.newLog = { d: today(), n: 0 }; return Math.max(0, S.settings.newPerDay - S.newLog.n); }
function queue() {
  const t = dayNum(), rev = [], neu = [];
